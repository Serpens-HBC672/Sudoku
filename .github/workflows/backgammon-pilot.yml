name: Backgammon TD-vs-EM 600-game comparisons
on:
  push:
    branches: [Backgammon-TD-Testing]
    paths:
      - .github/workflows/backgammon-pilot.yml
      - tools/backgammon-benchmark/run.cjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        pair: [td1-em1, td1-em6, td5-em1, td5-em6, td1-td5, td4-td5, em1-em6, em5-em6, td1-td2, td2-td3, td3-td4, em1-em2, em2-em3, em3-em4, em4-em5]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: Backgammon-TD-Testing
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify engine and probe both configurations
        shell: bash
        run: |
          set +e
          timeout -k 10s 180s node tools/backgammon-benchmark/run.cjs --mode probe --pair "${{ matrix.pair }}"
          code=$?
          echo "PROBE_EXIT=$code" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "PROBE_EXIT=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Bounded 600-game batch
        if: env.PROBE_EXIT == '0'
        shell: bash
        run: |
          set +e
          timeout -k 15s 3450s node tools/backgammon-benchmark/run.cjs --mode games --pair "${{ matrix.pair }}" --games 600 --seed 910001 --budget-seconds 3300
          code=$?
          echo "GAME_EXIT=$code" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "GAME_EXIT=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Summarize finished games
        if: always()
        run: node tools/backgammon-benchmark/run.cjs --mode summarize --pair "${{ matrix.pair }}" --games 600
      - name: Validate complete 600-game batch
        if: always()
        shell: bash
        run: |
          set -e
          test "${PROBE_EXIT:-}" = "0"
          test "${GAME_EXIT:-}" = "0"
          jq -e '
            .requestedGames == 600 and
            .recordedGames == 600 and
            .completedGames == 600 and
            .incomplete == 0 and
            (.sourceSha256 | length == 1)
          ' "tools/backgammon-benchmark/results/${{ matrix.pair }}.summary.json" > /dev/null
          node -e '
            const fs = require("node:fs");
            const file = "tools/backgammon-benchmark/results/${{ matrix.pair }}.jsonl";
            const rows = fs.readFileSync(file, "utf8").trim().split(/\\r?\\n/).map(JSON.parse);
            if (rows.length !== 600 || rows.some((r, i) => r.index !== i || r.winner === null)) {
              throw new Error("Expected 600 contiguous completed game records");
            }
            if (new Set(rows.map(r => r.sourceSha256)).size !== 1) {
              throw new Error("Mixed source hashes in result records");
            }
          '
      - name: Save completed records to testing branch
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/backgammon-benchmark/results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(backgammon): store 600-game batch ${{ matrix.pair }} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin Backgammon-TD-Testing
            git rebase origin/Backgammon-TD-Testing
            if git push origin HEAD:Backgammon-TD-Testing; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backgammon-600games-${{ matrix.pair }}
          path: tools/backgammon-benchmark/results/${{ matrix.pair }}.*
          if-no-files-found: warn
