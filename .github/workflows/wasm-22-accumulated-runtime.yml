name: WASM #22 Accumulated Runtime Reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - codex/wasm-22-accumulated-runtime
    paths:
      - "wasm-migration/tests/benchmark-22-accumulated-runtime.mjs"
      - "wasm-migration/bridge/assembly-core.mjs"
      - ".github/workflows/wasm-22-accumulated-runtime.yml"

permissions:
  contents: read

jobs:
  accumulated-1-through-22:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wasm-migration
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify historical implementation lineage
        run: |
          git rev-parse HEAD
          git merge-base --is-ancestor 3fb98015986848e20025f8d1b1881f28fa6978e4 HEAD
          git diff --name-only 3fb98015986848e20025f8d1b1881f28fa6978e4..HEAD

      - name: Install historical migration toolchain
        run: npm install --no-audit --no-fund

      - name: Build historical stub-runtime core
        run: npm run build

      - name: Run shared-instance #1 through #22 reproduction
        run: node tests/benchmark-22-accumulated-runtime.mjs

      - name: Upload accumulated-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-wasm-22-accumulated-runtime
          path: |
            wasm-migration/accumulated-runtime-results/benchmark-22-precall-breadcrumbs.jsonl
            wasm-migration/accumulated-runtime-results/benchmark-22-accumulated-result.json
            wasm-migration/accumulated-runtime-results/benchmark-22-failing-precall-state.json
          if-no-files-found: warn
