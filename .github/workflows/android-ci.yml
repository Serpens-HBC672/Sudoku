name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install mobile packaging dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure CI version
        env:
          APP_VERSION_NAME: 0.0.0-ci.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: npm run configure:android

      - name: Build installable validation packages
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug

      - name: Collect validation packages
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Sudoku-ci-${GITHUB_RUN_NUMBER}-android-test.apk"
          cp android/app/build/outputs/bundle/debug/app-debug.aab "dist/Sudoku-ci-${GITHUB_RUN_NUMBER}-android-test.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Upload CI packages
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-android-ci-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
