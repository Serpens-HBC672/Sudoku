.cell {

.theme-transition-clone {

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {

color: var(--ink);

display: flex;

}
button { font: inherit; }
.app { width: 100%; max-width: 480px; }
.header-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.subtitle { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; color: var(--ink-soft); }
.title { font-weight: 700; font-size: 28px; letter-spacing: -0.01em; margin: 0; }
.seg-control { display: flex; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg-btn { padding: 6px 14px; font-family: var(--font-display); font-size: 13px; font-weight: 600;

.seg-btn.seg-active { background: var(--ink); color: var(--panel); }
.difficulty-area-wrap { margin-bottom: 12px; }
.row-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.chip-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.icon-btn-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.icon-btn-wide { width: auto; padding: 0 12px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }
.mono-note { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); line-height: 1.4; }
.settings-explain { margin-top: 8px; }
.settings-explain summary {
cursor: pointer;

color: var(--ink-soft);

display: inline-flex;
align-items: center;

user-select: none;
}
.settings-explain summary::-webkit-details-marker { display: none; }
.settings-explain summary::before {

}
.settings-explain[open] summary::before { transform: rotate(90deg); }
.settings-section-divider { height: 1px; background: var(--border); margin: 18px 0 14px; }
.theme-icon-wrap { position: relative; display: inline-flex; width: 16px; height: 16px; }
.theme-icon-svg { position: absolute; inset: 0; }
.custom-row { margin-top: 8px; }
#custom-clue-input { width: 56px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border);

#create-hint { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px; }
.timer-row-wrap:not(:empty) { margin-bottom: 10px; }
.grid-panel {
background: var(--panel);

border-radius: 10px;
background-image:

linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);

}

}

.cand { display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 8.5px; color: var(--cand); line-height: 1; }
#note { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--ink-soft); border-radius: 4px;

white-space: pre-line; max-height: 46vh; overflow-y: auto; }
.string-io-panel { margin-top: 10px; }
.string-textarea { width: 100%; resize: vertical; padding: 8px 10px; border-radius: 6px;

.string-textarea:read-only { background: var(--panel); color: var(--ink-soft); }
.string-io-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.copy-icon-btn { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;

color: var(--ink-soft); cursor: pointer; font-size: 14px; line-height: 1; }
.copy-icon-btn.copy-icon-done { border-color: var(--success); color: var(--success); }
#controls { display: flex; gap: 8px; margin-top: 12px; }
.action-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;

.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.action-btn-primary { border-color: var(--accent-fill); background: var(--accent-fill); color: #fff; }
.action-btn-full { width: 100%; }
#challenge-row { margin-top: 8px; }
.history-row-wrap:not(:empty) { display: flex; gap: 8px; margin-top: 10px; }
#numpad-wrap { margin-top: 10px; }
#numpad-digits { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
.pad-btn { height: 42px; border-radius: 8px; border: 1px solid var(--pad-border); background: var(--surface); color: var(--ink);

display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pad-btn:disabled { opacity: 0.4; cursor: not-allowed; background: var(--panel); }
#numpad-erase { width: 100%; margin-top: 6px; height: 42px; border-radius: 8px; border: 1px solid var(--pad-border);

#numpad-erase:disabled { opacity: 0.4; cursor: not-allowed; background: var(--panel); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.soundness-title { font-family: var(--font-display); font-weight: 700; font-size: 16px;

.soundness-copy-btn.copy-icon-done { background: var(--success-fill); border-color: var(--success-fill); }
.soundness-close-btn { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);

@media (min-width: 640px) {

.title { font-size: 32px; }
.cell { font-size: 22px; }

.action-btn { font-size: 15px; padding: 12px 14px; }
.chip { font-size: 13.5px; padding: 7px 14px; }
.icon-btn { width: 38px; height: 38px; font-size: 18px; }

.title { font-size: 33px; }
.cell { font-size: 24px; }
.cand { font-size: 12px; }

.action-btn { font-size: 15.5px; padding: 13px 15px; }
.chip { font-size: 14px; padding: 7px 15px; }
.icon-btn { width: 40px; height: 40px; font-size: 19px; }
.soundness-card { max-width: 500px; }

@media (min-width: 1200px) {

.app { max-width: 680px; }
.title { font-size: 34px; }
.cell { font-size: 26px; }

.action-btn { font-size: 16px; padding: 13px 16px; }
.chip { font-size: 14.5px; padding: 8px 16px; }
.icon-btn { width: 42px; height: 42px; font-size: 20px; }
.soundness-card { max-width: 540px; }
}

  <div id="validation-extra"></div>

  <div id="controls"></div>
  <div id="challenge-row"></div>
  <div id="history-row" class="history-row-wrap"></div>

  <div id="numpad-wrap">

    </div>
  </div>

  </div>

  <div id="settings-panel"></div>

  <div id="soundness-error-modal"></div>

</div>
