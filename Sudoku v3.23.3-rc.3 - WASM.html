]);

function readStandalonePatternCells(core) {
  const cells = [];
  for (let i = 0; i < core.standaloneResultPatternCount(); i++) {
    const index = core.standaloneResultPatternAt(i);
    cells.push([Math.floor(index / 9), index % 9]);
  }
  return cells;
}

function readStandaloneEliminations(core) {
  const out = [];
  for (let i = 0; i < core.standaloneResultEliminationCount(); i++) {
    out.push(decodeFact(core.standaloneResultEliminationAt(i)));
  }
  return out;
}

function runStandaloneTechniqueFinder(core, techniqueId, alreadyRun = false) {
  const technique = STANDALONE_TECHNIQUE_KEYS.get(techniqueId);
  if (!technique) throw new Error("Unsupported standalone technique id: " + techniqueId);

  if (techniqueId === 48 || techniqueId === 49) {
    if (!alreadyRun && techniqueId === 48) core.runJuniorExocetFinder();
    else if (!alreadyRun) core.runSeniorExocetFinder();
    if (core.exocetFinderResultTechnique() === 0) return null;

    const transposed = core.exocetFinderResultOrientation() === 1;
    const decodeVirtualCell = (index) => {
      const r = Math.floor(index / 9);
      const c = index % 9;
      return transposed ? [c, r] : [r, c];
    };
    const decodeVirtualFact = (k) => {
      const digit = (k % 9) + 1;
      const cell = Math.floor(k / 9);
      const [r, c] = decodeVirtualCell(cell);
      return { r, c, digit };
    };
    const patternCells = Array.from(
      { length: core.exocetFinderResultPatternCount() },
      (_, i) => decodeVirtualCell(core.exocetFinderResultPatternAt(i)),
    );
    const eliminations = Array.from(
      { length: core.exocetFinderResultEliminationCount() },
      (_, i) => decodeVirtualFact(core.exocetFinderResultEliminationAt(i)),
    );
    const base = Array.from({ length: 2 }, (_, i) => decodeVirtualCell(core.exocetFinderResultBaseAt(i)));
    const targets = Array.from({ length: 2 }, (_, i) => decodeVirtualCell(core.exocetFinderResultTargetAt(i)));
    const baseCandidates = maskToDigits(core.exocetFinderResultBaseMask() & 0x1ff);
    const orientation = transposed ? "col" : "row";
    const subtypeCode = core.exocetFinderResultSubtype();

    if (techniqueId === 48) {
      const subtype = [
        "mirrorSync",
        "base",
        "mirrorConjugatePair",
        "adjacentTarget",
        "incompatiblePair",
        "mirrorAlmostHiddenSet",
      ][subtypeCode];
      return {
        actionType: "eliminate",
        technique,
        subtype,
        patternCells,
        eliminations,
        context: { orientation, base, baseCandidates, targets },
      };
    }

    const subtype = ["trueBase", "lockedMember", "base"][subtypeCode];
    const context = {
      orientation,
      base,
      baseCandidates,
      target: [...targets[0]],
      endoTarget: [...targets[1]],
    };
    if (subtypeCode === 0) context.trueBaseDigit = core.exocetFinderResultTrueBaseDigit();
    return {
      actionType: "eliminate",
      technique,
      subtype,
      patternCells,
      eliminations,
      context,
    };
  }

  if (techniqueId === 47) {
    if (!alreadyRun) core.runMslsFinder();
    if (core.mslsFinderResultEliminationCount() === 0) return null;
    const patternCells = [];
    for (let i = 0; i < core.mslsFinderResultPatternCount(); i++) {
      const index = core.mslsFinderResultPatternAt(i);
      patternCells.push([Math.floor(index / 9), index % 9]);
    }
    const eliminations = [];
    for (let i = 0; i < core.mslsFinderResultEliminationCount(); i++) {
      eliminations.push(decodeFact(core.mslsFinderResultEliminationAt(i)));
    }
    const rows = Array.from({ length: core.mslsFinderResultRowCount() }, (_, i) => core.mslsFinderResultRowAt(i));
    const cols = Array.from({ length: core.mslsFinderResultColCount() }, (_, i) => core.mslsFinderResultColAt(i));
    const boxes = Array.from({ length: core.mslsFinderResultBoxCount() }, (_, i) => core.mslsFinderResultBoxAt(i));
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations,
      context: { rows, cols, boxes, size: [rows.length, cols.length] },
    };
  }

  if (techniqueId === 46) {
    if (!alreadyRun) core.runSkLoopFinder();
    if (core.skLoopResultEliminationCount() === 0) return null;
    const patternCells = [];
    for (let i = 0; i < core.skLoopResultPatternCount(); i++) {
      const index = core.skLoopResultPatternAt(i);
      patternCells.push([Math.floor(index / 9), index % 9]);
    }
    const eliminations = [];
    for (let i = 0; i < core.skLoopResultEliminationCount(); i++) {
      eliminations.push(decodeFact(core.skLoopResultEliminationAt(i)));
    }
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations,
      context: {
        rows: [core.skLoopResultRowAt(0), core.skLoopResultRowAt(1)],
        cols: [core.skLoopResultColAt(0), core.skLoopResultColAt(1)],
        boxes: Array.from({ length: 4 }, (_, i) => core.skLoopResultBoxAt(i)),
      },
    };
  }

  if (techniqueId === 45) {
    if (!alreadyRun) core.runTridagonForceFinder();
    const actionType = core.finderResultActionType();
    if (actionType === 0) return null;
    const patternCells = [];
    for (let i = 0; i < core.finderResultPatternCellCount(); i++) {
      const index = core.finderResultPatternCellAt(i);
      patternCells.push([Math.floor(index / 9), index % 9]);
    }
    const guardians = [];
    for (let i = 0; i < core.tridagonForceResultGuardianCount(); i++) {
      const f = decodeFact(core.tridagonForceResultGuardianFactAt(i));
      guardians.push([f.r, f.c, f.digit]);
    }
    const blocks = Array.from({ length: 4 }, (_, i) => core.tridagonForceResultBlockAt(i));
    const digits = maskToDigits(core.tridagonForceResultTripleMask() & 0x1ff);
    if (actionType === 1) {
      const r = core.finderResultR();
      const c = core.finderResultC();
      const digit = core.finderResultDigit();
      return {
        actionType: "fill",
        technique,
        r,
        c,
        digit,
        patternCells,
        context: {
          digits,
          guardians,
          blocks,
          concludeCell: [r, c],
          concludeDigit: digit,
          branches: null,
        },
      };
    }
    const eliminations = readFinderEliminations(core);
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations,
      context: {
        digits,
        guardians,
        blocks,
        eliminationCount: eliminations.length,
        branches: null,
      },
    };
  }

  if (techniqueId === 40) {
    if (!alreadyRun) core.runMedusaFinder();
    if (core.medusaFinderResultActionType() === 0) return null;
    const patternCells = [];
    for (let i = 0; i < core.medusaFinderResultPatternCount(); i++) {
      const index = core.medusaFinderResultPatternAt(i);
      patternCells.push([Math.floor(index / 9), index % 9]);
    }
    const eliminations = [];
    for (let i = 0; i < core.medusaFinderResultEliminationCount(); i++) {
      eliminations.push(decodeFact(core.medusaFinderResultEliminationAt(i)));
    }
    const coloring = [];
    for (let i = 0; i < core.medusaFinderResultColoringCount(); i++) {
      const fact = decodeFact(core.medusaFinderResultColoringNode(i));
      coloring.push({ r: fact.r, c: fact.c, d: fact.digit, color: core.medusaFinderResultColoringColor(i) });
    }
    const rule = core.medusaFinderResultRuleType();
    const reasonCells = [];
    for (let i = 0; i < core.medusaFinderResultReasonCount(); i++) {
      const fact = decodeFact(core.medusaFinderResultReasonNode(i));
      const color = core.medusaFinderResultReasonColor(i);
      const entry = { r: fact.r, c: fact.c, d: fact.digit };
      if (rule === 2 || (rule === 3 && i > 0)) entry.color = color;
      reasonCells.push(entry);
    }
    const ruleType = ["cell", "unit", "twoColorsInCell", "seesTwoColors"][rule];
    const context = { coloring, ruleType, reasonCells };
    if (rule === 0 || rule === 1) context.badColor = core.medusaFinderResultBadColor();
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations,
      context,
    };
  }

  if (techniqueId === 41) {
    if (!alreadyRun) core.runTridagonFinder();
    if (core.tridagonFinderResultActionType() === 0) return null;
    const patternCells = [];
    for (let i = 0; i < core.tridagonFinderResultPatternCount(); i++) {
      const index = core.tridagonFinderResultPatternAt(i);
      patternCells.push([Math.floor(index / 9), index % 9]);
    }
    const eliminations = [];
    for (let i = 0; i < core.tridagonFinderResultEliminationCount(); i++) {
      eliminations.push(decodeFact(core.tridagonFinderResultEliminationAt(i)));
    }
    const guardianCells = [];
    for (let i = 0; i < core.tridagonFinderResultGuardianCount(); i++) {
      const index = core.tridagonFinderResultGuardianAt(i);
      guardianCells.push([Math.floor(index / 9), index % 9]);
    }
    const blocks = Array.from({ length: 4 }, (_, i) => core.tridagonFinderResultBlockAt(i));
    const tripleDigits = maskToDigits(core.tridagonFinderResultMeta(0) & 0x1ff);
    const guardianDigits = maskToDigits(core.tridagonFinderResultMeta(1) & 0x1ff);
    const variant = core.tridagonFinderResultVariant();

    if (variant === 1) {
      const targetIndex = core.tridagonFinderResultMeta(2);
      return {
        actionType: "eliminate",
        technique,
        patternCells,
        eliminations,
        context: {
          variant: 1,
          digits: tripleDigits,
          targetCell: [Math.floor(targetIndex / 9), targetIndex % 9],
          guardianDigits,
          blocks,
        },
      };
    }
    if (variant === 2) {
      return {
        actionType: "eliminate",
        technique,
        patternCells,
        eliminations,
        context: {
          variant: 2,
          digits: tripleDigits,
          guardianCells,
          guardianDigit: core.tridagonFinderResultMeta(3),
          blocks,
        },
      };
    }

    const subsetCells = [];
    for (let i = 0; i < core.tridagonFinderResultSubsetCount(); i++) {
      const index = core.tridagonFinderResultSubsetAt(i);
      subsetCells.push([Math.floor(index / 9), index % 9]);
    }
    const unitTypeCode = core.tridagonFinderResultMeta(4);
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations,
      context: {
        variant: 3,
        digits: tripleDigits,
        guardianCells,
        guardianDigits,
        houseType: unitTypeCode === 0 ? "row" : unitTypeCode === 1 ? "col" : "box",
        houseIndex: core.tridagonFinderResultMeta(5),
        subsetCells,
        subsetDigits: maskToDigits(core.tridagonFinderResultMeta(6) & 0x1ff),
        blocks,
      },
    };
  }

  if (techniqueId === 38 || techniqueId === 39) {
    if (!alreadyRun) core.runAlsAdvancedFinder(techniqueId);
    if (core.alsAdvancedResultKind() === 0) return null;
    const patternCells = [];
    for (let i = 0; i < core.alsAdvancedResultPatternCount(); i++) {
      const index = core.alsAdvancedResultPatternAt(i);
      patternCells.push([Math.floor(index / 9), index % 9]);
    }
    const eliminations = [];
    for (let i = 0; i < core.alsAdvancedResultEliminationCount(); i++) {
      eliminations.push(decodeFact(core.alsAdvancedResultEliminationAt(i)));
    }
    const auxDigits = [];
    for (let i = 0; i < core.alsAdvancedResultExtraDigitCount(); i++) {
      auxDigits.push(core.alsAdvancedResultExtraDigitAt(i));
    }

    if (techniqueId === 38) {
      const s0 = core.alsAdvancedResultMeta(0);
      const s1 = core.alsAdvancedResultMeta(1);
      const s2 = core.alsAdvancedResultMeta(2);
      return {
        actionType: "eliminate",
        technique,
        patternCells,
        eliminations,
        context: {
          chainLength: 3,
          elimDigit: core.alsAdvancedResultMeta(3),
          alsChain: [
            patternCells.slice(0, s0).map((cell) => [...cell]),
            patternCells.slice(s0, s0 + s1).map((cell) => [...cell]),
            patternCells.slice(s0 + s1, s0 + s1 + s2).map((cell) => [...cell]),
          ],
          linkRccDigits: auxDigits,
        },
      };
    }

    const stemCell = [...patternCells[0]];
    const petalCount = core.alsAdvancedResultMeta(2);
    const petals = [];
    let offset = 1;
    for (let p = 0; p < petalCount; p++) {
      const size = core.alsAdvancedResultMeta(4 + p);
      petals.push({
        digit: auxDigits[p],
        cells: patternCells.slice(offset, offset + size).map((cell) => [...cell]),
      });
      offset += size;
    }
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations,
      context: {
        stemCell,
        stemDigits: maskToDigits(core.alsAdvancedResultMeta(1) & 0x1ff),
        petals,
        elimDigit: core.alsAdvancedResultMeta(3),
      },
    };
  }

  if (techniqueId >= 31 && techniqueId <= 34) {
    if (!alreadyRun) core.runFireworkFinder(techniqueId);
    if (core.fireworkFinderResultActionType() === 0) return null;
    const patternCells = [];
    for (let i = 0; i < core.fireworkFinderResultPatternCount(); i++) {
      const index = core.fireworkFinderResultPatternAt(i);
      patternCells.push([Math.floor(index / 9), index % 9]);
    }
    const eliminations = [];
    for (let i = 0; i < core.fireworkFinderResultEliminationCount(); i++) {
      eliminations.push(decodeFact(core.fireworkFinderResultEliminationAt(i)));
    }
    const digits = maskToDigits(core.fireworkFinderResultMeta(0) & 0x1ff);
    if (techniqueId === 31) {
      return {
        actionType: "eliminate",
        technique,
        patternCells,
        eliminations,
        context: {
          stem: [...patternCells[0]],
          leaf: patternCells.slice(1, 3).map((cell) => [...cell]),
          digits,
        },
      };
    }
    if (techniqueId === 32) {
      return {
        actionType: "eliminate",
        technique,
        patternCells,
        eliminations,
        context: {
          stem: patternCells.slice(0, 2).map((cell) => [...cell]),
          leaf: patternCells.slice(2, 4).map((cell) => [...cell]),
          digits,
        },
      };
    }
    if (techniqueId === 33) {
      return {
        actionType: "eliminate",
        technique,
        patternCells,
        eliminations,
        context: {
          stem: [...patternCells[0]],
          leaf: patternCells.slice(1, 3).map((cell) => [...cell]),
          assist: patternCells.slice(3, 5).map((cell) => [...cell]),
          target: [...patternCells[5]],
          digits,
        },
      };
    }
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations,
      context: {
        stem: [...patternCells[0]],
        rowPartner: [...patternCells[1]],
        colPartner: [...patternCells[2]],
        assist: [...patternCells[3]],
        digits,
      },
    };
  }

  if (techniqueId === 30) {
    if (!alreadyRun) core.runSueDeCoqFinder();
    if (core.sdcFinderResultActionType() === 0) return null;
    const patternCells = [];
    for (let i = 0; i < core.sdcFinderResultPatternCount(); i++) {
      const index = core.sdcFinderResultPatternAt(i);
      patternCells.push([Math.floor(index / 9), index % 9]);
    }
    const eliminations = [];
    for (let i = 0; i < core.sdcFinderResultEliminationCount(); i++) {
      eliminations.push(decodeFact(core.sdcFinderResultEliminationAt(i)));
    }
    const irCount = core.sdcFinderResultMeta(3);
    const aSize = core.sdcFinderResultMeta(4);
    const bSize = core.sdcFinderResultMeta(5);
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations,
      context: {
        box: core.sdcFinderResultMeta(0),
        lineType: core.sdcFinderResultMeta(1) === 0 ? "row" : "col",
        lineIdx: core.sdcFinderResultMeta(2),
        irCells: patternCells.slice(0, irCount).map((cell) => [...cell]),
        aCells: patternCells.slice(irCount, irCount + aSize).map((cell) => [...cell]),
        bCells: patternCells.slice(irCount + aSize, irCount + aSize + bSize).map((cell) => [...cell]),
        digits: maskToDigits(core.sdcFinderResultMeta(6) & 0x1ff),
      },
    };
  }

  if (techniqueId === 28) {
    if (!alreadyRun) core.runAicFinder();
    const nodeCount = core.aicFinderResultNodeCount();
    if (nodeCount === 0) return null;
    const chainNodes = [];
    const patternCells = [];
    for (let i = 0; i < nodeCount; i++) {
      const cells = [];
      for (let j = 0; j < core.aicFinderResultNodeCellCount(i); j++) {
        const index = core.aicFinderResultNodeCellAt(i, j);
        const cell = [Math.floor(index / 9), index % 9];
        cells.push(cell);
        patternCells.push([...cell]);
      }
      chainNodes.push({ cells, d: core.aicFinderResultNodeDigit(i) });
    }
    const eliminations = [];
    for (let i = 0; i < core.aicFinderResultEliminationCount(); i++) {
      eliminations.push(decodeFact(core.aicFinderResultEliminationAt(i)));
    }
    return {
      actionType: "eliminate",
      technique,
      subtype: core.aicFinderResultSubtype() === 0 ? "type1" : "type2",
      patternCells,
      chainNodes,
      eliminations,
      context: {
        chainLength: chainNodes.length,
        startDigit: chainNodes[0].d,
        endDigit: chainNodes[chainNodes.length - 1].d,
        grouped: chainNodes.some((node) => node.cells.length > 1),
      },
    };
  }

  if (techniqueId === 29) {
    if (!alreadyRun) core.runNiceLoopFinder();
    const nodeCount = core.aicFinderResultNodeCount();
    if (nodeCount === 0) return null;
    const chainNodes = [];
    for (let i = 0; i < nodeCount; i++) {
      const cells = [];
      for (let j = 0; j < core.aicFinderResultNodeCellCount(i); j++) {
        const index = core.aicFinderResultNodeCellAt(i, j);
        cells.push([Math.floor(index / 9), index % 9]);
      }
      chainNodes.push({ cells, d: core.aicFinderResultNodeDigit(i) });
    }
    const start = chainNodes[0];
    const [r, c] = start.cells[0];
    return {
      actionType: "fill",
      technique,
      r,
      c,
      digit: start.d,
      chainNodes,
      context: { chainLength: chainNodes.length },
    };
  }

  if (!alreadyRun) core.runStandaloneTechniqueFinder(techniqueId);
  const actionType = core.standaloneResultActionType();
  if (actionType === 0) return null;

  const r = core.standaloneResultR();
  const c = core.standaloneResultC();
  const digit = core.standaloneResultDigit();

  if (techniqueId === 0) {
    return { actionType: "fill", technique, r, c, digit };
  }

  if (techniqueId === 1) {
    const unitTypeCode = core.standaloneResultMeta(0);
    return {
      actionType: "fill",
      technique,
      r,
      c,
      digit,
      unitType: unitTypeCode === 0 ? "row" : unitTypeCode === 1 ? "col" : "box",
      idx: core.standaloneResultMeta(1),
    };
  }

  if (techniqueId === 3) {
    const symmetry = ["central", "diagonal", "antidiagonal"][core.standaloneResultMeta(0)];
    if (actionType === 1) {
      const pairedIndex = core.standaloneResultMeta(1);
      return {
        actionType: "fill",
        technique,
        r,
        c,
        digit,
        context: {
          symmetry,
          pairedWith: [Math.floor(pairedIndex / 9), pairedIndex % 9],
          pairedDigit: core.standaloneResultMeta(2),
        },
      };
    }
    const kind = core.standaloneResultMeta(3) === 1 ? "axis" : "mirror";
    return {
      actionType: "eliminate",
      technique,
      patternCells: [],
      eliminations: readStandaloneEliminations(core),
      context: { symmetry, kind },
    };
  }

  if (techniqueId === 2) {
    const subtypeCode = core.standaloneResultSubtype();
    const subtype = ["pointingRow", "pointingCol", "claimingRow", "claimingCol"][subtypeCode];
    const box = core.standaloneResultMeta(0);
    const line = core.standaloneResultMeta(1);
    const lineType = core.standaloneResultMeta(2) === 0 ? "row" : "col";
    const lockedDigit = core.standaloneResultMeta(3);
    return {
      actionType: "eliminate",
      technique,
      subtype,
      patternCells: readStandalonePatternCells(core),
      eliminations: readStandaloneEliminations(core),
      context: { box, line, lineType, digit: lockedDigit },
    };
  }

  if (techniqueId === 12) {
    const patternCells = readStandalonePatternCells(core);
    const baseType = core.standaloneResultMeta(1) === 0 ? "row" : "col";
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: {
        digit: core.standaloneResultMeta(0),
        baseType,
        base: patternCells.slice(0, 2).map((cell) => [...cell]),
        roof: patternCells.slice(2, 4).map((cell) => [...cell]),
      },
    };
  }

  if (techniqueId === 13) {
    const patternCells = readStandalonePatternCells(core);
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: {
        digit: core.standaloneResultMeta(0),
        near: patternCells.slice(0, 2).map((cell) => [...cell]),
        far: patternCells.slice(2, 4).map((cell) => [...cell]),
      },
    };
  }

  if (techniqueId === 14) {
    const patternCells = readStandalonePatternCells(core);
    const eliminations = readStandaloneEliminations(core);
    const near = patternCells[patternCells.length - 2];
    const far = patternCells[patternCells.length - 1];
    const target = [eliminations[0].r, eliminations[0].c];
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations,
      context: {
        digit: core.standaloneResultMeta(0),
        box: core.standaloneResultMeta(1),
        axis: [core.standaloneResultMeta(2), core.standaloneResultMeta(3)],
        near: [...near],
        far: [...far],
        target,
      },
    };
  }

  if (techniqueId === 20) {
    const patternCells = readStandalonePatternCells(core);
    const digits = maskToDigits(core.standaloneResultMeta(0) & 0x1ff);
    const extraCell = patternCells[core.standaloneResultMeta(1)];
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: { digits, extraCell: [...extraCell] },
    };
  }

  if (techniqueId === 21) {
    const patternCells = readStandalonePatternCells(core);
    const roofCells = [];
    for (let i = 0; i < core.standaloneResultExtraCellCount(); i++) {
      const index = core.standaloneResultExtraCellAt(i);
      roofCells.push([Math.floor(index / 9), index % 9]);
    }
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: {
        digits: maskToDigits(core.standaloneResultMeta(0) & 0x1ff),
        extraDigit: core.standaloneResultMeta(1),
        roofCells,
      },
    };
  }

  if (techniqueId === 22) {
    const patternCells = readStandalonePatternCells(core);
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: {
        digits: maskToDigits(core.standaloneResultMeta(0) & 0x1ff),
        floorCell: [...patternCells[core.standaloneResultMeta(1)]],
        targetCell: [...patternCells[core.standaloneResultMeta(2)]],
        strongDigit: core.standaloneResultMeta(3),
      },
    };
  }

  if (techniqueId === 23) {
    const unitTypeCode = core.standaloneResultMeta(1);
    return {
      actionType: "fill",
      technique,
      r,
      c,
      digit,
      context: {
        tripleDigits: maskToDigits(core.standaloneResultMeta(0) & 0x1ff),
        oddUnit: {
          unitType: unitTypeCode === 0 ? "row" : unitTypeCode === 1 ? "col" : "box",
          idx: core.standaloneResultMeta(2),
        },
      },
    };
  }

  if (techniqueId === 24 || techniqueId === 26) {
    const patternCells = readStandalonePatternCells(core);
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: {
        hinge: [...patternCells[0]],
        outliers: patternCells.slice(1).map((cell) => [...cell]),
        digit: core.standaloneResultMeta(0),
        hingeDigits: maskToDigits(core.standaloneResultMeta(1) & 0x1ff),
      },
    };
  }

  if (techniqueId === 25) {
    const patternCells = readStandalonePatternCells(core);
    const unitTypeCode = core.standaloneResultMeta(2);
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: {
        biValueCells: patternCells.slice(0, 2).map((cell) => [...cell]),
        strongLinkCells: patternCells.slice(2, 4).map((cell) => [...cell]),
        strongDigit: core.standaloneResultMeta(0),
        elimDigit: core.standaloneResultMeta(1),
        unitType: unitTypeCode === 0 ? "row" : unitTypeCode === 1 ? "col" : "box",
        idx: core.standaloneResultMeta(3),
      },
    };
  }

  if (techniqueId === 29) {
    if (!alreadyRun) core.runNiceLoopFinder();
    const nodeCount = core.aicFinderResultNodeCount();
    if (nodeCount === 0) return null;
    const chainNodes = [];
    for (let i = 0; i < nodeCount; i++) {
      const cells = [];
      for (let j = 0; j < core.aicFinderResultNodeCellCount(i); j++) {
        const index = core.aicFinderResultNodeCellAt(i, j);
        cells.push([Math.floor(index / 9), index % 9]);
      }
      chainNodes.push({ cells, d: core.aicFinderResultNodeDigit(i) });
    }
    const start = chainNodes[0];
    const [r, c] = start.cells[0];
    return {
      actionType: "fill",
      technique,
      r,
      c,
      digit: start.d,
      chainNodes,
      context: { chainLength: chainNodes.length },
    };
  }

  if (techniqueId === 28) {
    if (!alreadyRun) core.runAicFinder();
    if (core.aicFinderResultNodeCount() === 0) return null;
    const chainNodes = [];
    const patternCells = [];
    for (let i = 0; i < core.aicFinderResultNodeCount(); i++) {
      const cells = [];
      for (let j = 0; j < core.aicFinderResultNodeCellCount(i); j++) {
        const index = core.aicFinderResultNodeCellAt(i, j);
        const cell = [Math.floor(index / 9), index % 9];
        cells.push(cell);
        patternCells.push([...cell]);
      }
      chainNodes.push({ cells, d: core.aicFinderResultNodeDigit(i) });
    }
    const eliminations = [];
    for (let i = 0; i < core.aicFinderResultEliminationCount(); i++) {
      eliminations.push(decodeFact(core.aicFinderResultEliminationAt(i)));
    }
    return {
      actionType: "eliminate",
      technique,
      subtype: core.aicFinderResultSubtype() === 0 ? "type1" : "type2",
      patternCells,
      chainNodes,
      eliminations,
      context: {
        chainLength: chainNodes.length,
        startDigit: chainNodes[0].d,
        endDigit: chainNodes[chainNodes.length - 1].d,
        grouped: chainNodes.some((node) => node.cells.length > 1),
      },
    };
  }

  if (techniqueId === 37) {
    const patternCells = readStandalonePatternCells(core);
    const aCellCount = core.standaloneResultMeta(0);
    const bCellCount = core.standaloneResultMeta(1);
    const aDigitCount = core.standaloneResultMeta(2);
    const bDigitCount = core.standaloneResultMeta(3);
    const overlapCount = core.standaloneResultMeta(4);
    const xCount = core.standaloneResultMeta(5);
    const zCount = core.standaloneResultMeta(6);
    const auxCells = [];
    for (let i = 0; i < core.standaloneResultExtraCellCount(); i++) {
      const index = core.standaloneResultExtraCellAt(i);
      auxCells.push([Math.floor(index / 9), index % 9]);
    }
    const auxDigits = [];
    for (let i = 0; i < core.standaloneResultExtraDigitCount(); i++) {
      auxDigits.push(core.standaloneResultExtraDigitAt(i));
    }
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: {
        ahsACells: patternCells.slice(0, aCellCount).map((cell) => [...cell]),
        ahsADigits: auxDigits.slice(0, aDigitCount),
        ahsBCells: patternCells.slice(aCellCount, aCellCount + bCellCount).map((cell) => [...cell]),
        ahsBDigits: auxDigits.slice(aDigitCount, aDigitCount + bDigitCount),
        rccCells: auxCells.slice(0, overlapCount).map((cell) => [...cell]),
        xCells: auxCells.slice(overlapCount, overlapCount + xCount).map((cell) => [...cell]),
        zCells: auxCells.slice(overlapCount + xCount, overlapCount + xCount + zCount).map((cell) => [...cell]),
      },
    };
  }

  if (techniqueId === 36) {
    const patternCells = readStandalonePatternCells(core);
    const aSize = core.standaloneResultMeta(0);
    const bSize = core.standaloneResultMeta(1);
    const rccDigits = [];
    for (let i = 0; i < core.standaloneResultExtraDigitCount(); i++) {
      rccDigits.push(core.standaloneResultExtraDigitAt(i));
    }
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: {
        rccDigits,
        elimDigit: core.standaloneResultMeta(2),
        alsACells: patternCells.slice(0, aSize).map((cell) => [...cell]),
        alsBCells: patternCells.slice(aSize, aSize + bSize).map((cell) => [...cell]),
      },
    };
  }

  if (techniqueId === 35) {
    const patternCells = readStandalonePatternCells(core);
    const patternCount = core.standaloneResultMeta(1);
    const pomDigit = core.standaloneResultMeta(0);
    if (actionType === 1) {
      const allFixedCells = [];
      for (let i = 0; i < core.standaloneResultExtraCellCount(); i++) {
        const index = core.standaloneResultExtraCellAt(i);
        allFixedCells.push([Math.floor(index / 9), index % 9]);
      }
      return {
        actionType: "fill",
        technique,
        r,
        c,
        digit,
        patternCells,
        context: { digit: pomDigit, patternCount, allFixedCells, mode: "allPattern" },
      };
    }
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      context: { digit: pomDigit, patternCount, mode: "noPattern" },
    };
  }

  if (techniqueId === 27) {
    const patternCells = readStandalonePatternCells(core);
    const chainLinkDigits = [];
    for (let i = 0; i < core.standaloneResultExtraDigitCount(); i++) {
      chainLinkDigits.push(core.standaloneResultExtraDigitAt(i));
    }
    return {
      actionType: "eliminate",
      technique,
      patternCells,
      eliminations: readStandaloneEliminations(core),
      chainCells: patternCells.map(([r, c]) => ({ r, c })),
      chainLinkDigits,
      context: {
        digit: core.standaloneResultMeta(0),
        chainLength: patternCells.length,
      },
    };
  }

  const finnedFishIds = new Set([17, 18, 19]);
  if (finnedFishIds.has(techniqueId)) {
    const patternCells = readStandalonePatternCells(core);
    const finCells = [];
    for (let i = 0; i < core.standaloneResultExtraCellCount(); i++) {
      const index = core.standaloneResultExtraCellAt(i);
      finCells.push([Math.floor(index / 9), index % 9]);
    }
    const baseType = core.standaloneResultMeta(1) === 0 ? "row" : "col";
    const coverType = baseType === "row" ? "col" : "row";
    const maskIndexes = (mask) => {
      const out = [];
      for (let i = 0; i < 9; i++) if (mask & (1 << i)) out.push(i);
      return out;
    };
    return {
      actionType: "eliminate",
      technique,
      subtype: baseType,
      patternCells,
      finCells,
      eliminations: readStandaloneEliminations(core),
      context: {
        digit: core.standaloneResultMeta(0),
        baseType,
        coverType,
        baseIdxs: maskIndexes(core.standaloneResultMeta(2) & 0x1ff),
        coverIdxs: maskIndexes(core.standaloneResultMeta(3) & 0x1ff),
      },
    };
  }

  const fishIds = new Set([10, 11, 15, 16]);
  if (fishIds.has(techniqueId)) {
    const baseType = core.standaloneResultMeta(1) === 0 ? "row" : "col";
    const coverType = baseType === "row" ? "col" : "row";
    const baseMask = core.standaloneResultMeta(2) & 0x1ff;
    const coverMask = core.standaloneResultMeta(3) & 0x1ff;
    const maskIndexes = (mask) => {
      const out = [];
      for (let i = 0; i < 9; i++) if (mask & (1 << i)) out.push(i);
      return out;
    };
    return {
      actionType: "eliminate",
      technique,
      subtype: baseType,
      patternCells: readStandalonePatternCells(core),
      eliminations: readStandaloneEliminations(core),
      context: {
        digit: core.standaloneResultMeta(0),
        baseType,
        coverType,
        baseIdxs: maskIndexes(baseMask),
        coverIdxs: maskIndexes(coverMask),
      },
    };
  }

  const unitTypeCode = core.standaloneResultMeta(0);
  const unitType = unitTypeCode === 0 ? "row" : unitTypeCode === 1 ? "col" : "box";
  const digitMask = core.standaloneResultMeta(2) & 0x1ff;
  return {
    actionType: "eliminate",
    technique,
    subtype: unitType,
    patternCells: readStandalonePatternCells(core),
    eliminations: readStandaloneEliminations(core),
    context: {
      unitType,
      idx: core.standaloneResultMeta(1),
      digits: maskToDigits(digitMask),
    },
  };
}


function runStaticNishioFinder(core, alreadyRun = false) {
  if (!alreadyRun) core.runStaticNishioFinder();
  if (core.finderResultActionType() === 0) return null;
  const r = core.finderResultStartR();
  const c = core.finderResultStartC();
  const d = core.finderResultStartDigit();
  return {
    actionType: "eliminate",
    technique: "nishioChain",
    patternCells: [[r, c]],
    eliminations: readFinderEliminations(core),
    context: { r, c, d, branches: null },
  };
}

function runStaticUnaryFinder(core, alreadyRun = false) {
  if (!alreadyRun) core.runStaticUnaryFinder();
  const actionType = core.finderResultActionType();
  if (actionType === 0) return null;
  const startR = core.finderResultStartR();
  const startC = core.finderResultStartC();
  const startDigit = core.finderResultStartDigit();
  if (actionType === 1) {
    const r = core.finderResultR();
    const c = core.finderResultC();
    const digit = core.finderResultDigit();
    return {
      actionType: "fill",
      technique: "unaryChain",
      r,
      c,
      digit,
      patternCells: [[startR, startC]],
      context: {
        startCell: [startR, startC],
        startDigit,
        concludeCell: [r, c],
        concludeDigit: digit,
        concludeValue: true,
        branches: null,
      },
    };
  }
  const eliminations = readFinderEliminations(core);
  return {
    actionType: "eliminate",
    technique: "unaryChain",
    patternCells: [[startR, startC]],
    eliminations,
    context: {
      startCell: [startR, startC],
      startDigit,
      concludeValue: false,
      eliminationCount: eliminations.length,
      branches: null,
    },
  };
}

function runStaticMultipleFinder(core, alreadyRun = false) {
  if (!alreadyRun) core.runStaticMultipleFinder();
  const actionType = core.finderResultActionType();
  if (actionType === 0) return null;

  const kindCode = core.finderResultKind();
  const patternCells = readFinderPatternCells(core);
  const eliminations = actionType === 2 ? readFinderEliminations(core) : null;
  const r = core.finderResultR();
  const c = core.finderResultC();
  const digit = core.finderResultDigit();
  let context;

  if (kindCode === 1) {
    const startR = core.finderResultStartR();
    const startC = core.finderResultStartC();
    const startDigits = maskToDigits(core.getInputMask(startR * 9 + startC) & 0x1ff);
    context = actionType === 1
      ? {
          kind: "cell",
          startCell: [startR, startC],
          startDigits,
          concludeCell: [r, c],
          concludeDigit: digit,
          branches: null,
        }
      : {
          kind: "cell",
          startCell: [startR, startC],
          startDigits,
          eliminationCount: eliminations.length,
          branches: null,
        };
  } else {
    const unitTypeCode = core.finderResultUnitType();
    const unitType = unitTypeCode === 0 ? "row" : unitTypeCode === 1 ? "col" : "box";
    const unitIdx = core.finderResultUnitIdx();
    const startDigit = core.finderResultStartDigit();
    context = actionType === 1
      ? {
          kind: "region",
          unitType,
          unitIdx,
          digit: startDigit,
          startCells: patternCells.map((cell) => [...cell]),
          concludeCell: [r, c],
          concludeDigit: digit,
          branches: null,
        }
      : {
          kind: "region",
          unitType,
          unitIdx,
          digit: startDigit,
          startCells: patternCells.map((cell) => [...cell]),
          eliminationCount: eliminations.length,
          branches: null,
        };
  }

  return actionType === 1
    ? { actionType: "fill", technique: "multipleChain", r, c, digit, patternCells, context }
    : { actionType: "eliminate", technique: "multipleChain", patternCells, eliminations, context };
}


function runTechniqueById(core, techniqueId, budgetLimit, alreadyRun = false) {
  if (techniqueId >= 0 && techniqueId <= 41) return runStandaloneTechniqueFinder(core, techniqueId, alreadyRun);
  if (techniqueId === 42) return runStaticUnaryFinder(core, alreadyRun);
  if (techniqueId === 43) return runStaticNishioFinder(core, alreadyRun);
  if (techniqueId === 44) return runStaticMultipleFinder(core, alreadyRun);
  if (techniqueId >= 45 && techniqueId <= 49) return runStandaloneTechniqueFinder(core, techniqueId, alreadyRun);
  if (techniqueId === 50) return runDynamicNishioFinder(core, budgetLimit, alreadyRun).finding;
  if (techniqueId === 51) return runDynamicUnaryFinder(core, budgetLimit, alreadyRun).finding;
  if (techniqueId === 52) return runDynamicMultipleFinder(core, budgetLimit, alreadyRun).finding;
  throw new RangeError("Unknown TECHNIQUE_CHAIN id: " + techniqueId);
}

function materializeTechniqueFinding(core, techniqueId, budgetLimit = 6790) {
  return runTechniqueById(core, techniqueId, budgetLimit, true);
}

function findNextStepWasm(core, options = {}) {
  const budgetLimit = options.budgetLimit ?? 6790;
  const validator = typeof options.validator === "function" ? options.validator : null;
  let startId = 0;
  while (startId < 53) {
    const techniqueId = core.runFindNextTechniqueIdFrom(startId, budgetLimit);
    if (techniqueId < 0) return null;
    const finding = runTechniqueById(core, techniqueId, budgetLimit, true);
    if (!finding) throw new Error("WASM selected technique " + techniqueId + " but adapter could not materialize its Finding");
    if (!validator || validator(finding)) return finding;
    startId = techniqueId + 1;
  }
  return null;
}

function findAllAvailableStepsWasm(core, options = {}) {
  const budgetLimit = options.budgetLimit ?? 6790;
  const validator = typeof options.validator === "function" ? options.validator : null;
  core.runScanAvailableTechniques(budgetLimit);
  const low = core.resultAvailableTechniqueMaskLow() >>> 0;
  const high = core.resultAvailableTechniqueMaskHigh() >>> 0;
  const findings = [];
  for (let id = 0; id < 53; id++) {
    const available = id < 32 ? !!(low & (1 << id)) : !!(high & (1 << (id - 32)));
    if (!available) continue;
    const finding = runTechniqueById(core, id, budgetLimit, false);
    if (!finding) throw new Error("WASM availability scan marked technique " + id + " but adapter could not materialize its Finding");
    if (!validator || validator(finding)) findings.push(finding);
  }
  return findings;
}

  let core = null;
  let attempted = false;
  const stats = { backend: 'uninitialized', searches: 0, detailSearches: 0 };
  function getCore() {
    if (attempted) return core;
    attempted = true;
    try {
      if (typeof WebAssembly === 'undefined') throw new Error('WebAssembly unavailable');
      const bytes = Uint8Array.from(atob(base64), ch => ch.charCodeAt(0));
      core = new WebAssembly.Instance(new WebAssembly.Module(bytes), { env: { abort: makeAbort() } }).exports;
      stats.backend = 'wasm';
    } catch (error) {
      stats.backend = 'javascript';
      console.warn('[Sudoku] WASM initialization unavailable; using the original JavaScript solver.', error);
    }
    return core;
  }
  function load(grid, getCands, givenGrid) {
    const engine = getCore();
    if (!engine) return null;
    const masks = Array.from({ length: 81 }, (_, index) => {
      const r = Math.floor(index / 9), c = index % 9;
      return grid[r][c] ? 0 : candMaskAt(getCands, r, c);
    });
    loadPosition(engine, grid, masks, givenGrid ?? null);
    return engine;
  }
  return {
    stats,
    next(grid, getCands, order, givenGrid, validator) {
      // Detailed chain derivations are UI data not present in the WASM ABI.
      // Preserve the original complete path when that user option is enabled.
      if (state.settings.showChainDetail) { stats.detailSearches++; return undefined; }
      const engine = load(grid, getCands, givenGrid);
      if (!engine) return undefined;
      stats.searches++;
      if (!order || order === TECHNIQUE_CHAIN) return findNextStepWasm(engine, { validator });
      for (const entry of order) {
        const id = TECHNIQUE_CHAIN.indexOf(entry);
        if (id < 0) throw new Error('Unknown Sudoku technique order entry');
        const finding = runTechniqueById(engine, id, 6790);
        if (finding && (!validator || validator(finding))) return finding;
      }
      return null;
    },
    all(grid, getCands, givenGrid, validator) {
      const engine = load(grid, getCands, givenGrid);
      if (!engine) return undefined;
      stats.searches++;
      return findAllAvailableStepsWasm(engine, { validator });

})();

function findNextStep(grid, getCands, order, givenGrid, validator) {
  const accelerated = WASM_RUNTIME.next(grid, getCands, order, givenGrid, validator);
  if (accelerated !== undefined) return accelerated;
  for (const { fn } of order || TECHNIQUE_CHAIN) {
    const finding = callTechniqueFn(fn, grid, getCands, givenGrid);
    if (finding && (!validator || validator(finding))) return finding;
  }
  return null;
}

// 跟findNextStep用的是同一批技巧、同一份arity判断逻辑,区别只是不提前
// return——TECHNIQUE_CHAIN里每一个技巧都跑一遍,把全部命中的原始
// finding都收集起来(不含message/peers,这两样很"贵"、只有真被选中
// 的那个才值得算,由调用方按需补,见wrapFinding)。顺序固定用
// TECHNIQUE_CHAIN默认顺序——"提示列出全部技巧"这个模式底下,
// 「反向遍历」已经被强制关闭,排序对"列出哪些技巧"这件事本身没有
// 意义,只影响列表里技巧名字先后,统一用默认顺序即可,不用接受
// order参数。
function findAllAvailableSteps(grid, getCands, givenGrid, validator) {
  const accelerated = WASM_RUNTIME.all(grid, getCands, givenGrid, validator);
  if (accelerated !== undefined) return accelerated;
  // 强制链/动态强制链家族(unaryChain/nishioChain/multipleChain及其
  // Dynamic版本)内部直接读全局state.settings.showChainDetail,开着的
  // 话每个命中都会多算一次详细推导——建列表这一步只需要知道"命中了
  // 哪些技巧",详细推导只有用户真从列表里点中这一个技巧时才值得算
  // (见handleHintChoicePick),所以这里临时按"关"跑,跑完再还原成
  // 用户真实的设置,不影响这次扫描之外的任何行为。
  const savedShowChainDetail = state.settings.showChainDetail;
  state.settings.showChainDetail = false;
  try {
    const results = [];
    for (const { fn } of TECHNIQUE_CHAIN) {
      const finding = callTechniqueFn(fn, grid, getCands, givenGrid);
      if (finding && (!validator || validator(finding))) results.push(finding);
    }
    return results;
  } finally {
    state.settings.showChainDetail = savedShowChainDetail;
  }
}

// 棋盘上所有跟唯一解不符的非给定格子(不只是第一个)——纠错顺序的
// 修复需要拿到完整列表,才能构造"把错的都当成空格"的修正视图。
function findAllWrongCells(grid, given, solution) {
  const wrong = [];
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const isGivenCell = given && given[r][c];
      if (!isGivenCell && grid[r][c] !== 0 && grid[r][c] !== solution[r][c]) {
        wrong.push({ r, c, correctDigit: solution[r][c] });
      }
    }
  }
  return wrong;
}

// 用方位描述一个宫,比"第5宫"这种编号直观得多,不需要用户数格子。
function describeBox(box) {
  const names = ["左上宫", "中上宫", "右上宫", "左中宫", "正中宫", "右中宫", "左下宫", "中下宫", "右下宫"];
  return names[box];
}
function collectUnitPeers(r, c) {
  const peers = new Set();
  unitCells("row", r).forEach(([pr, pc]) => peers.add(`${pr},${pc}`));
  unitCells("col", c).forEach(([pr, pc]) => peers.add(`${pr},${pc}`));
  unitCells("box", boxIndex(r, c)).forEach(([pr, pc]) => peers.add(`${pr},${pc}`));
  peers.delete(`${r},${c}`);
  return [...peers];
}

/* -------------------- 消息渲染系统 --------------------
   每个renderer返回若干"段落"拼接成的文本(段落间空一行,配合
   #note的white-space:pre-line实现真正的换行,不是挤成一整段)。
   options.verbose开启时,末尾会追加一段"具体来说"——把这一步
   实际会发生的动作(填哪个格子/划掉哪些候选数)按坐标点名复述
   一遍。options.forAuto开启时,收尾的行动指引换成"接下来会自动…"
   而不是"再点一次「提示」…"。这是手动提示和Auto模式共用同一套
   渲染逻辑、但详略/措辞不同的机制:手动提示默认两个选项都关闭
   (简洁),Auto模式两个都开启(更详细、措辞匹配自动执行)。
   -------------------- */

function joinParagraphs(paragraphs) {
  return paragraphs.filter(Boolean).join("\n\n");
}
function gspSymmetryDescription(symmetry) {
  if (symmetry === "diagonal") return "关于左上到右下的对角线镜像对称";
  if (symmetry === "antidiagonal") return "关于左下到右上的对角线镜像对称";
  return "关于盘面正中心 180° 旋转对称";
}
function describeUnit(unitType, idx) {
  if (unitType === "row") return `第 ${idx + 1} 行`;
  if (unitType === "col") return `第 ${idx + 1} 列`;
  return describeBox(idx);
}

// ==== 强制链详细推导:文字渲染辅助 ====
//
// 单步摘要故意做得很紧凑(技巧名+具体动作,一行完事),不是直接复用
// 每个技巧自己那套完整的多段落说明——一条链条动辄十几二十步,每步
// 都塞一整段说明,读起来只会是灾难,压缩成一行才读得下去。
function describeChainStepOneLine(finding) {
  const techLabel = TECHNIQUE_LABELS[finding.technique] || finding.technique;
  if (finding.actionType === "fill") {
    return `${techLabel}:${describeCell(finding.r, finding.c)}填入 ${finding.digit}`;
  }
  const elimDesc = finding.eliminations.map((e) => `${describeCell(e.r, e.c)}候选数 ${e.digit}`).join("、");
  return `${techLabel}:排除 ${elimDesc}`;
}
function describeContradictionReason(reason) {
  if (!reason) return "出现矛盾";
  if (reason.kind === "cellExhausted") return `${describeCell(reason.r, reason.c)}的候选数被排除到一个都不剩`;
  if (reason.kind === "unitExhausted") return `数字 ${reason.digit} 在${describeUnit(reason.unitType, reason.unitIndex)}里没有地方可以填了`;
  return "出现矛盾";
}
// 拼出完整的多分支详细推导文本,插在消息末尾。branches为null(详情
// 开关关闭,或者这个finding本身没走详细推导那条路)时返回空字符串,
// 上层直接不追加这一段,消息文案回到跟详情开关关闭时完全一样。
function renderChainBranchesDetail(branches) {
  if (!branches || branches.length === 0) return "";
  const parts = branches.map((b) => {
    if (b.tooLong) {
      const reasonPart = b.contradiction ? `,矛盾具体是:${describeContradictionReason(b.contradictionReason)}` : "";
      return `【${b.label}】这条推导共${b.stepCount != null ? b.stepCount : "很多"}步,篇幅太长不逐条展开${reasonPart}。`;
    }
    if (!b.steps || b.steps.length === 0) {
      return `【${b.label}】直接得出结论,没有中间推导步骤。`;
    }
    const stepLines = b.steps.map((s, i) => `　第 ${i + 1} 步 · ${describeChainStepOneLine(s)}`).join("\n");
    const tail = b.contradiction ? `\n　→ 矛盾:${describeContradictionReason(b.contradictionReason)}` : "";
    return `【${b.label}】\n${stepLines}${tail}`;
  });
  return "\n\n" + parts.join("\n\n");
}

function describeUnitList(unitType, idxs) {
  return idxs.map((i) => describeUnit(unitType, i)).join("、");
}
function describeDigits(digits) {
  return digits.join("、");
}
function describeCell(r, c) {
  return `第 ${r + 1} 行第 ${c + 1} 列`;
}
function describeFillAction(finding) {
  return `具体来说:${describeCell(finding.r, finding.c)}这一格,会被填入数字 ${finding.digit}。`;
}
function describeEliminationAction(eliminations) {
  const byCell = new Map();
  for (const { r, c, digit } of eliminations) {
    const key = `${r},${c}`;
    if (!byCell.has(key)) byCell.set(key, { r, c, digits: [] });
    byCell.get(key).digits.push(digit);
  }
  const parts = [...byCell.values()]
    .sort((a, b) => a.r - b.r || a.c - b.c)
    .map((cell) => `${describeCell(cell.r, cell.c)}划掉候选数 ${cell.digits.sort((a, b) => a - b).join("、")}`);
  return `具体来说:${parts.join("；")}。`;
}
// 每条消息收尾的"下一步会怎样"——手动模式说"再点一次提示",Auto
// 模式说"接下来会自动",两种措辞集中在这一个函数里管理,不用在每个
// renderer里各自判断forAuto、容易漏改或改出语法别扭的句子。
function actionPhrase(kind, options = {}) {
  const forAuto = !!options.forAuto;
  if (kind === "eliminate") {
    return forAuto ? "接下来会自动把这些候选数划掉。" : "再点一次「提示」,会把浅色标出的那些候选数真的划掉。";
  }
  if (kind === "fixReveal") {
    return forAuto
      ? "接下来会自动换成正确答案。"
      : "再点一次「提示」可以直接换成正确答案;想自己再想想的话,先去改别的格子也行。";

// 把一个原始finding(actionType只会是fill或eliminate——TECHNIQUE_CHAIN
// 里任何技巧函数都只产出这两种,"fix"/"advanced"是getHint自己在技巧链
// 之外另外构造的,不会走到这里)补全成UI真正要用的形状:fill补上
// peers(方便高亮同数字),两种都补上message(渲染成人话的文案)。
// getHint的单命中流程、findAllAvailableSteps列表模式下"用户点中了某一
// 项"之后,都调用这同一个函数,保证两条路径拼出来的对象形状完全
// 一致,下游pendingHint/displayComputedHint不用关心它从哪条路径来的。
function wrapFinding(finding, options) {
  if (finding.actionType === "fill") {
    return { ...finding, peers: collectUnitPeers(finding.r, finding.c), message: renderFillMessage(finding, options) };
  }
  return { ...finding, message: renderEliminateMessage(finding, options) };
}

function getHint(grid, notes, solution, options = {}) {
  const hasEmpty = grid.some((row) => row.some((v) => v === 0));
  if (!hasEmpty) return null;

  // preferAdvanced优先看显式传入的值——Worker线程里没有跟主线程同步
  // 的state,只能靠调用方把这个开关的值显式带过来;主线程直接调用
  // (没传这个option)时才退回读全局state,行为跟以前一致。
  const preferAdvanced = options.preferAdvanced !== undefined ? options.preferAdvanced : state.settings.preferAdvancedHint;
  const getCands = (r, c) => liveCandidatesAt(grid, notes, r, c);
  // options.technique:"提示列出全部技巧"模式下,用户已经从列表里点中
  // 了具体是哪一个技巧(比如需要单独补一次强制链详细推导时),这里就
  // 只试这一个技巧、不走完整链条——见handleHintChoicePick。平时(不传
  // 这个option)才是原来的"按顺序试整条链,命中第一个就用"。
  const order = options.technique
    ? TECHNIQUE_CHAIN.filter((entry) => entry.key === options.technique)
    : preferAdvanced
    ? TECHNIQUE_CHAIN_DESC
    : undefined;
  const finding = findNextStep(grid, getCands, order, options.givenGrid, (f) => exocetFindingMatchesSolution(f, solution));

  if (finding && (finding.actionType === "fill" || finding.actionType === "eliminate")) {
    return wrapFinding(finding, options);
  }

  // 技巧链没有命中——不是"这题需要猜",是咱们还没实现能推到这里的
  // 技巧。挑候选数最少的格子做进阶提示,老实说明情况,不假装是
  // 推理出来的。
  let best = null,
    bestLen = 10;
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] === 0) {
        const cands = getCands(r, c);
        if (cands.length < bestLen) {
          bestLen = cands.length;
          best = { r, c };
        }
      }
    }
  const advancedFinding = { actionType: "advanced", r: best.r, c: best.c, digit: solution[best.r][best.c] };
  return {
    ...advancedFinding,
    peers: collectUnitPeers(best.r, best.c),
    message: renderAdvancedMessage(advancedFinding, options),
  };
}

  if (!hasEmpty) return Promise.resolve(null);

  const preferAdvanced = state.settings.preferAdvancedHint;
  const worker = getDifficultyWorker();
  if (worker) {
    const id = ++difficultyRequestId;
    const loadingTimer = onLoading ? setTimeout(onLoading, DIFFICULTY_LOADING_DELAY_MS) : null;
    return new Promise((resolve) => {
      const handler = (e) => {
        if (e.data.id !== id) return;
        worker.removeEventListener("message", handler);
        if (loadingTimer) clearTimeout(loadingTimer);
        resolve(e.data.error ? null : e.data.result); // 算提示这一步万一出错,当作"没找到"处理,不假装推理出了结果
      };
      worker.addEventListener("message", handler);
      worker.postMessage({ id, type: "hint", grid, notes, solution, preferAdvanced, showChainDetail: state.settings.showChainDetail, options });
    });
  }
  if (onLoading) onLoading(true);
  return new Promise((resolve) => {
    setTimeout(() => resolve(getHint(grid, notes, solution, { ...options, preferAdvanced })), 0);
  });
}

// findAllAvailableSteps的异步版本——"提示列出全部技巧"模式点「提示」
// 时用这个,而不是getHintAsync。跟getHintAsync共用同一个Worker实例、
// 同一套id匹配/onLoading延迟通知机制,只是type换成"listTechniques",
// 详见getDifficultyWorker里worker端的分发逻辑。没有空格(已经解完)
// 时直接返回空数组,不占用Worker。
function findAllAvailableStepsAsync(grid, notes, solution, options, onLoading) {
  const hasEmpty = grid.some((row) => row.some((v) => v === 0));
  // 跟getHintAsync一样用null专门表示"已经解完",不是[]——[]留给"确实
  // 还有空格,但53个技巧一个都没命中"这种完全不同的处境,调用方
  // (computeAllHintChoices)要能把这两种情况分开处理,不能都当成
  // "没什么可列的"一概而论。
  if (!hasEmpty) return Promise.resolve(null);

  const worker = getDifficultyWorker();
  if (worker) {
    const id = ++difficultyRequestId;
    const loadingTimer = onLoading ? setTimeout(onLoading, DIFFICULTY_LOADING_DELAY_MS) : null;
    return new Promise((resolve) => {
      const handler = (e) => {
        if (e.data.id !== id) return;
        worker.removeEventListener("message", handler);
        if (loadingTimer) clearTimeout(loadingTimer);
        resolve(e.data.error ? [] : e.data.result); // 扫描过程万一出错,当作"什么都没找到"处理,不假装扫描出了结果
      };
      worker.addEventListener("message", handler);
      worker.postMessage({ id, type: "listTechniques", grid, notes, solution, givenGrid: options && options.givenGrid, options });
    });
  }
  if (onLoading) onLoading(true);
  return new Promise((resolve) => {
    setTimeout(() => {
      const getCands = (r, c) => liveCandidatesAt(grid, notes, r, c);
      const findings = findAllAvailableSteps(grid, getCands, options && options.givenGrid, (f) => exocetFindingMatchesSolution(f, solution));
      resolve(findings.map((f) => wrapFinding(f, options || {})));
    }, 0);
  });
}

// 启动自检:TECHNIQUE_CHAIN/TECHNIQUE_SE_WEIGHT/TECHNIQUE_LABELS
// 三处的key集合必须完全一致,少注册一处会在控制台立刻报警,不用等
// 到某天手动抽查才发现——这是从"新加技巧漏注册"这个老坑里长出来
// 的固定检查,以后每加一个技巧,这段代码会自动帮忙盯着。
(function checkTechniqueRegistryConsistency() {
  const chainKeys = new Set(TECHNIQUE_CHAIN.map((t) => t.key));
  const weightKeys = new Set(Object.keys(TECHNIQUE_SE_WEIGHT));
  const labelKeys = new Set(Object.keys(TECHNIQUE_LABELS));
  const allKeys = new Set([...chainKeys, ...weightKeys, ...labelKeys]);
  const missing = [];
  for (const k of allKeys) {
    const where = [];
    if (!chainKeys.has(k)) where.push("TECHNIQUE_CHAIN");
    if (!weightKeys.has(k)) where.push("TECHNIQUE_SE_WEIGHT");
    if (!labelKeys.has(k)) where.push("TECHNIQUE_LABELS");
    if (where.length > 0) missing.push(`"${k}"缺失于: ${where.join(", ")}`);
  }

  // 消息渲染分支容易漏写:renderFillMessage/renderEliminateMessage是
  // 手写的if/else链,不像TECHNIQUE_CHAIN那样是数据驱动的表,加新技巧
  // 时很容易顾着算法/注册三件套,却忘了顺手补一条渲染分支——出问题
  // 时是静默的(要么被误判成别的技巧文案,要么提示消息直接是空的),
  // 不会像三件套缺失那样容易在别处报错暴露出来。这里做一个不追求
  // 100%精确、但能覆盖绝大多数情况的启发式检查:每个技巧的key
  // 字符串字面量,应该能在renderFillMessage或renderEliminateMessage
  // 的源码文本里找到——hiddenSingle是唯一的例外(它走的是没有显式
  // 字符串匹配的兜底分支,设计如此,不是遗漏)。
  const RENDER_CHECK_ALLOWLIST = new Set(["hiddenSingle"]);
  const rendererSource = renderFillMessage.toString() + renderEliminateMessage.toString();
  const missingRender = [];
  for (const k of chainKeys) {
    if (RENDER_CHECK_ALLOWLIST.has(k)) continue;
    if (!rendererSource.includes(`"${k}"`)) missingRender.push(k);
  }
  if (missingRender.length > 0) missing.push(`消息渲染分支疑似缺失: ${missingRender.join(", ")}`);

  if (missing.length > 0 && typeof console !== "undefined") {
    console.warn("[技巧注册表不一致] " + missing.join(" | "));
  }
})();

// 按SE权重从高到低重新排一份TECHNIQUE_CHAIN——直接从TECHNIQUE_CHAIN
// 和TECHNIQUE_SE_WEIGHT现算,不是另外手写一份技巧列表,这样就不存在
// "改了技巧库,忘记同步这第四份顺序"的问题,它永远跟着前面那三处走。
const TECHNIQUE_CHAIN_DESC = [...TECHNIQUE_CHAIN].sort(
  (a, b) => TECHNIQUE_SE_WEIGHT[b.key] - TECHNIQUE_SE_WEIGHT[a.key]
);

// 消息文本里峰值分和累加分永远都会显示,不受这个开关影响——这个
// 开关只决定"入门/简单/中等/..."这个定性归档用哪个数字去算:
// "hardest"用峰值(默认,跟真正SE工具的习惯一致),"sum"用累加。
const SE_SCORING_MODE = "hardest";

// 把连续的SE分值粗分成几档中文说法,方便读——分档边界是我们自己按
// 官方表的技巧分布区间估的,不是SE官方定义的分档标准(SE本身只给
// 连续数值,不分档)。
function seDifficultyTier(score) {
  if (score < 1.6) return "入门";
  if (score < 2.5) return "简单";
  if (score < 3.5) return "中等";
  if (score < 4.5) return "困难";
  if (score < 5.5) return "很困难";
  return "极难";
}

// solution是可选参数——测难度/校验这两个调用方(自建的校验、做题的
// 测难度)其实在调这个函数之前就已经手握真实解了(校验靠solveCount
// 顺带算出来,测难度这边state.play.solution本来就在),只是以前没有
// 传进来,这条推理路径因此完全没有正确性检查,跟"做题"模式的提示/
// Auto步进走的是两套待遇——那边每一步都会跟真实解核对,这边在这次
// 修复之前一步都不核对。如果技巧本身有bug做出错误消除/错误填数,
// 会在这个"盲盒"式的整题推理里悄悄发生:轻则整题被判定成技巧库
// 推不到底(其实是被污染后推不动,不是真的需要更高技巧),重则一路
// 推完给出一个建立在错误推理上的难度分,用户和开发者都不会有任何
// 察觉。传了solution进来,这条路径就跟"做题"模式共用同一套
// verifySoundnessAfterApply/buildSoundnessErrorReport,查出问题立刻
// 中止并把完整报告当结果返回——不继续假装能算出一个难度分。
function estimateDifficulty(startGrid, solution, onProgress) {
  const totalEmpty = startGrid.reduce((sum, row) => sum + row.filter((v) => v === 0).length, 0);
  if (totalEmpty === 0) {
    return "这盘已经填满了,没有任何空格需要推理 —— 这其实是答案本身,不是一道待解的题,谈不上难度。";
  }
  let g = cloneGrid(startGrid);
  const tracker = makeEliminationTracker();
  const getCands = (r, c) => trackedCandidatesAt(g, tracker, r, c);
  const techCounts = {};
  let usedAdvanced = false;
  const t0 = onProgress ? Date.now() : 0;
  let lastReportedMs = 0;
  while (true) {
    const hasEmpty = g.some((row) => row.some((v) => v === 0));
    if (!hasEmpty) break;
    const finding = findNextStep(g, getCands, undefined, startGrid, (f) => exocetFindingMatchesSolution(f, solution));
    if (!finding) {
      usedAdvanced = true;
      break;
    }
    const beforeSnapshot = solution ? snapshotCandidatesGrid(g, getCands) : null;
    techCounts[finding.technique] = (techCounts[finding.technique] || 0) + 1;
    if (finding.actionType === "fill") {
      g[finding.r][finding.c] = finding.digit;
    } else {
      for (const { r, c, digit } of finding.eliminations) tracker.markErased(r, c, digit);
    }
    if (solution) {
      const problem = verifySoundnessAfterApply(finding, solution, g, getCands);
      if (problem) {
        const afterSnapshot = snapshotCandidatesGrid(g, getCands);
        return buildSoundnessErrorReport(finding, beforeSnapshot, afterSnapshot, problem);
      }
    }
    // 进度上报:粒度是"技巧链每走一步"(不是每次propagateAssumptionCore
    // 调用那么细,那个粒度太密),节流到至少间隔100ms才真的调一次
    // 回调——单个技巧步骤如果本身就要跑好几秒(比如撞上DFC),中途
    // 这段时间是没法再细分汇报的,这是不深入插桩传播内部的前提下
    // 能做到的最细粒度了。
    if (onProgress) {
      const elapsed = Date.now() - t0;
      if (elapsed - lastReportedMs >= 100) {
        lastReportedMs = elapsed;
        onProgress(elapsed);
      }
    }
  }

  // 推不到底不等于实现有缺口:Phil's Folly #10连YZF_Sudoku也只能靠蛮力,见TECHNIQUE_CHAIN旁的封顶声明。
  if (usedAdvanced) {
    const ceiling = Math.max(...Object.values(TECHNIQUE_SE_WEIGHT));
    return `现有技巧库推不到底 —— 需要比我们已实现的最高技巧(${ceiling.toFixed(1)} 分)更高级的技巧才能继续。这题的真实难度至少超过 ${ceiling.toFixed(1)} 分,具体高多少说不准,不能装作算得出来。`;
  }
  if (totalEmpty <= 20) {
    return `只留了 ${totalEmpty} 个空格,几乎不用推理就能填完,挑战性很低,称不上有难度。`;
  }

  const usedTechniques = Object.keys(techCounts);
  const peakScore = Math.max(...usedTechniques.map((t) => TECHNIQUE_SE_WEIGHT[t] || 0));
  const sumScore = usedTechniques.reduce((sum, t) => sum + (TECHNIQUE_SE_WEIGHT[t] || 0) * techCounts[t], 0);
  const totalSteps = usedTechniques.reduce((sum, t) => sum + techCounts[t], 0);
  let hardestTechnique = usedTechniques[0];
  for (const t of usedTechniques) {
    if ((TECHNIQUE_SE_WEIGHT[t] || 0) > (TECHNIQUE_SE_WEIGHT[hardestTechnique] || 0)) hardestTechnique = t;
  }
  const label = TECHNIQUE_LABELS[hardestTechnique];
  const count = techCounts[hardestTechnique];
  // SE_SCORING_MODE只决定用峰值还是累加去定性归档(入门/简单/...),
  // 不决定消息里显不显示——两个数字永远都给,不能只报其中一个:
  // 峰值分相同的两道题,累加分和"最高技巧用了几次"可能天差地别
  // (比如同样5.2分,一道只用1次XY-链,另一道用了8次),只看峰值会
  // 把这种真实的难度差距藏起来。
  const tierScore = SE_SCORING_MODE === "sum" ? sumScore : peakScore;
  const tier = seDifficultyTier(tierScore);
  return `SE 难度分:峰值 ${peakScore.toFixed(1)}(只取推理过程中最难那一步) / 累加 ${sumScore.toFixed(1)}(全部 ${totalSteps} 步分值加总),定性为${tier}。推理过程中用到的最高技巧是${label},出现了 ${count} 次——峰值相同不代表真的一样难,累加分和这个次数才看得出差距。`;
}

/* -------------------- 难度评估的后台线程 --------------------
   estimateDifficulty要把整道题从头到尾解一遍,困难题目(尤其是需要
   AIC/ALS-链才能推进的步骤)累计耗时可以到几秒,会让主线程卡住、
   连滑动都会顿。这里用一个常驻的Web Worker把计算挪到后台线程——
   Worker直接复用MAIN_SCRIPT_SOURCE(当前这份脚本自己的源码文本),
   不需要另外维护一份精简代码,技巧逻辑改到哪两边永远同步。 -------------------- */
let difficultyWorker = null;
let difficultyWorkerSupported = typeof Worker !== "undefined" && !!MAIN_SCRIPT_SOURCE;
function getDifficultyWorker() {
  if (!difficultyWorkerSupported) return null;
  if (difficultyWorker) return difficultyWorker;
  try {
    // 这个worker现在身兼两职:算难度(估算题目SE分值)和算提示(Hint/
    // Auto模式下一步该做什么)——变量名还叫difficultyWorker是历史
    // 遗留,懒得为了改名字牵动一堆调用点,但实际上两种请求共用同一
    // 个worker实例、同一份postMessage/onmessage通道,靠message里的
    // id区分responds属于哪次请求、靠type区分该调用哪个函数。
    const workerCode =
      MAIN_SCRIPT_SOURCE +
      `
      self.onmessage = function (e) {
        const { id, type } = e.data;
        try {
          if (type === "hint") {
            const { grid, notes, solution, preferAdvanced, showChainDetail, options } = e.data;
            // 强制链技巧内部是直接读state.settings.showChainDetail这个
            // 全局值的(没有走参数传递,历史原因是所有技巧函数统一
            // (grid,getCands)签名,不方便单独给这几个技巧加参数)。
            // worker有自己独立的state(整份脚本在worker里重新执行了
            // 一遍),不会跟主线程同步,不手动赋值这里就永远是初始值
            // false,用户开了这个设置在worker路径下也不会生效。
            state.settings.showChainDetail = !!showChainDetail;
            const result = getHint(grid, notes, solution, { ...options, preferAdvanced });
            self.postMessage({ id, result });
          } else if (type === "listTechniques") {
            // "提示列出全部技巧"模式的扫描请求——不用像上面"hint"分支
            // 那样从主线程带preferAdvanced/showChainDetail过来:顺序永远
            // 用默认TECHNIQUE_CHAIN(反向遍历对"列出哪些技巧"没有意义),
            // showChainDetail由findAllAvailableSteps自己临时强制关闭,
            // 跟主线程真实设置是什么无关。
            const { grid, notes, solution, givenGrid, options } = e.data;
            const getCands = (r, c) => liveCandidatesAt(grid, notes, r, c);
            const findings = findAllAvailableSteps(grid, getCands, givenGrid, (f) => exocetFindingMatchesSolution(f, solution));
            const result = findings.map((f) => wrapFinding(f, options || {}));
            self.postMessage({ id, result });
          } else {
            const { grid, solution, reportProgress } = e.data;
            const onProgress = reportProgress ? (ms) => self.postMessage({ id, progress: ms }) : undefined;
            const result = estimateDifficulty(grid, solution, onProgress);
            self.postMessage({ id, result });
          }
        } catch (err) {
          self.postMessage({ id, error: String(err && err.message || err) });
        }
      };
    `;
    const blob = new Blob([workerCode], { type: "application/javascript" });
    difficultyWorker = new Worker(URL.createObjectURL(blob));
    return difficultyWorker;
  } catch (e) {
    difficultyWorkerSupported = false; // 这个环境构造Worker失败,以后都不再尝试,直接走主线程兜底
    return null;
  }
}
let difficultyRequestId = 0;
// 算难度这件事挪到Worker之后,返回的是Promise——如果没有Worker支持
// (极少数环境),原地退回主线程同步计算,功能不丢,只是没有这次要
// 解决的"不卡界面"的体验提升。
// grid算完之后resolve出SE难度文案。onLoading是可选回调,用来在
// "该显示加载提示的时候"通知调用方——但具体"该"是什么时候,两条
// 路径完全不同,不能用同一套逻辑:
// - 真的用上Worker的情况:计算在后台线程跑,主线程没被占用,所以
//   可以放心"等DIFFICULTY_LOADING_DELAY_MS毫秒还没出结果才通知",
//   简单题目基本不会触发,不会有一闪而过的视觉噪音。
// - 没有Worker支持、退回主线程同步计算的情况:接下来这一步就是
//   会让界面卡住的重活,"等一会儿再显示"在这里没有意义——主线程
//   会被同步计算整个占满,setTimeout的回调压根没机会被执行,加载
//   提示因此永远不会出现(这是一个真实存在过的bug,不是猜的)。
//   这条路径改成立刻通知,并且用一次0延迟的setTimeout把控制权
//   让出去一轮事件循环,给浏览器一个机会先把这条提示画到屏幕上,
//   再开始真正卡界面的计算——不然DOM改了但从没被绘制过,等于白改。
function estimateDifficultyAsync(grid, onLoading, solution, onProgress) {
  const worker = getDifficultyWorker();
  if (worker) {
    const id = ++difficultyRequestId;
    const loadingTimer = onLoading ? setTimeout(onLoading, DIFFICULTY_LOADING_DELAY_MS) : null;
    return new Promise((resolve) => {
      const handler = (e) => {
        if (e.data.id !== id) return; // 不是这次请求的回复,继续等
        if (e.data.progress !== undefined) {
          if (onProgress) onProgress(e.data.progress);
          return; // 只是一次进度上报,不是最终结果,继续等着
        }
        worker.removeEventListener("message", handler);
        if (loadingTimer) clearTimeout(loadingTimer);
        resolve(e.data.error ? `计算难度时出错:${e.data.error}` : e.data.result);
      };
      worker.addEventListener("message", handler);
      worker.postMessage({ id, grid, solution, reportProgress: !!onProgress });
    });
  }
  // 兜底:这个环境用不上后台线程(比如file://协议下部分浏览器对
  // Worker/Blob有限制,或者压根不支持Worker)。诚实地在提示文案里
  // 说明这一点,而不是装作跟Worker路径体验一样——这样以后如果又
  // 有人反馈"卡顿",看提示文案里有没有这句话就能立刻判断是不是
  // 走了这条兜底路径,不用重新排查一遍。
  // 这条路径不传onProgress给estimateDifficulty——主线程被这次同步
  // 计算整个占满,中途没有机会重绘,传了回调也不会有任何实际的
  // "实时"效果,不如干脆不传,省下这份判断开销。
  if (onLoading) onLoading(true);
  return new Promise((resolve) => {
    setTimeout(() => resolve(estimateDifficulty(grid, solution)), 0);
  });
}
// 延迟出现的加载提示阈值——比这个时间短的计算(大多数随机生成的
// 题目都是这样)不会闪出"计算中"这几个字,只有真的等得久了才会
// 显示,避免简单题目一闪而过的别扭。改这一个数字,两处调用(做题
// 模块的测难度、自建模块的校验)都会跟着变,不用到处找。
const DIFFICULTY_LOADING_DELAY_MS = 150;

function diffCellsReport(a, b) {
  const diffs = [];
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) if (a[r][c] !== b[r][c]) diffs.push(`第${r + 1}行第${c + 1}列`);
  return diffs;
}
