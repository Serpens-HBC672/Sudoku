                        orientation: "row",
                        base: [
                          [baseRow, bc1],
                          [baseRow, bc2],
                        ],
                        baseCandidates: baseDigits,
                        target: [targetR, targetC],
                        endoTarget: [endoR, endoC],
                        trueBaseDigit,
                      },
                    };
                  }

                  if (valueDigits.length !== 0) continue; // 2个以上:C#原版也没处理,判无效跳过

                  // ==== case0:CheckSeniorExocetNoValueCells ====
                  for (const [endoR, endoC] of crossline) {
                    if (grid[endoR][endoC] !== 0) continue;
                    if (endoR === targetR && endoC === targetC) continue;

                    // CheckTargetCellsDigitsValidity:两个格子候选并集覆盖
                    // 全部基准数字,交集(跟基准数字的交集)非空
                    const endoMask = seDigitsMask(endoR, endoC);
                    const unionMask = targetMask | endoMask;
                    if ((unionMask & baseCandMask) !== baseCandMask) continue;
                    if ((targetMask & endoMask & baseCandMask) === 0) continue;

                    // 合法性门槛:用大区域(crosslineIncludingTarget)减去
                    // target格和endo-target格,每个基准数字要么appearing-
                    // times过关,要么locked member过关(只对唯一那个真实
                    // 目标格所在的宫检查,otherCol那一侧没有真正的目标格,
                    // 不适用locked member豁免)——全有全无,任何一个数字
                    // 两条路都过不了,整个组合判无效。这里额外记录每个数字
                    // 走的是哪条路,locked的那些要单独走CheckSeniorLockedMember
                    // 式的消除,不是简单套用基础Rule3/4。
                    const reducedCrossline = crosslineIncludingTarget.filter(
                      ([r, c]) => !(r === targetR && c === targetC) && !(r === endoR && c === endoC)
                    );
                    const lockedDigits = [];
                    let allDigitsValid = true;
                    for (const d of baseDigits) {
                      if (seIsExactAppearingTimesOf(d, reducedCrossline, 2)) continue;
                      if (seCheckLockedMember(d, band, primaryCols, targetR, targetC, baseRow)) {
                        lockedDigits.push(d);
                        continue;
                      }
                      allDigitsValid = false;
                      break;
                    }
                    if (!allDigitsValid) continue;

                    let deduped;
                    let subtype;
                    if (lockedDigits.length === 1) {
                      // 移植自C#的CheckSeniorLockedMember。这个数字虽然
                      // appearing-times过不了,但locked member豁免让它合法——
                      // 消除逻辑不是套用普通Rule3/4,是专门的一套:
                      // endo-target格里(基准数字减lockedDigit)为假、
                      // target格里非基准数字为假,外加"自相残杀规则"——
                      // 如果lockedDigit在(区域减target减endo-target)里最多
                      // 只能出现size-2次(不到size-1),连这个格局本身都撑不住,
                      // lockedDigit在基准格+target+endo-target里全部为假。
                      const lockedDigit = lockedDigits[0];
                      const eliminations = [];
                      const otherBaseMask = baseCandMask & ~(1 << (lockedDigit - 1));
                      for (const d of seDigitsFromMask(endoMask & otherBaseMask)) eliminations.push({ r: endoR, c: endoC, digit: d });
                      for (const d of seDigitsFromMask(targetMask & ~baseCandMask)) eliminations.push({ r: targetR, c: targetC, digit: d });
                      if (seAppearingTimesOf(lockedDigit, reducedCrossline) < 2) {
                        for (const [r, c] of [
                          [baseRow, bc1],
                          [baseRow, bc2],
                          [targetR, targetC],
                          [endoR, endoC],
                        ]) {
                          if (seDigitsMask(r, c) & (1 << (lockedDigit - 1))) eliminations.push({ r, c, digit: lockedDigit });
                        }
                      }
                      const seen2 = new Set();
                      deduped = eliminations.filter((e) => {
                        if (grid[e.r][e.c] !== 0) return false;
                        const k = `${e.r},${e.c},${e.digit}`;
                        if (seen2.has(k)) return false;
                        seen2.add(k);
                        return true;
                      });
                      subtype = "lockedMember";
                      if (deduped.length === 0) continue;
                    } else if (lockedDigits.length > 1) {
                      // 2个以上locked digit:C#原版的switch也没有对应分支,
                      // 判无效跳过,不去猜。
                      continue;
                    } else {
                      // 基础消除:跟JE的Rule3/4完全一样的逻辑,只是目标格对
                      // 换成了[target, endoTarget]
                      const eliminations = [];
                      for (const [r, c, mask] of [
                        [targetR, targetC, targetMask],
                        [endoR, endoC, endoMask],
                      ])
                        for (const d of seDigitsFromMask(mask)) if (!(baseCandMask & (1 << (d - 1)))) eliminations.push({ r, c, digit: d });
                      const targetRem = seDigitsFromMask(targetMask & baseCandMask);
                      const endoRem = seDigitsFromMask(endoMask & baseCandMask);
                      if (targetRem.length === 1 && endoRem.includes(targetRem[0]))
                        eliminations.push({ r: endoR, c: endoC, digit: targetRem[0] });
                      if (endoRem.length === 1 && targetRem.includes(endoRem[0]))
                        eliminations.push({ r: targetR, c: targetC, digit: endoRem[0] });
                      const seen3 = new Set();
                      deduped = eliminations.filter((e) => {
                        if (grid[e.r][e.c] !== 0) return false;
                        const k = `${e.r},${e.c},${e.digit}`;
                        if (seen3.has(k)) return false;
                        seen3.add(k);
                        return true;
                      });
                      subtype = "base";
                      if (deduped.length === 0) continue;
                    }

                    return {
                      actionType: "eliminate",
                      technique: "seniorExocet",
                      subtype,
                      patternCells: [
                        [baseRow, bc1],
                        [baseRow, bc2],
                        [targetR, targetC],
                        [endoR, endoC],
                      ],
                      eliminations: deduped,
                      context: {
                        orientation: "row",
                        base: [
                          [baseRow, bc1],
                          [baseRow, bc2],
                        ],
                        baseCandidates: baseDigits,
                        target: [targetR, targetC],
                        endoTarget: [endoR, endoC],
                      },
                    };
                  }
                }
              }
          }
        }
      }
    }
  }
  return null;
}

function findSeniorExocet(grid, getCands) {
  const rowResult = findSeniorExocetRowOriented(grid, getCands);
  if (rowResult) return sanitizeExocetFinding(rowResult, getCands);
  const t = Array.from({ length: 9 }, () => Array(9).fill(0));
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) t[c][r] = grid[r][c];
  const tGetCands = (r, c) => getCands(c, r);
  const colResult = findSeniorExocetRowOriented(t, tGetCands);
  if (!colResult) return null;
  const swap = ([r, c]) => [c, r];
  const transposed = {
    ...colResult,
    patternCells: colResult.patternCells.map(swap),
    eliminations: colResult.eliminations.map((e) => ({ r: e.c, c: e.r, digit: e.digit })),
    context: {
      ...colResult.context,
      orientation: "col",
      base: colResult.context.base.map(swap),
      target: swap(colResult.context.target),
      endoTarget: swap(colResult.context.endoTarget),
    },
  };
  return sanitizeExocetFinding(transposed, getCands);
}

// POM(候选数排列覆盖法,Pattern Overlay Method):对每个数字d,把它
// "还没确定的每一行"当成一次匹配问题——给每行指派一个候选列,列、宫
// 都不能跟其它行冲突,等价于给这个数字单独求一次"完美匹配"。每一种
// 可行的指派方式叫一个pattern。来源:GNPX page61(POM Rule1)。
// 只实现Rule1(all-pattern/no-pattern);Rule2/Rule2-Lv2(数字间
// 假设-矛盾交互)和Rule3/Rule4(跟NiceLoop搜索结合)复杂度高出一个
// 量级——尤其Rule3/4要求把NiceLoop的路径搜索整个接进来,这次先不做,
// 留作后续独立评估。
// - All Pattern:某个候选格在"全部pattern"里都出现,这个候选必为真
//   ——可以直接填(跟这里其它多格填数的技巧一样,遵循"每步只报告一个
//   格子"的既有惯例:findNextStep/estimateDifficulty的填数分支是
//   g[r][c]=digit的单格写法,不支持一步填多个格;后续step会自然重新
//   发现同一个digit剩下的all-pattern格子)。
// - No Pattern:某个候选格在"任何pattern"里都没出现过,这个候选必为
//   假——可以排除(这条走既有的eliminations数组,一次可以排除多个)。
// - 只有1个pattern时,两条规则的计算结果就是同一个pattern本身/其补集,
//   不需要额外分支,是同一套算法的自然特例(GNPX给出的几个例子里
//   patternCount===1时验证过)。
const POM_MAX_PATTERNS = 4000; // 封顶:超过这个数量就是这个数字还
// 太自由,继续穷举性价比太低,直接放弃——不是bug,是主动剪枝
const POM_STEP_BUDGET = 300000; // 回溯步数预算,防止候选还很松散时
// (行内可选列很多)穷举耗时失控;超预算返回null(=放弃分析),
// 调用方必须把null和"真的0个pattern"分开处理,不能混为一谈
// (0个pattern在POM语境下几乎意味着整盘矛盾,不该被这个技巧发现)
function enumeratePOMPatterns(grid, getCands, digit) {
  const bit = 1 << (digit - 1);
  const rowsNeeded = [];
  const rowColMask = [];
  for (let r = 0; r < 9; r++) {
    let already = false;
    let colMask = 0;
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] === digit) {
        already = true;
        break;
      }
      if (grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit) colMask |= 1 << c;
    }
    if (already) continue;
    if (colMask === 0) return []; // 这一行放不下这个数字了——防御性返回"无解"
    rowsNeeded.push(r);
    rowColMask[r] = colMask;
  }
  if (rowsNeeded.length === 0) return []; // 这个数字已经填完,没有"待定pattern"可言
  const patterns = [];
  const chosen = [];
  let steps = 0;
  let budgetExceeded = false;
  function backtrack(idx, usedColMask, usedBoxMask) {
    if (budgetExceeded) return;
    if (++steps > POM_STEP_BUDGET) {
      budgetExceeded = true;
      return;
    }
    if (idx === rowsNeeded.length) {
      patterns.push(chosen.slice());
      return;
    }
    const r = rowsNeeded[idx];
    const avail = rowColMask[r] & ~usedColMask;
    for (let c = 0; c < 9; c++) {
      if (!(avail & (1 << c))) continue;
      const boxBit = 1 << boxIndex(r, c);
      if (usedBoxMask & boxBit) continue;
      chosen.push([r, c]);
      backtrack(idx + 1, usedColMask | (1 << c), usedBoxMask | boxBit);
      chosen.pop();
      if (patterns.length >= POM_MAX_PATTERNS || budgetExceeded) return;
    }
  }
  backtrack(0, 0, 0);
  if (budgetExceeded) return null;
  return patterns;
}
function findPOM(grid, getCands) {
  for (let digit = 1; digit <= 9; digit++) {
    const patterns = enumeratePOMPatterns(grid, getCands, digit);
    if (patterns === null || patterns.length === 0) continue;
    const bit = 1 << (digit - 1);
    const candidateCells = [];
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++) if (grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit) candidateCells.push([r, c]);
    const cellCount = {};
    for (const pat of patterns) for (const [r, c] of pat) cellCount[`${r},${c}`] = (cellCount[`${r},${c}`] || 0) + 1;
    const fixedCells = candidateCells.filter(([r, c]) => cellCount[`${r},${c}`] === patterns.length);
    if (fixedCells.length > 0) {
      const [r, c] = fixedCells[0];
      return {
        actionType: "fill",
        technique: "pom",
        r,
        c,
        digit,
        patternCells: candidateCells,
        context: { digit, patternCount: patterns.length, allFixedCells: fixedCells, mode: "allPattern" },
      };
    }
    const excludedCells = candidateCells.filter(([r, c]) => !cellCount[`${r},${c}`]);
    if (excludedCells.length > 0) {
      return {
        actionType: "eliminate",
        technique: "pom",
        patternCells: candidateCells,
        eliminations: excludedCells.map(([r, c]) => ({ r, c, digit })),
        context: { digit, patternCount: patterns.length, mode: "noPattern" },
      };
    }
  }
  return null;
}

function niceLoopDfs(grid, getCands, path, visited, lastLinkType, remainingLinks) {
  if (remainingLinks <= 0) return null;
  const start = path[0];
  const last = path[path.length - 1];
  const nextType = lastLinkType === "strong" ? "weak" : "strong";
  const partners = nextType === "strong" ? aicStrongPartners(grid, getCands, last) : aicWeakPartners(grid, getCands, last);
  for (const next of partners) {
    if (nextType === "strong") {
      const isClosure =
        next.d === start.d &&
        next.cells.length === start.cells.length &&
        next.cells.every(([r, c]) => start.cells.some(([sr, sc]) => sr === r && sc === c));
      if (isClosure) return { path: [...path, next] };
    }
    const key = nodeKey(next);
    if (visited.has(key)) continue;
    path.push(next);
    visited.add(key);
    const result = niceLoopDfs(grid, getCands, path, visited, nextType, remainingLinks - 1);
    if (result) return result;
    path.pop();
    visited.delete(key);
  }
  return null;
}
// Nice Loop(闭合环):链条首尾都用强链接、绕回同一个格子、同一个
// 数字——这种情况下不管假设这一格"不是"这个数字成不成立,顺着链条
// 转一圈都会反过来逼出"必须是",可以直接把这个数字填进去。这是
// 链式技巧里唯一能直接确定答案(而不是消除候选)的形式,独立价值
// 最大,这版只做这一种情况。闭合环理论上还有另外两条规则(两条弱
// 链接闭合、一强一弱不同数字闭合,各自消掉一个候选),没做——查资料
// 时看到论坛里有经验的玩家明确说过,这两条规则找到的局面,换个角度
// 看,跟我们已经实现的AIC Type1/Type2大量重叠,只是同一个局面的
// 不同呈现方式,边际价值有限,不值得为了覆盖它们再增加一遍搜索
// 和出错的风险,复用同一套已经验证过的强/弱链接基础设施(aicStrong
// Partners/aicWeakPartners,含分组节点支持)。
const NICE_LOOP_MAX_LINKS = 7;
function findNiceLoop(grid, getCands) {
  const allNodes = [];
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      for (const d of maskToDigits(candMaskAt(getCands, r, c))) allNodes.push({ cells: [[r, c]], d });
    }
  for (let maxLinks = 3; maxLinks <= NICE_LOOP_MAX_LINKS; maxLinks += 2) {
    for (const start of allNodes) {
      for (const n1 of aicStrongPartners(grid, getCands, start)) {
        const visited = new Set([nodeKey(start), nodeKey(n1)]);
        const result = niceLoopDfs(grid, getCands, [start, n1], visited, "strong", maxLinks - 1);
        if (result) {
          const [r, c] = start.cells[0];
          return {
            actionType: "fill",
            technique: "niceLoop",
            r,
            c,
            digit: start.d,
            chainNodes: result.path,
            context: { chainLength: result.path.length },
          };
        }
      }
    }
  }
  return null;
}

// 一次性模拟场景(难度评估/自建题目技巧检测)用的候选状态追踪——
// 跟做题模式的notes彻底分开,不依赖UI状态,只在一次模拟内有效。
function makeEliminationTracker() {
  const erased = new Set();
  return {
    isErased: (r, c, d) => erased.has(`${r},${c},${d}`),
    markErased: (r, c, d) => erased.add(`${r},${c},${d}`),
  };
}
function trackedCandidatesAt(grid, tracker, r, c) {
  if (grid[r][c] !== 0) return [];
  const baseline = candidatesAt(grid, r, c);
  const out = baseline.filter((d) => !tracker.isErased(r, c, d));
  let erasedMask = 0;
  for (const d of baseline) if (tracker.isErased(r, c, d)) erasedMask |= 1 << (d - 1);
  out.mask = baseline.mask & ~erasedMask;
  return out;
}

// ---- 新增技巧统一走位掩码 ----
// 数字d(1-9)对应第(d-1)位,跟generateFullSolution/propagateAssumptionCore
// 已经在用的约定一致。countBits(下面findSkLoop用到的那个)是共享的
// popcount,这里只补两个之前没有全局版本的小工具。
// getCands(r,c)现在大概率会在返回的数组上顺手带一个.mask属性(见
// candidatesAt/liveCandidatesAt/trackedCandidatesAt),这种情况下直接
// 读它就是O(1),不用再遍历一次数组反推——只有极少数不走这几个函数的
// 自建getCands闭包(如果存在的话)才会落到下面这条兜底的慢路径。
function candMaskAt(getCands, r, c) {
  const cands = getCands(r, c);
  if (cands.mask !== undefined) return cands.mask;
  let m = 0;
  for (const d of cands) m |= 1 << (d - 1);
  return m;
}
function maskToDigits(mask) {
  const out = [];
  for (let d = 1; d <= 9; d++) if (mask & (1 << (d - 1))) out.push(d);
  return out;
}

// BUG+1(双值坟墓+1,Bivalue Universal Grave):除了恰好一个格子有3个
// 候选数,其余所有空格都恰好2个候选数——这种局面下,如果把那个三候选
// 格子也削成2个,整盘就会退化成经典的"死锁对称"局面(每个候选数字在
// 它出现的每个行/列/宫里都恰好出现偶数次,可以整体互换出另一个合法
// 解,矛盾于唯一解假设)。所以三候选格子里,必然有且只有一个数字在
// 它所在的行/列/宫某一个里出现次数是奇数——那就是这格真正的解,
// 其余两个候选都可以排除。用位掩码按位计数,天然契合这个判定。
// 参考:SudokuWiki BUG页面(Charles R Cochems的判定步骤)。
function findBugPlusOne(grid, getCands) {
  let tripleCell = null;
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      const n = countBits(candMaskAt(getCands, r, c));
      if (n === 2) continue;
      if (n === 3 && !tripleCell) {
        tripleCell = [r, c];
        continue;
      }
      return null; // 有格子不是2/3候选,或者3候选格子不止一个——不是BUG+1局面
    }
  if (!tripleCell) return null;
  const [r0, c0] = tripleCell;
  const digits = maskToDigits(candMaskAt(getCands, r0, c0));
  const countInUnit = (unitType, idx, bit) =>
    unitCells(unitType, idx).filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit).length;
  const box = boxIndex(r0, c0);
  for (const d of digits) {
    const bit = 1 << (d - 1);
    const oddRow = countInUnit("row", r0, bit) % 2 === 1;
    const oddCol = countInUnit("col", c0, bit) % 2 === 1;
    const oddBox = countInUnit("box", box, bit) % 2 === 1;
    if (oddRow || oddCol || oddBox) {
      const oddUnit = oddRow ? { unitType: "row", idx: r0 } : oddCol ? { unitType: "col", idx: c0 } : { unitType: "box", idx: box };
      return {
        actionType: "fill",
        technique: "bugPlusOne",
        r: r0,
        c: c0,
        digit: d,
        context: { tripleDigits: digits, oddUnit },
      };
    }
  }
  return null; // 理论上不该发生(说明不是真正的BUG+1局面),稳妥起见返回null而不是瞎猜
}

// Sue de Coq(俗称"两分区不相交子集"):在某个宫和穿过它的一行/列的
// 交集处取2或3个空格(记作IR),如果能在同一行/列的IR之外找到一组
// 格子A、在同一宫的IR之外找到另一组格子B,使得:①A的候选数并集、
// B的候选数并集互不重叠;②IR自己的候选数全部被A∪B覆盖;③(IR∪A∪B)
// 这个整体的"格子总数"恰好等于"候选数并集大小"——这就是一个横跨
// 行/列/宫三个house的"分散锁定集",跟单个house内部的显式数组是
// 同一个不变量,只是这次三个house分摊。既然这个不变量成立,集合里
// 每个候选数最终必然落在集合内部某个格子里,集合外任何能同时
// "看见"该候选数在集合内全部出现位置的格子,都能把这个候选数排除。
// 参考:SudokuWiki(A/B/C三组的经典表述,C即这里的IR)+taupierbw.be
// (Type1/Type2这个"两个双值格夹一个交集"的最简特例,数值算例核对
// 过)。A、B两组各封顶2个格子——现实样本里绝大多数SDC的A/B都是1-2
// 格,参照ALS_MAX_SIZE同样的性能/收益取舍,封到2格,不做更大范围
// 搜索。
const SDC_WING_MAX_SIZE = 2;
// Firework(烟花):定义来自New Sudoku Players' Forum(fireworks-t39513),
// GNPX(page58)做了整理转述。取一个候选格A,设block-A为A所在宫;
// row-B=A所在行里"block-A之外"的部分(6格),col-C=A所在列里
// "block-A之外"的部分(6格)。若某个数字n在row-B部分恰好只剩1个
// 候选格B、在col-C部分恰好只剩1个候选格C,则"A、B、C三格里至少有
// 一个是n"——证明:若B、C都不是n,则n在A所在行只能落在block-A内,
// n在A所在列也只能落在block-A内,而一个宫只能有一个n,能同时满足
// "在这一行的block-A部分"和"在这一列的block-A部分"的格子只有A
// 自己,所以A必为n。
//
// Firework Triple:上面这条对"单个数字"成立的结论,可以推广到"一组
// 三个数字"合起来看——从A的候选里选3个数字,如果这3个数字的候选
// 位置合起来,在row-B部分collapse成同一个格B、在col-C部分collapse
// 成同一个格C,那么这3个数字合起来必然落在{A,B,C}这3个格子里
// (跟单数字版本同一个论证,只是把"n"换成"这3个数字里至少有一个
// 在这一行/列的block-A之外部分"),也就是这3个数字被Locked进了
// 这3个格子——A、B、C三格里,不属于这3个数字的其它候选都能划掉。
// (来源:GNPX原文的单数字版本表述容易读成"3个数字各自独立组成
// firework、且恰好共享同一对B/C"，但用GNPX自己给的例子核对后
// 发现对不上——3个数字必须合起来当一组检查collapse,而不是各自
// 独立满足唯一性,后者在真实例子里只筛出2个数字,凑不出Triple。
// 已用GNPX原例的Stem/Leaf坐标+原始论坛帖子的另一个例子交叉核对过。)
function fireworkOutsideBoxCells(grid, getCands, r, c, axis, comboMask) {
  // axis: "row" 沿A所在行扫(排除block-A的列范围), "col" 沿A所在列扫
  const boxColStart = Math.floor(c / 3) * 3;
  const boxRowStart = Math.floor(r / 3) * 3;
  const cells = [];
  if (axis === "row") {
    for (let cc = 0; cc < 9; cc++) {
      if (cc >= boxColStart && cc < boxColStart + 3) continue;
      if (grid[r][cc] !== 0) continue;
      if (candMaskAt(getCands, r, cc) & comboMask) cells.push([r, cc]);
      if (cells.length > 1) break; // 提前退出,只关心是否恰好1个
    }
  } else {
    for (let rr = 0; rr < 9; rr++) {
      if (rr >= boxRowStart && rr < boxRowStart + 3) continue;
      if (grid[rr][c] !== 0) continue;
      if (candMaskAt(getCands, rr, c) & comboMask) cells.push([rr, c]);
      if (cells.length > 1) break;
    }
  }
  return cells;
}
function findFireworkTriple(grid, getCands) {
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      const stemMask = candMaskAt(getCands, r, c);
      const stemDigits = maskToDigits(stemMask);
      if (stemDigits.length < 3) continue;
      for (const combo of combinations(stemDigits, 3)) {
        const comboMask = combo.reduce((m, d) => m | (1 << (d - 1)), 0);
        const rowCells = fireworkOutsideBoxCells(grid, getCands, r, c, "row", comboMask);
        if (rowCells.length !== 1) continue;
        const colCells = fireworkOutsideBoxCells(grid, getCands, r, c, "col", comboMask);
        if (colCells.length !== 1) continue;
        const cells = [[r, c], rowCells[0], colCells[0]];
        const eliminations = [];
        for (const [er, ec] of cells) {
          for (const d of maskToDigits(candMaskAt(getCands, er, ec) & ~comboMask)) eliminations.push({ r: er, c: ec, digit: d });
        }
        if (eliminations.length > 0) {
          return {
            actionType: "eliminate",
            technique: "fireworkTriple",
            patternCells: cells,
            eliminations,
            context: { stem: [r, c], leaf: [rowCells[0], colCells[0]], digits: combo },
          };
        }
      }
    }
  }
  return null;
}

// Firework Quadruple:两个独立的firework(各自的stem不同,记A1、A2)靠
// 共享的两个leaf拼成一个矩形——A1所在行(宫外)collapse到leaf1、A1所在
// 列(宫外)collapse到leaf2;A2所在行(宫外)collapse到leaf2(反过来)、
// A2所在列(宫外)collapse到leaf1。四个角(A1、A2、leaf1、leaf2)之间
// 不要求跨恰好2个宫(跟唯一矩形不同)——GNPX原例的4个角分属4个不同的
// 宫,firework本来就是按行/列单独判定,不依赖"只跨2个宫"这个额外约束。
// 两个stem各自选出的数字组合起来,一共被Locked进这4个格子。
// (验证说明:GNPX page58给的Firework_Quadruple例题图配的谜题字符串
// 是从Firework_Triple例题原样复制过来的——网页本身的数据错误,字符串
// 里根本不存在Stem/Leaf声明的那些候选数字。核对不了官方例题,改用
// 手工构造的合成盘验证了核心的"两个方向各自collapse到同一格"这套
// 逻辑是对的;消除部分复用Triple已经验证过的同一套"候选数减去Lock
// 数字集合"写法,没有引入新逻辑。)
// 找出stem格(r,c)候选里,所有能让"row-outside-box恰好collapse到
// rowTarget、col-outside-box恰好collapse到colTarget"的数字子集
// (不预设大小,由调用方决定怎么跟另一个stem的子集组合)。
function fireworkValidLockingSubsets(grid, getCands, r, c, rowTarget, colTarget) {
  const digits = maskToDigits(candMaskAt(getCands, r, c));
  const valid = [];
  for (let size = 1; size <= digits.length; size++) {
    for (const combo of combinations(digits, size)) {
      const comboMask = combo.reduce((m, d) => m | (1 << (d - 1)), 0);
      const rowCells = fireworkOutsideBoxCells(grid, getCands, r, c, "row", comboMask);
      if (rowCells.length !== 1 || rowCells[0][0] !== rowTarget[0] || rowCells[0][1] !== rowTarget[1]) continue;
      const colCells = fireworkOutsideBoxCells(grid, getCands, r, c, "col", comboMask);
      if (colCells.length !== 1 || colCells[0][0] !== colTarget[0] || colCells[0][1] !== colTarget[1]) continue;
      valid.push({ combo, mask: comboMask });
    }
  }
  return valid;
}
function findFireworkQuadruple(grid, getCands) {
  const idxs = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  for (const r1 of idxs) {
    for (const r2 of idxs) {
      if (r2 === r1) continue;
      for (const c1 of idxs) {
        for (const c2 of idxs) {
          if (c2 === c1) continue;
          if (grid[r1][c1] !== 0 || grid[r2][c2] !== 0 || grid[r1][c2] !== 0 || grid[r2][c1] !== 0) continue;
          const leaf1 = [r1, c2]; // A1的行伙伴 / A2的列伙伴
          const leaf2 = [r2, c1]; // A1的列伙伴 / A2的行伙伴
          const valid1 = fireworkValidLockingSubsets(grid, getCands, r1, c1, leaf1, leaf2);
          if (valid1.length === 0) continue;
          const valid2 = fireworkValidLockingSubsets(grid, getCands, r2, c2, leaf2, leaf1);
          if (valid2.length === 0) continue;
          // 两个stem各自的候选数字子集必须不相交,且合计恰好4个——这才是
          // 真正的"4个数字锁进4个格子"(数字比格子少,是没有意义的弱结论;
          // 之前漏了这条检查,曾经产生过"1个数字锁4个格"的错误消除,
          // 已经在Inkala's Everest的回归测试里抓到并修复)。
          for (const v1 of valid1) {
            for (const v2 of valid2) {
              if (v1.mask & v2.mask) continue; // 两组数字不能重叠
              if (v1.combo.length + v2.combo.length !== 4) continue;
              const lockMask = v1.mask | v2.mask;
              const cells = [[r1, c1], [r2, c2], leaf1, leaf2];
              const eliminations = [];
              for (const [er, ec] of cells) {
                for (const d of maskToDigits(candMaskAt(getCands, er, ec) & ~lockMask)) eliminations.push({ r: er, c: ec, digit: d });
              }
              if (eliminations.length > 0) {
                return {
                  actionType: "eliminate",
                  technique: "fireworkQuadruple",
                  patternCells: cells,
                  eliminations,
                  context: { stem: [[r1, c1], [r2, c2]], leaf: [leaf1, leaf2], digits: maskToDigits(lockMask) },
                };
              }
            }
          }
        }
      }
    }
  }
  return null;
}

// Firework W-Wing:stem+leaf1+leaf2构成2-firework(数字对{x,y})之后,再
// 找两个"助攻"双值格——assist1在leaf1所在列(跟leaf1同列,排除leaf1和
// target自己)、恰好是{x,y};assist2在leaf2所在行、也恰好是{x,y}。
// target = (leaf2所在行, leaf1所在列)这个交叉格。矛盾论证(手工推导过,
// 完整走了一遍,不只是套例子对数字):假设target=x——target跟assist1
// 同列/宫,逼出assist1=y(双值格排除x后只剩y);assist1=y跟leaf1同列,
// 逼出leaf1≠y。同理target跟assist2同行,逼出assist2=y,assist2=y跟
// leaf2同行,逼出leaf2≠y。结合"y必在stem/leaf1/leaf2之一"(firework
// 命题)且leaf1、leaf2都已经被排除y,逼出stem=y。另一方面,target跟
// leaf1同列、跟leaf2同行,假设的target=x会直接让leaf1≠x、leaf2≠x;
// 结合"x必在stem/leaf1/leaf2之一"且leaf1、leaf2都被排除x,逼出
// stem=x。stem不可能同时是x和y,矛盾——所以target不能是x(同理y也
// 不行),两个候选都能划掉。
// (来源例题GNPX page58的Assist格子实际候选数比"双值格"定义要求的多
// 一个,疑似又是配图跟文字提取不一致的数据问题——核对方式改成上面
// 这套完整手推矛盾链,而不是指望拿这份例题的具体数字对拍。)
function findFireworkWWing(grid, getCands) {
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      const digits = maskToDigits(candMaskAt(getCands, r, c));
      if (digits.length < 2) continue;
      for (const [x, y] of combinations(digits, 2)) {
        const comboMask = (1 << (x - 1)) | (1 << (y - 1));
        const rowCells = fireworkOutsideBoxCells(grid, getCands, r, c, "row", comboMask);
        if (rowCells.length !== 1) continue;
        const colCells = fireworkOutsideBoxCells(grid, getCands, r, c, "col", comboMask);
        if (colCells.length !== 1) continue;
        const leaf1 = rowCells[0];
        const leaf2 = colCells[0];
        const target = [leaf2[0], leaf1[1]];
        if (grid[target[0]][target[1]] !== 0) continue;
        const targetMask = candMaskAt(getCands, target[0], target[1]);
        if (!(targetMask & comboMask)) continue;
        let assist1 = null;
        for (let rr = 0; rr < 9; rr++) {
          if (rr === leaf1[0] || rr === target[0]) continue;
          if (grid[rr][leaf1[1]] !== 0) continue;
          if (candMaskAt(getCands, rr, leaf1[1]) === comboMask) {
            assist1 = [rr, leaf1[1]];
            break;
          }
        }
        if (!assist1) continue;
        let assist2 = null;
        for (let cc = 0; cc < 9; cc++) {
          if (cc === leaf2[1] || cc === target[1]) continue;
          if (grid[leaf2[0]][cc] !== 0) continue;
          if (candMaskAt(getCands, leaf2[0], cc) === comboMask) {
            assist2 = [leaf2[0], cc];
            break;
          }
        }
        if (!assist2) continue;
        const eliminations = [];
        for (const d of maskToDigits(targetMask & comboMask)) eliminations.push({ r: target[0], c: target[1], digit: d });
        if (eliminations.length > 0) {
          return {
            actionType: "eliminate",
            technique: "fireworkWWing",
            patternCells: [[r, c], leaf1, leaf2, assist1, assist2, target],
            eliminations,
            context: { stem: [r, c], leaf: [leaf1, leaf2], assist: [assist1, assist2], target, digits: [x, y] },
          };
        }
      }
    }
  }
  return null;
}

// Firework ALP-s:stem跟它的行伙伴、列伙伴构成2-firework(数字对{x,y})
// 之后,矩形的第4个角(行伙伴的列、列伙伴的行交叉的那一格)如果恰好是
// 纯双值格{x,y},就能反过来清理STEM自己——除了{x,y}之外的候选都能划掉。
// 矛盾论证(手推验证过):假设stem填了不属于{x,y}的数字w。firework的
// 命题"x必在stem/行伙伴/列伙伴之一"里,stem已经被排除,于是x落在行
// 伙伴或列伙伴;y同理。第4角(assist)跟列伙伴同行、跟行伙伴同列——
// 如果assist=x,行伙伴(跟assist同列)就不能是x,只能列伙伴=x;但
// 列伙伴又跟assist同行,两个格子同行还都是x,矛盾。assist=y的情形
// 对称同理矛盾。所以stem不能是w,除{x,y}外的候选都能划掉。
// (用GNPX原例题验证过:字符串本身又比81位多了1位——这次是配图导出
// 时候多贴了一个尾随字符,不是内容错;砍掉最后一位后,leaf1/leaf2/
// assist三格的候选数精确匹配文字说明,stem的消除结果{3,8}也精确
// 匹配"Exclude: r7c3#69"这行的言外之意——保留69,划掉其余。)
function findFireworkAlp(grid, getCands) {
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      const digits = maskToDigits(candMaskAt(getCands, r, c));
      if (digits.length < 2) continue;
      for (const [x, y] of combinations(digits, 2)) {
        const comboMask = (1 << (x - 1)) | (1 << (y - 1));
        const rowCells = fireworkOutsideBoxCells(grid, getCands, r, c, "row", comboMask);
        if (rowCells.length !== 1) continue;
        const colCells = fireworkOutsideBoxCells(grid, getCands, r, c, "col", comboMask);
        if (colCells.length !== 1) continue;
        const rowPartner = rowCells[0];
        const colPartner = colCells[0];
        const assistPos = [colPartner[0], rowPartner[1]];
        if (grid[assistPos[0]][assistPos[1]] !== 0) continue;
        if (candMaskAt(getCands, assistPos[0], assistPos[1]) !== comboMask) continue;
        const stemMask = candMaskAt(getCands, r, c);
        const eliminations = [];
        for (const d of maskToDigits(stemMask & ~comboMask)) eliminations.push({ r, c, digit: d });
        if (eliminations.length > 0) {
          return {
            actionType: "eliminate",
            technique: "fireworkAlp",
            patternCells: [[r, c], rowPartner, colPartner, assistPos],
            eliminations,
            context: { stem: [r, c], rowPartner, colPartner, assist: assistPos, digits: [x, y] },
          };
        }
      }
    }
  }
  return null;
}

function findSueDeCoq(grid, getCands) {
  for (let box = 0; box < 9; box++) {
    const boxCells = unitCells("box", box).filter(([r, c]) => grid[r][c] === 0);
    if (boxCells.length < 3) continue; // IR(≥2)+B(≥1)至少3个格子(A组在line里,不占box的格子数)
    for (const lineType of ["row", "col"]) {
      const lineIdxs = [...new Set(boxCells.map(([r, c]) => (lineType === "row" ? r : c)))];
      for (const lineIdx of lineIdxs) {
        const lineCellsAll = unitCells(lineType, lineIdx).filter(([r, c]) => grid[r][c] === 0);
        const ir = lineCellsAll.filter(([r, c]) => boxCells.some(([br, bc]) => br === r && bc === c));
        if (ir.length < 2) continue;
        let irMask = 0;
        for (const [r, c] of ir) irMask |= candMaskAt(getCands, r, c);
        if (countBits(irMask) < ir.length + 1) continue; // 粗筛:IR自己至少要有1个"多出来"的候选数,不然没有必要往外扩

        const inIr = ([r, c]) => ir.some(([ir_, ic]) => ir_ === r && ic === c);
        const lineRest = lineCellsAll.filter((cell) => !inIr(cell));
        const boxRest = boxCells.filter((cell) => !inIr(cell));

        const wingCombos = (cells) => {
          const out = [];
          for (let size = 1; size <= Math.min(SDC_WING_MAX_SIZE, cells.length); size++) {
            for (const combo of combinations(cells, size)) {
              let m = 0;
              for (const [r, c] of combo) m |= candMaskAt(getCands, r, c);
              if (countBits(m) > size + 1) continue; // 超过"locked set/ALS"的门槛(candidates <= cells+1),不要
              out.push({ cells: combo, mask: m });
            }
          }
          return out;
        };
        const aWings = wingCombos(lineRest);
        const bWings = wingCombos(boxRest);

        for (const a of aWings) {
          if ((a.mask & irMask) !== a.mask) continue; // A组候选数必须完全被IR覆盖,不能带"自由数字"
          for (const b of bWings) {
            if ((b.mask & irMask) !== b.mask) continue;
            if (a.mask & b.mask) continue; // A、B候选数不能重叠
            const unionMask = a.mask | b.mask;
            if ((irMask & unionMask) !== irMask) continue; // IR的候选数必须被A∪B完全覆盖,不能有遗漏
            const totalCells = ir.length + a.cells.length + b.cells.length;
            if (countBits(unionMask) !== totalCells) continue; // 核心不变量:总格子数=候选数并集大小

            const allCells = [...ir, ...a.cells, ...b.cells];
            const inPattern = (r, c) => allCells.some(([pr, pc]) => pr === r && pc === c);
            const digits = maskToDigits(unionMask);
            const eliminations = [];
            for (const d of digits) {
              const bit = 1 << (d - 1);
              const posInPattern = allCells.filter(([r, c]) => candMaskAt(getCands, r, c) & bit);
              for (let r = 0; r < 9; r++)
                for (let c = 0; c < 9; c++) {
                  if (inPattern(r, c) || grid[r][c] !== 0) continue;
                  if (!(candMaskAt(getCands, r, c) & bit)) continue;
                  if (posInPattern.every(([pr, pc]) => cellsSeeEachOther({ r, c }, { r: pr, c: pc }))) {
                    eliminations.push({ r, c, digit: d });
                  }
                }
            }
            if (eliminations.length > 0) {
              return {
                actionType: "eliminate",
                technique: "sueDeCoq",
                patternCells: allCells,
                eliminations,
                context: { box, lineType, lineIdx, irCells: ir, aCells: a.cells, bCells: b.cells, digits },
              };
            }
          }
        }
      }
    }
  }
  return null;
}

// GSP(Gurth's Symmetrical Placement,格斯对称摆放):如果题目原始
// 已知数关于盘面中心180°旋转对称(每个已知格的旋转对称格也是已知
// 格),可以给每个数字找一个"旋转搭档"数字(旋转对称格上的那个数),
// 这套映射在全部已知数上必须自洽(同一个数字不能对上两个不同的
// 搭档)。一旦映射确立,任何一格填了数字X、它的旋转对称格若还空着,
// 直接就能填上X的搭档,不需要额外推理。
// 必须用"题目原始已知数"(givenGrid)判断对称性,不能用当前(可能
// 已经填了一部分)的盘面替代——样本太少时,少数几个刚好填对的格子
// 可能"碰巧"看起来对称,会把假对称误判成真对称。这也是这个技巧要
// 单独多接一个givenGrid参数的唯一原因,见findNextStep旁的说明。
// 参考:Sudopedia "Gurth's Symmetrical Placement"词条、SudokuWiki的GSP专题页、
// kyoyama-kazusa/Sudoku的SymmetricalPlacementStepSearcher(MIT许可)——四种
// 对称类型和"轴上格只能自配对"的判据来自这几处,代码是按算法重新写的。
//
// 之前这里只有"已知数关于盘面中心180°旋转对称,且已经推出了搭档数字对"
// 这一种最窄的情形,只做"已填格→镜像空格直接填搭档"这一步——遗漏了三处:
//   (1) 只认中心对称,漏了对角线/反对角线;
//   (2) 没有"对称轴/中心格只能填自配对数字"这条最先起作用、用得最多的规则;
//   (3) 没有"镜像候选一致性"(X格的候选d成立,当且仅当镜像格还留着搭档
//       数字π(d)),只看已填格,没把结论撒到候选层面。
// 这三条都在同一个对称关系下派生,判据、误报风险都已经核实过,合在一起写。
// 只做这三种:都是"自己的逆变换"(做两次等于没做),数字排列π也就只需要
// 满足"配对了就能翻回来"(π(π(d))=d)。90°旋转做两次是180°、四次才回到
// 原样,数字排列要跟着满足4阶条件而不是这个"能翻回来"的条件,判据完全
// 是另一套,参考实现(Sudopedia/SudokuWiki/kazusa)也都没把它算进GSP,
// 所以先不做,免得当成2阶对称处理反而出错。
function gspSymmetryDefs() {
  return [
    ["central", (r, c) => [8 - r, 8 - c]],
    ["diagonal", (r, c) => [c, r]],
    ["antidiagonal", (r, c) => [8 - c, 8 - r]],

//
// 没有跟findTridagon共用一份扫描循环:一开始是共用的(生成器函数
// iterateTridagonMatches),写完之后实测findTridagon自己在Inkala-2012/
// GoldenNugget这类稠密盘面上明显变慢(约2.3倍,整局求解慢了9%~11%)——
// findTridagon是SE权重较低、几乎每一步都会被尝试一次的高频函数,这个
// 代价划不来。生成器本身的调度开销、以及为了同时满足两个消费者而在
// 每次命中时都构建根本用不上的guardianList,是变慢的主因。这里选择
// 犯规:两份扫描逻辑基本相同,各自独立,用注释说明原因,而不是为了
// "不写两遍循环"硬扛下这个性能倒退——用户明确说过讨厌拿来凑数的重复
// 技巧,但这不是那种情况,是同一个技巧内部为了保住热路径性能做的
// 权衡取舍。
const TRIDAGON_FORCE_MAX_GUARDIANS = 8;
function findTridagonForceChain(grid, getCands, engine = propagateAssumption, techniqueName = "tridagonForce") {
  const masks = [];
  const pcs = [];
  for (let r = 0; r < 9; r++) {
    const row = [];
    const pcRow = [];
    for (let c = 0; c < 9; c++) {
      const m = grid[r][c] === 0 ? candMaskAt(getCands, r, c) : -1;
      row.push(m);
      pcRow.push(m > 0 ? countBits(m) : 0);
    }
    masks.push(row);
    pcs.push(pcRow);
  }
  const patterns = getTridagonPatterns();
  const bandPairs = [[0, 1], [0, 2], [1, 2]];
  for (const [b1, b2] of bandPairs) {
    for (const [s1, s2] of bandPairs) {
      const blockPos = [[b1, s1], [b1, s2], [b2, s1], [b2, s2]];
      const blockNumbers = blockPos.map(([br, bc]) => br * 3 + bc);
      for (const pattern of patterns) {
        const cells = [];
        const ms = [];
        let usable = true;
        let bigCells = 0;
        let unionAll = 0;
        for (let k = 0; k < 4 && usable; k++) {
          for (const [lr, lc] of pattern[k]) {
            const r = blockPos[k][0] * 3 + lr;
            const c = blockPos[k][1] * 3 + lc;
            const m = masks[r][c];
            if (m <= 0 || (m & (m - 1)) === 0) {
              usable = false;
              break;
            }
            if (pcs[r][c] > 4) bigCells++;
            unionAll |= m;
            cells.push([r, c]);
            ms.push(m);
          }
        }
        if (!usable || bigCells > 4) continue;
        for (const T of TRIDAGON_TRIPLE_MASKS) {
          if ((unionAll & T) !== T) continue;
          let ok = true;
          const guardianList = []; // [[r, c, digit], ...]:每个"格子+具体守卫数字"单独一项,是分支的粒度
          for (let i = 0; i < 12 && ok; i++) {
            const m = ms[i];
            if (!(m & T)) {
              ok = false;
              break;
            }
            for (let bits = m & ~T; bits; bits &= bits - 1) {
              const d = 32 - Math.clz32(bits & -bits);
              guardianList.push([cells[i][0], cells[i][1], d]);
            }
            if (guardianList.length > TRIDAGON_FORCE_MAX_GUARDIANS) {
              ok = false; // 提前退出:守卫只会越扫越多,不会变少
              break;
            }
          }
          if (!ok || guardianList.length < 2) continue;
          const digits = maskToDigits(T);
          const branches = guardianList.map(([r, c, d]) => engine(grid, getCands, r, c, d, true));
          if (branches.some((b) => b.contradiction)) continue; // 交给unaryChain/nishioChain,这里不重复报告
          let commonTrue = new Set(branches[0].trueSet);
          let commonFalse = new Set(branches[0].falseSet);
          for (let i = 1; i < branches.length; i++) {
            commonTrue = new Set([...commonTrue].filter((k) => branches[i].trueSet.has(k)));
            commonFalse = new Set([...commonFalse].filter((k) => branches[i].falseSet.has(k)));
          }
          for (const [r, c, d] of guardianList) commonTrue.delete(`${r},${c},${d}`); // 守卫自己的候选不算"额外结论"
          function buildDetailBranches() {
            if (!state.settings.showChainDetail) return null;
            return guardianList.map(([r, c, d]) =>
              buildChainBranch(`假设${describeCell(r, c)}=${d}成立`, recomputeAssumptionWithTrace(grid, getCands, techniqueName, r, c, d, true))
            );
          }
          if (commonTrue.size > 0) {
            const [tr, tc, td] = [...commonTrue][0].split(",").map(Number);
            return {
              actionType: "fill",
              technique: techniqueName,
              r: tr, c: tc, digit: td,
              patternCells: cells,
              context: { digits, guardians: guardianList, blocks: blockNumbers, concludeCell: [tr, tc], concludeDigit: td, branches: buildDetailBranches() },
            };
          }
          if (commonFalse.size > 0) {
            const eliminations = [...commonFalse].map((k) => {
              const [er, ec, ed] = k.split(",").map(Number);
              return { r: er, c: ec, digit: ed };
            });
            return {
              actionType: "eliminate",
              technique: techniqueName,
              patternCells: cells,
              eliminations,
              context: { digits, guardians: guardianList, blocks: blockNumbers, eliminationCount: eliminations.length, branches: buildDetailBranches() },
            };
          }
        }
      }
    }
  }
  return null;
}

// 命中的发现。提示引擎、难度评估、Auto模式,都调用这一份,不再
// 各自维护一套顺序判断。

// 每一项显式带上key(对应TECHNIQUE_SE_WEIGHT/TECHNIQUE_LABELS的键),

// 抽查了一遍,发现TECHNIQUE_CHAIN原来的排列顺序其实跟TECHNIQUE_

// 启动自检、TECHNIQUE_CHAIN_DESC的定义挪到了TECHNIQUE_SE_WEIGHT/
// TECHNIQUE_LABELS后面(这两个是const,在它们的声明语句真正执行之前
// 引用会报"暂时性死区"错误,不能提前用)——见那两张表下面。

// order可以传TECHNIQUE_CHAIN_DESC(按SE权重降序,给"优先用高级技巧"
// 这个开关用),不传就是TECHNIQUE_CHAIN本身的默认顺序——测难度/校验
// 那两个入口永远不传这个参数,不受这个开关影响。
// givenGrid是可选的第四参数:只有GSP这一个技巧需要"题目原始已知数"
// 这份额外信息(不能用当前grid替代——当前grid可能已经填了一部分,
// 用它判断对称性会把"碰巧对上"的少量样本误判成真对称)。其余37个
// 技巧函数签名都是(grid, getCands),多传这一个参数对它们完全无感,
// 不用逐个改。调用方拿不到给定盘面时(比如没有正在玩的题目)传
// undefined即可,findGSP自己会在拿不到时直接返回null。
// 统一处理"要不要多传第三个参数givenGrid"这件事——findNextStep(单
// 命中,按顺序找到第一个就停)和findAllAvailableSteps(全部命中,不
// 提前停)都要用同一份判断逻辑,抽出来避免两处各写一份、以后改判断
// 条件却漏改一处。
function callTechniqueFn(fn, grid, getCands, givenGrid) {
  // fn.length是JS内置的"必填参数个数"(带默认值的参数不计入),只有
  // 显式声明了第三个必填参数的技巧(目前只有findGSP)才真的要这个
  // 值,借这个内置行为筛一遍,不用手动维护一份黑名单。findUnaryChain/
  // findNishioChain这两个技巧自己的第三位是带默认值的engine参数,
  // fn.length不会把它算进去,不会被误传。
  return fn.length >= 3 ? fn(grid, getCands, givenGrid) : fn(grid, getCands);
}

// JE/SE专用的另一道防线,这道需要真实解才能查,没法放进技巧函数
// 内部(技巧函数统一走(grid,getCands)接口,拿不到solution,GSP用的
// givenGrid那个位置已经被占了,不能再借用),只能在有真实解可用的
// 调用方这一层做,通过findNextStep/findAllAvailableSteps新增的可选
// validator参数介入。跟sanitizeExocetFinding(不需要真实解,检查会不
// 会把候选数削零)是两道独立防线,互不替代。
function exocetFindingMatchesSolution(finding, solution) {
  if (!solution) return true; // 没有真实解可对照(理论上不该发生),不拦
  if (finding.technique !== "juniorExocet" && finding.technique !== "seniorExocet") return true;
  if (finding.actionType !== "eliminate") return true;
  return finding.eliminations.every((e) => solution[e.r][e.c] !== e.digit);
}

// validator可选:只有手上有真实解的调用方(getHint等)才会传,用来
// 让JE/SE的结论多过一道solution校验,不通过就当没找到、继续试链条
// 里排在后面的技巧——不传validator时行为跟以前完全一样。
// Embedded inside the original solver script, so its Blob Worker gets the same
// engine and immutable-givens contract without external requests or async races.
const WASM_RUNTIME = (() => {
  // Browser/Worker-safe compatibility adapter for the migrated Sudoku technique core.
// No Node.js imports and no UI/message-rendering dependencies.
// Generated from assembly-core.mjs; keep raw Finding reconstruction identical.

function makeAbort(memory) {
  return (messagePtr, filePtr, line, column) => {
    throw new Error(`AssemblyScript abort at ${line}:${column} (message=${messagePtr}, file=${filePtr})`);
  };
}

async function instantiateCore(source) {
  const imports = { env: { abort: makeAbort() } };
  if (source instanceof WebAssembly.Module) {
    return new WebAssembly.Instance(source, imports).exports;
  }
  const bytes =
    source instanceof Uint8Array
      ? source
      : source instanceof ArrayBuffer
        ? new Uint8Array(source)
        : ArrayBuffer.isView(source)
          ? new Uint8Array(source.buffer, source.byteOffset, source.byteLength)
          : null;
  if (!bytes) throw new TypeError("instantiateCore expects WebAssembly.Module, ArrayBuffer, or typed-array bytes");
  const { instance } = await WebAssembly.instantiate(bytes, imports);
  return instance.exports;
}

// Load immutable puzzle givens after reset, together with each current position.
// Omission deliberately disables GSP; never infer givens from the current grid.
function loadPosition(core, grid, masks, givenGrid = null) {
  if (!Array.isArray(grid) || grid.length !== 9 || !grid.every((row) => Array.isArray(row) && row.length === 9)) {
    throw new Error("grid must be a 9x9 array");
  }
  if (!Array.isArray(masks) || masks.length !== 81) {
    throw new Error("masks must contain exactly 81 entries");
  }

  // Validate before resetting a previously loaded position.
  if (givenGrid !== null) validateGivenGrid(givenGrid);

  core.resetInput();
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const index = r * 9 + c;
      core.setInputCell(index, grid[r][c] | 0);
      core.setInputMask(index, masks[index] & 0x1ff);
    }
  }
  if (givenGrid !== null) loadGivenGrid(core, givenGrid);
}

function validateGivenGrid(grid) {
  if (!Array.isArray(grid) || grid.length !== 9 || !grid.every((row) => Array.isArray(row) && row.length === 9)) {
    throw new Error("given grid must be a 9x9 array");
  }
  if (!grid.every(row => row.every(digit => Number.isInteger(digit) && digit >= 0 && digit <= 9))) {
    throw new Error("given grid digits must be integers in 0..9");
  }
}

// Legacy two-call API: call this AFTER every loadPosition(), which resets givens.
function loadGivenGrid(core, grid) {
  validateGivenGrid(grid);
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      core.setGivenCell(r * 9 + c, grid[r][c] | 0);
    }
  }
}

function decodeFact(k) {
  const digit = (k % 9) + 1;
  const q = (k - (digit - 1)) / 9;
  const c = q % 9;
  const r = (q - c) / 9;
  return { r, c, digit };
}

function readPropagationResult(core, contradiction) {
  const trueFacts = [];
  const falseFacts = [];
  for (let i = 0; i < core.resultTrueCount(); i++) trueFacts.push(core.resultTrueFactAt(i));
  for (let i = 0; i < core.resultFalseCount(); i++) falseFacts.push(core.resultFalseFactAt(i));

  const grid = Array.from({ length: 9 }, (_, rr) =>
    Array.from({ length: 9 }, (_, cc) => core.resultGridCell(rr * 9 + cc)),
  );

  return {
    contradiction: !!contradiction,
    aborted: typeof core.resultAborted === "function" ? !!core.resultAborted() : false,
    budgetCalls: typeof core.resultBudgetCalls === "function" ? core.resultBudgetCalls() : null,
    guardIterations: core.resultGuardIterations(),
    trueFacts,
    falseFacts,
    grid,
  };
}

function runStaticAssumption(core, r, c, digit, startTrue) {
  return readPropagationResult(
    core,
    core.runStaticAssumption(r, c, digit, startTrue ? 1 : 0),
  );
}

function runDynamicAssumption(core, r, c, digit, startTrue, budgetLimit = 6790) {
  return readPropagationResult(
    core,
    core.runDynamicAssumption(r, c, digit, startTrue ? 1 : 0, budgetLimit),
  );
}


function readFinderEliminations(core) {
  const eliminations = [];
  for (let i = 0; i < core.finderResultEliminationCount(); i++) {
    const fact = decodeFact(core.finderResultEliminationFactAt(i));
    eliminations.push({ r: fact.r, c: fact.c, digit: fact.digit });
  }
  return eliminations;
}

function runDynamicNishioFinder(core, budgetLimit = 6790, alreadyRun = false) {
  if (!alreadyRun) core.runDynamicNishioFinder(budgetLimit);
  const actionType = core.finderResultActionType();
  const budgetCalls = core.resultBudgetCalls();
  if (actionType === 0) return { finding: null, budgetCalls, budgetLimit };

  const r = core.finderResultStartR();
  const c = core.finderResultStartC();
  const d = core.finderResultStartDigit();
  return {
    finding: {
      actionType: "eliminate",
      technique: "dynamicNishioChain",
      patternCells: [[r, c]],
      eliminations: readFinderEliminations(core),
      context: { r, c, d, branches: null },
    },
    budgetCalls,
    budgetLimit,
  };
}

function runDynamicUnaryFinder(core, budgetLimit = 6790, alreadyRun = false) {
  if (!alreadyRun) core.runDynamicUnaryFinder(budgetLimit);
  const actionType = core.finderResultActionType();
  const budgetCalls = core.resultBudgetCalls();
  if (actionType === 0) return { finding: null, budgetCalls, budgetLimit };

  const startR = core.finderResultStartR();
  const startC = core.finderResultStartC();
  const startDigit = core.finderResultStartDigit();

  if (actionType === 1) {
    const r = core.finderResultR();
    const c = core.finderResultC();
    const digit = core.finderResultDigit();
    return {
      finding: {
        actionType: "fill",
        technique: "dynamicUnaryChain",
        r,
        c,
        digit,
        patternCells: [[startR, startC]],
        context: {
          startCell: [startR, startC],
          startDigit,
          concludeCell: [r, c],
          concludeDigit: digit,
          concludeValue: true,
          branches: null,
        },
      },
      budgetCalls,
      budgetLimit,
    };
  }

  const eliminations = readFinderEliminations(core);
  return {
    finding: {
      actionType: "eliminate",
      technique: "dynamicUnaryChain",
      patternCells: [[startR, startC]],
      eliminations,
      context: {
        startCell: [startR, startC],
        startDigit,
        concludeValue: false,
        eliminationCount: eliminations.length,
        branches: null,
      },
    },
    budgetCalls,
    budgetLimit,
  };
}


function maskToDigits(mask) {
  const digits = [];
  for (let d = 1; d <= 9; d++) if (mask & (1 << (d - 1))) digits.push(d);
  return digits;
}

function readFinderPatternCells(core) {
  const cells = [];
  for (let i = 0; i < core.finderResultPatternCellCount(); i++) {
    const index = core.finderResultPatternCellAt(i);
    cells.push([Math.floor(index / 9), index % 9]);
  }
  return cells;
}

function runDynamicMultipleFinder(core, budgetLimit = 6790, alreadyRun = false) {
  if (!alreadyRun) core.runDynamicMultipleFinder(budgetLimit);
  const actionType = core.finderResultActionType();
  const budgetCalls = core.resultBudgetCalls();
  if (actionType === 0) return { finding: null, budgetCalls, budgetLimit };

  const kindCode = core.finderResultKind();
  const patternCells = readFinderPatternCells(core);
  const eliminations = actionType === 2 ? readFinderEliminations(core) : null;
  const resultR = core.finderResultR();
  const resultC = core.finderResultC();
  const resultDigit = core.finderResultDigit();

  let context;
  if (kindCode === 1) {
    const startR = core.finderResultStartR();
    const startC = core.finderResultStartC();
    const startDigits = maskToDigits(core.getInputMask(startR * 9 + startC) & 0x1ff);
    context = actionType === 1
      ? {
          kind: "cell",
          startCell: [startR, startC],
          startDigits,
          concludeCell: [resultR, resultC],
          concludeDigit: resultDigit,
          branches: null,
        }
      : {
          kind: "cell",
          startCell: [startR, startC],
          startDigits,
          eliminationCount: eliminations.length,
          branches: null,
        };
  } else if (kindCode === 2) {
    const unitTypeCode = core.finderResultUnitType();
    const unitType = unitTypeCode === 0 ? "row" : unitTypeCode === 1 ? "col" : "box";
    const unitIdx = core.finderResultUnitIdx();
    const digit = core.finderResultStartDigit();
    context = actionType === 1
      ? {
          kind: "region",
          unitType,
          unitIdx,
          digit,
          startCells: patternCells.map((cell) => [...cell]),
          concludeCell: [resultR, resultC],
          concludeDigit: resultDigit,
          branches: null,
        }
      : {
          kind: "region",
          unitType,
          unitIdx,
          digit,
          startCells: patternCells.map((cell) => [...cell]),
          eliminationCount: eliminations.length,
          branches: null,
        };
  } else {
    throw new Error("Unexpected Dynamic Multiple finder kind: " + kindCode);
  }

  if (actionType === 1) {
    return {
      finding: {
        actionType: "fill",
        technique: "dynamicMultipleChain",
        r: resultR,
        c: resultC,
        digit: resultDigit,
        patternCells,
        context,
      },
      budgetCalls,
      budgetLimit,
    };
  }

  return {
    finding: {
      actionType: "eliminate",
      technique: "dynamicMultipleChain",
      patternCells,
      eliminations,
      context,
    },
    budgetCalls,
    budgetLimit,
  };
}


const STANDALONE_TECHNIQUE_KEYS = new Map([
  [0, "nakedSingle"],
  [1, "hiddenSingle"],
  [2, "lockedCandidate"],
  [3, "gsp"],
  [4, "nakedPair"],
  [5, "hiddenPair"],
  [6, "nakedTriple"],
  [7, "hiddenTriple"],
  [8, "nakedQuad"],
  [9, "hiddenQuad"],
  [10, "xWing"],
  [11, "swordfish"],
  [12, "skyscraper"],
  [13, "twoStringKite"],
  [14, "emptyRectangle"],
  [15, "jellyfish"],
  [16, "squirmbagFish"],
  [17, "finnedXWing"],
  [18, "finnedSwordfish"],
  [19, "finnedJellyfish"],
  [20, "uniqueRectangleType1"],
  [21, "uniqueRectangleType2"],
  [22, "hiddenUniqueRectangle"],
  [23, "bugPlusOne"],
  [24, "xyzWing"],
  [25, "wWing"],
  [26, "wxyzWing"],
  [27, "xyChain"],
  [28, "aic"],
  [29, "niceLoop"],
  [30, "sueDeCoq"],
  [31, "fireworkTriple"],
  [32, "fireworkQuadruple"],

  [36, "alsXZ"],

  [39, "deathBlossom"],
  [40, "medusa3D"],
  [41, "tridagon"],
