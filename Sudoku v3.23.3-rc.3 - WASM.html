function renderTimerRow() {
  const el = document.getElementById("timer-row");
  if (state.mode !== "play" || !state.play.solution) {
    el.innerHTML = "";
    return;
  }
  const leftHtml = !state.play.timerStarted
    ? `<button class="chip" data-action="start-challenge">开始挑战</button>`
    : `<span class="mono-note" id="timer-display">${formatTime(getElapsedMs())}</span>`;
  const candActive = state.showCandidates;
  const auto = state.play.autoMode;

  if (auto.active) {
    const pauseLabel = auto.paused ? "继续" : "暂停";
    el.innerHTML = `
      <div class="row-wrap">
        ${leftHtml}
        <button class="chip" data-action="auto-toggle-pause" style="margin-left:auto;">${pauseLabel}</button>
        <button class="chip" data-action="auto-takeover">接手</button>
        <button class="chip chip-active" data-action="toggle-candidates" disabled title="Auto 模式期间候选数强制开启">候选数</button>
      </div>
    `;
    return;
  }

  const pencilActive = state.play.pencilMode;
  const eraserActive = state.play.eraserMode;
  el.innerHTML = `
    <div class="row-wrap">
      ${leftHtml}
      <button class="chip" data-action="auto-start">Auto Mode</button>
      <button class="icon-btn ${pencilActive ? "icon-btn-active" : ""}" data-action="toggle-pencil" title="笔记模式(只增)" style="margin-left:auto;">✎</button>
      <button class="icon-btn ${eraserActive ? "icon-btn-active" : ""}" data-action="toggle-eraser" title="候选数橡皮(只减)">⌫</button>
      <button class="chip ${candActive ? "chip-active" : ""}" data-action="toggle-candidates">候选数</button>
    </div>
  `;
}

function renderHistoryRow() {
  const el = document.getElementById("history-row");
  if (state.mode === "play" && !state.play.solution) {
    el.innerHTML = "";
    return;
  }
  const s = state.mode === "play" ? state.play : state.create;
  const locked = state.mode === "play" && (state.play.showSolution || state.play.autoMode.active);
  const undoDisabled = s.history.length === 0 || locked;
  const redoDisabled = s.future.length === 0 || locked;
  let html = `
    <button class="icon-btn" data-action="undo" ${undoDisabled ? "disabled" : ""} title="撤销">↶</button>
    <button class="icon-btn" data-action="redo" ${redoDisabled ? "disabled" : ""} title="重做">↷</button>
  `;
  if (state.mode === "play") {
    html += `<button class="icon-btn icon-btn-wide" data-action="reset" ${locked ? "disabled" : ""} title="重置">重置</button>`;
    html += `<button class="icon-btn icon-btn-wide" data-action="validate-difficulty" ${locked ? "disabled" : ""} title="评估这道题的SE难度分">测难度</button>`;
  }
  el.innerHTML = html;
}

/* -------------------- 链式技巧的箭头覆盖层 --------------------
   #grid是1:1正方形的9x9 CSS grid,SVG覆盖层用viewBox="0 0 900 900"
   跟它精确重叠,900=9格*100——这样箭头坐标可以纯几何算出来,不用
   查DOM元素的实际像素位置,缩放也不会跑偏。候选数迷你格子固定是
   3x3布局(1-9按行优先排列),所以候选数d在格子内部的相对坐标也能
   直接算出来,不用查具体的.cand元素在哪。 -------------------- */
function candidatePixelPos(r, c, d) {
  const subCol = (d - 1) % 3;
  const subRow = Math.floor((d - 1) / 3);
  return {
    x: c * 100 + (subCol + 0.5) * (100 / 3),
    y: r * 100 + (subRow + 0.5) * (100 / 3),
  };
}
// 弯不弯、往哪边弯,核心目的只有一个:别压在候选数上面。原来全部用
// 直线,最挡视线的两种情形是——(1)同一个格子内部两个候选数之间连线,
// 直线会直接穿过格子正中间,格子中间往往还站着别的候选数;(2)两个
// 格子恰好同行或同列(尤其只隔1-2格),直线会贴着这一行/列的候选数
// 一路刮过去,正好把中间格子的候选数盖住。这两种情形必须弯。
// 反过来,如果两个格子既不同行也不同列、离得又比较远(典型是斜跨
// 好几个宫),直线本来就不会贴着谁走,弯反而多此一举、徒增视觉噪音——
// 这种情形直接退化成直线,不是每一段都强制弯。
function chainNeedsCurve(from, to) {
  const cellAx = Math.floor(from.x / 100),
    cellAy = Math.floor(from.y / 100);
  const cellBx = Math.floor(to.x / 100),
    cellBy = Math.floor(to.y / 100);
  const sameCell = cellAx === cellBx && cellAy === cellBy;
  const sameRow = cellAy === cellBy;
  const sameCol = cellAx === cellBx;
  return { sameCell, needsCurve: sameCell || sameRow || sameCol };
}
// 三次贝塞尔(两个控制点,不是二次那种单控制点),弯曲方向主动避让:
// 同格情形下,两个控制点往"远离格子中心"的方向偏,等于绕格子中间
// 一圈走边上,不切中间;跨格同行/同列的情形,往垂直于连线的方向偏,
// 方向按这条线在整条链里的序号奇偶交替,避免同一条链的相邻线段
// 全部往同一侧弯、又叠在一起。不需要弯的情形(见chainNeedsCurve)
// 直接退化成一条直线路径,没有控制点。
function chainPathData(from, to, segIndex) {
  const { sameCell, needsCurve } = chainNeedsCurve(from, to);
  if (!needsCurve) {
    return `M ${from.x.toFixed(1)} ${from.y.toFixed(1)} L ${to.x.toFixed(1)} ${to.y.toFixed(1)}`;
  }
  const dx = to.x - from.x,
    dy = to.y - from.y;
  const dist = Math.hypot(dx, dy) || 1;
  let perpX = -dy / dist,
    perpY = dx / dist;
  if (sameCell) {
    // 往"远离格子中心"的方向弯,而不是任意一侧——这样线段会绕到
    // 格子边缘附近,不会正好扫过中间那几个候选数。用连线中点相对
    // 格子中心的方位来判断该往哪偏;中点恰好落在格子正中心时(比如
    // 对角线1↔9这种),两个垂直方向没有偏好,退回奇偶交替。
    const cellCx = (Math.floor(from.x / 100) + 0.5) * 100;
    const cellCy = (Math.floor(from.y / 100) + 0.5) * 100;
    const midX = (from.x + to.x) / 2,
      midY = (from.y + to.y) / 2;
    const awayX = midX - cellCx,
      awayY = midY - cellCy;
    const dot = awayX * perpX + awayY * perpY;
    if (Math.abs(dot) > 0.01) {
      if (dot < 0) {
        perpX = -perpX;
        perpY = -perpY;
      }
    } else if (segIndex % 2 !== 0) {
      perpX = -perpX;
      perpY = -perpY;
    }
  } else if (segIndex % 2 !== 0) {
    perpX = -perpX;
    perpY = -perpY;
  }
  // 同格的弯曲幅度用固定值(格子大小是100,22够绕到候选数外圈又不会
  // 弯得太夸张);跨格的按距离算比例,但设个上限,避免离得很远的两格
  // 弯出一个很夸张的大弧。
  const bow = sameCell ? 22 : Math.min(dist * 0.22, 36);
  const c1x = from.x + dx * 0.28 + perpX * bow;
  const c1y = from.y + dy * 0.28 + perpY * bow;
  const c2x = from.x + dx * 0.72 + perpX * bow;
  const c2y = from.y + dy * 0.72 + perpY * bow;
  return `M ${from.x.toFixed(1)} ${from.y.toFixed(1)} C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${to.x.toFixed(1)} ${to.y.toFixed(1)}`;
}
// 分组节点(Grouped AIC)没有唯一的"数字在哪"——组里具体是哪个格子
// 成立,链条本身也不知道,所以箭头连的是组内所有候选位置的几何
// 中心。单格节点(组大小为1)时,这个公式退化成就是那一个候选的
// 精确坐标,不需要另外分支处理。
function groupCentroid(cells, d) {
  const positions = cells.map(([r, c]) => candidatePixelPos(r, c, d));
  const x = positions.reduce((s, p) => s + p.x, 0) / positions.length;
  const y = positions.reduce((s, p) => s + p.y, 0) / positions.length;
  return { x, y };
}
// 把一串{cells,d}节点转成线段列表,强弱按下标奇偶交替(0-1强、1-2弱、
// 2-3强……)。AIC/Nice Loop的强弱交替是这个规律,ALS-XZ/ALS-链"同ALS
// 内部跳转是强链接、跨ALS的RCC互斥是弱链接"、W-Wing"格内双值跳转是
// 强链接、跨格看得见是弱链接"也完全符合这个交替规律,所以抽成一个
// 公共函数,不用每个技巧各写一遍这段循环。
function chainNodesToSegments(nodes) {
  const segs = [];
  for (let i = 0; i < nodes.length - 1; i++) {
    const a = nodes[i];
    const b = nodes[i + 1];
    segs.push({ from: groupCentroid(a.cells, a.d), to: groupCentroid(b.cells, b.d), strong: i % 2 === 0 });
  }
  return segs;
}
// 从一个finding里提取"链条线段"列表:{from, to, strong}。不同技巧的
// 链条数据结构不一样,按技巧分别处理;没有明确顺序概念的技巧(唯一
// 矩形、鱼形等)不返回线段,箭头只画真正是"链"的技巧。
function extractChainSegments(finding, getCands) {
  if (!finding) return [];
  if (finding.technique === "xyChain" && finding.chainCells && finding.chainLinkDigits) {
    const segs = [];
    for (let i = 0; i < finding.chainLinkDigits.length; i++) {
      const d = finding.chainLinkDigits[i];
      const a = finding.chainCells[i];
      const b = finding.chainCells[i + 1];
      segs.push({ from: candidatePixelPos(a.r, a.c, d), to: candidatePixelPos(b.r, b.c, d), strong: true });
    }
    return segs;
  }
  if ((finding.technique === "aic" || finding.technique === "niceLoop") && finding.chainNodes) {
    const segs = [];
    const nodes = finding.chainNodes;
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i];
      const b = nodes[i + 1];
      segs.push({ from: groupCentroid(a.cells, a.d), to: groupCentroid(b.cells, b.d), strong: i % 2 === 0 });
    }
    return segs;
  }
  if (finding.technique === "wWing" && finding.context) {
    const { biValueCells, strongLinkCells, strongDigit, elimDigit } = finding.context;
    const [A, B] = biValueCells;
    const [L1, L2] = strongLinkCells;
    const toRC = ([r, c]) => ({ r, c });
    const p = cellsSeeEachOther(toRC(L1), toRC(A)) ? L1 : L2;
    const q = p === L1 ? L2 : L1;
    const nodes = [
      { cells: [A], d: elimDigit },
      { cells: [A], d: strongDigit },
      { cells: [p], d: strongDigit },
      { cells: [q], d: strongDigit },
      { cells: [B], d: strongDigit },
      { cells: [B], d: elimDigit },
    ];
    return chainNodesToSegments(nodes);
  }
  if (finding.technique === "emptyRectangle" && finding.context) {
    const { digit, near, far, target } = finding.context;
    const nodes = [
      { cells: [far], d: digit },
      { cells: [near], d: digit },
      { cells: [target], d: digit },
    ];
    return chainNodesToSegments(nodes);
  }
  if (finding.technique === "alsXZ" && finding.context && getCands) {
    const { alsACells, alsBCells, rccDigits, elimDigit } = finding.context;
    const segs = [];
    for (const rcc of rccDigits) {
      const nodes = [
        { cells: alsCandidatePositions({ cells: alsACells }, elimDigit, getCands), d: elimDigit },
        { cells: alsCandidatePositions({ cells: alsACells }, rcc, getCands), d: rcc },
        { cells: alsCandidatePositions({ cells: alsBCells }, rcc, getCands), d: rcc },
        { cells: alsCandidatePositions({ cells: alsBCells }, elimDigit, getCands), d: elimDigit },
      ];
      segs.push(...chainNodesToSegments(nodes));
    }
    return segs;
  }
  if (finding.technique === "alsChain" && finding.context && getCands) {
    const { alsChain, linkRccDigits, elimDigit } = finding.context;
    const first = alsChain[0];
    const last = alsChain[alsChain.length - 1];
    const nodes = [{ cells: alsCandidatePositions({ cells: first }, elimDigit, getCands), d: elimDigit }];
    for (let i = 0; i < linkRccDigits.length; i++) {
      const rcc = linkRccDigits[i];
      nodes.push({ cells: alsCandidatePositions({ cells: alsChain[i] }, rcc, getCands), d: rcc });
      nodes.push({ cells: alsCandidatePositions({ cells: alsChain[i + 1] }, rcc, getCands), d: rcc });
    }
    nodes.push({ cells: alsCandidatePositions({ cells: last }, elimDigit, getCands), d: elimDigit });
    return chainNodesToSegments(nodes);
  }
  if (finding.technique === "deathBlossom" && finding.context && getCands) {
    const { stemCell, petals, elimDigit } = finding.context;
    const segs = [];
    for (const petal of petals) {
      const petalDigitPos = alsCandidatePositions({ cells: petal.cells }, petal.digit, getCands);
      const petalZPos = alsCandidatePositions({ cells: petal.cells }, elimDigit, getCands);
      segs.push({
        from: candidatePixelPos(stemCell[0], stemCell[1], petal.digit),
        to: groupCentroid(petalDigitPos, petal.digit),
        strong: false,
      });
      segs.push({ from: groupCentroid(petalDigitPos, petal.digit), to: groupCentroid(petalZPos, elimDigit), strong: true });
    }
    return segs;
  }
  if ((finding.technique === "wxyzWing" || finding.technique === "xyzWing") && finding.context && getCands) {
    const { hinge, outliers, digit } = finding.context;
    const segs = [];
    for (const outlier of outliers) {
      const other = getCands(outlier[0], outlier[1]).find((d) => d !== digit);
      if (other === undefined) continue; // 双值格理论上必有另一个候选,这里只是稳妥起见
      segs.push({
        from: candidatePixelPos(hinge[0], hinge[1], other),
        to: candidatePixelPos(outlier[0], outlier[1], other),
        strong: false,
      });
      segs.push({
        from: candidatePixelPos(outlier[0], outlier[1], other),
        to: candidatePixelPos(outlier[0], outlier[1], digit),
        strong: true,
      });
    }
    return segs;
  }
  if (finding.technique === "medusa3D" && finding.context && finding.context.coloring && getCands) {
    // 渲染时从context.coloring现场重建强链接边,不改findMedusa3D本身
    // (它内部建图时用的Map/Set,不方便直接塞进finding里)。这里重建
    // 出来的边,只要是"同一格双值"或"同数字在共享单元里只剩这两个
    // 位置",就必然是当初染色时用过的强链接之一——染色本身的定义
    // 保证了这一点,不存在"重建出来的边跟实际染色对不上"的风险。
    const nodes = finding.context.coloring;
    const segs = [];
    const grid = state.play.grid;
    // 格内双值链接
    const byCell = new Map();
    for (const n of nodes) {
      const ck = `${n.r},${n.c}`;
      if (!byCell.has(ck)) byCell.set(ck, []);
      byCell.get(ck).push(n);
    }
    for (const group of byCell.values()) {
      if (group.length === 2 && getCands(group[0].r, group[0].c).length === 2) {
        segs.push({ from: candidatePixelPos(group[0].r, group[0].c, group[0].d), to: candidatePixelPos(group[1].r, group[1].c, group[1].d), strong: true });
      }
    }
    // 同数字共轭对链接:两个节点数字相同、能互相看见,而且它们共享的
    // 那个单元(行/列/宫)里,这个数字恰好只剩这两个位置
    const sharedUnitCells = (a, b) => {
      const units = [];
      if (a.r === b.r) units.push(Array.from({ length: 9 }, (_, c) => [a.r, c]));
      if (a.c === b.c) units.push(Array.from({ length: 9 }, (_, r) => [r, a.c]));
      if (Math.floor(a.r / 3) === Math.floor(b.r / 3) && Math.floor(a.c / 3) === Math.floor(b.c / 3)) {
        const br = Math.floor(a.r / 3) * 3, bc = Math.floor(a.c / 3) * 3;
        const boxCells = [];
        for (let r = br; r < br + 3; r++) for (let c = bc; c < bc + 3; c++) boxCells.push([r, c]);
        units.push(boxCells);
      }
      return units;
    };
    for (let i = 0; i < nodes.length; i++)
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        if (a.d !== b.d || (a.r === b.r && a.c === b.c)) continue;
        if (!cellsSeeEachOther({ r: a.r, c: a.c }, { r: b.r, c: b.c })) continue;
        const isConjugate = sharedUnitCells(a, b).some((unit) => {
          const positions = unit.filter(([r, c]) => grid[r][c] === 0 && getCands(r, c).includes(a.d));
          return positions.length === 2;
        });
        if (isConjugate) segs.push({ from: candidatePixelPos(a.r, a.c, a.d), to: candidatePixelPos(b.r, b.c, b.d), strong: true });
      }
    return segs;
  }
  return [];
}
function renderChainOverlay() {
  const svg = document.getElementById("chain-overlay");
  const ph = state.mode === "play" ? state.play.pendingHint : null;
  const getCands = ph ? (r, c) => liveCandidatesAt(state.play.grid, state.play.notes, r, c) : null;
  const segs = extractChainSegments(ph, getCands);
  // marker的箭头颜色跟着COLORS.chain走,不在静态HTML里另外硬编码
  // 一份颜色——颜色只有COLORS这一处来源,改配色不会漏改箭头。
  const defsHtml = `<defs><marker id="chain-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${COLORS.chain}" /></marker></defs>`;
  let pathsHtml = "";
  segs.forEach((seg, i) => {
    const dash = seg.strong ? "" : ' stroke-dasharray="6 5"';
    const opacity = seg.strong ? "0.88" : "0.72";
    const d = chainPathData(seg.from, seg.to, i);
    pathsHtml += `<path d="${d}" fill="none" stroke="${COLORS.chain}" stroke-width="2.5" opacity="${opacity}"${dash} marker-end="url(#chain-arrow)" />`;
  });
  svg.innerHTML = defsHtml + pathsHtml;
}

function renderGrid() {
  const conflicts = state.mode === "play" ? findConflicts(state.play.grid) : findConflicts(state.create.grid);
  const blocked = state.mode === "play" && (state.play.showSolution || !state.play.solution);
  const showCand = state.mode === "play" && state.showCandidates && !state.play.showSolution && !!state.play.solution;

  let html = "";
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const val = getDisplayValue(r, c);
      const s = cellStyle(r, c, conflicts);
      const b = cellBorderStyle(r, c);
      const outerStyle = styleStr({ ...b, background: s.bg, boxShadow: s.ring });

      let inner;
      if (val !== 0) {
        inner = `<span style="color:${s.textColor};font-weight:${s.fontWeight};">${val}</span>`;
      } else {
        // 候选数容器要不要渲染:候选数总开关开着(可能同时有auto和
        // manual),或者这一格已经有手动标记——手动标记不受候选数
        // 总开关支配,哪怕开关关着也始终可见,用户可以只靠手动笔记
        // 工作,不依赖自动候选数。
        // 笔记(state.play.notes)只属于做题页:自建页的盘面是另一份数据
        // (state.create.grid),不能把做题页的手动笔记画上去——这个分支下面
        // 读的冲突判断、笔记内容也全是做题页的,所以整个分支只在play模式进。
        const rawCell = state.mode === "play" ? state.play.notes[r][c] : null;
        const hasManual = !!(rawCell && Object.values(rawCell).some((v) => v === "manual"));
        if (showCand || hasManual) {
          if (showCand) {
            // 逐位懒加载:只补全这一格里"这个数字的键完全不存在"的
            // 情况,已经是auto/manual/erased的键一律不动——这正是
            // "系统消除后数字重新合法能自然恢复,但用户主动擦除的
            // 绝不会被自动找回"这条不变量在渲染层的落地方式。
            const cell = ensureNotesCell(state.play.notes, r, c);
            for (const cd of candidatesAt(state.play.grid, r, c)) {
              if (!Object.prototype.hasOwnProperty.call(cell, cd)) cell[cd] = "auto";
            }
          }
          const cell = state.play.notes[r][c] || {};
          const hlDigit = state.play.highlightDigit;
          const elimDigits = hintEliminatedDigitsAt(r, c);
          let candHtml = "";
          for (let d = 1; d <= 9; d++) {
            const origin = cell[d];
            // manual永远可见;auto只有候选数总开关开着才可见;erased
            // 或者压根没标记,永远不可见——跟pressDigit里铅笔/橡皮
            // 判断"该不该生效"用的是同一套isVisibleOrigin逻辑。
            if (!isVisibleOrigin(origin, showCand)) {
              candHtml += `<span class="cand"></span>`;
              continue;
            }
            const isConflict = digitConflictsWithPeers(state.play.grid, r, c, d);
            const isHl = hlDigit === d;
            const isElimTarget = !!(elimDigits && elimDigits.has(d));
            const patternColor = hintPatternColorAt(r, c, d);
            let color, weight, extraStyle = "";
            if (isConflict) {
              color = COLORS.error;
              weight = 700;
            } else if (isElimTarget) {
              // 提示/自动模式要划掉的具体候选数——精确到这一个数字,
              // 用删除线+红底跟"这个数字本身就有冲突"(isConflict,粗体
              // 无删除线)区分开,不然两者都用error色会分不清是"已经
              // 错了"还是"马上要被推理消掉"。3D Medusa的badColor那一
              // 派候选数也会落进eliminations,天然就走这条分支,不用
              // 另外判断。
              color = COLORS.error;
              weight = 700;
              extraStyle = `background:${COLORS.error}30;border-radius:2px;text-decoration:line-through;text-decoration-thickness:1.5px;`;
            } else if (patternColor !== null) {
              // 3D Medusa存活的那一派染色阵营——走到这里说明没被
              // isElimTarget接住,即这个候选数属于"好"的那个颜色。
              color = patternColor === 0 ? COLORS.medusaA : COLORS.medusaB;
              weight = 700;
              extraStyle = `background:${color}30;border-radius:2px;`;
            } else if (isHl) {
              color = COLORS.hint;
              weight = 700;
              extraStyle = `background:${COLORS.hint}35;border-radius:2px;`;
            } else if (origin === "manual") {
              color = COLORS.accent;
              weight = 600;
            } else {
              color = COLORS.inkSoft;
              weight = 500;
            }
            candHtml += `<span class="cand" style="color:${color};font-weight:${weight};${extraStyle}">${d}</span>`;
          }
          inner = `<div class="cand-grid">${candHtml}</div>`;
        } else {
          inner = "";
        }
      }
      html += `<div class="cell" data-r="${r}" data-c="${c}" style="${outerStyle}">${inner}</div>`;
    }
  }
  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = html;
  gridEl.classList.toggle("grid-blocked", blocked);
}

// hintChoices有值时,note除了本身那句"发现了以下技巧"的文字,还要
// 现拼一份可点的技巧名字列表——不能预先烤成字符串存进note.text里,
// 必须每次render都从当下的state.play.hintChoices现算,这样"清空
// hintChoices"和"DOM里还有没有这些按钮"才是同一件事,不会脱节(参考
// invalidateStaleHintChoices的注释)。
function renderTechniqueChoiceList(choices) {
  const items = choices
    .map((h) => {
      // fix类型是"这一格本来就填错了"的纠正,不是常规技巧——用专门的
      // 文案,不显示它触发时恰好碰到的那个技巧的名字,免得看起来像是
      // 那个技巧本身要做别的事。
      const label = h.actionType === "fix" ? "纠正填错的格子" : TECHNIQUE_LABELS[h.technique] || h.technique;
      return `<button type="button" class="tech-choice-btn" data-action="pick-technique" data-technique="${escapeHtml(h.technique)}">${escapeHtml(label)}</button>`;
    })
    .join("");
  return `<div class="tech-choice-list">${items}</div>`;
}

function renderNote() {
  const note = state.mode === "play" ? state.play.note : state.create.note;
  const color = noteColorFor(note.tone);
  const el = document.getElementById("note");
  el.style.borderLeftColor = color;
  el.style.background = color + "14";
  let html = `<span style="color:${color};font-weight:600;">» </span>${escapeHtml(note.text)}`;
  if (state.mode === "play" && state.play.hintChoices) {
    html += renderTechniqueChoiceList(state.play.hintChoices);
  }
  el.innerHTML = html;
}

function renderValidationExtra() {
  const el = document.getElementById("validation-extra");
  if (state.mode === "create" && state.create.validation && state.create.validation.status === "multiple") {
    const diffs = state.create.validation.diffs;
    const shown = diffs.slice(0, 6).join("、");
    const rest = diffs.length > 6 ? `,等共 ${diffs.length} 处不同。` : "。";
    el.innerHTML = `<div class="mono-note" style="margin-top:8px;">两个解从这些格子开始不同:${escapeHtml(shown)}${rest}</div>`;
  } else {
    el.innerHTML = "";
  }
}

function renderControls() {
  const el = document.getElementById("controls");
  const extraEl = document.getElementById("challenge-row");
  if (state.mode === "play") {
    const hintLabel = state.play.hintComputing ? "提示(计算中...)" : state.play.pendingHint ? "揭晓数字" : "提示";
    const baseDisabled = !state.play.solution || state.play.autoMode.active;
    el.innerHTML = `
      <button class="action-btn" data-action="hint" ${baseDisabled || state.play.hintBusy ? "disabled" : ""}>${hintLabel}</button>
      <button class="action-btn" data-action="toggle-solution" ${baseDisabled ? "disabled" : ""}>${
      state.play.showSolution ? "返回进度" : "查看答案"
    }</button>
    `;
    extraEl.innerHTML = "";
  } else {
    el.innerHTML = `
      <button class="action-btn action-btn-primary" data-action="validate">校验</button>
      <button class="action-btn" data-action="clear-create">清空</button>
    `;
    if (state.create.validation && state.create.validation.status === "unique") {
      extraEl.innerHTML = `<button class="action-btn action-btn-primary action-btn-full" data-action="challenge">挑战这道自己出的题</button>`;
    } else {
      extraEl.innerHTML = "";
    }
  }
}

function renderNumberPad() {
  const sel = state.mode === "play" ? state.play.selected : state.create.selected;
  const selGiven = state.mode === "play" && state.play.given && sel && state.play.given[sel.r][sel.c];
  const disabled =
    !sel ||
    selGiven ||
    (state.mode === "play" && (state.play.showSolution || !state.play.solution || state.play.autoMode.active));

  const digitsHtml = [1, 2, 3, 4, 5, 6, 7, 8, 9]
    .map((d) => `<button class="pad-btn" data-action="digit" data-digit="${d}" ${disabled ? "disabled" : ""}>${d}</button>`)
    .join("");
  document.getElementById("numpad-digits").innerHTML = digitsHtml;

  // "清除这一格"现在只清定性填入的值,选中的格子本来就是空的话,
  // 这个按钮就没什么可做的,直接禁用。
  const cellCurrentlyEmpty =
    sel &&
    ((state.mode === "play" && state.play.grid[sel.r][sel.c] === 0) ||
      (state.mode === "create" && state.create.grid[sel.r][sel.c] === 0));
  document.getElementById("numpad-erase").disabled = disabled || cellCurrentlyEmpty;
}

function renderStringPanels() {
  const createPanel = document.getElementById("create-string-io");
  const playPanel = document.getElementById("play-string-io");
  createPanel.style.display = state.mode === "create" ? "block" : "none";
  // 自建模块的框是用户在编辑/粘贴的输入,这里绝不主动改它的value,
  // 不然每次render都会把用户正在打的字覆盖掉——只在"盘面→字符串"
  // 按钮被点击时才会去改它的值,那是用户主动触发的操作,不是被动
  // 渲染。
  const playVisible = state.mode === "play" && !!state.play.solution;
  playPanel.style.display = playVisible ? "block" : "none";
  if (playVisible) {
    const str = gridToPuzzleString(state.play.grid);
    document.getElementById("play-string-box").value = formatPuzzleStringForDisplay(str);
  }
}

/* -------------------- WASM迁移差分测试钩子 --------------------
   只提供机器可读的只读/离线测试入口,不参与UI行为。迁移测试通过它把
   当前JS实现固定成oracle:逐步记录first-match finding和候选掩码;
   需要技巧覆盖率时,再用enumerateAvailableFromMasks()调用现成的
   findAllAvailableSteps(),对某个已记录状态完整扫描53技巧。把“完整
   扫描”与“正常逐步求解”分开,避免Golden Nugget/Platinum Blonde
   这类重盘每一步都额外跑53个技巧而把基准时间放大到失去意义。
   ------------------------------------------------------------ */
(function installWasmMigrationTestHooks() {
  if (typeof globalThis === "undefined") return;

  function normalizeOracleValue(value, seen = new WeakSet()) {
    if (value === null || value === undefined) return value;
    if (typeof value !== "object") return value;
    if (seen.has(value)) return "[Circular]";
    seen.add(value);
    if (value instanceof Set) {
      const out = { __type: "Set", values: [...value].map((v) => normalizeOracleValue(v, seen)) };
      seen.delete(value);
      return out;
    }
    if (value instanceof Map) {
      const out = {
        __type: "Map",
        entries: [...value.entries()].map(([k, v]) => [normalizeOracleValue(k, seen), normalizeOracleValue(v, seen)]),
      };
      seen.delete(value);
      return out;
    }
    if (Array.isArray(value)) {
      const out = value.map((v) => normalizeOracleValue(v, seen));
      seen.delete(value);
      return out;
    }
    const out = {};
    for (const key of Object.keys(value)) out[key] = normalizeOracleValue(value[key], seen);
    seen.delete(value);
    return out;
  }

  function candidateMasksSnapshot(grid, getCands) {
    const masks = new Array(81).fill(0);
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (grid[r][c] !== 0) continue;
        masks[r * 9 + c] = candMaskAt(getCands, r, c) & 0x1ff;
      }
    }
    return masks;
  }

  function getCandsFromMasks(grid, masks) {
    return (r, c) => {
      const out = [];
      if (grid[r][c] !== 0) {
        out.mask = 0;
        return out;
      }
      const mask = masks[r * 9 + c] & 0x1ff;
      for (let d = 1; d <= 9; d++) if (mask & (1 << (d - 1))) out.push(d);
      out.mask = mask;
      return out;
    };
  }

  function tracePuzzle(startGrid, solution, maxSteps = 512, stopAtFirstDynamic = false) {
    const givenGrid = cloneGrid(startGrid);
    const g = cloneGrid(startGrid);
    const tracker = makeEliminationTracker();
    const getCands = (r, c) => trackedCandidatesAt(g, tracker, r, c);
    const trace = [];
    let stalled = false;
    let soundnessProblem = null;

    // 迁移oracle不记录“为展示而重算”的chain detail;它会改变finding的
    // 附带说明数据但不改变技巧判定。真正迁chain detail时再单独做契约
    // 测试,这里先固定求解核心本身。
    const savedShowChainDetail = state.settings.showChainDetail;
    state.settings.showChainDetail = false;
    try {
      for (let stepIndex = 0; stepIndex < maxSteps; stepIndex++) {
        if (!g.some((row) => row.some((v) => v === 0))) break;
        const beforeGrid = gridToPuzzleString(g);
        const beforeMasks = candidateMasksSnapshot(g, getCands);
        const finding = findNextStep(g, getCands, undefined, givenGrid, (f) => exocetFindingMatchesSolution(f, solution));
        if (!finding) {
          stalled = true;
          break;
        }

        if (finding.actionType === "fill") {
          g[finding.r][finding.c] = finding.digit;
        } else if (finding.actionType === "eliminate") {
          for (const { r, c, digit } of finding.eliminations) tracker.markErased(r, c, digit);
        } else {
          throw new Error("oracle trace encountered unsupported actionType: " + finding.actionType);
        }

        const problem = verifySoundnessAfterApply(finding, solution, g, getCands);
        const afterGrid = gridToPuzzleString(g);
        const afterMasks = candidateMasksSnapshot(g, getCands);
        trace.push({
          step: stepIndex,
          beforeGrid,
          beforeMasks,
          finding: normalizeOracleValue(finding),
          afterGrid,
          afterMasks,
          soundnessProblem: normalizeOracleValue(problem),
        });
        if (problem) {
          soundnessProblem = problem;
          break;
        }
        if (
          stopAtFirstDynamic &&
          (finding.technique === "dynamicNishioChain" || finding.technique === "dynamicUnaryChain")
        ) {
          break;
        }
      }
    } finally {
      state.settings.showChainDetail = savedShowChainDetail;
    }

    return {
      techniqueKeys: TECHNIQUE_CHAIN.map((entry) => entry.key),
      givenGrid: gridToPuzzleString(givenGrid),
      finalGrid: gridToPuzzleString(g),
      complete: !g.some((row) => row.some((v) => v === 0)),
      stalled,
      soundnessProblem: normalizeOracleValue(soundnessProblem),
      trace,
    };
  }

  function enumerateAvailableFromMasks(grid, masks, givenGrid, solution) {
    const getCands = getCandsFromMasks(grid, masks);
    const savedShowChainDetail = state.settings.showChainDetail;
    state.settings.showChainDetail = false;
    try {
      const findings = findAllAvailableSteps(
        grid,
        getCands,
        givenGrid,
        (f) => exocetFindingMatchesSolution(f, solution)
      );
      return findings.map((finding) => normalizeOracleValue(finding));
    } finally {
      state.settings.showChainDetail = savedShowChainDetail;
    }
  }

  function findTechniqueFromMasks(key, grid, masks, givenGrid, solution) {
    const entry = TECHNIQUE_CHAIN.find((candidate) => candidate.key === key);
    if (!entry) throw new Error("Unknown technique key: " + key);
    const getCands = getCandsFromMasks(grid, masks);
    const savedShowChainDetail = state.settings.showChainDetail;
    state.settings.showChainDetail = false;
    try {
      const finding = callTechniqueFn(entry.fn, grid, getCands, givenGrid);
      if (!finding || !exocetFindingMatchesSolution(finding, solution)) return null;
      return normalizeOracleValue(finding);
    } finally {
      state.settings.showChainDetail = savedShowChainDetail;
    }
  }

  function validateFindingAgainstSolution(finding, solution) {
    if (!finding) return null;
    return exocetFindingMatchesSolution(finding, solution) ? normalizeOracleValue(finding) : null;
  }

  function propagateStaticFromMasks(grid, masks, r, c, d, startTrue) {
    const getCands = getCandsFromMasks(grid, masks);
    return normalizeOracleValue(propagateAssumption(grid, getCands, r, c, d, !!startTrue));
  }

  function propagateDynamicFromMasks(grid, masks, r, c, d, startTrue, budgetLimit = DFC_BUDGET) {
    const getCands = getCandsFromMasks(grid, masks);
    const budget = { calls: 0, limit: budgetLimit };
    const result = propagateAssumptionDynamic(grid, getCands, r, c, d, !!startTrue, budget);
    return {
      result: normalizeOracleValue(result),
      budgetCalls: budget.calls,
      budgetLimit: budget.limit,
    };
  }

  function findDynamicNishioFromMasks(grid, masks, budgetLimit = DFC_BUDGET) {
    const getCands = getCandsFromMasks(grid, masks);
    const budget = { calls: 0, limit: budgetLimit };
    const engine = (g, gc, r, c, d, st) => propagateAssumptionDynamic(g, gc, r, c, d, st, budget);
    const savedShowChainDetail = state.settings.showChainDetail;
    state.settings.showChainDetail = false;
    try {
      return {
        finding: normalizeOracleValue(findNishioChain(grid, getCands, engine, "dynamicNishioChain")),
        budgetCalls: budget.calls,
        budgetLimit: budget.limit,
      };
    } finally {
      state.settings.showChainDetail = savedShowChainDetail;
    }
  }

  function findDynamicUnaryFromMasks(grid, masks, budgetLimit = DFC_BUDGET) {
    const getCands = getCandsFromMasks(grid, masks);
    const budget = { calls: 0, limit: budgetLimit };
    const engine = (g, gc, r, c, d, st) => propagateAssumptionDynamic(g, gc, r, c, d, st, budget);
    const savedShowChainDetail = state.settings.showChainDetail;
    state.settings.showChainDetail = false;
    try {
      return {
        finding: normalizeOracleValue(findUnaryChain(grid, getCands, engine, "dynamicUnaryChain")),
        budgetCalls: budget.calls,
        budgetLimit: budget.limit,
      };
    } finally {
      state.settings.showChainDetail = savedShowChainDetail;
    }
  }

  function findDynamicMultipleFromMasks(grid, masks, budgetLimit = DFC_BUDGET) {
    const getCands = getCandsFromMasks(grid, masks);
    const budget = { calls: 0, limit: budgetLimit };
    const engine = (g, gc, r, c, d, st) => propagateAssumptionDynamic(g, gc, r, c, d, st, budget);
    const savedShowChainDetail = state.settings.showChainDetail;
    state.settings.showChainDetail = false;
    try {
      const finding =
        findCellForcingChain(grid, getCands, engine, "dynamicMultipleChain") ||
        findRegionForcingChain(grid, getCands, engine, "dynamicMultipleChain");
      return {
        finding: normalizeOracleValue(finding),
        budgetCalls: budget.calls,
        budgetLimit: budget.limit,
      };
    } finally {
      state.settings.showChainDetail = savedShowChainDetail;
    }
  }

  globalThis.__SUDOKU_WASM_MIGRATION_TEST_HOOKS__ = Object.freeze({
    version: 1,
    techniqueKeys: () => TECHNIQUE_CHAIN.map((entry) => entry.key),
    candidateMasksForGrid: (grid) => candidateMasksSnapshot(grid, (r, c) => candidatesAt(grid, r, c)),
    tracePuzzle,
    enumerateAvailableFromMasks,
    findTechniqueFromMasks,
    validateFindingAgainstSolution,
    propagateStaticFromMasks,
    propagateDynamicFromMasks,
    findDynamicNishioFromMasks,
    findDynamicUnaryFromMasks,
    findDynamicMultipleFromMasks,
  });
})();

/* ------------------------------ 事件绑定(只绑一次,靠事件委托应对每次 render 重建的子节点) ------------------------------ */

// 这个判断是专门为Web Worker复用这份脚本准备的:Worker环境没有
// document,如果不加这层判断,脚本刚加载到Worker里就会在这里直接
// 报错崩溃,连前面定义好的求解函数都用不上。加了这层判断之后,
// 同一份脚本可以原封不动地喂给主线程和Worker两边,不需要另外维护
// 一份精简版代码——技巧逻辑不管改到哪,两边永远同步。
if (typeof document !== "undefined") {
  document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("mode-play-btn").addEventListener("click", () => {
    state.settingsUI.explainOpen = {}; // 离开设置模式,折叠状态忘掉;不在设置模式时清空一个空对象也无副作用
    state.settingsUI.capturingKeyFor = null; // 同上,离开设置模式就不该还留着"正在等待按键"的悬空状态
    state.settingsUI.keyBindingMessage = "";
    hintRequestSeq++; // 可能是从自建切回来的,旧的校验请求作废
    state.mode = "play";
    render();
  });
  document.getElementById("mode-create-btn").addEventListener("click", () => {
    state.settingsUI.explainOpen = {};
    state.settingsUI.capturingKeyFor = null;
    state.settingsUI.keyBindingMessage = "";
    hintRequestSeq++; // 离开做题模式,任何还没返回的提示请求都作废
    if (state.play.autoMode.active) {
      state.play.autoMode.active = false;
      state.play.autoMode.paused = false;
      clearAutoModeTimeout();
    }
    state.mode = "create";
    render();
  });
  document.getElementById("mode-settings-btn").addEventListener("click", () => {
    hintRequestSeq++; // 同上
    if (state.play.autoMode.active) {
      state.play.autoMode.active = false;
      state.play.autoMode.paused = false;
      clearAutoModeTimeout();
    }
    state.mode = "settings";
    render();
  });
  document.getElementById("settings-panel").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    if (btn.dataset.action === "toggle-prefer-advanced-hint") {
      // 正常情况下,「提示列出全部技巧」开着时这个chip在render()里
      // 已经是disabled、点不到——这里只是双重保险,不是主要防线。
      if (!state.settings.preferAdvancedHint && state.settings.listTechniquesOnHint) return;
      state.settings.preferAdvancedHint = !state.settings.preferAdvancedHint;
      render();
    }
    if (btn.dataset.action === "toggle-list-techniques-on-hint") {
      if (!state.settings.listTechniquesOnHint && state.settings.preferAdvancedHint) return; // 同上,双重保险
      state.settings.listTechniquesOnHint = !state.settings.listTechniquesOnHint;
      render();
    }
    if (btn.dataset.action === "toggle-chain-detail") {
      state.settings.showChainDetail = !state.settings.showChainDetail;
      render();
    }
    if (btn.dataset.action === "toggle-theme") {
      const rect = btn.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      applyThemeWithTransition(state.theme === "dark" ? "light" : "dark", originX, originY);
    }
    if (btn.dataset.action === "toggle-remember-theme") {
      state.settings.rememberTheme = btn.checked;
      try {
        if (btn.checked) localStorage.setItem("sudoku-theme", state.theme);
        else localStorage.removeItem("sudoku-theme");
      } catch (err) {
        /* 存储被禁用(隐私模式/受限WebView):静默忽略,不让"记不住"
           这件事本身变成一个报错打断用户,勾选框状态照样按用户操作
           更新,只是这次不会真的持久化下去。 */
      }
      render();
    }
    if (btn.dataset.action === "clear-local-storage") {
      try {
        localStorage.removeItem("sudoku-theme");
        localStorage.removeItem("sudoku-key-bindings");
      } catch (err) {
        /* 同上,存储不可用时清除操作本身没有意义,静默忽略即可。 */
      }
      state.settings.rememberTheme = false;
      state.settings.rememberKeyBindings = false;
      render();
    }
    if (btn.dataset.action === "toggle-performance-monitor") {
      state.settings.performanceMonitor = btn.checked;
      render();
    }
    if (btn.dataset.action === "capture-key-binding") {
      state.settingsUI.capturingKeyFor = btn.dataset.kbAction;
      state.settingsUI.keyBindingMessage = "";
      render();
    }
    if (btn.dataset.action === "clear-key-binding") {
      state.settings.keyBindings[btn.dataset.kbAction] = null;
      state.settingsUI.keyBindingMessage = "";
      persistKeyBindingsIfEnabled();
      render();
    }
    if (btn.dataset.action === "toggle-remember-key-bindings") {
      state.settings.rememberKeyBindings = btn.checked;
      try {
        if (btn.checked) localStorage.setItem("sudoku-key-bindings", JSON.stringify(state.settings.keyBindings));
        else localStorage.removeItem("sudoku-key-bindings");
      } catch (err) {
        /* 存储被禁用:静默忽略,勾选框状态照样按用户操作更新,只是
           这次不会真的持久化下去。 */
      }
      render();
    }
  });
  // 数字输入框的值变化走change事件,不是click——单独监听,复用同一个
  // data-action约定。用change(失焦/回车才触发)而不是input(每敲一
  // 个字符都触发),是故意的:边打字边校验/边clamp,数字会在输入
  // 中途被打断,体验很差,等用户输完(失焦或回车)再统一校验一次。
  document.getElementById("settings-panel").addEventListener("change", (e) => {
    const input = e.target.closest("[data-action]");
    if (!input) return;
    if (input.dataset.action === "set-auto-interval") {
      let v = Number(input.value);
      if (!Number.isFinite(v)) v = state.settings.autoStepIntervalMs; // 输入框被清空/输入了非数字,退回当前值,不让NaN流进设置里
      v = Math.max(AUTO_STEP_INTERVAL_MIN_MS, Math.min(AUTO_STEP_INTERVAL_MAX_MS, Math.round(v / 100) * 100)); // 夹到上下限之间,顺带取整到100ms的倍数,避免出现类似3057这种没有意义的精度
      state.settings.autoStepIntervalMs = v;
      render();
    }
  });
  // details/summary的toggle事件不冒泡,委托只能用捕获阶段(第三个参数
  // 传true)才能在settings-panel这层拦到——这里只同步状态,不主动
  // render(),避免用户刚展开就被立刻重绘打断。
  document.getElementById("settings-panel").addEventListener(
    "toggle",
    (e) => {
      const details = e.target.closest("details[data-explain-key]");
      if (!details) return;
      state.settingsUI.explainOpen[details.dataset.explainKey] = details.open;
    },
    true
  );

  document.getElementById("difficulty-area").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === "select-difficulty") handleSelectDifficulty(btn.dataset.diff);
    else if (action === "select-custom") handleSelectCustom();
    else if (action === "refresh") handleRefresh();
  });

  document.getElementById("grid").addEventListener("click", (e) => {
    const cell = e.target.closest(".cell");
    if (!cell) return;
    handleCellClick(Number(cell.dataset.r), Number(cell.dataset.c));
  });

  document.getElementById("controls").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === "hint") handleHintClick();
    else if (action === "toggle-solution") toggleShowSolution();
    else if (action === "validate") handleValidate();
    else if (action === "clear-create") handleClearCreate();
  });

  document.getElementById("note").addEventListener("click", (e) => {
    // 只有"提示列出全部技巧"模式下,note里现拼出来的技巧名字按钮才有
    // 这个data-action,平时note纯粹是展示文字,这里点不到任何东西。
    const btn = e.target.closest('button[data-action="pick-technique"]');
    if (!btn) return;
    handleHintChoicePick(btn.dataset.technique);
  });

  document.getElementById("challenge-row").addEventListener("click", (e) => {
    const btn = e.target.closest('button[data-action="challenge"]');
    if (btn) challengeOwnPuzzle();
  });

  document.getElementById("timer-row").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    if (btn.dataset.action === "start-challenge") handleStartChallenge();
    else if (btn.dataset.action === "toggle-candidates") {
      // 完全独立开关:只管显示/隐藏候选数,不影响铅笔/橡皮模式,
      // 也不被它们影响——用户可以只用手动笔记,不依赖自动候选数。
      state.showCandidates = !state.showCandidates;
      render();
    } else if (btn.dataset.action === "toggle-pencil") {
      state.play.pencilMode = !state.play.pencilMode;
      if (state.play.pencilMode) state.play.eraserMode = false; // 跟橡皮互斥
      render();
    } else if (btn.dataset.action === "toggle-eraser") {
      state.play.eraserMode = !state.play.eraserMode;
      if (state.play.eraserMode) state.play.pencilMode = false; // 跟铅笔互斥
      render();
    } else if (btn.dataset.action === "auto-start") {
      handleStartAutoMode();
    } else if (btn.dataset.action === "auto-toggle-pause") {
      handleTogglePauseAutoMode();
    } else if (btn.dataset.action === "auto-takeover") {
      handleTakeOverAutoMode();
    }
  });

  document.getElementById("history-row").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    if (btn.dataset.action === "undo") undo(state.mode);
    else if (btn.dataset.action === "redo") redo(state.mode);
    else if (btn.dataset.action === "reset") handleResetPlay();
    else if (btn.dataset.action === "validate-difficulty") handleValidateDifficulty();
  });

  document.getElementById("create-string-io").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    if (btn.dataset.action === "string-to-grid") handleStringToGrid();
    else if (btn.dataset.action === "grid-to-string") handleGridToString();
    else if (btn.dataset.action === "copy-string") handleCopyString(btn.dataset.target, btn);
    else if (btn.dataset.action === "clear-string") {
      // 不靠长按全选再删除,直接清空并换一个全新的输入框节点——既是
      // 日常的清空入口,也是输入框一旦进入"僵尸态"时的保底出口。
      const box = document.getElementById("puzzle-string-box");
      if (box) {
        box.value = "";
        reviveTextarea(box, false);
      }
    }
  });

  document.getElementById("play-string-io").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    if (btn.dataset.action === "copy-string") handleCopyString(btn.dataset.target, btn);
  });

  document.getElementById("numpad-digits").addEventListener("click", (e) => {
    const btn = e.target.closest('button[data-action="digit"]');
    if (btn) pressDigit(Number(btn.dataset.digit));
  });
  document.getElementById("numpad-erase").addEventListener("click", () => pressDigit(0));

  document.getElementById("soundness-error-modal").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    if (btn.dataset.action === "copy-soundness-report") {
      handleCopyString("soundness-report-box", btn);
    } else if (btn.dataset.action === "close-soundness-error") {
      // 关闭只是收起这个弹层,不撤销已经发生的填入/消除——那个状态
      // 本身也是报告的一部分,撤销了反而没法配合报告去复现问题。
      // 想撤销的话用现成的"撤销"按钮,是两件独立的事。
      state.play.soundnessError = null;
      render();
    }
  });

  // 桌面端键盘导航:方向键挪选中格,数字键1-9/Backspace/Delete直接
  // 对当前选中格生效——跟点鼠标选格子+点数字键盘是完全同一条逻辑
  // 路径(moveSelection复用handleCellClick,数字键直接调pressDigit),
  // 不需要额外的"确认选中"步骤。
  // 文本编辑会话追踪:不能完全依赖document.activeElement判断"焦点是否
  // 在输入控件上"——某些WebView/内嵌预览容器在长按选择文字的过程中,
  // activeElement会短暂"僵尸态"地变成document.body,即使textarea视觉
  // 上仍然保持着选区、软键盘也还弹着。这时候如果下面的全局快捷键只
  // 检查activeElement,会误判成"焦点不在任何控件上",把用户在文本框
  // 里按的Backspace/Delete当成数独"清空这一格"的快捷键抢走,还
  // preventDefault()把textarea原生的删除操作一起取消了——具体复现:
  // 自建页字符串框里长按→全选→一次性删除,内容不会消失、光标也不会
  // 闪烁。用一个显式维护的"是否正在编辑文本"标记兜底,不完全依赖
  // activeElement这一个可能失真的信号;pointerdown/focusin落在可编辑
  // 元素上就置真,pointerdown落在其它任何地方就置回假(用捕获阶段,
  // 保证不会被目标元素自己的事件处理逻辑拦掉)。
  function isEditableElement(el) {
    return el instanceof Element && !!el.closest('textarea, input, select, [contenteditable]:not([contenteditable="false"])');
  }
  let textEditingActive = false;
  document.addEventListener("focusin", (e) => {
    if (isEditableElement(e.target)) textEditingActive = true;
  });
  document.addEventListener(
    "pointerdown",
    (e) => {
      textEditingActive = isEditableElement(e.target);
    },
    true
  );

  // 输入框"僵尸态"的自愈机制。某些WebView/预览容器里,长按全选后一次性
  // 删除,会让输入法和textarea节点的连接失步:键盘还在、但打字进不去,
  // 收起键盘后再点输入框也唤不起键盘。这个状态在页面之外(输入法连接层),
  // 页面脚本改不了它,但换一个全新的textarea节点就能让WebView重新建立
  // 输入连接。两个触发点:①一次输入事件里成片删除内容(≥6个字符);
  // ②点击输入框后焦点没有真正落上去。所有监听都挂在document上(事件
  // 委托),节点被换掉之后不需要重新绑定。
  const PUZZLE_BOX_ID = "puzzle-string-box";
  let boxPreLen = null;
  let boxPreSelDelete = false; // 本次编辑开始前选区是展开的,且操作类型是删除/剪切
  let boxLastLen = 0;
  let lastReviveAt = 0;
  function reviveTextarea(ta, refocus) {
    if (!ta || !ta.isConnected) return ta;
    const value = ta.value;
    let s = value.length;
    let e = value.length;
    try {
      s = ta.selectionStart;
      e = ta.selectionEnd;
    } catch (_) {}
    const fresh = ta.cloneNode(false); // 保留id/class/属性/内联高度,不带旧的内部状态
    fresh.value = value;
    ta.replaceWith(fresh);
    if (refocus) {
      try {
        fresh.focus({ preventScroll: true });
        fresh.setSelectionRange(s, e);
      } catch (_) {}
    }
    return fresh;
  }
  document.addEventListener(
    "focusin",
    (e) => {
      if (e.target && e.target.id === PUZZLE_BOX_ID) boxLastLen = e.target.value.length;
    },
    true
  );
  document.addEventListener(
    "beforeinput",
    (e) => {
      if (e.target && e.target.id === PUZZLE_BOX_ID) {
        const t = e.target;
        boxPreLen = t.value.length;
        // "选中一段再删除/剪切"才是僵尸态的真正诱因,跟删了多少个字符无关;
        // 普通退格时选区是收拢的(起点=终点),不会命中。
        boxPreSelDelete =
          t.selectionStart !== t.selectionEnd && typeof e.inputType === "string" && e.inputType.startsWith("delete");
      }
    },
    true
  );
  document.addEventListener(
    "input",
    (e) => {
      const ta = e.target;
      if (!ta || ta.id !== PUZZLE_BOX_ID) return;
      const pre = boxPreLen !== null ? boxPreLen : boxLastLen;
      const selDelete = boxPreSelDelete && pre > ta.value.length;
      boxPreLen = null;
      boxPreSelDelete = false;
      boxLastLen = ta.value.length;
      // 主判据:选区展开时的删除/剪切,不管删了几个字符。兜底:个别输入法
      // 在beforeinput里拿不到选区或inputType,退回到"一次删掉≥6个字符"。
      if (!selDelete && pre - ta.value.length < 6) return;
      const now = Date.now();
      if (now - lastReviveAt < 500) return;
      lastReviveAt = now;
      // 不在input事件回调里同步换节点,推迟到本轮事件处理完之后。
      setTimeout(() => reviveTextarea(document.getElementById(PUZZLE_BOX_ID), true), 0);
    },
    true
  );
  // 只看click,不看pointerup:长按选字不会触发click,不会在用户选字
  // 的过程中误把节点换掉。
  document.addEventListener(
    "click",
    (e) => {
      if (!e.target || e.target.id !== PUZZLE_BOX_ID) return;
      setTimeout(() => {
        const cur = document.getElementById(PUZZLE_BOX_ID);
        if (cur && cur.isConnected && cur.offsetParent !== null && document.activeElement !== cur) {
          reviveTextarea(cur, true);
        }
      }, 150);
    },
    true
  );

  document.addEventListener("keydown", (e) => {
    // 正在捕获自定义快捷键(设置面板里点了"设置额外按键"之后):这个
    // 分支放最前面,跳过下面"焦点不在具体控件上才接管"那道判断——
    // 捕获这个动作本身,触发它的按钮这时候必然还拿着焦点,就是要在
    // 这种情况下也能抓到用户接下来按的那个键,不能被焦点guard拦掉。
    if (state.settingsUI.capturingKeyFor) {
      e.preventDefault();
      const action = state.settingsUI.capturingKeyFor;
      state.settingsUI.capturingKeyFor = null;
      if (e.key === "Escape") {
        state.settingsUI.keyBindingMessage = "";
      } else if (e.ctrlKey || e.metaKey || e.altKey) {
        state.settingsUI.keyBindingMessage = "不支持绑定带 Ctrl/Cmd/Alt 的组合键——这类按键整体不会被这个 app 的快捷键接管,绑了也不会生效";
      } else {
        const result = tryAssignKeyBinding(action, e.key);
        state.settingsUI.keyBindingMessage = result.ok ? "" : result.reason;
        if (result.ok) persistKeyBindingsIfEnabled();
      }
      render();
      return;
    }
    // Ctrl/Cmd/Alt按着时整个不接管,不跟浏览器/系统自己的快捷键打架
    // (包括Mac上的Cmd,不是只考虑了Windows的Ctrl)。
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // 焦点落在按钮/输入框/details等任何具体控件上时让开,把按键交还
    // 给浏览器原生处理(Tab导航到下一个控件、Enter激活按钮、Space
    // 切换复选框这些)——棋盘的快捷键只在"焦点不落在任何具体控件上"
    // 时接管,不然比如Tab到"撤销"按钮之后按方向键会被棋盘抢走。
    if (document.activeElement && document.activeElement !== document.body) return;
    // 上面这条是原有逻辑,正常情况下已经够用;这里再叠加一层——即使
    // WebView把activeElement弄丢成了body,只要我们独立追踪到"正在
    // 编辑文本"这个会话状态,也照样让开,不让数独快捷键抢走文本框的
    // 按键(完整背景见上面isEditableElement/textEditingActive那段)。
    if (textEditingActive) return;
    // 纠错弹窗是靠position:fixed的全屏遮罩挡住鼠标点击的,但这挡不住
    // keydown事件,得显式拦截,不然弹窗开着的时候方向键/数字键还能
    // 穿透过去悄悄改动盘面。
    if (state.play.soundnessError) return;

    if (e.key >= "1" && e.key <= "9") {
      pressDigit(Number(e.key));
      e.preventDefault();
    } else if (e.key === "Backspace" || e.key === "Delete" || matchesKeyBinding("erase", e.key)) {
      pressDigit(0);
      e.preventDefault();
    } else if (e.key === "ArrowUp" || matchesKeyBinding("up", e.key)) {
      moveSelection(-1, 0);
      e.preventDefault();
    } else if (e.key === "ArrowDown" || matchesKeyBinding("down", e.key)) {
      moveSelection(1, 0);
      e.preventDefault();
    } else if (e.key === "ArrowLeft" || matchesKeyBinding("left", e.key)) {
      moveSelection(0, -1);
      e.preventDefault();
    } else if (e.key === "ArrowRight" || matchesKeyBinding("right", e.key)) {
      moveSelection(0, 1);
      e.preventDefault();
    }
  });

  render();
  });
}

</script>
</body>
</html>
