// 全量重算)+矛盾检测②(9digit×3unitType×9unit×9cell=2187次嵌套
// 扫描)——profiling实测Platinum Blonde一局里这个函数被调用62334次,
// 吃掉95.1%总耗时,真正的热点就是这两处全量重扫,不是某个具体技巧。

// 逐项比对完全一致后才把V2内容替换进这个函数本身;另外在Fata Morgana
// +Platinum Blonde两道基准题上验证过步数、SE难度分(峰值/累加)、
// 最高技巧统计跟旧版逐位相同。实测耗时:Fata Morgana 25.44s→19.05s
// (降25.1%),Platinum Blonde 163.66s→104.25s(降36.3%)——涨幅小于
// propagateAssumptionCore的95.1%总占比,因为这个函数内部调用的
// findNakedSingle/findHiddenSingle/findLockedCandidates(或
// DYNAMIC_MIDLEVEL_TECHNIQUES)这些技巧搜索函数本身没有跟着重构,
// cloneGrid()的O(81)复制也还在——这两处是下一步如果还要继续榨性能
// 的候选方向,这一轮没有动它们。
function propagateAssumptionCore(grid, getCandsBase, r0, c0, d0, startTrue, techniques, budget, recordTrace = false) {
  if (budget) {
    budget.calls++;
    if (budget.calls > budget.limit) return { contradiction: false, aborted: true, trueSet: new Set(), falseSet: new Set() };
  }
  const g = cloneGrid(grid);
  const hypoErased = new Set(); // 整数key
  const trueSet = new Set(); // 整数key
  const falseSet = new Set(); // 整数key
  const steps = recordTrace ? [] : null;

  const baseCache = new Map();
  let initialized = false;
  let cellMask = null;
  let unitDigitMask = null;
  let placedMask = null;
  const touchedCells = new Set();
  const touchedTriples = new Set();

  function tripleKey(ut, idx, d) {
    return (d - 1) * 27 + ut * 9 + idx;
  }
  function clearUnitPositionsOnly(r, c, dd) {
    const br = boxIndex(r, c);
    if (unitDigitMask.row[r][dd] & (1 << c)) {
      unitDigitMask.row[r][dd] &= ~(1 << c);
      touchedTriples.add(tripleKey(0, r, dd));
    }
    if (unitDigitMask.col[c][dd] & (1 << r)) {
      unitDigitMask.col[c][dd] &= ~(1 << r);
      touchedTriples.add(tripleKey(1, c, dd));
    }
    const posInBox = (r % 3) * 3 + (c % 3);
    if (unitDigitMask.box[br][dd] & (1 << posInBox)) {
      unitDigitMask.box[br][dd] &= ~(1 << posInBox);
      touchedTriples.add(tripleKey(2, br, dd));
    }
  }
  function clearCandidate(r, c, dd) {
    const bit = 1 << (dd - 1);
    if (!(cellMask[r][c] & bit)) return;
    cellMask[r][c] &= ~bit;
    touchedCells.add(cellIdx(r, c));
    clearUnitPositionsOnly(r, c, dd);
  }
  function placeDigit(r, c, d) {
    const oldMask = cellMask[r][c];
    for (let dd = 1; dd <= 9; dd++) {
      if (oldMask & (1 << (dd - 1))) clearUnitPositionsOnly(r, c, dd);
    }
    cellMask[r][c] = 0;
    g[r][c] = d;
    const br = boxIndex(r, c);
    placedMask.row[r] |= 1 << (d - 1);
    placedMask.col[c] |= 1 << (d - 1);
    placedMask.box[br] |= 1 << (d - 1);
    for (const [pr, pc] of PEERS_TABLE[r][c]) {
      if (g[pr][pc] === 0) clearCandidate(pr, pc, d);
    }
  }
  function initMasks() {
    cellMask = Array.from({ length: 9 }, () => new Array(9).fill(0));
    unitDigitMask = {
      row: Array.from({ length: 9 }, () => new Array(10).fill(0)),
      col: Array.from({ length: 9 }, () => new Array(10).fill(0)),
      box: Array.from({ length: 9 }, () => new Array(10).fill(0)),
    };
    placedMask = { row: new Array(9).fill(0), col: new Array(9).fill(0), box: new Array(9).fill(0) };
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++) {
        if (g[r][c] !== 0) {
          const d = g[r][c];
          const br = boxIndex(r, c);
          placedMask.row[r] |= 1 << (d - 1);
          placedMask.col[c] |= 1 << (d - 1);
          placedMask.box[br] |= 1 << (d - 1);
        }
      }
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++) {
        if (g[r][c] !== 0) {
          cellMask[r][c] = 0;
          continue;
        }
        const k = cellIdx(r, c);
        if (!baseCache.has(k)) baseCache.set(k, getCandsBase(r, c));
        const base = baseCache.get(k);
        let baseMask = 0;
        for (const d of base) baseMask |= 1 << (d - 1);
        let used = 0;
        for (let i = 0; i < 9; i++) {
          if (g[r][i]) used |= 1 << (g[r][i] - 1);
          if (g[i][c]) used |= 1 << (g[i][c] - 1);
        }
        const br0 = Math.floor(r / 3) * 3,
          bc0 = Math.floor(c / 3) * 3;
        for (let i = br0; i < br0 + 3; i++) for (let j = bc0; j < bc0 + 3; j++) if (g[i][j]) used |= 1 << (g[i][j] - 1);
        const rawMask = 0x1ff & ~used;
        let erasedMask = 0;
        for (let d = 1; d <= 9; d++) if (hypoErased.has(factIdx(r, c, d))) erasedMask |= 1 << (d - 1);
        cellMask[r][c] = rawMask & baseMask & ~erasedMask;
      }
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++) {
        const m = cellMask[r][c];
        if (!m) continue;
        const br = boxIndex(r, c);
        const posInBox = (r % 3) * 3 + (c % 3);
        for (let d = 1; d <= 9; d++) {
          if (m & (1 << (d - 1))) {
            unitDigitMask.row[r][d] |= 1 << c;
            unitDigitMask.col[c][d] |= 1 << r;
            unitDigitMask.box[br][d] |= 1 << posInBox;
          }
        }
      }
    initialized = true;
    // 第一轮检查退化成全量扫描(见函数头注释的归纳法边界说明)
    touchedCells.clear();
    touchedTriples.clear();
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) touchedCells.add(cellIdx(r, c));
    for (let d = 1; d <= 9; d++) for (let ut = 0; ut < 3; ut++) for (let idx = 0; idx < 9; idx++) touchedTriples.add(tripleKey(ut, idx, d));
  }
  function getCands(r, c) {
    if (!initialized) return candidatesAt(g, r, c);
    if (g[r][c] !== 0) return [];
    const m = cellMask[r][c];
    const out = [];
    for (let d = 1; d <= 9; d++) if (m & (1 << (d - 1))) out.push(d);
    return out;
  }

  function markTrue(r, c, d) {
    const k = factIdx(r, c, d);
    if (trueSet.has(k)) return true;
    if (falseSet.has(k)) return false; // 矛盾:已经被推定为假,现在又要求为真
    if (g[r][c] !== 0) return g[r][c] === d;
    if (initialized && !(cellMask[r][c] & (1 << (d - 1)))) return false; // 这个候选数此刻已经不可能了,还要求它为真
    trueSet.add(k);
    if (initialized) placeDigit(r, c, d);
    else g[r][c] = d;
    return true;
  }
  function markFalse(r, c, d) {
    const k = factIdx(r, c, d);
    if (falseSet.has(k)) return true;
    if (trueSet.has(k)) return false; // 矛盾:已经被推定为真,现在又要求为假
    if (g[r][c] !== 0) return true; // 格子已经填了别的数,候选数概念不适用,不算矛盾
    falseSet.add(k);
    hypoErased.add(k);
    if (initialized) clearCandidate(r, c, d);
    return true;
  }
  // 对外的trueSet/falseSet仍然用字符串key("r,c,d")——这样调用方
  // (findUnaryChain等)不用因为引擎内部换了表示方式而跟着改一行代码,
  // 只在返回的这一刻转换一次,不影响传播循环本身的性能。
  function toStringSet(s) {
    const out = new Set();
    for (const k of s) {
      const [r, c, d] = decodeFactIdx(k);
      out.add(`${r},${c},${d}`);
    }
    return out;
  }

  if (!(startTrue ? markTrue(r0, c0, d0) : markFalse(r0, c0, d0))) {
    return { contradiction: true, trueSet: toStringSet(trueSet), falseSet: toStringSet(falseSet), steps };
  }
  initMasks();

  let guard = 0;
  while (guard++ < 200) {
    let finding = null;
    for (const tech of techniques) {
      finding = tech(g, getCands);
      if (finding) break;
    }
    if (!finding) break;
    if (recordTrace) steps.push(finding);
    if (finding.actionType === "fill") {
      if (!markTrue(finding.r, finding.c, finding.digit))
        return { contradiction: true, trueSet: toStringSet(trueSet), falseSet: toStringSet(falseSet), steps };
    } else {
      let hardConflict = false;
      for (const { r, c, digit } of finding.eliminations) {
        if (!markFalse(r, c, digit)) {
          hardConflict = true;
          break;
        }
      }
      if (hardConflict) return { contradiction: true, trueSet: toStringSet(trueSet), falseSet: toStringSet(falseSet), steps };
    }

    // 矛盾检测①(只查这一轮touch过的格子,按row-major排序还原原版
    // "第一个命中"的确定性顺序)
    const sortedCells = [...touchedCells].sort((a, b) => a - b);
    let contradictionFound = null;
    for (const idx of sortedCells) {
      const r = Math.floor(idx / 9),
        c = idx % 9;
      if (g[r][c] === 0 && cellMask[r][c] === 0) {
        contradictionFound = { kind: "cellExhausted", r, c };
        break;
      }
    }
    if (contradictionFound) {
      return {
        contradiction: true,
        trueSet: toStringSet(trueSet),
        falseSet: toStringSet(falseSet),
        steps,
        contradictionReason: recordTrace ? contradictionFound : null,
      };
    }

    // 矛盾检测②(只查这一轮touch过的unit×digit三元组,按
    // (digit,unitType,idx)排序还原原版的检查顺序)
    const sortedTriples = [...touchedTriples].sort((a, b) => a - b);
    for (const key of sortedTriples) {
      const d = Math.floor(key / 27) + 1;
      const rest = key % 27;
      const ut = Math.floor(rest / 9);
      const idx = rest % 9;
      const utName = UT_NAMES[ut];
      if (unitDigitMask[utName][idx][d] === 0 && !(placedMask[utName][idx] & (1 << (d - 1)))) {
        return {
          contradiction: true,
          trueSet: toStringSet(trueSet),
          falseSet: toStringSet(falseSet),
          steps,
          contradictionReason: recordTrace ? { kind: "unitExhausted", digit: d, unitType: utName, unitIndex: idx } : null,
        };
      }
    }

    touchedCells.clear();
    touchedTriples.clear();
  }
  return { contradiction: false, trueSet: toStringSet(trueSet), falseSet: toStringSet(falseSet), grid: g, steps };
}
// 静态版(原来的行为完全不变):只用唯一余数+唯一候选+锁定候选,不带
// budget限制。unaryChain/nishioChain/multipleChain这3个已经校准过
// 的技巧继续调这个,行为、SE权重、消息文案全部原样不动。
const STATIC_PROPAGATION_TECHNIQUES = [findNakedSingle, findHiddenSingle, findLockedCandidates];
function propagateAssumption(grid, getCandsBase, r0, c0, d0, startTrue, recordTrace = false) {
  return propagateAssumptionCore(grid, getCandsBase, r0, c0, d0, startTrue, STATIC_PROPAGATION_TECHNIQUES, null, recordTrace);
}
// 动态版传播用的中阶技巧清单——比静态版多了显式数对/三数组、简单鱼,
// 这些都很便宜,不涉及递归。要以后再给动态传播解锁更多技巧(比如
// 更大的鱼、Wing),只需要往这个数组里加一项。
const DYNAMIC_MIDLEVEL_TECHNIQUES = [
  findNakedSingle,
  findHiddenSingle,
  findLockedCandidates,
  (g, gc) => findNakedSubset(g, gc, 2),
  (g, gc) => findHiddenSubset(g, gc, 2),
  (g, gc) => findNakedSubset(g, gc, 3),
  (g, gc) => findHiddenSubset(g, gc, 3),
  (g, gc) => findFish(g, gc, 2),
  (g, gc) => findFish(g, gc, 3),
];
// 这是"动态"这个词真正的含义所在:传播卡住的时候(中阶技巧清单也
// 试过了、找不到下一步),作为清单里最后一项的伪技巧,挑一个候选数
// (双值格优先,便宜且矛盾率高),只用静态技巧清单再递归传播一层——
// 如果那一层出矛盾,说明这个候选数在当前假设状态下不可能为真,可以
// 划掉,让外层传播接着往下走。这里的"只递归一层"是硬性规定(嵌套
// 调用时传的是STATIC_PROPAGATION_TECHNIQUES,不是动态清单自己),
// 不允许无限往下嵌套——不然复杂度真的会失控。要以后想放开到两层,
// 只需要改这一个函数,不用碰外层的findDynamicXxxChain。budget是
// 跨整次findDynamicXxxChain调用共享的预算,超出直接放弃,不是让它
// 自然收敛。
function makeNestedNishioStep(budget) {
  return function nestedNishioStep(g, getCands) {
    if (budget.calls > budget.limit) return null;
    const candList = [];
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++) {
        if (g[r][c] !== 0) continue;
        const mask = candMaskAt(getCands, r, c);
        const n = countBits(mask);
        for (const d of maskToDigits(mask)) candList.push([r, c, d, n]);
      }
    candList.sort((a, b) => a[3] - b[3]);
    for (const [r, c, d] of candList) {
      if (budget.calls > budget.limit) return null;
      const res = propagateAssumptionCore(g, getCands, r, c, d, true, STATIC_PROPAGATION_TECHNIQUES, budget);
      if (res.contradiction) {
        return { actionType: "eliminate", technique: "_nestedNishio", eliminations: [{ r, c, digit: d }] };
      }
    }
    return null;
  };
}
// DFC_BUDGET:单次findDynamicXxxChain调用允许的propagateAssumptionCore
// 总调用次数上限(含所有分支、含嵌套)。超出预算直接判定"这一轮没找到",
// 交给后面的技巧或者下一次hint请求重试,不会卡死界面。
//
// 这个值的调整历史,如实记录:
// - 最初4000是拍脑袋定的保守值,当时Golden Nugget/Easter Monster在
//   这个预算下都能秒级到百秒级出结果。
// - JE、SE(含全部子路径:MirrorAlmostHiddenSet、CheckSeniorTrueBase、
//   CheckSeniorLockedMember式消除)按C#参考实现移植完、反复验证过
//   不出错之后,Platinum Blonde依然攻克不了——诊断确认不是"差一点点",
//   是这一步棋盘状态下JE/SE两家族确实找不到任何立足点(资料显示真正
//   啃下这题需要的是工作量非常大的专门性技巧,不打算再往那个方向投入)。
// - 因此改用DFC兜底。测试时先把预算临时调大10倍到40000(激进值,纯粹
//   用来测算真实需求上限,不是最终值),完整跑通Platinum Blonde后,
//   插桩记录下实际用到的峰值propagateAssumptionCore调用次数是6783
//   (来自某一次dynamicNishioChain命中),正确性用solveCount反解交叉
//   核对过、全程没有矛盾。
// - 最终值取6783向上取整到整10,即6790——只覆盖实测需求,不是继续用
//   40000那个没有依据的激进值。
//
// 关于DFC是不是"猜":这一点专门找kyoyama-kazusa(C#参考实现的作者)
// 确认过,他的原话大意是——这顶多在人类的直觉上感觉像是在猜,但算法
// 层面跟真正的Guess(试值+回溯)有本质区别:DFC每一步的"假设为真/假"
// 分支都会被完整propagate到底,得出矛盾就是矛盾、没矛盾就是没矛盾,
// 结论是确定性推导出来的,不依赖"蒙对了继续、蒙错了回溯重来"这种
// 试错机制。所以DFC仍然归在逻辑类技巧里,不算猜测类,只是搜索空间
// 比其他技巧大得多、需要更大的调用预算才能在合理时间内穷尽分支。
const DFC_BUDGET = 6790;
function propagateAssumptionDynamic(grid, getCandsBase, r0, c0, d0, startTrue, budget, recordTrace = false) {
  const nestedStep = makeNestedNishioStep(budget);
  const techniques = [...DYNAMIC_MIDLEVEL_TECHNIQUES, nestedStep];
  return propagateAssumptionCore(grid, getCandsBase, r0, c0, d0, startTrue, techniques, budget, recordTrace);
}

// ==== 强制链详细推导:重算辅助 ====
//
// "先搜索、后重算"是这一整套详细推导功能的核心设计:搜索阶段(试哪个
// 格子、哪个候选数)完全不受这个功能影响,永远是现在这套逻辑、这个
// 速度;只有搜索已经确认某一组假设有效之后,才会为了展示详情,单独
// 针对这一组假设重新跑一遍传播(这次开着recordTrace)。多付出的计算量
// 只是"重算一次已经知道会成功的路径",跟搜索阶段试错的量完全不是
// 一个数量级。
//
// 阈值是保守估的初版值,不是精确校准过的,以后看实际跑出来的分布可以调:
// - CHAIN_DETAIL_MAX_STEPS:重算出来的steps长度超过这个数,就不逐条
//   展示了,回退成摘要文案+"共X步,太长不展开"这句话,而不是硬挤一份
//   谁都读不下去的清单。
// (曾经还有个CHAIN_DETAIL_LINE_MAX_STEPS,专门管盘面上画不画连接线——
// 但连接线这部分从来没真的写过,这个常量定义了却没有任何地方读它,
// 是个不做事的死代码,已经删掉。设置面板里"分支多会退化成不画线"
// 的说法也是照着这个从没实现的功能编的,一并改成了如实的"现在不管
// 分支多少一律不画线"。)
const CHAIN_DETAIL_MAX_STEPS = 30;
// Dynamic重算专用的预算上限,不是DFC_BUDGET本身——重算时故意给一个
// 小得多的预算,如果这组假设本身在Dynamic传播里就需要消耗很多次
// propagateAssumptionCore调用(常见于嵌套的_nestedNishio,一次嵌套
// 检测可能试好几个候选数,每个都要走一遍完整静态传播),重算会在
// 这个小预算下提前aborted,直接当"太长,不展开"处理,不用真的把
// 几千次调用的重算跑完再发现"算是算完了但没法展示"——两全其美,
// 既不会为了展示不出来的内容白付出大量计算,又能顺带拿到"是不是
// 太长"这个信号,不用另外发明一套预判机制。
const CHAIN_DETAIL_DYNAMIC_RECOMPUTE_BUDGET = 800;
// 重算某一组假设的详细推导过程。technique用来判断走静态版还是
// Dynamic版——Dynamic版必须用一份全新的预算,不能复用搜索阶段已经
// 消耗过的那个budget对象,不然重算可能因为预算已经快耗尽而被提前
// 中断,即使这组假设在搜索阶段已经证明是可行的。
function recomputeAssumptionWithTrace(grid, getCands, technique, r, c, d, startTrue) {
  if (technique.startsWith("dynamic")) {
    const freshBudget = { calls: 0, limit: CHAIN_DETAIL_DYNAMIC_RECOMPUTE_BUDGET };
    return propagateAssumptionDynamic(grid, getCands, r, c, d, startTrue, freshBudget, true);
  }
  return propagateAssumption(grid, getCands, r, c, d, startTrue, true);
}
// 把一次propagateAssumptionCore(开着recordTrace)的返回结果,包装成
// 挂在finding.context上的一份"分支"描述——label是这条分支的人话
// 说明(比如"假设(3,5)=7成立"),steps是重算出来的逐步推导(可能因为
// 太长被置为null,由tooLong标记原因),contradictionReason是矛盾类
// 分支特有的、矛盾具体是什么。
function buildChainBranch(label, result) {
  const tooLong = result.aborted || (result.steps && result.steps.length > CHAIN_DETAIL_MAX_STEPS);
  return {
    label,
    contradiction: result.contradiction,
    tooLong,
    steps: tooLong ? null : result.steps,
    stepCount: result.steps ? result.steps.length : null,
    contradictionReason: result.contradictionReason || null,
  };
}

// UnaryChain:挑一个候选数,分别假设它真、假,各自用propagateAssumption
// 推到底。如果两条分支都没矛盾、而且推出了同一个结论(某处必须填
// 某数,或者某个候选数必须被划掉),那这个结论不管起点候选数本身
// 真假都成立。两条分支只要有一条出现矛盾,交给findNishioChain处理,
// 这里不重复报告(保持两个技巧的判定条件互斥,互不越界)。
function findUnaryChain(grid, getCands, engine = propagateAssumption, techniqueName = "unaryChain") {
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      for (const d of maskToDigits(candMaskAt(getCands, r, c))) {
        const onB = engine(grid, getCands, r, c, d, true);
        if (onB.contradiction) continue;
        const offB = engine(grid, getCands, r, c, d, false);
        if (offB.contradiction) continue;
        const startKey = `${r},${c},${d}`;
        let commonTrueKey = null;
        for (const k of onB.trueSet) {
          if (k !== startKey && offB.trueSet.has(k)) { commonTrueKey = k; break; }
        }
        // 详细推导:只有确认这组假设(true分支、false分支都没矛盾,且
        // 已经找到共同结论)真的会产出一个finding时才重算,不会平白

            buildChainBranch(`假设${describeCell(r, c)}=${d}不成立`, recomputeAssumptionWithTrace(grid, getCands, techniqueName, r, c, d, false)),

        if (commonTrueKey) {

            actionType: "fill",
            technique: techniqueName,
            r: tr, c: tc, digit: td,
            patternCells: [[r, c]],
            context: { startCell: [r, c], startDigit: d, concludeCell: [tr, tc], concludeDigit: td, concludeValue: true, branches: buildDetailBranches() },
          };
        }
        const commonFalseKeys = [...onB.falseSet].filter((k) => offB.falseSet.has(k));

            const [er, ec, ed] = k.split(",").map(Number);
            return { r: er, c: ec, digit: ed };

          return {
            actionType: "eliminate",
            technique: techniqueName,
            patternCells: [[r, c]],
            eliminations,
            context: { startCell: [r, c], startDigit: d, concludeValue: false, eliminationCount: eliminations.length, branches: buildDetailBranches() },
          };

}

// NishioChain:挑一个候选数,只假设它为真,推到底。如果推出矛盾,说明
// 这个候选数不可能是解,直接划掉——这是经典意义上最基础的Nishio
// (单分支、只找矛盾),不要求跟另一条分支殊途同归。
function findNishioChain(grid, getCands, engine = propagateAssumption, techniqueName = "nishioChain") {
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      for (const d of maskToDigits(candMaskAt(getCands, r, c))) {
        const onB = engine(grid, getCands, r, c, d, true);
        if (!onB.contradiction) continue;
        const branches = state.settings.showChainDetail
          ? [buildChainBranch(`假设${describeCell(r, c)}=${d}成立`, recomputeAssumptionWithTrace(grid, getCands, techniqueName, r, c, d, true))]
          : null;
        return {
          actionType: "eliminate",
          technique: techniqueName,
          patternCells: [[r, c]],
          eliminations: [{ r, c, digit: d }],
          context: { r, c, d, branches },
        };
      }
    }
  return null;
}

// SK Loop:MSLS(Multi-Sector Locked Set)在"2行+2列+这2行2列确定的
// 4个宫"这个固定8-Sector结构下的特例——之所以先做这个不做完全通用
// 的MSLS,是因为Sector组合是固定形状,搜索空间是C(9,2)跨带行对(27种)
// ×C(9,2)跨栏列对(27种)=729种,而不是在27个Sector里做开放式组合
// 搜索。算法核心是"rank 0"计数论证(查资料交叉验证过,GNPX的
// Sector/Link框架、SudokuWiki修正后的"限制性共同候选"证明、Allan
// Barker的Base/Link/Rank通用框架,三个独立信源在数学上完全一致):
// 交集格子数如果等于覆盖这些格子所需的最小Sector数之和,这个结构

    const out = [];
    for (let a = 0; a < n; a++)

      if (boxes.length !== 4) continue; // 跨带跨栏理论上必然是4个不同的宫,防御性检查

      // 每个格子属于哪几个Sector(0/1=两行,2/3=两列,4-7=四个宫,按boxes数组顺序编号)

        if (c === c2) idx.push(3);
        const bi = boxes.indexOf(boxOf(r, c));
        if (bi >= 0) idx.push(4 + bi);
        return idx;
      };

      // 交集:还没解出、恰好属于2个Sector的格子——属于3个的是"三重
      // 重叠"(典型情况就是4个角:同时是行、列、宫的交点),按MSLS的
      // 通用规则整体排除出交集,不管这个角本身有没有解出。
      const intersectionCells = [];
      for (let r = 0; r < 9; r++)

          byDigit.get(d).push(sectorsAt(r, c));

        }
        digitCover.set(d, best.mask);
        totalLinks += best.size;
      }
      if (!feasible || totalLinks !== intersectionCells.length) continue; // rank≠0,这个组合不成立

      const sectorCellsOf = (s) => {
        if (s === 0) return Array.from({ length: 9 }, (_, c) => [r1, c]);
        if (s === 1) return Array.from({ length: 9 }, (_, c) => [r2, c]);
        if (s === 2) return Array.from({ length: 9 }, (_, r) => [r, c1]);
        if (s === 3) return Array.from({ length: 9 }, (_, r) => [r, c2]);
        const boxIdx = boxes[s - 4];
        const br = Math.floor(boxIdx / 3) * 3,
          bc = (boxIdx % 3) * 3;

            eliminations.push({ r, c, digit: d });

      if (eliminations.length === 0) continue;

        actionType: "eliminate",
        technique: "skLoop",
        patternCells: intersectionCells,
        eliminations,
        context: { rows: [r1, r2], cols: [c1, c2], boxes },
      };
    }
  return null;
}

// ==== MSLS(Multi-Sector Locked Set,通用n行×p列矩形版,含宫扩展) ====
//

//    按字典序枚举"恰好n个1"的掩码,不用后来居上判断popcount,单纯是

//    跑得够快。

//    三类,组合数直接上一个量级,Gosper's Hack这种针对固定枚举顺序
//    的位技巧没法优雅地扩展到三类混合Sector的场景,勉强套用的话
//    枚举空间会指数级失控,所以整个换血,从"暴力枚举掩码"(不管是

// 弱校验测过,还没出过错。3) 如实报告:Golden Nugget和Easter Monster

              if (colSet.has(cc) || grid[r][cc] !== 0) continue; // 落在选中列上=三重重叠,排除
              const bx = ((r / 3) | 0) * 3 + s;

  };
  // 每个尺寸先试纯行列版(更常见、更便宜),不行再试含宫版(更贵,
  // 覆盖的pattern更多)。不是按尺寸分组两轮扫完,而是同一尺寸内先纯
  // 后宫——这样如果某个小尺寸的纯版就能解决,不用等所有尺寸的纯版
  // 都试完才轮到宫。
  for (const [n, p] of MSLS_SIZES) {
    let found = trySizeMSLS(grid, cachedGetCands, n, p, false);
    if (found) return found;
    found = trySizeMSLS(grid, cachedGetCands, n, p, true);
    if (found) return found;
  }
  return null;
}


// UnaryChain已经覆盖的情况,这里不重复),把每个候选数各自单独假设
// 为真,分别用propagateAssumption推到底,求N条分支的共同结论。跟
// UnaryChain不一样的地方:这里每条分支只测"为真"这一种情况(不测
// "为假"),因为N个候选数本身就是互斥且穷尽的(格子必须填这N个之
// 一),不需要再单独测每一个的"假"分支。
function findCellForcingChain(grid, getCands, engine = propagateAssumption, techniqueName = "multipleChain") {
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      const mask = candMaskAt(getCands, r, c);
      if (countBits(mask) < 3) continue;
      const cands = maskToDigits(mask);
      const branches = cands.map((d) => engine(grid, getCands, r, c, d, true));
      if (branches.some((b) => b.contradiction)) continue; // 任一分支矛盾,交给别的技巧(比如nishioChain类似的单支矛盾逻辑)处理,这里不重复报告
      let commonTrue = new Set(branches[0].trueSet);
      let commonFalse = new Set(branches[0].falseSet);
      for (let i = 1; i < branches.length; i++) {
        commonTrue = new Set([...commonTrue].filter((k) => branches[i].trueSet.has(k)));
        commonFalse = new Set([...commonFalse].filter((k) => branches[i].falseSet.has(k)));
      }
      for (const d of cands) commonTrue.delete(`${r},${c},${d}`); // 起点格子自己的候选数不算"额外结论"
      // 详细推导:cands每个候选数都是一条独立分支,全部都是论证的一
      // 部分(不是"只有一条被采纳、其余是废弃探索"),确认要出finding
      // 之后才逐条重算,数量最多9条。
      function buildDetailBranches() {
        if (!state.settings.showChainDetail) return null;
        return cands.map((d) => buildChainBranch(`假设${describeCell(r, c)}=${d}`, recomputeAssumptionWithTrace(grid, getCands, techniqueName, r, c, d, true)));
      }
      if (commonTrue.size > 0) {
        const [tr, tc, td] = [...commonTrue][0].split(",").map(Number);
        return {
          actionType: "fill",
          technique: techniqueName,
          r: tr, c: tc, digit: td,
          patternCells: [[r, c]],
          context: { kind: "cell", startCell: [r, c], startDigits: cands, concludeCell: [tr, tc], concludeDigit: td, branches: buildDetailBranches() },
        };
      }
      if (commonFalse.size > 0) {
        const eliminations = [...commonFalse].map((k) => {
          const [er, ec, ed] = k.split(",").map(Number);
          return { r: er, c: ec, digit: ed };
        });
        return {
          actionType: "eliminate",
          technique: techniqueName,
          patternCells: [[r, c]],
          eliminations,
          context: { kind: "cell", startCell: [r, c], startDigits: cands, eliminationCount: eliminations.length, branches: buildDetailBranches() },
        };
      }
    }
  return null;
}

// MultipleChain,Region入口:一个数字在某个行/列/宫里有3个或以上
// 候选位置(同样,2个的话UnaryChain已经覆盖),每个位置各自单独假设
// 为真,分别推到底,求共同结论。
function findRegionForcingChain(grid, getCands, engine = propagateAssumption, techniqueName = "multipleChain") {
  for (let d = 1; d <= 9; d++) {
    const dBit = 1 << (d - 1);
    for (const unitType of ["row", "col", "box"]) {
      for (let idx = 0; idx < 9; idx++) {
        const cells = unitCells(unitType, idx).filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & dBit);
        if (cells.length < 3) continue;
        const branches = cells.map(([r, c]) => engine(grid, getCands, r, c, d, true));
        if (branches.some((b) => b.contradiction)) continue;
        let commonTrue = new Set(branches[0].trueSet);
        let commonFalse = new Set(branches[0].falseSet);
        for (let i = 1; i < branches.length; i++) {
          commonTrue = new Set([...commonTrue].filter((k) => branches[i].trueSet.has(k)));
          commonFalse = new Set([...commonFalse].filter((k) => branches[i].falseSet.has(k)));
        }
        for (const [r, c] of cells) commonTrue.delete(`${r},${c},${d}`);
        function buildDetailBranches() {
          if (!state.settings.showChainDetail) return null;
          return cells.map(([r, c]) => buildChainBranch(`假设${describeCell(r, c)}=${d}`, recomputeAssumptionWithTrace(grid, getCands, techniqueName, r, c, d, true)));
        }
        if (commonTrue.size > 0) {
          const [tr, tc, td] = [...commonTrue][0].split(",").map(Number);
          return {
            actionType: "fill",
            technique: techniqueName,
            r: tr, c: tc, digit: td,
            patternCells: cells,
            context: { kind: "region", unitType, unitIdx: idx, digit: d, startCells: cells, concludeCell: [tr, tc], concludeDigit: td, branches: buildDetailBranches() },
          };
        }
        if (commonFalse.size > 0) {
          const eliminations = [...commonFalse].map((k) => {
            const [er, ec, ed] = k.split(",").map(Number);
            return { r: er, c: ec, digit: ed };
          });
          return {
            actionType: "eliminate",
            technique: techniqueName,
            patternCells: cells,
            eliminations,
            context: { kind: "region", unitType, unitIdx: idx, digit: d, startCells: cells, eliminationCount: eliminations.length, branches: buildDetailBranches() },
          };
        }
      }
    }
  }
  return null;
}

// 对外统一入口:先试Cell再试Region,跟其它技巧一样,一次调用只返回
// 第一个命中的发现。
function findMultipleChain(grid, getCands) {
  return findCellForcingChain(grid, getCands) || findRegionForcingChain(grid, getCands);
}

// ==== Dynamic Forcing Chain(动态强制链)====
//
// 跟上面3个静态版是完全相同的外层逻辑(挑候选数/挑区域、假设、求
// 共同结论)——唯一区别是传播时用propagateAssumptionDynamic而不是
// propagateAssumption,即"传播过程本身能用的技巧更多、还能嵌套一层
// 试错"。这也是为什么上面4个函数要重构成engine可传参:不用另外
// 写4份几乎一样的外层循环,只是换一个引擎、换一个technique标签。
//
// 背景:Golden Nugget、Easter Monster这类SE评分11.8~11.9的构造,
// 之前的技巧链(含MSLS的宫扩展版)全部试过仍然攻克不了。查过SE官方
// 对同量级题目的真实解题日志,清一色是各种Forcing Chain
// (Nishio/Cell/Region/Dynamic Contradiction Forcing Chains反复出现),
// SE自己的难度表也显示8.8~9.6这一档正是"Dynamic Forcing Chains"——
// 说明要覆盖到这个难度区间,该升级的是链条本身能不能嵌套,不是再去
// 补Wing/UR/ALS/BUG+N这些中低难度的技巧(那些卡在4~6分,跟11+差着
// 一大截,而且大多已经被现有的AIC/ALS-chain更一般地覆盖了)。
//
// 已实测:加了dynamicNishioChain+dynamicUnaryChain这两个之后,
// Golden Nugget(128步,约106秒)、Easter Monster(113步,约36秒,
// 而且Easter Monster的开局命中确实是skLoop——跟公开的手解路径吻合)
// 都能被完整攻克,过程中每一步的结论都跟真解核对过、没有矛盾。这两
// 局的单次结论耗时目前是秒级到分钟级,不是毫秒级——这是预期之内的,
// SE自己在这个难度上也不快,不是性能回归。
function findDynamicUnaryChain(grid, getCands) {
  const budget = { calls: 0, limit: DFC_BUDGET };
  const engine = (g, gc, r, c, d, st) => propagateAssumptionDynamic(g, gc, r, c, d, st, budget);
  return findUnaryChain(grid, getCands, engine, "dynamicUnaryChain");
}
function findDynamicNishioChain(grid, getCands) {
  const budget = { calls: 0, limit: DFC_BUDGET };
  const engine = (g, gc, r, c, d, st) => propagateAssumptionDynamic(g, gc, r, c, d, st, budget);
  return findNishioChain(grid, getCands, engine, "dynamicNishioChain");
}
function findDynamicMultipleChain(grid, getCands) {
  const budget = { calls: 0, limit: DFC_BUDGET };
  const engine = (g, gc, r, c, d, st) => propagateAssumptionDynamic(g, gc, r, c, d, st, budget);
  // Cell和Region共用同一份budget:两个都试的话,加起来也不能超过
  // 一次findDynamicMultipleChain调用的总预算。
  return (
    findCellForcingChain(grid, getCands, engine, "dynamicMultipleChain") ||
    findRegionForcingChain(grid, getCands, engine, "dynamicMultipleChain")
  );
}

// ==== Junior Exocet(JE,飞鱼)====
//
// 一个跟MSLS/SK Loop完全不同的技巧家族——不是Rank 0集合覆盖论证,
// 是"基准格2格若干候选数,通过目标格+伴随格+镜像格的几何关系,证明
// 目标格只能持有基准候选数"这一套独立的推理体系。理论依据是David
// P Bird的JExocet Compendium,这一轮进一步对照kyoyama-kazusa的C#
// 参考实现(ExocetStepSearcher.cs)逐段核对过。
//
// 【这一版做了什么、没做什么,老实交代,不为了显得完整而硬编】
//
// 几何定位(基准格/目标格/伴随格/镜像格,条件1-6)——这部分本轮没有
// 改动,继续沿用之前跟David Bird本人{1,5,8}例子核对过的实现。
//
// 基准合法性判定——本轮**整个重写**,不再是"只认3个候选数"的自制
// 启发式,换成跟C#参考实现语义一致的appearing-times精确匹配判定
// (数字在cross-line里能否找到恰好size-1=2个互不相邻、彼此覆盖的
// 候选位置)+locked member豁免,而且是全有全无门槛(基准候选集合
// 要么整体有效,要么整体放弃——之前有一版语义错误地"逐个筛选留下
// 能通过的",被validate.js的solveCount真实解交叉核对抓出来过一次
// 严重的错误消除,已修复)。这套判定天然不关心候选数个数,不需要
// 再靠"恰好3个"这道闸门兜底。
//
// escalation子技巧——按C#参考实现CollectJuniorExocets的优先级顺序
// 全部接完了:MirrorSync、基础消除(Rule3/4)、MirrorConjugatePair、
// AdjacentTarget、IncompatiblePair(连带inferredTargetPairMask
// 推导,再喂给TargetPair和GeneralizedFish,三者结果合并返回)、
// 最后MirrorAlmostHiddenSet兜底。GeneralizedFish移植时抓到过一次
// 真实bug(消除区域没排除目标格自身,把Fata Morgana的真实解当假的
// 划掉了),已修复。
//
// **MirrorAlmostHiddenSet没有正例验证过**——Fata Morgana/Platinum
// Blonde两题里它都没有实际触发(前者更早的escalation阶段就出结果了,
// 后者压根过不了基准合法性门槛),只能确认它不会崩溃、不会拖累其他
// 结果,不能确认它自己触发时产出的消除是对的。下次遇到真的靠它才能
// 推进的题,第一件事是拿solveCount交叉核对,不要预设它是对的。
//
// 没做的:
// - **locked member digit存在时该走的CheckJuniorLockedMember**——
//   现在locked member只是被当成appearing-times规则的豁免条件之一,
//   合并进主流程走同一套escalation链,不是C#里那个独立的、产出
//   逻辑也不一样的escalation路径,这是简化,不是完整移植
// - **Double JE、Complex(Franken/Mutant)变体完全没有实现**——这些是
//   比Basic JE复杂一个量级的东西(Senior Exocet后来补上了,见
//   findSeniorExocetRowOriented,不在这个"没做的"名单里了)
//
// 目前实测:Golden Nugget、Easter Monster、AI Escargot(2006)、
// Inkala's Hardest/Everest(2012)四个已经被MSLS+动态强制链完整攻克。
// Fata Morgana(海市蜃楼)被这一版JE完整解出(第2步命中基础消除,
// 第3步命中IncompatiblePair+TargetPair+GeneralizedFish这条链,
// 20处消除),全程solveCount交叉核对真实解,没有任何一步划掉正确答案。
// 下面这段是加Senior Exocet之前的诊断记录,原样保留(历史记录,不是
// 当前状态)——当时的结论是"基础JE本身不是Platinum Blonde这一步真正
// 需要的技巧,下一步该评估Senior Exocet":在卡住的那一步,用独立重写
// 的验证脚本核对过全部22组候选基准,没有一组能通过appearing-times+
// locked member的合法性门槛(最接近的一组4个候选数字里,2个干净通过、
// 2个差一点点),不是escalation子技巧没接全的问题——这些子技巧全部
// 要求先有一个通过门槛的合法基准才能上场。
// 后续进展:Senior Exocet按这个诊断补上了(见下面),但SE同样对
// Platinum Blonde这一步无能为力(见findSeniorExocetRowOriented的
// 注释)——Platinum Blonde最终是靠动态强制链(DFC)解出的,不是卡在
// 这里没有下文,详见TECHNIQUE_CHAIN旁的DFC_BUDGET调整记录。
function findJuniorExocetRowOriented(grid, getCands) {
  const jeBands = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
  ];
  const jeBoxCols = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
  ];
  // 跟共享的candMaskAt/maskToDigits做的事完全一样,这里保留这两个
  // 本地别名不改名字(整个函数内部几十处调用都用的这两个名字),但
  // 委托给共享实现——candMaskAt对已经带.mask的getCands是O(1)读取,
  // 比这里原来的逐个候选数组重新OR一遍快。
  function jeDigitsMask(r, c) {
    if (grid[r][c] !== 0) return 0;
    return candMaskAt(getCands, r, c);
  }
  function jeDigitsFromMask(mask) {
    return maskToDigits(mask);
  }

  for (const band of jeBands) {
    for (let baseBoxIdx = 0; baseBoxIdx < 3; baseBoxIdx++) {
      const baseCols = jeBoxCols[baseBoxIdx];
      for (const baseRow of band) {
        const otherRows = band.filter((r) => r !== baseRow);
        const colPairs = [
          [baseCols[0], baseCols[1], baseCols[2]],
          [baseCols[0], baseCols[2], baseCols[1]],
          [baseCols[1], baseCols[2], baseCols[0]],
        ];
        for (const [bc1, bc2, clbCol] of colPairs) {
          if (grid[baseRow][bc1] !== 0 || grid[baseRow][bc2] !== 0) continue;
          const baseCandMask = jeDigitsMask(baseRow, bc1) | jeDigitsMask(baseRow, bc2);
          const baseSize = countBits(baseCandMask);
          // 候选数至少要2个才谈得上"基准数字之间的竞争",1个是退化
          // 情况(等价于普通唯一余数,轮不到JE出场)。上限不设硬性限制——
          // 下面新换的合法性判定(移植自kyoyama-kazusa的C#参考实现)天生
          // 不关心候选数个数,不需要再靠"恰好3个"这道闸门兜底。
          if (baseSize < 2) continue;

          const remainingBoxes = [0, 1, 2].filter((i) => i !== baseBoxIdx);
          for (const [t1BoxIdx, t2BoxIdx] of [
            [remainingBoxes[0], remainingBoxes[1]],
            [remainingBoxes[1], remainingBoxes[0]],
          ]) {
            const t1Cols = jeBoxCols[t1BoxIdx],
              t2Cols = jeBoxCols[t2BoxIdx];
            for (const t1Col of t1Cols)
              for (const t1Row of otherRows) {
                if (grid[t1Row][t1Col] !== 0) continue;
                const t1CandMask = jeDigitsMask(t1Row, t1Col);
                // 伴随格:跟目标格同宫、另一行、同列。允许已解出(给定或
                // 已填值)——已解出反而是更强的证据,只要不是基准数字就行。
                const c1Row = otherRows.find((r) => r !== t1Row);
                if (grid[c1Row][t1Col] !== 0) {
                  if (baseCandMask & (1 << (grid[c1Row][t1Col] - 1))) continue;
                } else {
                  const c1CandMask = jeDigitsMask(c1Row, t1Col);
                  if ((c1CandMask & baseCandMask) !== 0) continue;
                }

                for (const t2Col of t2Cols)
                  for (const t2Row of otherRows) {
                    if (grid[t2Row][t2Col] !== 0) continue;
                    const t2CandMask = jeDigitsMask(t2Row, t2Col);
                    const c2Row = otherRows.find((r) => r !== t2Row);
                    if (grid[c2Row][t2Col] !== 0) {
                      if (baseCandMask & (1 << (grid[c2Row][t2Col] - 1))) continue;
                    } else {
                      const c2CandMask = jeDigitsMask(c2Row, t2Col);
                      if ((c2CandMask & baseCandMask) !== 0) continue;
                    }

                    // 镜像格:交叉引用——T1的镜像节点在T2的宫/T2的行/
                    // 另外2列,T2的镜像节点在T1的宫/T1的行/另外2列(这个
                    // 交叉关系是Document 2第87段明确写的,不是自我对照,
                    // 之前走过一次自我对照的弯路,已经修正)。同样允许
                    // 已解出。
                    const mirror1Cells = t2Cols.filter((c) => c !== t2Col).map((c) => [t2Row, c]);
                    const mirror2Cells = t1Cols.filter((c) => c !== t1Col).map((c) => [t1Row, c]);
                    function jeCellMaskIncludingSolved(r, c) {
                      if (grid[r][c] !== 0) return 1 << (grid[r][c] - 1);
                      return jeDigitsMask(r, c);
                    }
                    const mirror1Masks = mirror1Cells.map(([r, c]) => jeCellMaskIncludingSolved(r, c));
                    const mirror2Masks = mirror2Cells.map(([r, c]) => jeCellMaskIncludingSolved(r, c));
                    const mirror1Union = mirror1Masks[0] | mirror1Masks[1];
                    const mirror2Union = mirror2Masks[0] | mirror2Masks[1];

                    // 条件3(目标格候选覆盖基准候选)和条件5(镜像节点覆盖
                    // 目标格可能持有的基准数字)故意不在这里检查——用完整
                    // 的baseCandMask检查太早,会被注定要被不相容判定排除
                    // 掉的数字错误地卡死整个组合。挪到下面数字精简完之后,
                    // 用activeMask重新检查。

                    const sCols = [clbCol, t1Col, t2Col];
                    const otherBands = jeBands.filter((b) => b !== band);
                    const crosslineCells = [];
                    for (const ob of otherBands) for (const r of ob) for (const c of sCols) crosslineCells.push([r, c]);

                    // 以下几个函数移植自kyoyama-kazusa的C#参考实现
                    // (ExocetStepSearcher.cs的AppearingTimesOf/IsExactAppearingTimesOf/
                    // GetLockedMembers),取代了之前自制的needsCheck/coverHouseCount/
                    // incompatible那一套启发式——那套只在3个基准候选数时勉强够用,
                    // 换成这套之后不再关心候选数个数,baseSize的硬性限制已经撤掉。
                    function jeCellsSeeEachOther(cells) {
                      for (let i = 0; i < cells.length; i++)
                        for (let j = i + 1; j < cells.length; j++) {
                          const [r1, c1] = cells[i],
                            [r2, c2] = cells[j];
                          if (r1 === r2 || c1 === c2 || boxIndex(r1, c1) === boxIndex(r2, c2)) return true;
                        }
                      return false;
                    }
                    function jePeersOf(r, c) {
                      const peers = [];
                      const seen = new Set();
                      const add = (rr, cc) => {
                        if (rr === r && cc === c) return;
                        const k = rr * 9 + cc;
                        if (!seen.has(k)) {
                          seen.add(k);
                          peers.push([rr, cc]);
                        }
                      };
                      for (let i = 0; i < 9; i++) {
                        add(r, i);
                        add(i, c);
                      }
                      const br = Math.floor(r / 3) * 3,
                        bc0 = Math.floor(c / 3) * 3;
                      for (let dr = 0; dr < 3; dr++) for (let dc = 0; dc < 3; dc++) add(br + dr, bc0 + dc);
                      return peers;
                    }
                    function jeCellsOfRow(r) {
                      return Array.from({ length: 9 }, (_, c) => [r, c]);
                    }
                    function jeCellsOfCol(c) {
                      return Array.from({ length: 9 }, (_, r) => [r, c]);
                    }
                    function jeCellsOfBox(boxIdx) {
                      const br = Math.floor(boxIdx / 3) * 3,
                        bc0 = (boxIdx % 3) * 3;
                      const cells = [];
                      for (let dr = 0; dr < 3; dr++) for (let dc = 0; dc < 3; dc++) cells.push([br + dr, bc0 + dc]);
                      return cells;
                    }
                    // 判定数字d在cellList这个区域内,是否"恰好需要limitCount个
                    // 互不相邻的格子才能覆盖它在这个区域里的全部候选位置"——
                    // 对应C#源码的IsExactAppearingTimesOf。cross-line恰好18格
                    // (2个宫带×3个相关列),标准JE的limitCount固定是2,不随基准
                    // 候选数个数变化。
                    function jeIsExactAppearingTimesOf(digit, cellList, limitCount) {
                      const digitBit = 1 << (digit - 1);
                      const activeCells = cellList.filter(([r, c]) => grid[r][c] === 0 && jeDigitsMask(r, c) & digitBit);
                      const inactiveCount = cellList.filter(([r, c]) => grid[r][c] === digit).length;
                      if (activeCells.length === 0) return limitCount === inactiveCount;
                      const activeKeys = activeCells.map(([r, c]) => r * 9 + c);
                      function combinations(arr, k) {
                        const result = [],
                          combo = [];
                        (function backtrack(start) {
                          if (combo.length === k) {
                            result.push(combo.slice());
                            return;
                          }
                          for (let i = start; i < arr.length; i++) {
                            combo.push(arr[i]);
                            backtrack(i + 1);
                            combo.pop();
                          }
                        })(0);
                        return result;
                      }
                      // 上界是3不是9:基础JE的cross-line固定"2个宫带×3列"
                      // (18格),同一列的6个格子两两同宫或同列、必然互相能
                      // 看见,不同列的格子只要同行也能看见——这是个行×列的
                      // 二分结构,互不相邻的最大集合规模不可能超过列数(3)。
                      // C#原版这里写的9是给复杂变体的通用cross-line size用的,
                      // 基础JE场景照抄会把组合搜索空间放大到不必要的规模。
                      for (let i = Math.min(3, activeCells.length); i >= 1; i--) {
                        for (const combo of combinations(activeCells, i)) {
                          if (jeCellsSeeEachOther(combo)) continue;
                          const covered = new Set();
                          for (const [r, c] of combo) {
                            covered.add(r * 9 + c);
                            for (const [pr, pc] of jePeersOf(r, c)) covered.add(pr * 9 + pc);
                          }
                          if (activeKeys.every((k) => covered.has(k))) return i + inactiveCount === limitCount;
                        }
                      }
                      return false;
                    }
                    // locked member豁免:如果数字d在某个目标宫里(排除目标格
                    // 本身),所有候选位置都恰好落在基准行上,即使不满足上面的
                    // appearing-times规则也算合法——对应C#的GetLockedMembers。
                    function jeCheckLockedMember(digit, boxRows, boxCols, excludeR, excludeC) {
                      let found = false;
                      const digitBit = 1 << (digit - 1);
                      for (const r of boxRows)
                        for (const c of boxCols) {
                          if (r === excludeR && c === excludeC) continue;
                          if (grid[r][c] === 0 && jeDigitsMask(r, c) & digitBit) {
                            found = true;
                            if (r !== baseRow) return false;
                          }
                        }
                      return found;
                    }
                    // 现在已经接入下面的门槛判定,作为appearing-times规则的
                    // 豁免路径。注意:这不是C#里独立的CheckJuniorLockedMember
                    // (那是locked member digit存在时走的一条完全不同的
                    // escalation路径,产出的消除逻辑也不一样,这一版还没实现)——
                    // 这里只是把locked member当成"基准合法性判定"里的豁免条件
                    // 之一,跟原本的Rule3/4基础消除走同一套流程。

                    // 保守版:先只接受"全部基准候选数都通过appearing-times规则"
                    // 的组合，不实现locked member救援分支(对应C#里独立的
                    // CheckJuniorLockedMember,这一版还没吃透，先不接，避免
                    // 又引入新错误)。这是全有全无的门槛判定，不是逐个筛选——
                    // 只要有1个数字appearing-times和locked member两条路
                    // 都过不了，整个基准组合就判无效、直接放弃；只要每个
                    // 数字都能靠其中一条路过关，全部数字原样保留，不能
                    // 只把通不过的数字摘掉、留下能通过的继续用(这是上一版
                    // 的语义错误，已经被validate.js的正确性交叉核对抓出来了:
                    // 6个候选数字的组合被错误收窄成1个，之后拿这个错误结果
                    // 做消除，把Platinum Blonde的真实解当假的划掉了)。
                    let activeBaseDigits = jeDigitsFromMask(baseCandMask);
                    const allDigitsValid = activeBaseDigits.every(
                      (d) =>
                        jeIsExactAppearingTimesOf(d, crosslineCells, 2) ||
                        jeCheckLockedMember(d, band, t1Cols, t1Row, t1Col) ||
                        jeCheckLockedMember(d, band, t2Cols, t2Row, t2Col)
                    );
                    if (!allDigitsValid) continue;

                    // Rule2(92):基准候选数如果没法同时在某个目标格+它的
                    // 镜像节点里为真,则整体排除
                    const rule2Excluded = activeBaseDigits.filter((d) => {
                      const bit = 1 << (d - 1);
                      const okViaT1 = t1CandMask & bit && mirror1Union & bit;
                      const okViaT2 = t2CandMask & bit && mirror2Union & bit;
                      return !okViaT1 && !okViaT2;
                    });
                    activeBaseDigits = activeBaseDigits.filter((d) => !rule2Excluded.includes(d));
                    if (activeBaseDigits.length < 1) continue;

                    const activeMask = activeBaseDigits.reduce((m, d) => m | (1 << (d - 1)), 0);

                    // 移植自C#参考实现的CheckIncompatiblePair,作为escalation
                    // 子技巧接在下面。前提:远端4宫(跟base既不同band又不同
                    // 列组的4个宫)跟cross-line的交集(t1Col/t2Col这两列×
                    // 另外2个band=12格)里,要恰好有4个已解出的格子,正好摆成
                    // 2行2列的方形。再从X区域(16格)里按对角线取已解出数字的
                    // 交集,两条对角线各自的数字集合互相标记为不相容,最后拿
                    // 基准格候选数字比对:如果某数字的不相容集合恰好等于
                    // 搭档格子除它以外的全部候选,这个数字就能被排除。
                    // 移植自C#的CheckMirrorSync。前提跟IncompatiblePair一样:
                    // 基准数字不能已经作为解出的值出现在cross-line里。核心
                    // 想法:t1配对t2的镜像格,t2配对t1的镜像格——如果某一侧
                    // 镜像格只剩1个空格,且它的基准候选数字集合(跟基准数字
                    // 的交集)不完整,那对面的目标格就要跟这个不完整集合同步
                    // (删掉镜像格里没有的数字),镜像格自己也反过来跟目标格
                    // 同步。
                    function jeCheckMirrorSync() {
                      for (const d of activeBaseDigits) {
                        for (const [r, c] of crosslineCells) {
                          if (grid[r][c] === d) return [];
                        }
                      }
                      const conclusions = [];
                      for (const [targetR, targetC, otherMirrorCells] of [
                        [t1Row, t1Col, mirror2Cells],
                        [t2Row, t2Col, mirror1Cells],
                      ]) {
                        const emptyMirror = otherMirrorCells.filter(([r, c]) => grid[r][c] === 0);
                        if (emptyMirror.length !== 1) continue;
                        const [mr, mc] = emptyMirror[0];
                        const mirrorBaseMask = jeDigitsMask(mr, mc) & baseCandMask;
                        if (mirrorBaseMask === baseCandMask) continue;
                        if (grid[targetR][targetC] !== 0) continue;
                        const targetMask = jeDigitsMask(targetR, targetC);
                        const digitsToSyncOut = jeDigitsFromMask(targetMask & ~mirrorBaseMask);
                        if (digitsToSyncOut.length === 0) continue;
                        for (const d of digitsToSyncOut) conclusions.push({ r: targetR, c: targetC, digit: d });
                        let lastMask = (targetMask & baseCandMask) & ~digitsToSyncOut.reduce((m, d) => m | (1 << (d - 1)), 0);
                        for (const d of getCands(mr, mc)) if (!(lastMask & (1 << (d - 1)))) conclusions.push({ r: mr, c: mc, digit: d });
                      }
                      return conclusions;
                    }

                    // 移植自C#的CheckMirrorConjugatePair。对t1/t2各自的镜像格
                    // (2格,同一行/同一宫):挑出还空着的那些,在它们共享的
                    // house(行或宫,如果只剩1格空着就连列也算)里,找一个
                    // 数字d——如果这个house里所有带候选d的格子都恰好落在
                    // 这些空镜像格里(d被锁死在这里),那这些镜像格里除了d和
                    // 基准数字之外的候选就都能排除。
                    function jeCheckMirrorConjugatePair() {
                      const conclusions = [];
                      for (const [targetR, targetC, mirrorCells] of [
                        [t1Row, t1Col, mirror1Cells],
                        [t2Row, t2Col, mirror2Cells],
                      ]) {
                        const emptyMirrors = mirrorCells.filter(([r, c]) => grid[r][c] === 0);
                        if (emptyMirrors.length === 0) continue;
                        const houses = [];
                        if (emptyMirrors.length === 2) {
                          const [[r1, c1]] = emptyMirrors;
                          houses.push(jeCellsOfRow(r1));
                          if (boxIndex(emptyMirrors[0][0], emptyMirrors[0][1]) === boxIndex(emptyMirrors[1][0], emptyMirrors[1][1])) {
                            houses.push(jeCellsOfBox(boxIndex(r1, c1)));
                          }
                        } else {
                          const [r, c] = emptyMirrors[0];
                          houses.push(jeCellsOfRow(r), jeCellsOfCol(c), jeCellsOfBox(boxIndex(r, c)));
                        }
                        let otherDigitsMask = 0;
                        for (const [r, c] of emptyMirrors) otherDigitsMask |= jeDigitsMask(r, c);
                        for (const house of houses) {
                          for (const d of jeDigitsFromMask(otherDigitsMask)) {
                            const cellsWithDigit = house.filter(
                              ([r, c]) => !(r === targetR && c === targetC) && grid[r][c] === 0 && jeDigitsMask(r, c) & (1 << (d - 1))
                            );
                            if (cellsWithDigit.length === 0) continue;
                            const allInMirrors = cellsWithDigit.every(([r, c]) => emptyMirrors.some(([mr, mc]) => mr === r && mc === c));
                            if (!allInMirrors) continue;
                            for (const [er, ec] of emptyMirrors) {
                              const mask = jeDigitsMask(er, ec) & ~baseCandMask & ~(1 << (d - 1));
                              for (const ed of jeDigitsFromMask(mask)) conclusions.push({ r: er, c: ec, digit: ed });
                            }
                          }
                        }
                      }
                      return conclusions;
                    }

                    // 移植自C#的CheckAdjacentTarget。t1的镜像格如果只剩1个
                    // 空格:这个镜像格里非基准数字的候选直接排除;它里面
                    // 属于基准数字的那部分,反过来同步给t2(t2里不在这个
                    // 子集里的候选也排除)。t2同理对t1。
                    function jeCheckAdjacentTarget() {
                      const conclusions = [];
                      for (const [otherTargetR, otherTargetC, mirrorCells] of [
                        [t2Row, t2Col, mirror1Cells],
                        [t1Row, t1Col, mirror2Cells],
                      ]) {
                        const emptyMirrors = mirrorCells.filter(([r, c]) => grid[r][c] === 0);
                        if (emptyMirrors.length !== 1) continue;
                        const [mr, mc] = emptyMirrors[0];
                        const mirrorMask = jeDigitsMask(mr, mc);
                        const elimFromMirror = jeDigitsFromMask(mirrorMask & ~baseCandMask);
                        const digitsInBaseMask = mirrorMask & baseCandMask;
                        for (const d of elimFromMirror) conclusions.push({ r: mr, c: mc, digit: d });
                        if (grid[otherTargetR][otherTargetC] !== 0) continue;
                        for (const d of jeDigitsFromMask(jeDigitsMask(otherTargetR, otherTargetC) & ~digitsInBaseMask)) conclusions.push({ r: otherTargetR, c: otherTargetC, digit: d });
                      }
                      return conclusions;
                    }

                    function jeCheckIncompatiblePair() {
                      for (const d of activeBaseDigits) {
                        for (const [r, c] of crosslineCells) {
                          if (grid[r][c] === d) return null;
                        }
                      }

                      const intersectValueCells = [];
                      for (const ob of otherBands)
                        for (const r of ob) {
                          if (grid[r][t1Col] !== 0) intersectValueCells.push([r, t1Col]);
                          if (grid[r][t2Col] !== 0) intersectValueCells.push([r, t2Col]);
                        }
                      if (intersectValueCells.length !== 4) return null;
                      const valueRows = [...new Set(intersectValueCells.map(([r]) => r))];
                      const valueCols = [...new Set(intersectValueCells.map(([, c]) => c))];
                      if (valueRows.length !== 2 || valueCols.length !== 2) return null;

                      // X区域(16格),按band分组,方便按对角线配对
                      const bandXCells = otherBands.map((ob) =>
                        ob
                          .filter((r) => !valueRows.includes(r))
                          .flatMap((r) => [
                            ...t1Cols.filter((c) => c !== t1Col).map((c) => [r, c]),
                            ...t2Cols.filter((c) => c !== t2Col).map((c) => [r, c]),
                          ])
                      );
                      function valuesInRegion(bandIdx, colGroup) {
                        let mask = 0;
                        for (const [r, c] of bandXCells[bandIdx]) {
                          if (colGroup.includes(c) && grid[r][c] !== 0) mask |= 1 << (grid[r][c] - 1);
                        }
                        return mask;
                      }
                      // 两条对角线:(band0,t1Cols)x(band1,t2Cols) 和
                      // (band0,t2Cols)x(band1,t1Cols)
                      const diag1 = valuesInRegion(0, t1Cols) & valuesInRegion(1, t2Cols);
                      const diag2 = valuesInRegion(0, t2Cols) & valuesInRegion(1, t1Cols);
                      if (diag1 === 0 || diag2 === 0) return null;

                      const incompatibleMask = {};
                      for (const d1 of jeDigitsFromMask(diag1))
                        for (const d2 of jeDigitsFromMask(diag2)) {
                          incompatibleMask[d1] = (incompatibleMask[d1] || 0) | (1 << (d2 - 1));
                          incompatibleMask[d2] = (incompatibleMask[d2] || 0) | (1 << (d1 - 1));
                        }

                      const conclusions = [];
                      for (const [elimCell, otherCell] of [
                        [
                          [baseRow, bc1],
                          [baseRow, bc2],
                        ],
                        [
                          [baseRow, bc2],
                          [baseRow, bc1],
                        ],
                      ]) {
                        const otherMask = jeDigitsMask(otherCell[0], otherCell[1]);
                        for (const elimDigit of getCands(elimCell[0], elimCell[1])) {
                          const expectMask = otherMask & ~(1 << (elimDigit - 1));
                          if ((incompatibleMask[elimDigit] || 0) === expectMask) {
                            conclusions.push({ r: elimCell[0], c: elimCell[1], digit: elimDigit });
                          }
                        }
                      }
                      // 推导inferredTargetPairMask:如果上面的消除,恰好让
                      // 基准候选数字缩减到只剩2个(每个被消除的数字都是从
                      // base1和base2两个格子同时被划掉的),那这2个数字就是
                      // "分布不相交对"(distributed disjointed pair)——
                      // 这个更强的结论会喂给下面的TargetPair/GeneralizedFish。
                      let inferredTargetPairMask = 0;
                      if (conclusions.length > 0) {
                        let lastMask = baseCandMask;
                        let targetDigitsMask = 0;
                        for (const [r, c] of [
                          [t1Row, t1Col],
                          [t2Row, t2Col],
                        ]) {
                          if (grid[r][c] === 0) targetDigitsMask |= jeDigitsMask(r, c);
                        }
                        for (const d of jeDigitsFromMask(targetDigitsMask)) {
                          const elimCellsForD = conclusions.filter((c) => c.digit === d).map((c) => `${c.r},${c.c}`);
                          const bothBaseCells = elimCellsForD.includes(`${baseRow},${bc1}`) && elimCellsForD.includes(`${baseRow},${bc2}`) && elimCellsForD.length === 2;
                          if (bothBaseCells) lastMask &= ~(1 << (d - 1));
                        }
                        if (countBits(lastMask) === 2) inferredTargetPairMask = lastMask;
                      }
                      return { conclusions, inferredTargetPairMask };
                    }

                    // 移植自C#的CheckTargetPair:如果inferredTargetPairMask
                    // 已经推出了确定的2个数字,基准格+目标格里任何不是这2个
                    // 数字的候选都为假;这2个数字反过来在基准格/目标格的
                    // 公共可见格里也为假(因为已经被这2个格子瓜分了)。
                    function jeCheckTargetPair(pairMask) {
                      if (pairMask === 0) return [];
                      const conclusions = [];
                      for (const [r, c] of [
                        [baseRow, bc1],
                        [baseRow, bc2],
                        [t1Row, t1Col],
                        [t2Row, t2Col],
                      ]) {
                        if (grid[r][c] !== 0) continue;
                        for (const d of jeDigitsFromMask(jeDigitsMask(r, c) & ~pairMask)) conclusions.push({ r, c, digit: d });
                      }
                      function commonPeers(cellA, cellB) {
                        const peersA = new Set(jePeersOf(cellA[0], cellA[1]).map(([r, c]) => `${r},${c}`));
                        return jePeersOf(cellB[0], cellB[1]).filter(([r, c]) => peersA.has(`${r},${c}`));
                      }
                      for (const [r, c] of commonPeers([t1Row, t1Col], [t2Row, t2Col])) {
                        if (grid[r][c] !== 0) continue;
                        for (const d of jeDigitsFromMask(jeDigitsMask(r, c) & pairMask)) conclusions.push({ r, c, digit: d });
                      }
                      for (const [r, c] of commonPeers([baseRow, bc1], [baseRow, bc2])) {
                        if (grid[r][c] !== 0) continue;
                        for (const d of jeDigitsFromMask(jeDigitsMask(r, c) & pairMask)) conclusions.push({ r, c, digit: d });
                      }
                      return conclusions;
                    }

                    // 移植自C#的CheckGeneralizedFish:inferredTargetPairMask
                    // 那2个数字,如果在cross-line的某一列里还有候选位置,
                    // 那这一列里base所在band的部分(也就是这一列除了cross-line
                    // 之外剩下的部分)可以把这2个数字都排除掉——鱼式结构。
                    // 注意:band里这一列可能正好穿过t1或t2目标格本身
                    // (target cell本来就在base所在的band里,只是不同列/宫)，
                    // 这两个格子是这2个数字"应该去的地方"，不能被当成消除
                    // 对象——这个排除条件是被validate.js的正确性交叉核对
                    // 抓出来的:漏排除导致Fata Morgana的真实解被错误划掉。
                    function jeCheckGeneralizedFish(pairMask) {
                      if (pairMask === 0) return [];
                      const conclusions = [];
                      for (const col of sCols) {
                        const hasIntersect = crosslineCells.some(
                          ([r, c]) => c === col && grid[r][c] === 0 && jeDigitsMask(r, c) & pairMask
                        );
                        if (!hasIntersect) continue;
                        for (const r of band) {
                          if (grid[r][col] !== 0) continue;
                          if (r === t1Row && col === t1Col) continue;
                          if (r === t2Row && col === t2Col) continue;
                          for (const d of jeDigitsFromMask(jeDigitsMask(r, col) & pairMask)) conclusions.push({ r, c: col, digit: d });
                        }
                      }
                      return conclusions;
                    }

                    // 移植自C#的CheckMirrorAlmostHiddenSet,escalation链最后
                    // 一环。核心想法:target的镜像格里还空着的那些,如果能跟
                    // 同house(行/列/宫)里另外几个空格拼出一个"几乎隐藏集"——
                    // size个非基准数字,在这个house里(排除target格本身)
                    // 恰好只出现在"镜像空格+额外挑出的size-1个格子"这些格子
                    // 里——那额外挑出的那几个格子,除了这size个数字之外的
                    // 候选就都能排除(注意:排除范围只包括"额外挑出的格子",
                    // 不包括镜像格本身,这点跟C#原版一致)。
                    function jeCheckMirrorAlmostHiddenSet() {
                      const conclusions = [];
                      function combinations(arr, k) {
                        const res = [],
                          cur = [];
                        (function bt(s) {
                          if (cur.length === k) {
                            res.push(cur.slice());
                            return;
                          }
                          for (let i = s; i < arr.length; i++) {
                            cur.push(arr[i]);
                            bt(i + 1);
                            cur.pop();
                          }
                        })(0);
                        return res;
                      }
                      for (const [targetR, targetC, mirrorCells] of [
                        [t1Row, t1Col, mirror1Cells],
                        [t2Row, t2Col, mirror2Cells],
                      ]) {
                        const segment = [[targetR, targetC], ...mirrorCells];
                        const segmentKeys = new Set(segment.map(([r, c]) => `${r},${c}`));
                        const mirrorEmptyCells = mirrorCells.filter(([r, c]) => grid[r][c] === 0);
                        if (mirrorEmptyCells.length === 0) continue;

                        const houses = [];
                        if (mirrorEmptyCells.length === 2) {
                          const [[r1, c1], [r2, c2]] = mirrorEmptyCells;
                          houses.push(jeCellsOfRow(r1));
                          if (boxIndex(r1, c1) === boxIndex(r2, c2)) houses.push(jeCellsOfBox(boxIndex(r1, c1)));
                        } else {
                          const [r, c] = mirrorEmptyCells[0];
                          houses.push(jeCellsOfRow(r), jeCellsOfCol(c), jeCellsOfBox(boxIndex(r, c)));
                        }

                        for (const house of houses) {
                          const otherCells = house.filter(([r, c]) => grid[r][c] === 0 && !segmentKeys.has(`${r},${c}`));
                          if (otherCells.length < 2) continue;

                          for (let size = 2; size <= otherCells.length - 1; size++) {
                            for (const extraCells of combinations(otherCells, size - 1)) {
                              const ahsCells = [...extraCells, ...mirrorEmptyCells];
                              let ahsDigitsMask = 0;
                              for (const [r, c] of ahsCells) ahsDigitsMask |= jeDigitsMask(r, c);
                              ahsDigitsMask &= ~baseCandMask;
                              const ahsDigits = jeDigitsFromMask(ahsDigitsMask);
                              if (ahsDigits.length < size) continue;

                              for (const digitsMaskGroup of combinations(ahsDigits, size)) {
                                const extraDigitsMask = digitsMaskGroup.reduce((m, d) => m | (1 << (d - 1)), 0);
                                const coverCells = house.filter(([r, c]) => {
                                  if (r === targetR && c === targetC) return false;
                                  if (grid[r][c] !== 0) return false;
                                  return jeDigitsMask(r, c) & extraDigitsMask;
                                });
                                const ahsKeys = new Set(ahsCells.map(([r, c]) => `${r},${c}`));
                                if (coverCells.length !== ahsKeys.size) continue;
                                if (!coverCells.every(([r, c]) => ahsKeys.has(`${r},${c}`))) continue;

                                for (const [r, c] of extraCells) {
                                  for (const d of jeDigitsFromMask(jeDigitsMask(r, c) & ~extraDigitsMask)) {
                                    conclusions.push({ r, c, digit: d });
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                      return conclusions;
                    }

                    // 用精简后的activeMask重新检查条件3/5
                    const baseDigitsInT1 = t1CandMask & activeMask;
                    const baseDigitsInT2 = t2CandMask & activeMask;
                    if ((mirror1Union & baseDigitsInT1) !== baseDigitsInT1) continue;
                    if ((mirror2Union & baseDigitsInT2) !== baseDigitsInT2) continue;

                      if (t2Rem.length === 1 && t1Rem.includes(t2Rem[0])) eliminations.push({ r: t1Row, c: t1Col, digit: t2Rem[0] });

                      subtype,
                      patternCells: [

                        [baseRow, bc2],
                        [t1Row, t1Col],
                        [t2Row, t2Col],
                        [c1Row, t1Col],
                        [c2Row, t2Col],

                        ...mirror2Cells,

                      context: {

                          [baseRow, bc2],

                          [t2Row, t2Col],

// 消除类结论里,任何一条如果会把某个格子的候选数削成0,这条结论在

// 那唯一剩下的必然就是答案,没有"消除"的空间。JE/SE的模式识别本身
// 没有在提议消除前查这一点:盘面被削到接近全员单候选时(典型触发

// 高度收敛),真实撞见过它们把某个格子仅剩的、也是正确答案的那个

// 消掉两个数字(而它当前恰好就只剩这两个候选),每一条单独看"候选数
// 个数>1"都会通过检查(因为削零前个数确实是2),但两条一起应用就会
// 把这格削成0——这是逐条判断版本测不出来的漏洞,只有把同一格的
// 消除合并起来看才发现得了。
//

// 交给排在后面的技巧继续处理——不尝试猜"这几条里留哪条、去掉哪条"
// 更安全,因为矛盾本身已经说明这个模式的推理链条在某处站不住脚,

  const t = Array.from({ length: 9 }, () => Array(9).fill(0));
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) t[c][r] = grid[r][c];

    ...colResult,
    patternCells: colResult.patternCells.map(swap),
    eliminations: colResult.eliminations.map((e) => ({ r: e.c, c: e.r, digit: e.digit })),
    context: {
      ...colResult.context,
      orientation: "col",
      base: colResult.context.base.map(swap),
      targets: colResult.context.targets.map(swap),

// ==== Senior Exocet(SE)====
//

// 分岔点在C#参考实现CollectSeniorExocets里的这一条判断:
//   targetCells.Count == 1 → 走SE
//   targetCells.Count == 2 且两个目标格不同宫 → 走JE(我们已经实现的)

// 场景——另一边找不到目标格时,第二个"目标"角色由cross-line内部某个
// 空格(endo-target cell)代打,而不是外部固定的一个格子。

//

// (Rule3/4,target+endoTarget当成一对目标格处理)也是复用JE同款逻辑。
//

//   二选一过关,过关方式全是appearing-times时走普通Rule3/4消除。
// - CheckSeniorLockedMember式消除(case0内,恰好1个数字靠locked member
//   过关时):endo-target格里(基准数字减这个数字)为假、target格里
//   非基准数字为假,外加"自相残杀规则"(这个数字如果在区域里连

//   在我们的搜索循环里没有直接对应物,没有把握就没有照抄,改成了
//   用我们自己已经验证过的locked member判定结果来触发——语义上是
//   等价的想法(这个数字靠locked member而不是appearing-times过关),
//   但不保证跟C#原版的触发时机完全一致。
// - CheckSeniorTrueBase(case1,恰好1个基准数字已经在区域里解出了值):

// 都是2-3个数字同时不过关,没有"差一点点"的情况——不是还差最后一块

// 推不动:Platinum Blonde现在是能完整解出的,SE找不到立足点之后交给

function findSeniorExocetRowOriented(grid, getCands) {

    [3, 4, 5],
    [6, 7, 8],

    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

        const [r1, c1] = cells[i],
          [r2, c2] = cells[j];
        if (r1 === r2 || c1 === c2 || boxIndex(r1, c1) === boxIndex(r2, c2)) return true;

    const inactiveCount = cellList.filter(([r, c]) => grid[r][c] === digit).length;

  // 就是这样(activeCells为空时循环直接跳过,返回0,不是inactiveCount)。

                    for (const [r, c] of [
