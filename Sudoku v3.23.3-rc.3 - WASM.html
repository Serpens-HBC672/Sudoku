/* ============================================================
   纯 JS 应用层——状态、交互逻辑、渲染。
   算法部分(DLX求解器/生成器/提示引擎/SEED_17题库)在这个文件之前,
   是从 React 版本原样搬过来的,完全没有改动。
   ============================================================ */

const ICONS = { refresh: "↻" };

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function toKebab(s) {
  return s.replace(/([A-Z])/g, "-$1").toLowerCase();
}
function styleStr(obj) {
  return Object.entries(obj)
    .map(([k, v]) => `${toKebab(k)}:${v}`)
    .join(";");
}

/* ------------------------------ 状态 ------------------------------ */

const state = {
  mode: "play", // 'play' | 'create' | 'settings'
  // 主题:初始值直接读</head>里那段防闪烁内联脚本已经写好的
  // data-theme属性,不在这里重新判断一遍——避免两处独立判断逻辑
  // 万一走岔,状态跟DOM实际呈现的不一致。
  // 加typeof document !== "undefined"这个guard不是多余的防御性
  // 编程——这份脚本会被getDifficultyWorker()原封不动地整份塞进
  // Worker里重新执行一遍(见MAIN_SCRIPT_SOURCE),Worker里没有document,
  // 这一行原来没加guard的时候,Worker一执行到这里就直接抛异常,
  // 而self.onmessage是拼在MAIN_SCRIPT_SOURCE后面才赋值的——异常
  // 一炸,self.onmessage永远不会被注册,Worker创建出来之后对任何
  // postMessage都没有响应,提示/测难度/Auto模式/校验会全部卡在
  // "计算中"出不来。这是从暗色主题那一轮就带进来的问题,当时的
  // 验证全程在Node里跑(Node没有Worker,天然走不到这条路),一直
  // 没有真正跑过真机浏览器的Worker路径,所以没发现。
  theme: typeof document !== "undefined" ? document.documentElement.getAttribute("data-theme") || "light" : "light",
  // 主题圆形扩散动画进行中时置true,挡掉这期间的重复点击——不是
  // state.settings的一部分(不需要持久化,纯瞬时UI状态),跟
  // state.settingsUI.explainOpen是同一类东西。
  themeTransitionActive: false,
  selectedDifficulty: "medium",
  customClue: 30,
  showCandidates: false, // 候选数显示偏好,是全局的,不随生成新题重置
  settings: {
    // 提示/Auto模式优先用高级技巧:开着的时候,findNextStep按SE权重从
    // 高到低试(TECHNIQUE_CHAIN_DESC);关着(默认)就是原来的默认顺序
    // (TECHNIQUE_CHAIN本身)。「测难度」/「校验」永远不受这个开关
    // 影响,不管开关状态是什么,那两个入口调findNextStep永远不传
    // order参数。这是纯内存状态,刷新页面会重置回默认关闭,当前没有
    // 做localStorage持久化(这个app目前所有设置都不做跨会话持久化,
    // 保持一致,如果以后想要跨会话记住,需要另外讨论)。
    preferAdvancedHint: false,
    // 提示按钮列出全部可用技巧供选择:只影响手动点「提示」这一个入口,
    // 跟Auto模式、「测难度」/「校验」都无关。开着的时候,点「提示」
    // 不会直接给出/高亮某一步,而是先把当前盘面上能找到的全部技巧都
    // 扫一遍,列出技巧名字供选择,点某一个之后才高亮、才能用「揭晓
    // 数字」应用。跟preferAdvancedHint("反向遍历")互斥——原因不是
    // 两者同时生效在逻辑上有冲突(对Auto模式而言确实没有),而是两个
    // 开关都是围着"提示按钮该表现成什么样"转的,同时开着会让提示
    // 按钮的行为定义不清楚,所以干脆二选一。纯内存状态,不做持久化。
    listTechniquesOnHint: false,
    // 强制链/动态强制链(NishioChain/UnaryChain/CellForcingChain/
    // RegionForcingChain,及其Dynamic版本)是否展示详细推导步骤+
    // 完整视觉反馈:关(默认)就是现在这套行为,只有起点/结论的摘要
    // 文案,盘面上只高亮起点格子;开了之后,这几个技巧会在"已经确定
    // 有效"的那组假设上多重算一遍(开着记录),把逐步推导过程和用于
    // 画线的节点数据挂到finding上。同样是纯内存状态,不做持久化。
    showChainDetail: false,
    // 主题偏好是这个app第一个允许跨会话持久化的设置(经过讨论后的
    // 例外,不是随手加的)——用户对localStorage本来就抗拒,所以这里
    // 必须是自由选择:默认不记(rememberTheme=false),用户主动勾选
    // "记住我的选择"才会真的写localStorage,取消勾选立刻清掉已存的
    // 值,设置面板里还有一个独立的"清除本机存储"按钮兜底。初始值
    // 反映localStorage里现在到底有没有真的存了值,不是写死false。
    rememberTheme: (() => {
      try {
        const v = localStorage.getItem("sudoku-theme");
        return v === "dark" || v === "light";
      } catch (e) {
        return false;
      }
    })(),
    // Auto模式每步的总时长(毫秒),均分成两半:思考展示(显示这一步用
    // 了什么技巧、推理过程)/结果展示(技巧生效后的盘面)各占一半——
    // 跟做题/自建的其他设置一样是用户偏好,放在state.settings而不是
    // state.play.autoMode里,这样切换题目/开新局不会把这个偏好重置掉
    // (state.play每次开新题都会整个重建,state.settings不会)。
    // 上下限见AUTO_STEP_INTERVAL_MIN_MS/MAX_MS,同样纯内存,不做
    // 跨会话持久化。
    autoStepIntervalMs: 3000,
    // 性能监测:默认关闭。打开后,做题/自建的"测难度"/"校验"会额外
    // 报告这次计算实际花了多少时间——Worker可用时是实时刷新的,不可用
    // 时只在算完那一刻给一个总耗时(单线程环境里,主线程被同步计算
    // 整个占满,没有机会中途重绘,做不到实时,这是JS单线程模型本身
    // 决定的,不是没做全)。
    performanceMonitor: false,
    // 桌面端键盘快捷键的自定义额外按键:方向键(ArrowUp/Down/Left/
    // Right)和Backspace/Delete这几个固定按键永远生效,这里每个动作
    // 最多再加一个用户自选的"额外"按键(比如喜欢用WASD的话,up可以
    // 加"w")——是补充不是替换,自定义key永远不会覆盖/取消固定按键,
    // 就算自定义选得不顺手,可靠的默认操作方式也不会丢。null表示
    // 没设置额外按键。
    // 跟主题偏好一样是opt-in的跨会话持久化(默认不记),不是这个app
    // 唯一一个这么做的设置了,但道理相同:用户主动勾选"记住我的按键
    // 设置"才会真的写localStorage,取消勾选立刻清掉已存的值,设置
    // 面板里"清除本机存储"那个按钮也会一并清掉这一份。初始值反映
    // localStorage里现在到底有没有真的存了值,不是写死false/null。
    rememberKeyBindings: (() => {
      try {
        return !!localStorage.getItem("sudoku-key-bindings");
      } catch (e) {
        return false;
      }
    })(),
    keyBindings: (() => {
      const fallback = { up: null, down: null, left: null, right: null, erase: null };
      try {
        const raw = localStorage.getItem("sudoku-key-bindings");
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return { ...fallback, ...parsed };
      } catch (e) {
        return fallback;
      }
    })(),
  },
  // 设置面板里每条说明文字的展开/收起状态——故意不放进state.settings
  // (那是"设置"本身,这个是纯UI呈现状态),在设置模式内部随便切换别的
  // 开关都不会重置;但切到"做题"/"自建"再切回来,会重新变成全部收起
  // ——这个"忘记"是在mode-play-btn/mode-create-btn的点击处理里主动
  // 清空这个对象做到的,不是自动发生的。
  settingsUI: {
    explainOpen: {},
    // 键盘快捷键自定义:正在等待用户按下一个新按键时,这里记录是给
    // 哪个动作设置(up/down/left/right/erase),null表示当前没有在
    // 捕获状态。keyBindingMessage是冲突/成功提示文案,瞬时的,跟
    // explainOpen一样切出设置模式再切回来就清空,不需要持久化。
    capturingKeyFor: null,
    keyBindingMessage: "",
  },
  play: {
    difficulty: null,
    solution: null,
    given: null,
    grid: emptyGrid(),
    notes: makeEmptyNotes(),
    pencilMode: false, // 笔记编辑模式(只增),逐题重置(不像showCandidates是全局偏好)
    eraserMode: false, // 候选数橡皮模式(只减),跟pencilMode互斥,同一时刻最多开一个
    autoMode: {
      active: false,
      paused: false,
      // 展示上一步盘面的这段时间本来就是空闲的,趁这段时间在后台把
      // 下一步先算出来:applyPendingHint之后立刻调用
      // computeNextHintOrCorrection(不等待),把返回的Promise存这里;
      // 到下一次真的需要用的时候,大概率已经算完,直接用,不用再等。
      // 没有值代表还没开始预取(比如第一步,前面没有"展示阶段"可以
      // 用来预取)。
      prefetchPromise: null,
    }, // Auto模式:整体开关/是否暂停/每步间隔/下一步的预取Promise
    highlightDigit: null, // 选中某个已填的数(含已知数)后,高亮所有同数字
    selected: null,
    showSolution: false,
    pendingHint: null,
    // 「提示」列出全部技巧模式下,扫描出的完整命中列表(每项跟单个
    // pendingHint一样详细),用户还没点选具体某一项时存在这里;跟
    // pendingHint同一批地方失效——具体在哪些地方清,见
    // invalidateStaleHintChoices()。
    hintChoices: null,
    hintFilledCells: new Set(),
    note: { tone: "info", text: "选好难度后,生成一局数独开始解题吧。" },
    // 计时:不自动开始,点「开始挑战」才会真正起计时
    timerStarted: false,
    timerRunning: false,
    accumulatedMs: 0,
    runningSinceMs: null,
    // 撤销/重做:存{grid, notes}快照,每次生成新题都会清空
    history: [],
    future: [],
  },
  create: {
    grid: emptyGrid(),
    selected: null,
    validation: null,
    note: { tone: "info", text: "在格子里填入你想作为「已知数」的数字,留下其余空格,完成后点「校验」。" },
    history: [],
    future: [],
  },
};

/* ------------------------------ 业务逻辑(对应 React 版本的各个 handler) ------------------------------ */

function freshPlayExtras() {
  return {
    timerStarted: false,
    timerRunning: false,
    accumulatedMs: 0,
    runningSinceMs: null,
    history: [],
    future: [],
    notes: makeEmptyNotes(),
    pencilMode: false,
    eraserMode: false,
    autoMode: { active: false, paused: false, prefetchPromise: null },
    highlightDigit: null,
    hintComputing: false, // Worker正在算下一步提示时为true,用来给"提示"按钮显示"计算中"、并且暂时禁用它防止重复发起请求
    hintChoices: null, // 见顶层state.play里pendingHint旁边的注释
    soundnessError: null, // 消除/填入正确性检查失败时,存放报错文本;非null时render()会弹出全屏警示层
  };
}

function handleGenerate(diff) {
  hintRequestSeq++; // 开新题,任何还没返回的旧提示请求都不再适用
  stopTimerTicker();
  clearAutoModeTimeout();
  const { puzzle, solution, clueCount } = generatePuzzle(diff);
  state.play = {
    difficulty: diff,
    solution,
    given: puzzle.map((row) => row.map((v) => v !== 0)),
    grid: cloneGrid(puzzle),
    selected: null,
    showSolution: false,
    pendingHint: null,
    hintFilledCells: new Set(),
    note: {
      tone: "info",
      text: `已生成一局「${DIFFICULTY_CONFIG[diff].label}」数独,留了 ${clueCount} 个已知数,开始吧。`,
    },
    ...freshPlayExtras(),
  };
  render();
}

function handleGenerateCustom() {
  hintRequestSeq++; // 开新题,任何还没返回的旧提示请求都不再适用
  stopTimerTicker();
  clearAutoModeTimeout();
  const n = Math.max(17, Math.min(45, Math.round(Number(state.customClue)) || 30));
  state.customClue = n;
  const { puzzle, solution, clueCount, requested, source } = generateCustomPuzzle(n);
  const sourceNote =
    source === "seed"
      ? "(17–21 这个区间用的是一批已经验证过的真实极限数独,加了随机变换不会重复)"
      : source === "seed-fallback"
      ? "(挖了 15 次都没能正好留下这个数量,改用验证过的极限数独库精确补齐了,已知数数量是准的)"
      : "";
  state.play = {
    difficulty: "custom",
    solution,
    given: puzzle.map((row) => row.map((v) => v !== 0)),
    grid: cloneGrid(puzzle),
    selected: null,
    showSolution: false,
    pendingHint: null,
    hintFilledCells: new Set(),
    note: {
      tone: "info",
      text:
        clueCount === requested
          ? `已生成一局自定义数独,留了 ${clueCount} 个已知数,开始吧。${sourceNote}`
          : `目标是留 ${requested} 个已知数,实际留了 ${clueCount} 个(这种情况理论上不该发生,如果你看到这句话请告诉我)。`,
    },
    ...freshPlayExtras(),
  };
  render();
}

function handleSelectDifficulty(diff) {
  if (state.selectedDifficulty === diff) return;
  state.selectedDifficulty = diff;
  handleGenerate(diff);
}

function handleSelectCustom() {
  if (state.selectedDifficulty === "custom") return;
  state.selectedDifficulty = "custom";
  handleGenerateCustom();
}

function handleRefresh() {
  if (state.selectedDifficulty === "custom") handleGenerateCustom();
  else handleGenerate(state.selectedDifficulty);
}

function handleCellClick(r, c) {
  if (state.mode === "play") {
    if (state.play.showSolution || state.play.autoMode.active) return;
    const isSameCell = state.play.selected && state.play.selected.r === r && state.play.selected.c === c;
    // 切换到一个不同的格子,就该把上一次「提示」留下的待确认状态清掉——
    // 不然会出现"点了提示、再点别的格子,画面上留着两处高光、提示按钮
    // 还停在等待二次确认"这种不一致状态。
    if (!isSameCell) state.play.pendingHint = null;
    state.play.selected = { r, c };
    const val = state.play.grid[r][c];
    state.play.highlightDigit = val !== 0 ? val : null;
  } else {
    state.create.selected = { r, c };
  }
  render();
}

// 键盘方向键挪动选中格——复用handleCellClick而不是自己直接赋值
// state.xxx.selected,保证跟鼠标点击格子完全一致的副作用(pendingHint
// 清理、highlightDigit联动),不会跑出两条不同步的选中逻辑。挪到
// 边界就停在边界,不循环绕圈。还没选中任何格子时,第一次按方向键
// 不管往哪个方向,都先落在(0,0),从这里开始挪。
function moveSelection(dr, dc) {
  const cur = state.mode === "play" ? state.play.selected : state.create.selected;
  const r = cur ? Math.min(8, Math.max(0, cur.r + dr)) : 0;
  const c = cur ? Math.min(8, Math.max(0, cur.c + dc)) : 0;
  handleCellClick(r, c);
}

/* ---- 计时器:跟主渲染流程分开,每秒只更新自己的文字节点 ---- */
function renderTimerOnly() {
  if (state.mode !== "play" || !state.play.timerStarted) return;
  const el = document.getElementById("timer-display");
  if (el) el.textContent = formatTime(getElapsedMs());
}
let timerIntervalId = null;
function startTimerTicker() {
  if (timerIntervalId) return;
  timerIntervalId = setInterval(renderTimerOnly, 1000);
}
function stopTimerTicker() {
  if (timerIntervalId) {
    clearInterval(timerIntervalId);
    timerIntervalId = null;
  }
}
function getElapsedMs() {
  const p = state.play;
  if (!p.timerStarted) return 0;
  return p.accumulatedMs + (p.timerRunning ? Date.now() - p.runningSinceMs : 0);
}
function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function pauseTimer() {
  const p = state.play;
  if (p.timerRunning) {
    p.accumulatedMs += Date.now() - p.runningSinceMs;
    p.timerRunning = false;
    p.runningSinceMs = null;
  }
  stopTimerTicker();
  clearAutoModeTimeout();
}
function handleStartChallenge() {
  if (!state.play.solution || state.play.timerStarted) return;
  state.play.timerStarted = true;
  state.play.timerRunning = true;
  state.play.runningSinceMs = Date.now();
  state.play.accumulatedMs = 0;
  startTimerTicker();
  render();
}

function checkWinCondition() {
  if (!state.play.solution) return;
  const matches = state.play.grid.every((row, r) => row.every((v, c) => v === state.play.solution[r][c]));
  if (matches && state.play.note.tone !== "win") {
    const wasTimed = state.play.timerStarted;
    pauseTimer();
    const timeNote = wasTimed
      ? ` 用时 ${formatTime(state.play.accumulatedMs)},提示用了 ${state.play.hintFilledCells.size} 次。`
      : "";
    state.play.note = { tone: "win", text: "全部填对了,这局数独完成了。" + timeNote };
  }
}

/* ---- 撤销/重做:只存 grid 快照,做题/自建各自一套历史 ---- */
function pushHistory(modeKey) {
  const s = state[modeKey];
  s.history.push({ grid: cloneGrid(s.grid), notes: s.notes ? cloneNotes(s.notes) : null });
  s.future = [];
  if (s.history.length > 200) s.history.shift();
}
function undo(modeKey) {
  const s = state[modeKey];
  if (s.history.length === 0) return;
  s.future.push({ grid: cloneGrid(s.grid), notes: s.notes ? cloneNotes(s.notes) : null });
  const snap = s.history.pop();
  s.grid = snap.grid;
  if (s.notes) s.notes = snap.notes || makeEmptyNotes();
  s.selected = null;
  if (modeKey === "play") {
    hintRequestSeq++; // 局面被撤回了,旧的提示请求不再对应当下的棋盘
    state.play.pendingHint = null;
    invalidateStaleHintChoices();
    state.play.highlightDigit = null;
    checkWinCondition();
  } else {
    hintRequestSeq++; // 同上,盘面变了,旧的校验请求作废
    state.create.validation = null;
  }
  render();
}
function redo(modeKey) {
  const s = state[modeKey];
  if (s.future.length === 0) return;
  s.history.push({ grid: cloneGrid(s.grid), notes: s.notes ? cloneNotes(s.notes) : null });
  const snap = s.future.pop();
  s.grid = snap.grid;
  if (s.notes) s.notes = snap.notes || makeEmptyNotes();
  s.selected = null;
  if (modeKey === "play") {
    hintRequestSeq++; // 同上,局面变了,旧请求作废
    state.play.pendingHint = null;
    invalidateStaleHintChoices();
    state.play.highlightDigit = null;
    checkWinCondition();
  } else {
    hintRequestSeq++; // 同上,盘面变了,旧的校验请求作废
    state.create.validation = null;
  }
  render();
}
function handleResetPlay() {
  if (!state.play.solution || state.play.showSolution) return;
  const targetGrid = state.play.grid.map((row, r) => row.map((v, c) => (state.play.given[r][c] ? v : 0)));
  const gridChanged = JSON.stringify(targetGrid) !== JSON.stringify(state.play.grid);
  // 只有manual或erased(用户真实操作过的痕迹)才算"有笔记要清"——纯auto
  // 是候选数显示开着时被动懒加载出来的,不是用户做过什么,不该被算作
  // "有变化",否则只要候选数开关开着,哪怕全新题目什么都没填,notes
  // 也会因为懒加载而处处非null,导致重置被误判成"有实质内容可清"。
  const notesChanged = state.play.notes.some((row) =>
    row.some((cell) => cell && Object.values(cell).some((v) => v === "manual" || v === "erased"))
  );
  if (!gridChanged && !notesChanged) {
    // 没有任何用户填入的数字或笔记需要清——重置本身就是空操作,不压
    // 历史栈,不然连点几次重置,撤销按钮会跟着无中生有地变得可点。
    state.play.note = { tone: "info", text: "当前已经是初始状态,没有什么可重置的。" };
    render();
    return;
  }
  pushHistory("play");
  hintRequestSeq++; // 棋盘被清空重来了,旧的提示请求作废
  state.play.grid = targetGrid;
  // 重置后的空格笔记归还成null,候选数显示开着的话渲染器会重新现算填回去。
  state.play.notes = makeEmptyNotes();
  state.play.selected = null;
  state.play.pendingHint = null;
  state.play.hintChoices = null; // 这里紧接着就会设置更贴切的note,不用invalidateStaleHintChoices()那句通用文案
  state.play.highlightDigit = null;
  state.play.hintFilledCells = new Set();
  state.play.note = { tone: "info", text: "已经清空你填的数字,已知数保留,重新开始推理。" };
  render();
}

function pressDigit(d) {
  if (state.mode === "play") {
    if (!state.play.solution || state.play.showSolution || !state.play.selected) return;
    const { r, c } = state.play.selected;
    if (state.play.given[r][c]) return;
    const cellIsEmpty = state.play.grid[r][c] === 0;

    if (d === 0) {
      // 数字盘的"清除这一格":只负责清掉确定性填入的数字,跟候选数/
      // 笔记完全无关,也不受铅笔/橡皮模式影响。格子本来就是空的
      // (没有可清的定性值)就什么都不做。
      if (cellIsEmpty) return;
      hintRequestSeq++; // 棋盘真的变了,旧的提示请求作废
      pushHistory("play");
      const ng = cloneGrid(state.play.grid);
      ng[r][c] = 0;
      state.play.grid = ng;
      state.play.notes[r][c] = null; // 这一格候选数状态本来就不存在(此前是定性填入),回到空格是全新未决定状态
      state.play.highlightDigit = null;
      state.play.pendingHint = null; // 棋盘发生了真实变化,任何还没确认的提示都失去意义了
      invalidateStaleHintChoices();
      state.play.hintFilledCells.delete(`${r},${c}`);
      checkWinCondition();
    } else if (state.play.pencilMode) {
      // 笔记模式:只对空格生效,已经定性填入的格子不受数字键影响
      // (铅笔不该有能力偷偷改答案)。只增不减,而且判断"要不要加"
      // 看的是这个数字当下是否已经可见,不是它原始的来源标记——
      // 如果它已经以auto身份显示着,再点一下不会把它"升级"成manual,
      // 直接当作已经标过,什么都不做。
      // 这里不动hintRequestSeq:manual标记只影响"要不要显示",不影响
      // liveCandidatesAt算出来的候选数集合(见liveCandidatesAt上面
      // 的注释),提示引擎压根感知不到这个变化,不需要作废任何请求。
      if (!cellIsEmpty) return;
      const existing = state.play.notes[r][c];
      const currentOrigin = existing ? existing[d] : undefined;
      if (isVisibleOrigin(currentOrigin, state.showCandidates)) return;
      pushHistory("play");
      ensureNotesCell(state.play.notes, r, c)[d] = "manual";
    } else if (state.play.eraserMode) {
      // 橡皮模式:同样只对空格生效,只针对候选数、只减不增。只有
      // 当前真的显示着的数字才会被擦掉(判断依据跟铅笔一致,都是
      // "当下是否可见"),擦掉后落一个erased墓碑。点一个本来就没
      // 在显示的数字不产生任何效果。
      // 这里要动hintRequestSeq:erased墓碑会实际改变liveCandidatesAt
      // 算出来的候选数集合,提示引擎依赖的输入变了,旧请求不能再用。
      if (!cellIsEmpty) return;
      const cell = state.play.notes[r][c];
      const origin = cell ? cell[d] : undefined;
      if (!isVisibleOrigin(origin, state.showCandidates)) return;
      hintRequestSeq++;
      pushHistory("play");
      cell[d] = "erased";
      // 注意:这里原有代码不清pendingHint(现状如此,这次没有改动它),
      // 但候选数确实变了,"提示列出全部技巧"里列出的名字有可能不再
      // 成立,所以hintChoices单独按更保守的口径处理。
      invalidateStaleHintChoices();
    } else {
      // 正常定性填入(覆盖已有值,或者填进一个新空格)。填入的数字
      // 跟已有的一样就什么都不做,避免无意义的历史记录。填入后立刻
      // 高亮这个数字,不用取消选中再重选才能看到高亮。
      if (!cellIsEmpty && state.play.grid[r][c] === d) return;
      hintRequestSeq++; // 棋盘真的变了,旧的提示请求作废
      pushHistory("play");
      commitFill(state.play.grid, state.play.notes, r, c, d);
      state.play.highlightDigit = d;
      // 只要真的发生了一次定性填入,任何还没确认的提示都失去意义了
      // (不管这次填入跟提示指向的是不是同一格)——eliminate类的提示
      // 没有顶层r,c,之前只按r,c匹配的写法永远清不到它,这里改成
      // 只要有真实填入就清,两种提示类型都能正确处理。
      state.play.pendingHint = null;
      invalidateStaleHintChoices();
      state.play.hintFilledCells.delete(`${r},${c}`);
      checkWinCondition();
    }
  } else {
    if (!state.create.selected) return;
    const { r, c } = state.create.selected;
    if (state.create.grid[r][c] === d) return;
    hintRequestSeq++; // 自建盘面变了,旧的校验/测难度请求作废
    pushHistory("create");
    const ng = cloneGrid(state.create.grid);
    ng[r][c] = d;
    state.create.grid = ng;
    state.create.validation = null;
    state.create.note = { tone: "info", text: "继续编辑,完成后点「校验」检查是否合法。" };
  }
  render();
}

// 判断下一步该做什么:优先检查有没有填错的格子需要纠正(按"从
// 已知数出发能推理到哪"的真实顺序,不是随手挑一个),否则走正常的
// 技巧链。返回一个pendingHint形状的对象、null(已经解完)、或者
// undefined(这次请求已经过期,调用方应该静默丢弃,什么都不touch——
// 跟null分开表达,是因为"过期"和"真的没有下一步了"是两件完全不同
// 的事,不能混为一谈)。手动点击提示、Auto模式的每一步,都调用这
// 同一个函数,不会出现两条逻辑各走各的、容易失同步的问题。
//
// hintRequestSeq是这次请求的"过期令牌":每次调用这个函数,令牌
// 自增一次,只有等异步计算真正返回的那一刻,令牌还是全局当前值,
// 结果才作数。局面/模式/设置发生任何可能让这次结果不再适用的变化
// (编辑格子、撤销重做、切模式、查看答案、Auto模式启停暂停、开新
// 题……),各自在自己的代码里主动把hintRequestSeq也加一——不是靠
// 一个中心化的地方去侦测"变没变",是每个会让请求过期的动作自己
// 负责报告,覆盖面更可靠,也更不容易漏。
let hintRequestSeq = 0;
async function computeNextHintOrCorrection(options = {}) {
  const mySeq = ++hintRequestSeq;
  const wrongCells = findAllWrongCells(state.play.grid, state.play.given, state.play.solution);
  // 有错误格子时,把它们当成空格构造一份修正视图——推理全程(技巧链
  // 命中、还是技巧链罢工后候选数最少兜底揭晓)都只认这一份视图,不
  // 会再有第二条路径回去看那份被错误数字污染过的真实棋盘。
  const effectiveGrid =
    wrongCells.length > 0
      ? state.play.grid.map((row, r) => row.map((v, c) => (wrongCells.some((w) => w.r === r && w.c === c) ? 0 : v)))
      : state.play.grid;

  // GSP需要"题目原始已知数"这份额外信息(不能用当前grid替代,理由见
  // findGSP旁的注释)——这里复用别处已经在用的写法拼出来,通过options
  // 带给getHintAsync/getHint。已知格永远不会是错误格,不受上面
  // effectiveGrid那份"错误格当空格"处理的影响。
  const givenGrid = state.play.given.map((row, r) => row.map((given, c) => (given ? state.play.grid[r][c] : 0)));
  const h = await getHintAsync(effectiveGrid, state.play.notes, state.play.solution, { ...options, givenGrid }, () => {
    if (mySeq !== hintRequestSeq) return; // 等待期间这次请求已经过期了,不用再显示"计算中"
    state.play.hintComputing = true;
    renderControls();
  });
  if (mySeq !== hintRequestSeq) return undefined; // 过期了,不能再假装这份结果还对应当下的局面

  if (!h) return null;

  return convertToFixIfTouchesWrongCell(h, wrongCells, options);
}

// 检查一个finding是不是恰好碰到了某个错误格子——不管是刚好该填它
// (fill)、刚好该消它身上的候选数(eliminate,得看eliminations列表
// 里有没有它)、还是技巧链彻底罢工后候选数最少兜底揭晓刚好落在它
// 头上(advanced)——都说明"从已知数出发的自然推理顺序"已经走到这里
// 了,该纠正,转成fix口径返回。没碰到就原样返回原来的h——错误格子
// 就先放着,不会被特殊对待、被塞到队伍前面插队。computeNextHint
// OrCorrection(单命中)、computeAllHintChoices(列表模式建列表)、
// handleHintChoicePick(列表模式里选中了需要单独重算详细推导的强制链
// 技巧)这三处都要用同一份判断,抽出来避免三处各写一份、以后改判断
// 条件却漏改。
function convertToFixIfTouchesWrongCell(h, wrongCells, options) {
  let touched = null;
  if (h.actionType === "fill" || h.actionType === "advanced") {
    touched = wrongCells.find((w) => w.r === h.r && w.c === h.c) || null;
  } else if (h.actionType === "eliminate") {
    for (const e of h.eliminations || []) {
      touched = wrongCells.find((w) => w.r === e.r && w.c === e.c) || null;
      if (touched) break;
    }
  }
  if (!touched) return h;
  const fixFinding = { actionType: "fix", r: touched.r, c: touched.c, digit: touched.correctDigit, technique: h.technique };
  return {
    ...fixFinding,
    peers: collectUnitPeers(fixFinding.r, fixFinding.c),
    message: renderFixMessage(fixFinding, options),
  };
}

// 跟computeNextHintOrCorrection是同一套"错误格纠正优先"框架(错误格
// 当空格、用effectiveGrid推理、GSP要givenGrid),区别是要列表模式下
// 的完整命中集合,不是第一个命中。列表里任何一项如果碰到了错误格子
// (填入的目标格就是它,或者消除的候选数里有它),同样要转成"fix"
// 口径,跟单命中流程保持一致的语义。如果好几个不同技巧最后都指向
// 同一个错误格子,合并成一条(而不是同一个"纠正这一格"用不同技巧
// 名字重复出现好几次),按r,c去重。
// 跟computeNextHintOrCorrection是同一套"错误格纠正优先"框架(错误格
// 当空格、用effectiveGrid推理、GSP要givenGrid),区别是要列表模式下
// 的完整命中集合,不是第一个命中。返回值三种情况都要能区分开,跟
// computeNextHintOrCorrection的null/undefined约定保持一致:
// undefined=这次请求已经过期,调用方应该静默丢弃;null=已经解完,
// 没有任何空格;[]=还有空格,但53个技巧一个都没命中(技巧链罢工,
// 单命中流程走的是候选数最少兜底揭晓,列表模式没有这种"退而求其次"
// 的兜底,老实告诉用户列不出来);非空数组=正常情况,列出全部命中。
// 列表里任何一项如果碰到了错误格子(填入的目标格就是它,或者消除的
// 候选数里有它),同样要转成"fix"口径,跟单命中流程保持一致的语义
// (复用convertToFixIfTouchesWrongCell,不另外写一份判断)。如果好
// 几个不同技巧最后都指向同一个错误格子,合并成一条,按r,c去重。
async function computeAllHintChoices(options = {}) {
  const mySeq = ++hintRequestSeq;
  const wrongCells = findAllWrongCells(state.play.grid, state.play.given, state.play.solution);
  const effectiveGrid =
    wrongCells.length > 0
      ? state.play.grid.map((row, r) => row.map((v, c) => (wrongCells.some((w) => w.r === r && w.c === c) ? 0 : v)))
      : state.play.grid;
  const givenGrid = state.play.given.map((row, r) => row.map((given, c) => (given ? state.play.grid[r][c] : 0)));
  const list = await findAllAvailableStepsAsync(effectiveGrid, state.play.notes, state.play.solution, { ...options, givenGrid }, () => {
    if (mySeq !== hintRequestSeq) return; // 等待期间这次请求已经过期了,不用再显示"计算中"
    state.play.hintComputing = true;
    renderControls();
  });
  if (mySeq !== hintRequestSeq) return undefined; // 过期了,不能再假装这份结果还对应当下的局面
  if (list === null) return null; // 已经解完

  const seenFixCells = new Set();
  const result = [];
  for (const h of list) {
    const converted = convertToFixIfTouchesWrongCell(h, wrongCells, options);
    if (converted.actionType === "fix") {
      const cellKey = `${converted.r},${converted.c}`;
      if (seenFixCells.has(cellKey)) continue; // 已经有别的技巧指向同一个错误格子了,不重复列
      seenFixCells.add(cellKey);
    }
    result.push(converted);
  }
  return result;
}


//
// 这一版DFC_BUDGET调大了10倍去兜底Platinum Blonde,而且JE/SE这一路
// 移植过程中已经两次在开发阶段抓到过真实的错误消除(靠的是拿solveCount
// 反解出的真实解去交叉核对)。开发阶段能这样测,是因为每次都是我们
// 主动挑一道题去跑;但用户长期实际使用时,没有人会在旁边拿真实解去
// 逐步核对——如果哪个技巧在某个没测过的盘面局部踩到了同样的坑,
// 用户是不会知道的,只会看着一个原本有解的盘面变得越推越死。
//
// 这套检查就是把开发阶段用的"solveCount真实解交叉核对"这个方法,
// 原样搬到运行时:每次应用一步(填入或消除)之后,拿这道题一开始
// 生成好、存在state.play.solution里的真实解核对一遍——填的数字
// 对不对,划掉的候选数是不是恰好就是真实解。任何一处不对,立刻中断
// 当前的"看起来很顺"的假象,把出错前后的完整候选数盘面和用到的
// 技巧都存下来,弹出显眼的报错,而不是让错误静悄悄地混在后续的
// 推理里、越滚越大,到最后卡死了都不知道是哪一步埋下的。

// 把当前盘面(已填数字+全部候选数)拍成一份纯文本快照,格式是
// 9x9网格,每格要么是已经填的数字,要么是当前候选数字符串,要么是
// "×"(候选数被划到一个都不剩,矛盾态)。用于错误报告里"出错前"/
// "出错后"两份对照。
// getCands是调用方传入的候选数获取函数,不写死依赖liveCandidatesAt/
// notes——这样"做题"模式(候选数来自state.play.notes)和estimateDifficulty
// 内部(候选数来自makeEliminationTracker)可以共用同一个快照函数,不用
// 各自维护一份几乎一样的格式化逻辑。
function snapshotCandidatesGrid(grid, getCands) {
  const rows = [];
  for (let r = 0; r < 9; r++) {
    const row = [];
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) {
        row.push(String(grid[r][c]));
      } else {
        const cands = getCands(r, c);
        // 空格候选数用括号包起来,跟"已经填好的数字"区分开——不然
        // 一个空格如果恰好只剩1个候选数,跟已填数字看起来会一模一样,
        // 报告给人看的时候容易误判"这格到底是给定值/已填值,还是
        // 还没填、只是候选数被收窄到只剩1个"。
        row.push(cands.length > 0 ? `(${cands.join("")})` : "×");
      }
    }
    rows.push(row);
  }
  return rows;
}
// 把snapshotCandidatesGrid的结果排成等宽对齐的文本块,每格按当前
// 快照里最长的格子对齐,3x3一组之间留一道竖线,方便肉眼定位到具体
// 是第几行第几列。
function formatCandidatesGridText(snapshot) {
  let width = 1;
  for (const row of snapshot) for (const cell of row) width = Math.max(width, cell.length);
  const lines = [];
  for (let r = 0; r < 9; r++) {
    if (r > 0 && r % 3 === 0) lines.push("");
    const parts = [];
    for (let c = 0; c < 9; c++) {
      if (c > 0 && c % 3 === 0) parts.push("|");
      parts.push(snapshot[r][c].padStart(width, " "));
    }
    lines.push(parts.join(" "));
  }
  return lines.join("\n");
}
// 核对一步finding有没有破坏盘面正确性。这里故意把三类错误放在
// 同一个门禁里,迁移/差分测试也复用这套判据,避免生产路径和测试路径
// 各自维护一份“什么算错误”的定义:
//   1) eliminate把某格的真实答案候选划掉;
//   2) fill/fix/advanced填入了与真实解不同的数字;
//   3) 这一步执行后,某个受影响的仍为空的格子候选数变成0。
// 第3项以前只会在错误报告快照里显示成“×”,并没有真的触发报错;
// WASM迁移开始前把它补成正式门禁,这样行为对拍时能更早抓到候选传播
// 被破坏的问题。grid/getCands是执行完finding后的实时状态。
function verifySoundnessAfterApply(ph, solution, grid, getCands) {
  if (solution) {
    if (ph.actionType === "eliminate") {
      for (const e of ph.eliminations) {
        if (solution[e.r][e.c] === e.digit) {
          return { kind: "badElimination", cell: { r: e.r, c: e.c }, digit: e.digit, correctDigit: solution[e.r][e.c] };
        }
      }
    } else {
      // fill / fix / advanced
      if (solution[ph.r][ph.c] !== ph.digit) {
        return { kind: "badFill", cell: { r: ph.r, c: ph.c }, digit: ph.digit, correctDigit: solution[ph.r][ph.c] };
      }
    }
  }

  // 没有执行后的盘面/候选读取器时只能做上面两项;生产路径和迁移
  // oracle都会传这两个参数。只检查“本步可能碰到”的格子,不做81格
  // 全盘扫描,避免给测难度的每一步增加不必要的固定开销。
  if (!grid || !getCands) return null;
  const affected = new Set();
  const add = (r, c) => affected.add(r * 9 + c);
  if (ph.actionType === "eliminate") {
    for (const e of ph.eliminations) add(e.r, e.c);
  } else if (Number.isInteger(ph.r) && Number.isInteger(ph.c)) {
    // 定性填入只会让同行/同列/同宫的候选发生客观变化。
    for (const key of collectUnitPeers(ph.r, ph.c)) {
      const [r, c] = key.split(",").map(Number);
      add(r, c);
    }
  }

  // row-major检查,让同一异常在JS/WASM差分里总是报同一个“第一个格子”。
  const ordered = [...affected].sort((a, b) => a - b);
  for (const idx of ordered) {
    const r = Math.floor(idx / 9);
    const c = idx % 9;
    if (grid[r][c] !== 0) continue;
    if (getCands(r, c).length === 0) {
      return {
        kind: "zeroCandidates",
        cell: { r, c },
        correctDigit: solution ? solution[r][c] : null,
      };
    }
  }
  return null;
}
// 拼出完整的、可以直接复制去反馈的报错文本。
function buildSoundnessErrorReport(ph, beforeSnapshot, afterSnapshot, problem) {
  const techLabel = TECHNIQUE_LABELS[ph.technique] || ph.technique || "(未知技巧)";
  const subtypeText = ph.subtype ? `  子类型: ${ph.subtype}` : "";
  const actionText =
    ph.actionType === "eliminate"
      ? `消除: ${ph.eliminations.map((e) => `(${e.r},${e.c})候选数${e.digit}`).join("、")}`
      : `${ph.actionType === "fix" ? "纠错填入" : "填入"}: (${ph.r},${ph.c}) = ${ph.digit}`;
  const problemText =
    problem.kind === "badElimination"
      ? `!! 严重: 格子(${problem.cell.r},${problem.cell.c})的真实解是${problem.correctDigit},但这一步把候选数${problem.digit}当成假的划掉了,而${problem.digit}恰好就是真实解本身。`
      : problem.kind === "zeroCandidates"
      ? `!! 严重: 这一步执行后,格子(${problem.cell.r},${problem.cell.c})仍然是空格,但全部候选数都被划掉了${problem.correctDigit ? `,真实解应为${problem.correctDigit}` : ""}。`
      : `!! 严重: 格子(${problem.cell.r},${problem.cell.c})被填成了${problem.digit},但真实解是${problem.correctDigit}。`;
  return [
    "==== 数独求解器 · 盘面正确性检查失败 ====",
    `时间: ${new Date().toISOString()}`,
    `用到的技巧: ${techLabel}${subtypeText}`,
    `具体动作: ${actionText}`,
    "",
    problemText,
    "",
    "---- 出错前的完整候选数盘面 ----",
    formatCandidatesGridText(beforeSnapshot),
    "",
    "---- 出错后的完整候选数盘面 ----",
    formatCandidatesGridText(afterSnapshot),
    "",
    "(带括号的是空格当前的候选数,不带括号的数字是已经填入/给定的值,",
    "×表示这一格候选数已经被划到一个都不剩,是矛盾态)",
    "",
    "请把以上全部内容复制下来并反馈给开发者,这能帮助定位具体是",
    "哪一步、哪种盘面结构触发的问题。",
  ].join("\n");
}

// 跟pendingHint处于同一地位的失效处理:棋盘/候选数真的发生实质变化
// 时调用。如果清之前"提示列出全部技巧"的列表确实正显示着(用户还
// 没点选具体某一项),顺手把note换成一句诚实的话——不然文字会停留
// 在"当前发现了以下技巧"这种已经不再成立的措辞上不动,而用户又点
// 不到任何东西,容易被当成卡住了。真正被点选中、已经转成pendingHint
// 的技巧不受这个函数影响,走的是pendingHint自己那套失效逻辑。
function invalidateStaleHintChoices() {
  if (state.play.hintChoices) {
    state.play.hintChoices = null;
    state.play.note = {
      tone: "info",
      text: "棋盘刚刚发生了变化,之前列出的技巧可能已经不适用了,重新点一次「提示」看看当前能用的技巧。",
    };
  }
}

// 应用一个pendingHint(不管是手动点击提示的第二次点击,还是Auto模式
// 定时器触发的"执行"阶段)——统一处理fill/fix/advanced的定性填入,
// 和eliminate的候选数消除,顺带处理"两次动作之间棋盘已经变了,这个
// 提示不再适用"的边界情况。只负责改状态,不负责render()。
function applyPendingHint(ph) {
  if (ph.actionType === "eliminate") {
    const stillRelevant = ph.eliminations.some(
      (e) =>
        state.play.grid[e.r][e.c] === 0 &&
        liveCandidatesAt(state.play.grid, state.play.notes, e.r, e.c).includes(e.digit)
    );
    if (!stillRelevant) {
      state.play.pendingHint = null;
      state.play.note = { tone: "info", text: "这些候选数已经不用再处理了,再点一次「提示」继续。" };
      return;
    }
    const beforeSnapshot = snapshotCandidatesGrid(state.play.grid, (r, c) => liveCandidatesAt(state.play.grid, state.play.notes, r, c));
    pushHistory("play");
    if (!state.showCandidates) state.showCandidates = true; // 消除得让人看得见才有意义
    markCellsErased(state.play.notes, ph.eliminations);
    const problem = verifySoundnessAfterApply(ph, state.play.solution, state.play.grid, (r, c) => liveCandidatesAt(state.play.grid, state.play.notes, r, c));
    if (problem) {
      const afterSnapshot = snapshotCandidatesGrid(state.play.grid, (r, c) => liveCandidatesAt(state.play.grid, state.play.notes, r, c));
      state.play.soundnessError = { report: buildSoundnessErrorReport(ph, beforeSnapshot, afterSnapshot, problem) };
    }
    state.play.pendingHint = null;
    const distinctDigits = [...new Set(ph.eliminations.map((e) => e.digit))].sort((a, b) => a - b);
    const digitDesc = distinctDigits.length === 1 ? `候选数 ${distinctDigits[0]}` : `候选数 ${distinctDigits.join("、")}`;
    state.play.note = { tone: "hint", text: `已经把标出格子里的${digitDesc}划掉了,候选数少了,继续推理剩下的部分吧。` };
    return;
  }

  // fill / fix / advanced 都是"确定填入一个数字",统一走commitFill——
  // 不管这个数字是唯一余数法推出来的、纠错纠出来的、还是高级技巧
  // 兜底揭晓的,都必须触发对同行列宫候选数的强制消除,跟手动填字
  // 完全一致,不能厚此薄彼。
  const { r, c, digit } = ph;
  if (state.play.grid[r][c] !== 0 && state.play.grid[r][c] === digit) {
    state.play.pendingHint = null;
    state.play.note = { tone: "info", text: "这一格已经填好了,再点一次「提示」继续。" };
    return;
  }
  pushHistory("play");
  const beforeFillSnapshot = snapshotCandidatesGrid(state.play.grid, (rr, cc) => liveCandidatesAt(state.play.grid, state.play.notes, rr, cc));
  commitFill(state.play.grid, state.play.notes, r, c, digit);
  const fillProblem = verifySoundnessAfterApply(ph, state.play.solution, state.play.grid, (r, c) => liveCandidatesAt(state.play.grid, state.play.notes, r, c));
  if (fillProblem) {
    const afterFillSnapshot = snapshotCandidatesGrid(state.play.grid, (rr, cc) => liveCandidatesAt(state.play.grid, state.play.notes, rr, cc));
    state.play.soundnessError = { report: buildSoundnessErrorReport(ph, beforeFillSnapshot, afterFillSnapshot, fillProblem) };
  }
  state.play.selected = { r, c };
  state.play.highlightDigit = digit;
  state.play.hintFilledCells.add(`${r},${c}`);
  state.play.pendingHint = null;
  state.play.note =
    ph.actionType === "fix"
      ? { tone: "hint", text: "已经把这一格换成正确答案了,继续推理剩下的格子吧。" }
      : { tone: "hint", text: "已经把这一格填上了,继续推理剩下的格子吧。" };
  checkWinCondition();
}

// 把computeNextHintOrCorrection算出来的结果,落到selected/pendingHint/
// note上——手动点击提示、Auto模式的"思考展示"阶段,都调用这一个
// 函数,行为完全一致。每种消息现在都自带完整的收尾措辞(actionPhrase
// 已经处理过),这里不需要再额外拼接任何后缀。
function displayComputedHint(h) {
  // 不管h是直接算出来的(列表模式关闭时的原有流程),还是从"提示列出
  // 全部技巧"的列表里点选出来的,一旦要展示成pendingHint,列表本身
  // 就该退场——不用诚实提示那句话,因为note马上就会被下面的h.message
  // 覆盖掉,不存在"文字停留在过期状态"的问题。
  state.play.hintChoices = null;
  if (h.actionType === "eliminate") {
    state.play.selected = null;
    state.play.pendingHint = h;
    state.play.note = { tone: "hint", text: h.message };
  } else if (h.actionType === "fix") {
    state.play.selected = { r: h.r, c: h.c };
    state.play.pendingHint = h;
    state.play.note = { tone: "error", text: h.message };
  } else {
    // "advanced"和真正的fill(唯一余数法/排除法)视觉上一视同仁,
    // 都是选中目标格、hint语气。
    state.play.selected = { r: h.r, c: h.c };
    state.play.pendingHint = h;
    state.play.note = { tone: "hint", text: h.message };
  }
}

async function handleHintClick() {
  if (!state.play.solution) return;
  if (state.play.showSolution) {
    state.play.note = { tone: "info", text: "先点「返回进度」,再使用提示。" };
    render();
    return;
  }
  if (state.play.hintBusy) return; // 已经有一次请求飞着,点了也没用,防止重复发起

  if (state.play.pendingHint) {
    applyPendingHint(state.play.pendingHint);
    render();
    return;
  }

  if (state.play.hintChoices) {
    // 列表已经算出来、正显示着,用户还没点选任何一项——只要棋盘没变,
    // 列表就没过期(过期的话invalidateStaleHintChoices早就把它清掉了,
    // 走不到这个分支),不用再发起一次扫描重算一遍。这个状态下点
    // 「提示」本来就没有"下一步该做什么"这个问题——选择权在用户手上
    // 那份列表里,不在这个按钮上。
    return;
  }

  if (state.settings.listTechniquesOnHint) {
    state.play.hintBusy = true; // 立即生效,配合renderControls把按钮禁用掉,不用等延迟的"计算中"文字出现
    render();
    const list = await computeAllHintChoices();
    state.play.hintBusy = false;
    state.play.hintComputing = false;
    if (list === undefined) {
      // 过期了(等待期间盘面变了/切走了),静默丢弃
      render();
      return;
    }
    if (list === null) {
      state.play.note = { tone: "win", text: "已经没有空格了,这局解完啦。" };
      render();
      return;
    }
    if (list.length === 0) {
      // 还有空格,但53个技巧一个都没命中——单命中流程走的是"候选数
      // 最少兜底揭晓"这条退而求其次的路,列表模式没有对应的兜底可选
      // (兜底本身也不是一个真的技巧,列不出名字),老实告诉用户现在
      // 列不出来,不假装找到了什么。
      state.play.note = { tone: "info", text: "这一步需要咱们还没实现的技巧,暂时列不出可选的提示。" };
      render();
      return;
    }
    state.play.hintChoices = list;
    state.play.note = { tone: "hint", text: "当前在盘面上发现了以下可用技巧,请选择要应用的:" };
    render();
    return;
  }

  state.play.hintBusy = true; // 立即生效,配合renderControls把按钮禁用掉,不用等延迟的"计算中"文字出现
  render();
  const h = await computeNextHintOrCorrection();
  state.play.hintBusy = false;
  state.play.hintComputing = false;
  if (h === undefined) {
    // 这次请求已经过期(比如算的过程中用户切走了模式、编辑了棋盘)——
    // 静默丢弃,不touch任何状态,让当下真实的界面保持原样。
    render();
    return;
  }
  if (!h) {
    state.play.note = { tone: "win", text: "已经没有空格了,这局解完啦。" };
    render();
    return;
  }
  displayComputedHint(h);
  render();
}

// 用户从"提示列出全部技巧"的列表里点中了某一项。多数情况下这一项
// 早就是完整的finding(建列表那一步已经把message/peers都拼好了),
// 直接摆进pendingHint就行,不用再算一遍。唯一的例外是:这一项恰好是
// 强制链家族技巧,而且用户的showChainDetail真实设置确实开着——建
// 列表那一步为了效率,强制链技巧的详细推导全程是按"关"算的(见
// findAllAvailableSteps),这里需要针对这一个技巧单独重新算一次,
// 拿到真正带详细推导的版本。这次单独重算的开销,跟平时不开列表
// 模式、showChainDetail直接开着时"点一次提示"的开销完全一样,只是
// 从"扫描全部技巧的时候预付"挪到了"确定要看这一个的时候才付"。
function handleHintChoicePick(technique) {
  if (state.play.hintBusy) return; // 已经有请求飞着(比如正在做下面这个单独重算),先不要再发起一次
  const choice = (state.play.hintChoices || []).find((h) => h.technique === technique);
  if (!choice) return; // 正常渲染出来的按钮不该点到这种情况,这里只是防御

  if (!CHAIN_DETAIL_TECHNIQUES.has(choice.technique) || !state.settings.showChainDetail) {
    displayComputedHint(choice);
    render();
    return;
  }

  (async () => {
    state.play.hintBusy = true;
    render();
    const mySeq = ++hintRequestSeq;
    const wrongCells = findAllWrongCells(state.play.grid, state.play.given, state.play.solution);
    const effectiveGrid =
      wrongCells.length > 0
        ? state.play.grid.map((row, r) => row.map((v, c) => (wrongCells.some((w) => w.r === r && w.c === c) ? 0 : v)))
        : state.play.grid;
    const givenGrid = state.play.given.map((row, r) => row.map((given, c) => (given ? state.play.grid[r][c] : 0)));
    const h = await getHintAsync(effectiveGrid, state.play.notes, state.play.solution, { technique: choice.technique, givenGrid }, () => {
      if (mySeq !== hintRequestSeq) return;
      state.play.hintComputing = true;
      renderControls();
    });
    state.play.hintBusy = false;
    state.play.hintComputing = false;
    if (mySeq !== hintRequestSeq) {
      // 过期了(重算这一下的等待期间,盘面变了/切走了)——
      // invalidateStaleHintChoices已经在别处把hintChoices和note都
      // 处理过了,这里什么都不用再做,维持现状。
      render();
      return;
    }
    if (!h) {
      // 理论上不该发生——建列表那一刻这个技巧明明命中过,重算用的是
      // 同一份棋盘状态。防御性地什么都不做,让用户看到的列表原样留着。
      render();
      return;
    }
    displayComputedHint(convertToFixIfTouchesWrongCell(h, wrongCells, {}));
    render();
  })();
}

/* ============================================================
   Auto Mode:相当于程序代替人一直点「提示」,中间插入停顿。
   每一步分两个阶段:
     "思考展示"阶段 —— 算出下一步该做什么,选中/高亮相关格子,
       展示详细说明(不真正生效),对应手动点击提示的第一次点击。
     "执行"阶段 —— 真正应用这一步(定性填入,或者划掉候选数),
       对应手动点击提示的第二次点击。
   两个阶段各占一半的步进间隔,由getAutoPhaseDurationMs统一计算——
   现在是固定值,以后想按技巧难度/文字长度动态调整步进时长,只需要
   改这一个函数,不用动调用它的地方。
   ============================================================ */

let autoModeTimeoutId = null;
function clearAutoModeTimeout() {
  if (autoModeTimeoutId) {
    clearTimeout(autoModeTimeoutId);
    autoModeTimeoutId = null;
  }
}
function scheduleAutoModeTick(delayMs) {
  clearAutoModeTimeout();
  autoModeTimeoutId = setTimeout(autoModeTick, delayMs);
}
// 总步进时长的上下限(毫秒)——下限800ms(两阶段各400ms)是"至少能让
// 文字说明有机会被瞥一眼"的最低要求;上限10000ms(两阶段各5000ms)
// 是"Auto模式终究是给人看推理过程用的,超过这个时长基本没人会真的
// 坐着等,需要更长间隔的场景更适合手动点提示"的经验判断。设置面板
// 里的输入框会用这两个常量做校验,不允许存进去一个越界的值。
const AUTO_STEP_INTERVAL_MIN_MS = 800;
const AUTO_STEP_INTERVAL_MAX_MS = 10000;
// 每个阶段该展示多久——目前固定是步进间隔的一半,参数留着finding,
// 为以后"按技巧难度/文字长度算不同时长"这种更复杂的方案预留接口,
// 不需要到时候再改调用方。
function getAutoPhaseDurationMs(phase, finding) {
  return state.settings.autoStepIntervalMs / 2;
}

function stopAutoMode(reason) {
  state.play.autoMode.active = false;
  state.play.autoMode.paused = false;
  state.play.autoMode.prefetchPromise = null;
  clearAutoModeTimeout();
  if (reason === "solved") {
    state.play.note = { tone: "win", text: "已经没有空格了,这局解完啦。" };
  } else if (reason === "stuck") {
    state.play.note = {
      tone: "info",
      text: "自动推理已经停下——接下来需要咱们还没实现的技巧,不能装作是推理出来的。\n\n你可以点「接手」自己继续,或者用手动「提示」按钮直接查看这一格的答案。",
    };
  }
  // reason为null时不改note,调用方已经自己设置好了。
}

// 展示上一步盘面的这段时间(applied阶段)本来就是纯等待,趁这段空档
// 把下一步先算出来——不等待、不阻塞,存一个Promise,真正要用的时候
// 再await。computeNextHintOrCorrection内部自己管理hintRequestSeq的
// 过期判断,这里不用额外操心"暂停/接手/停止了怎么办",过期了它自己
// 会返回undefined。
function startPrefetchNextStep() {
  state.play.autoMode.prefetchPromise = computeNextHintOrCorrection({ verbose: true, forAuto: true });
}

async function autoModeTick() {
  if (!state.play.autoMode.active || state.play.autoMode.paused) return;

  if (state.play.pendingHint) {
    const ph = state.play.pendingHint;
    if (ph.actionType === "advanced") {
      // 已经进入"思考展示"阶段,但这是还没实现的技巧兜底——诚实停下,
      // 不要在Auto模式里悄悄揭晓答案却假装是推理出来的。
      stopAutoMode("stuck");
      render();
      return;
    }
    applyPendingHint(ph);
    render();
    if (!state.play.autoMode.active) return; // applyPendingHint间接触发了win,已经停止
    if (state.play.soundnessError) {
      // applyPendingHint只负责记录问题(state.play.soundnessError),
      // 不会自己叫停——这里必须主动检查并停下,不能带着一个已经被
      // 验证出问题的盘面继续预取/步进下去,假装什么都没发生。
      stopAutoMode(null);
      state.play.note = {
        tone: "error",
        text: "自动推理过程中触发了盘面正确性检查——已经停止,不会假装继续推理下去,详情见下方报告。",
      };
      render();
      return;
    }
    startPrefetchNextStep(); // 趁接下来这段展示盘面的空闲时间,后台把下一步先算出来
    scheduleAutoModeTick(getAutoPhaseDurationMs("applied", ph));
    return;
  }

  let h;
  if (state.play.autoMode.prefetchPromise) {
    h = await state.play.autoMode.prefetchPromise;
    state.play.autoMode.prefetchPromise = null;
  } else {
    // 没有预取结果可用(比如第一步,前面没有展示阶段可以拿来预取)——
    // 现算,跟以前的行为一致。
    h = await computeNextHintOrCorrection({ verbose: true, forAuto: true });
  }
  if (h === undefined) return; // 这次请求已经过期(等待期间被暂停/接手/停止了),什么都不做
  if (!state.play.autoMode.active || state.play.autoMode.paused) return;
  if (!h) {
    stopAutoMode("solved");
    render();
    return;
  }
  if (h.actionType === "advanced") {
    state.play.selected = { r: h.r, c: h.c };
    stopAutoMode("stuck");
    render();
    return;
  }
  displayComputedHint(h);
  render();
  scheduleAutoModeTick(getAutoPhaseDurationMs("thinking", h));
}

function handleStartAutoMode() {
  if (!state.play.solution || state.play.showSolution) return;
  hintRequestSeq++; // 启动Auto模式,任何手动模式下还没返回的旧提示请求都作废
  state.play.autoMode.active = true;
  state.play.autoMode.paused = false;
  state.play.pendingHint = null; // 不沿用手动模式可能留下的、措辞不是forAuto的待确认提示
  invalidateStaleHintChoices(); // 手动模式下如果正列着技巧选择还没选,Auto模式接管后这份列表也没有意义了
  state.play.autoMode.prefetchPromise = null;
  if (!state.showCandidates) state.showCandidates = true; // Auto模式的视觉反馈全靠候选数,强制打开
  state.play.pencilMode = false;
  state.play.eraserMode = false;
  render();
  autoModeTick(); // 立刻开始,不等待任何整体预解
}
function handleTogglePauseAutoMode() {
  if (!state.play.autoMode.active) return;
  if (state.play.autoMode.paused) {
    hintRequestSeq++; // 恢复:视为一次新的开始,不沿用暂停前可能还飞着的旧请求
    state.play.autoMode.paused = false;
    render();
    autoModeTick();
  } else {
    hintRequestSeq++; // 暂停:让当下正在飞的请求作废,回来的结果不能再被应用
    state.play.autoMode.paused = true;
    state.play.autoMode.prefetchPromise = null;
    clearAutoModeTimeout();
    render();
  }
}
function handleTakeOverAutoMode() {
  if (!state.play.autoMode.active) return;
  hintRequestSeq++; // 接手,同上,飞着的请求作废
  state.play.autoMode.active = false;
  state.play.autoMode.paused = false;
  state.play.autoMode.prefetchPromise = null;
  clearAutoModeTimeout();
  state.play.pendingHint = null;
  state.play.hintChoices = null; // Auto模式期间本来就不会有值,这里只是保险;下面马上设置自己的note,不用invalidateStaleHintChoices()那句通用文案
  state.play.note = { tone: "info", text: "已经交还给你了,棋盘上填的数字和候选数都保留着,接着推理吧。" };
  render();
}



function toggleShowSolution() {
  if (!state.play.solution) return;
  hintRequestSeq++; // 切进/切出查看答案,旧的提示请求不再适用
  const wasShowing = state.play.showSolution;
  state.play.showSolution = !wasShowing;
  state.play.pendingHint = null;
  invalidateStaleHintChoices();

  if (!wasShowing) {
    pauseTimer();
  } else if (state.play.timerStarted && state.play.note.tone !== "win") {
    state.play.timerRunning = true;
    state.play.runningSinceMs = Date.now();
    startTimerTicker();
  }

  state.play.note = !wasShowing
    ? { tone: "info", text: "正在查看完整答案,点「返回进度」继续解题。" }
    : { tone: "info", text: "已经回到你自己的解题进度。" };
  render();
}

async function handleValidate() {
  const conflicts = findConflicts(state.create.grid);
  if (conflicts.size > 0) {
    state.create.validation = { status: "invalid" };
    state.create.note = { tone: "error", text: "有格子在同一行/列/宫里重复了(已标红),请先修正冲突再校验。" };
    render();
    return;
  }
  const filledCount = state.create.grid.flat().filter((v) => v !== 0).length;
  if (filledCount === 0) {
    const box = document.getElementById("puzzle-string-box");
    const hasStringInput = box && box.value.replace(/\s+/g, "").length > 0;
    state.create.note = hasStringInput
      ? { tone: "info", text: "盘面是空的,但下面的字符串框里有内容——先点「字符串→盘面」把它映射上去,再校验。" }
      : { tone: "info", text: "还没有填任何数字,先放几个已知数再校验吧。" };
    render();
    return;
  }
  const { count, solutions } = solveCount(state.create.grid, 2);
  if (count === 0) {
    state.create.validation = { status: "none" };
    state.create.note = {
      tone: "error",
      text: "这个数独无解 —— 已知数字之间互相矛盾,任何填法都满足不了所有行/列/宫的规则,请检查已知数的位置。",
    };
    render();
    return;
  }
  if (count > 1) {
    const diffs = diffCellsReport(solutions[0], solutions[1]);
    state.create.validation = { status: "multiple", diffs };
    state.create.note = { tone: "error", text: "存在多个解,这还不算一个合格的数独。建议增加更多已知数后再校验一次。" };
    render();
    return;
  }
  // 走到这里说明合法且唯一解——只有这个分支真的需要estimateDifficulty
  // 这个耗时的计算,前面几种"很快就能判断完"的情况都已经提前return了,
  // 不用陪着一起等。
  const mySeq = ++hintRequestSeq;
  state.create.validation = { status: "unique", clueCount: filledCount, solution: solutions[0] };

  let perfIsFallback = false;
  const perfT0 = state.settings.performanceMonitor ? performance.now() : 0;
  const onProgress = state.settings.performanceMonitor
    ? (ms) => {
        if (mySeq !== hintRequestSeq) return;
        state.create.note = {
          tone: "success",
          text: `合格:有且只有一个解。已知数 ${filledCount} 个(数学上保证唯一解至少需要 17 个)。正在计算难度…[性能监测] 已耗时 ${ms.toFixed(0)}ms`,
        };
        renderNote();
      }
    : undefined;
  const diffNote = await estimateDifficultyAsync(
    state.create.grid,
    (isFallback) => {
      perfIsFallback = isFallback;
      if (mySeq !== hintRequestSeq) return;
      const loadingWord = isFallback ? "正在计算难度(这个环境暂时用不了后台计算,界面会短暂无响应)…" : "正在计算难度…";
      state.create.note = { tone: "success", text: `合格:有且只有一个解。已知数 ${filledCount} 个(数学上保证唯一解至少需要 17 个)。${loadingWord}` };
      renderNote();
    },
    solutions[0],
    onProgress
  );
  if (mySeq !== hintRequestSeq) return;
  // 性能监测打开时,耗时直接跟着这次校验结果一起显示在这里——不是
  // 另存一份去设置面板展示。设置面板只负责解释这个开关是干什么的、
  // Worker有无的差异,不负责替用户记住"刚才那次点了什么按钮"。
  const perfNote = state.settings.performanceMonitor
    ? `\n\n[性能监测] 本次耗时 ${(performance.now() - perfT0).toFixed(0)}ms${perfIsFallback ? "(主线程同步计算)" : "(后台线程计算)"}`
    : "";

  state.create.note = {
    tone: "success",
    text: `合格:有且只有一个解。已知数 ${filledCount} 个(数学上保证唯一解至少需要 17 个)。${diffNote}${perfNote}`,
  };
  render();
}

function handleClearCreate() {
  hintRequestSeq++; // 画布清空了,旧的校验/测难度请求作废
  state.create = {
    grid: emptyGrid(),
    selected: null,
    validation: null,
    note: { tone: "info", text: "画布已清空,重新填入已知数吧。" },
    history: [],
    future: [],
  };
  render();
}

function handleStringToGrid() {
  const box = document.getElementById("puzzle-string-box");
  const result = parsePuzzleString(box.value);
  if (!result.ok) {
    state.create.note = { tone: "error", text: result.error };
    render();
    return;
  }
  state.create.grid = result.grid;
  hintRequestSeq++; // 粘贴导入了新盘面,旧的校验/测难度请求作废
  state.create.selected = null;
  state.create.validation = null; // 盘面变了,之前的校验结论作废,免得显示过期的"合格"结论
  state.create.history = [];
  state.create.future = [];
  state.create.note = { tone: "info", text: "已经把字符串映射到盘面上了,点下面的「校验」检查是否合法且唯一解。" };
  render();
}

function handleGridToString() {
  const str = gridToPuzzleString(state.create.grid);
  document.getElementById("puzzle-string-box").value = formatPuzzleStringForDisplay(str);
  state.create.note = { tone: "info", text: "已经把当前盘面转成字符串,显示在上面的框里了(空格记作 0)。" };
  render();
}

function handleCopyString(targetId, btnEl) {
  const box = document.getElementById(targetId);
  const text = box.value;
  if (!text) return;
  const done = () => {
    if (!btnEl) return;
    const original = btnEl.textContent;
    btnEl.classList.add("copy-icon-done");
    btnEl.textContent = "✓";
    setTimeout(() => {
      btnEl.classList.remove("copy-icon-done");
      btnEl.textContent = original;
    }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {
      box.select();
      document.execCommand("copy");
      done();
    });
  } else {
    box.select();
    document.execCommand("copy");
    done();
  }
}

// 做题模块的"测难度":量的是这道题原本(已知数)的难度,不是量当前
// 已经填了多少——不然玩家越往后填,盘面越空,分数会跟着往下掉,
// 那是"剩余难度"不是"这道题的难度",会误导人。所以先把玩家/系统
// 后续填的都还原成空格,只留下最初生成时的已知数。
async function handleValidateDifficulty() {
  if (!state.play.solution) return;
  const mySeq = ++hintRequestSeq;
  const givenOnlyGrid = state.play.grid.map((row, r) => row.map((v, c) => (state.play.given[r][c] ? v : 0)));

  let perfIsFallback = false;
  const perfT0 = state.settings.performanceMonitor ? performance.now() : 0;
  const onProgress = state.settings.performanceMonitor
    ? (ms) => {
        if (mySeq !== hintRequestSeq) return;
        state.play.note = { tone: "info", text: `正在计算难度…[性能监测] 已耗时 ${ms.toFixed(0)}ms` };
        renderNote();
      }
    : undefined;
  const note = await estimateDifficultyAsync(
    givenOnlyGrid,
    (isFallback) => {
      perfIsFallback = isFallback;
      if (mySeq !== hintRequestSeq) return; // 等待期间又发起了新的请求,这次不用再显示"计算中"
      state.play.note = {
        tone: "info",
        text: isFallback ? "正在计算难度(这个环境暂时用不了后台计算,界面会短暂无响应)…" : "正在计算难度…",
      };
      renderNote();
    },
    state.play.solution,
    onProgress
  );
  if (mySeq !== hintRequestSeq) return; // 这次请求已经过期(用户点了不止一次),结果作废,不覆盖更新的状态
  const perfNote = state.settings.performanceMonitor
    ? `\n\n[性能监测] 本次耗时 ${(performance.now() - perfT0).toFixed(0)}ms${perfIsFallback ? "(主线程同步计算)" : "(后台线程计算)"}`
    : "";

  state.play.note = { tone: "info", text: `${note}${perfNote}` };
  render();
}

function challengeOwnPuzzle() {
  if (!state.create.validation || state.create.validation.status !== "unique") return;
  hintRequestSeq++; // 从自建切进做题,整个play状态都是全新的,旧请求作废
  stopTimerTicker();
  clearAutoModeTimeout();
  const solution = state.create.validation.solution;
  state.selectedDifficulty = "custom";
  state.play = {
    difficulty: "custom",
    solution,
    given: state.create.grid.map((row) => row.map((v) => v !== 0)),
    grid: cloneGrid(state.create.grid),
    selected: null,
    showSolution: false,
    pendingHint: null,
    hintFilledCells: new Set(),
    note: { tone: "info", text: "这是你自己出的题,试着解出来吧。" },
    ...freshPlayExtras(),
  };
  state.mode = "play";
  render();
}

/* ------------------------------ 单元格状态计算(对应 React 版本) ------------------------------ */

function getDisplayValue(r, c) {
  if (state.mode === "play") return state.play.showSolution ? state.play.solution[r][c] : state.play.grid[r][c];
  return state.create.grid[r][c];
}
function getCellRole(r, c) {
  if (state.mode === "play") {
    if (state.play.given && state.play.given[r][c]) return "given";
    if (state.play.showSolution) return "solution";
    if (state.play.hintFilledCells.has(`${r},${c}`)) return "hint";
    if (state.play.grid[r][c] !== 0) return "user";
    return "empty";
  }
  return state.create.grid[r][c] !== 0 ? "authored" : "empty";
}
function isCellConflict(r, c, conflicts) {
  if (state.mode === "play" && state.play.showSolution) return false;
  return conflicts.has(`${r},${c}`);
}
function isCellSelected(r, c) {
  const sel = state.mode === "play" ? state.play.selected : state.create.selected;
  return !!sel && sel.r === r && sel.c === c;
}
function isCellSelectedPeer(r, c) {
  const sel = state.mode === "play" ? state.play.selected : state.create.selected;
  if (!sel || (sel.r === r && sel.c === c)) return false;
  return sel.r === r || sel.c === c || boxIndex(sel.r, sel.c) === boxIndex(r, c);
}
// 收集详细推导涉及到的全部格子(每条分支里每一步碰过的格子),用于
// 盘面上的辅助高亮——这是这一轮能做到的、性价比最高的视觉反馈:
// 完整画出连接每一步的箭头链条,在Nishio/UnaryChain这种场景下涉及
// 的技巧太杂(唯一余数、排除法、锁定候选轮番上场),不像AIC那样天生
// 就是一串首尾相连的节点,没有统一的"从哪个候选指向哪个候选"的边
// 结构,勉强砌出来的箭头会是牵强的、容易误导人的。先做"哪些格子在
// 这条推导里出现过"这个更朴素但站得住脚的版本,箭头链条留到以后
// 单独评估要不要为此重新设计这几个技巧的中间数据结构。
let __detailTouchedCellsCache = { ph: null, cells: null };
function collectDetailTouchedCells(ph) {
  if (!ph || !ph.context || !ph.context.branches) return [];
  // 缓存基于pendingHint的对象引用:同一次render里81个格子会各调用
  // 一次这个函数,ph在一次render周期内是同一个引用,不用重算81遍;
  // 只有真正换了一个新的pendingHint(引用变了)才会重新遍历。
  if (__detailTouchedCellsCache.ph === ph) return __detailTouchedCellsCache.cells;
  const cells = [];
  const seen = new Set();
  const add = (r, c) => {
    const k = `${r},${c}`;
    if (!seen.has(k)) {
      seen.add(k);
      cells.push([r, c]);
    }
  };
  for (const b of ph.context.branches) {
    if (b.tooLong || !b.steps) continue;
    for (const s of b.steps) {
      if (s.actionType === "fill") add(s.r, s.c);
      else for (const e of s.eliminations) add(e.r, e.c);
    }
  }
  __detailTouchedCellsCache = { ph, cells };
  return cells;
}
function hintHighlight(r, c) {
  if (state.mode !== "play" || !state.play.pendingHint) return null;
  const ph = state.play.pendingHint;
  if (ph.actionType === "eliminate") {
    if (ph.patternCells && ph.patternCells.some(([pr, pc]) => pr === r && pc === c)) return "pattern";
    if (ph.eliminations.some((e) => e.r === r && e.c === c)) return "eliminate";
    if (collectDetailTouchedCells(ph).some(([pr, pc]) => pr === r && pc === c)) return "chainDetail";
    return null;
  }
  // fill类型:target(真正要填的格子)优先级最高;patternCells是新加的
  // 通道,给unaryChain/multipleChain这类"试验田"式的技巧标出起点/
  // 被测试的那一批候选,原来nakedSingle/hiddenSingle这些fill技巧不
  // 设置这个字段,行为不受影响。peer(同行列宫)兜底,保持原样。
  if (ph.r === r && ph.c === c) return "target";
  if (ph.patternCells && ph.patternCells.some(([pr, pc]) => pr === r && pc === c)) return "pattern";
  if (collectDetailTouchedCells(ph).some(([pr, pc]) => pr === r && pc === c)) return "chainDetail";
  if (ph.peers.includes(`${r},${c}`)) return "peer";
  return null;
}
// 提示要消除的候选数,精确到具体数字,而不只是"这个格子有牵连"——
// 一个格子完全可能同时被划掉好几个候选数(比如唯一矩形同时消掉
// 两个数字),所以返回的是一个数字集合,不是单个布尔值。跟
// hintHighlight的"eliminate"角色是同一个数据来源,只是这里要精确到
// 数字层面,给候选数迷你格子逐个上色用,不是给整个格子上色用。
function hintEliminatedDigitsAt(r, c) {
  if (state.mode !== "play" || !state.play.pendingHint) return null;
  const ph = state.play.pendingHint;
  if (ph.actionType !== "eliminate") return null;
  const digits = ph.eliminations.filter((e) => e.r === r && e.c === c).map((e) => e.digit);
  return digits.length > 0 ? new Set(digits) : null;
}
// 3D Medusa专用:某个候选数在这次染色里属于哪个阵营(0或1)。跟
// hintEliminatedDigitsAt并列,同样精确到候选数级别,但这个是"阵营
// 归属"信息,不是"要被消除"信息——3D Medusa里,染色网络中只有
// 落在badColor那个阵营的候选数最终会被消除,另一半(好阵营)只是
// 展示信息,不会出现在eliminations里,所以要单独一条通路。除了
// medusa3D技巧,其它任何技巧的pendingHint都返回null,不受影响。
function hintPatternColorAt(r, c, d) {
  if (state.mode !== "play" || !state.play.pendingHint) return null;
  const ph = state.play.pendingHint;
  if (ph.technique !== "medusa3D" || !ph.context || !ph.context.coloring) return null;
  const hit = ph.context.coloring.find((n) => n.r === r && n.c === c && n.d === d);
  return hit ? hit.color : null;
}
function cellMatchesHighlightDigit(r, c) {
  if (state.mode !== "play" || state.play.highlightDigit === null) return false;
  return state.play.grid[r][c] === state.play.highlightDigit;
}

function cellStyle(r, c, conflicts) {
  const role = getCellRole(r, c);
  const conflict = isCellConflict(r, c, conflicts);
  const sel = isCellSelected(r, c);
  const selPeer = isCellSelectedPeer(r, c);
  const hh = hintHighlight(r, c);
  const sameDigit = cellMatchesHighlightDigit(r, c);

  let bg = "transparent";
  let textColor = COLORS.ink;
  let fontWeight = 500;
  let ring = "none";

  if (role === "given" || role === "authored") {
    fontWeight = 700;
    textColor = COLORS.ink;
  } else if (role === "user") {
    fontWeight = 600;
    textColor = COLORS.accent;
  } else if (role === "hint") {
    fontWeight = 600;
    textColor = COLORS.hint;
  } else if (role === "solution") {
    fontWeight = 600;
    textColor = COLORS.inkSoft;
  }

  if (selPeer) bg = COLORS.inkSoft + "12";
  if (sameDigit) {
    bg = COLORS.hint + "3D";
    ring = `inset 0 0 0 1.5px ${COLORS.hint}99`;
  }
  if (hh === "peer") bg = COLORS.accent + "14";
  // chainDetail(强制链详细推导涉及的格子)刻意做得比pattern更轻——
  // 一条链条最多能牵扯到約30个格子,用跟pattern一样重的高亮会让整个
  // 盘面看起来"到处都在闪",分不清重点在哪。
  if (hh === "chainDetail") bg = COLORS.chain + "12";
  if (hh === "pattern") {
    bg = COLORS.accent + "24";
    ring = `inset 0 0 0 1.5px ${COLORS.accent}88`;
  }
  if (hh === "eliminate") {
    bg = COLORS.error + "1A";
    ring = `inset 0 0 0 1px ${COLORS.error}77`;
  }
  if (sel) {
    bg = COLORS.accent + "1F";
    ring = `inset 0 0 0 2px ${COLORS.accent}AA`;
  }
  if (hh === "target") {
    const isFix = state.mode === "play" && state.play.pendingHint && state.play.pendingHint.actionType === "fix";
    bg = isFix ? COLORS.error + "33" : COLORS.accent + "33";
    ring = `inset 0 0 0 2px ${isFix ? COLORS.error : COLORS.accent}`;
    if (isFix) textColor = "#7A2828";
  }
  if (conflict) {
    bg = COLORS.error + "26";
    textColor = "#7A2828";
    ring = `inset 0 0 0 1px ${COLORS.error}`;
  }
  return { bg, textColor, fontWeight, ring };
}
function cellBorderStyle(r, c) {
  return {
    borderTop: r % 3 === 0 ? `2px solid ${COLORS.ink}` : `1px solid ${COLORS.inkSoft}40`,
    borderLeft: c % 3 === 0 ? `2px solid ${COLORS.ink}` : `1px solid ${COLORS.inkSoft}40`,
    borderRight: c === 8 ? `2px solid ${COLORS.ink}` : "none",
    borderBottom: r === 8 ? `2px solid ${COLORS.ink}` : "none",
  };
}

/* ------------------------------ 渲染 ------------------------------ */

function noteColorFor(tone) {
  if (tone === "success" || tone === "win") return COLORS.success;
  if (tone === "error") return COLORS.error;
  if (tone === "hint") return COLORS.hint;
  return COLORS.inkSoft;
}

function render() {
  refreshColors(); // 必须在其余render*之前——cellStyle/cellBorderStyle等都是同步读COLORS这个模块级变量的
  renderHeader();
  renderDifficultyArea();
  renderCreateHint();
  renderTimerRow();
  renderGrid();
  renderChainOverlay();
  renderNote();
  renderValidationExtra();
  renderControls();
  renderHistoryRow();
  renderNumberPad();
  renderStringPanels();
  renderSettingsPanel();
  renderSoundnessErrorModal();
}

function renderHeader() {
  document.getElementById("mode-play-btn").classList.toggle("seg-active", state.mode === "play");
  document.getElementById("mode-create-btn").classList.toggle("seg-active", state.mode === "create");
  document.getElementById("mode-settings-btn").classList.toggle("seg-active", state.mode === "settings");
  // "做题"/"自建"原来那一堆内容(棋盘、控制区、数字盘……)整体包在
  // main-content里,"设置"是完全独立的第三块内容,在顶层这一处统一
  // 切换显隐——不用去改前面十几个渲染函数各自内部的mode判断逻辑,
  // 它们该clear自己内容就clear,不冲突。
  const isSettings = state.mode === "settings";
  document.getElementById("main-content").style.display = isSettings ? "none" : "";
  document.getElementById("settings-panel").style.display = isSettings ? "" : "none";
}

function renderDifficultyArea() {
  const el = document.getElementById("difficulty-area");
  if (state.mode !== "play") {
    el.innerHTML = "";
    return;
  }

  const chips = Object.entries(DIFFICULTY_CONFIG)
    .map(([key, cfg]) => {
      const active = state.selectedDifficulty === key;
      return `<button class="chip ${active ? "chip-active" : ""}" data-action="select-difficulty" data-diff="${key}">${cfg.label}</button>`;
    })
    .join("");

  const customActive = state.selectedDifficulty === "custom";
  const givenCount = state.play.given ? state.play.given.flat().filter(Boolean).length : 0;
  const labelHtml = state.play.solution
    ? `<span class="mono-note" style="margin-left:auto;">${state.play.difficulty === "custom" ? "自定义 · " : ""}已知 ${givenCount} 格</span>`
    : "";

  let html = `
    <div class="row-wrap">
      ${chips}
      <button class="chip ${customActive ? "chip-active" : ""}" data-action="select-custom">自定义</button>
      <button class="icon-btn" data-action="refresh" title="再来一局" aria-label="再来一局">${ICONS.refresh}</button>
      ${labelHtml}
    </div>
  `;

  if (customActive) {
    html += `
      <div class="row-wrap custom-row">
        <input type="number" min="17" max="45" id="custom-clue-input" value="${state.customClue}" />
        <span class="mono-note">个已知数(17–45;17–21 来自已验证的真实极限数独库,22 起靠现场挖空生成)—— 改完点上面的刷新按钮生成</span>
      </div>
    `;
  }

  el.innerHTML = html;

  if (customActive) {
    const input = document.getElementById("custom-clue-input");
    input.addEventListener("input", (e) => {
      state.customClue = e.target.value;
    });
    input.addEventListener("blur", (e) => {
      const v = Math.max(17, Math.min(45, Math.round(Number(e.target.value)) || 30));
      state.customClue = v;
      e.target.value = v;
    });
  }
}

function renderCreateHint() {
  const el = document.getElementById("create-hint");
  el.style.display = state.mode === "create" ? "block" : "none";
}

// 主题切换:手写clip-path方案(View Transitions API已经弃用,见上面
// CSS里.theme-transition-clone旁的说明)。做法是克隆一份当前画面,
// 强制它显示"新主题"的样子(包括手动纠正图标状态,见下面注释),
// 盖在真实页面上方,clip-path从按钮圆心的0px长到覆盖全屏的
// maxRadius——新主题的截图从圆心向外"长出来",真实页面这段时间
// 完全没动(还是旧主题),等克隆层长满整个视口、跟真实页面即将
// 切换成的样子完全一致了,才真正切换真实页面并把克隆层拿掉,
// 无缝衔接不会闪一下。
// 不支持clip-path过渡效果的环境、或用户开了"减少动态效果"系统
// 偏好时,直接瞬间切换,不用任何动画掩饰——降级到"能用但没有这个
// 视觉效果",不是降级到"不能用"。
// 主题切换:手写clip-path方案(View Transitions API已经弃用,见上面
// CSS里.theme-transition-clone旁的说明)。用两份静态快照叠出来:
// 旧主题快照(oldClone)当固定背景,真实页面立刻切换成新主题(不再
// 拖到动画结束才切——拖到最后切会导致"圆圈已经扩散过去但旁边的
// 文字还没变"这种滞后,以及摘掉克隆层那一刻的闪烁,这两个问题上一
// 版都踩过);再从切换后的真实DOM克隆第二份快照(newClone),这份
// 天然保证每个文字/图标/颜色细节都是对的,不用一处处手动纠正。
// newClone盖在oldClone上面,clip-path从按钮圆心的0px长到覆盖全屏的
// maxRadius,新主题从圆心向外"长出来";动画结束只是把两层快照一起
// 摘掉,真实页面早就是对的,不需要再切一次,自然没有闪烁。
// 不支持clip-path过渡效果的环境、或用户开了"减少动态效果"系统
// 偏好时,直接瞬间切换,不用任何动画掩饰——降级到"能用但没有这个
// 视觉效果",不是降级到"不能用"。
function applyThemeWithTransition(newTheme, originX, originY) {
  // 动画播完之前不接受新的切换请求——不然连续点击会同时挂好几组
  // 克隆层叠在一起,状态和视觉都会错乱。
  if (state.themeTransitionActive) return;

  const oldTheme = state.theme;
  const doSwitch = () => {
    state.theme = newTheme;
    document.documentElement.setAttribute("data-theme", newTheme);
    if (state.settings.rememberTheme) {
      try {
        localStorage.setItem("sudoku-theme", newTheme);
      } catch (err) {
        /* 存储不可用:主题切换本身照常生效,只是这次没能持久化,
           不因为这个次要功能失败就打断主线操作。 */
      }
    }
    render();
  };
  // 无障碍偏好:跟用哪种转场技术无关,不管走不走圆形扩散效果都要
  // 尊重这个系统设置,开了就直接瞬间切换,不播放动画。
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduceMotion) {
    doSwitch();
    return;
  }

  const x = originX ?? window.innerWidth / 2;
  const y = originY ?? window.innerHeight / 2;
  const maxRadius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
  const scrollX = window.scrollX;
  const scrollY = window.scrollY;
  const docWidth = document.documentElement.clientWidth;
  const isDarkOld = oldTheme === "dark";
  const isDarkNew = newTheme === "dark";

  // 外层容器是position:fixed的视口窗口,天生不知道文档此刻滚动了
  // 多少;克隆下来的<body>如果不额外处理,会按它原本的文档流位置
  // (即从scrollTop=0开始)渲染,跟真实页面此刻实际展示的、已经
  // 滚动过的画面对不上——这是"展开设置说明(页面变高需要滚动)后
  // 再切主题,圆圈内容跟按钮位置对不上"这个问题的根因。用绝对定位
  // 把它重新钉回此刻在文档坐标系里的真实位置(往上/往左偏移当前
  // 滚动量)来补偿。两份快照(旧/新)共用同一份坐标,严丝合缝叠在
  // 一起。
  const alignCloneToScroll = (node) => {
    node.style.position = "absolute";
    node.style.top = `${-scrollY}px`;
    node.style.left = `${-scrollX}px`;
    node.style.margin = "0";
    node.style.width = `${docWidth}px`;
  };
  // cloneNode(true)会把子树里所有元素的id原样复制一份——这个app
  // 到处都是document.getElementById(...),克隆层短暂挂在DOM里的
  // 这几百毫秒,如果任何一次render()被触发(比如Worker回调、定时器
  // 凑巧在这个窗口内触发),getElementById可能因为重复id抓到克隆层
  // 里这份看不见、不该被操作的节点,产生很隐蔽的bug。克隆层本来就
  // 是纯装饰、不需要任何可寻址性,把整棵子树里的id全部清掉最干净。
  const stripIds = (node) => {
    node.removeAttribute("id");
    node.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
  };

  let oldWrapper, newWrapper;
  let prevHtmlOverflow, prevBodyOverflow;
  try {
    const oldClone = document.body.cloneNode(true);
    stripIds(oldClone);
    alignCloneToScroll(oldClone);
    // 显式钉住data-theme=旧主题:CSS自定义属性是活的、跟着DOM实时
    // 级联,不这样钉住的话,下面doSwitch()一把<html>的data-theme改成
    // 新主题,这份背景快照的颜色会立刻跟着跳过去(但里面baked的文字
    // /图标还是旧状态),变成颜色新、内容旧的诡异混合。
    oldClone.setAttribute("data-theme", oldTheme);
    oldWrapper = document.createElement("div");
    oldWrapper.className = "theme-transition-clone";
    oldWrapper.setAttribute("aria-hidden", "true");
    oldWrapper.appendChild(oldClone);
    // 注意:这里先不appendChild到真实document.body——下面还要再
    // cloneNode(document.body)一次拿新快照,如果这层已经先挂上去了,
    // 第二次克隆body会把这层克隆递归克隆进新快照里面(克隆的克隆),
    // 白白多出一份嵌套的旧画面。等两份快照都在内存里准备好了,
    // 后面一次性按顺序挂上去。
  } catch (err) {
    doSwitch();
    return;
  }

  doSwitch(); // 真实页面立刻切换,后面新快照直接从这份已经切好的DOM克隆

  try {
    const newClone = document.body.cloneNode(true);
    stripIds(newClone);
    alignCloneToScroll(newClone);
    // 同样显式钉住,道理跟旧快照那份一致——虽然此刻<html>已经是新
    // 主题、理论上这段时间不会再变,但钉住不依赖这个隐含假设,成本
    // 几乎为零。
    newClone.setAttribute("data-theme", newTheme);
    // 主题按钮的图标(旋转角度+两个svg的透明度)是JS按isDark算出来
    // 直接写的行内样式,不受data-theme联动。这份新快照克隆自切换后
    // 的真实DOM,图标本来就已经是新主题该有的最终状态——这里先把
    // 它手动倒回旧状态,配合下面加的CSS过渡,在克隆层内部真的转
    // 一圈,而不是像之前那样瞬间跳过去。这份克隆节点整个转场期间
    // 都是活的,不会像真实DOM那样被下一次render()整体重建打断,
    // 过渡效果放心用。
    const iconWrap = newClone.querySelector(".theme-icon-wrap");
    let svgs = [];
    if (iconWrap) {
      svgs = Array.from(iconWrap.querySelectorAll(".theme-icon-svg"));
      iconWrap.style.transition = "transform 500ms ease-in-out";
      svgs.forEach((svg) => (svg.style.transition = "opacity 500ms ease-in-out"));
      iconWrap.style.transform = `rotate(${isDarkOld ? 180 : 0}deg)`;
      if (svgs[0]) svgs[0].style.opacity = isDarkOld ? "0" : "1";
      if (svgs[1]) svgs[1].style.opacity = isDarkOld ? "1" : "0";
    }
    newWrapper = document.createElement("div");
    newWrapper.className = "theme-transition-clone";
    newWrapper.setAttribute("aria-hidden", "true");
    newWrapper.style.clipPath = `circle(0px at ${x}px ${y}px)`;
    newWrapper.appendChild(newClone);

    // 两份快照都齐了,现在才真正挂到真实DOM上——先旧后新,保证新
    // 快照(会长大的那层)在层叠顺序里盖在旧快照上面。
    document.body.appendChild(oldWrapper);
    document.body.appendChild(newWrapper);

    // 动画期间锁定页面滚动:两层快照都是position:fixed,天生不会
    // 跟手指滑动;如果不锁,真实页面(已经切换完、被快照挡住看不见)
    // 会在快照底下悄悄滚动,松手快照一摘就是画面突然跳一下,而且
    // 动画中途"旧主题区域跟着滑动、新主题区域不跟着滑动"这种两块
    // 不一致的观感也是因为真实页面在滚而固定快照不在滚。锁住之后
    // 整个转场期间画面统一"冻结",跟大多数app转场遮罩的做法一致。
    state.themeTransitionActive = true;
    prevHtmlOverflow = document.documentElement.style.overflow;
    prevBodyOverflow = document.body.style.overflow;
    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      if (oldWrapper.parentNode) oldWrapper.parentNode.removeChild(oldWrapper);
      if (newWrapper.parentNode) newWrapper.parentNode.removeChild(newWrapper);
      document.documentElement.style.overflow = prevHtmlOverflow;
      document.body.style.overflow = prevBodyOverflow;
      state.themeTransitionActive = false;
    };
    // 只认newWrapper自己的clip-path过渡结束事件——transitionend会
    // 冒泡,图标的transform/opacity过渡(挂在newWrapper的子节点上)
    // 时长虽然设的一样,但如果不过滤target/propertyName,冒泡上来的
    // 图标过渡结束事件可能先到,导致克隆层在clip-path动画真正播完
    // 之前就被提前摘掉。
    newWrapper.addEventListener("transitionend", (e) => {
      if (e.target === newWrapper && e.propertyName === "clip-path") finish();
    });
    // 保险:万一transitionend没触发(比如这个环境clip-path过渡不
    // 生效),不能让两层克隆+滚动锁定永久卡住——700ms给了500ms动画
    // 本身200ms余量,到点强制收尾,done标记保证不会重复执行。
    setTimeout(finish, 700);

    // 下一帧再把目标值改过去,让transition真的播出来——如果跟上面
    // 设置初始值放在同一帧,浏览器会直接跳到终态,拿不到过渡动画
    // 效果,需要等一帧布局/样式先生效,再触发目标值的变化。
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        newWrapper.style.clipPath = `circle(${maxRadius}px at ${x}px ${y}px)`;
        if (iconWrap) {
          iconWrap.style.transform = `rotate(${isDarkNew ? 180 : 0}deg)`;
          if (svgs[0]) svgs[0].style.opacity = isDarkNew ? "0" : "1";
          if (svgs[1]) svgs[1].style.opacity = isDarkNew ? "1" : "0";
        }
      });
    });
  } catch (err) {
    // 新快照建失败:真实页面已经切换完成(上面doSwitch()已经跑过),
    // 只是这个装饰性的圆形扩散效果没做成,把已经挂上去的克隆层都
    // 清掉,不能让它们留在页面上一直挡住已经切换好的真实内容。
    if (oldWrapper && oldWrapper.parentNode) oldWrapper.parentNode.removeChild(oldWrapper);
    if (newWrapper && newWrapper.parentNode) newWrapper.parentNode.removeChild(newWrapper);
    // 万一失败发生在锁定滚动之后(理论上后面都是纯赋值,风险很低,
    // 但不为这个假设兜底成本也不高)——按锁是否已经生效来判断要不要
    // 还原,不能让页面永久卡在锁住滚动、点不动主题按钮的状态。
    if (state.themeTransitionActive) {
      document.documentElement.style.overflow = prevHtmlOverflow;
      document.body.style.overflow = prevBodyOverflow;
      state.themeTransitionActive = false;
    }
  }
}

// 键盘快捷键自定义:固定按键(方向键/数字1-9/Backspace/Delete)加上
// 几个有明确浏览器原生含义的键(Escape/Tab/Enter/Space)一律不能被
// 自定义快捷键占用——不是因为它们"更重要",是因为占用了要么跟固定
// 按键本身冲突,要么会让Tab导航/Enter激活按钮这些浏览器原生行为
// 出问题。
const RESERVED_SHORTCUT_KEYS = new Set([
  "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
  "Backspace", "Delete", "Escape", "Tab", "Enter", " ",
  "1", "2", "3", "4", "5", "6", "7", "8", "9",
]);
const KEY_BINDING_LABELS = { up: "上", down: "下", left: "左", right: "右", erase: "清除" };
const KEY_BINDING_DEFAULT_HINT = { up: "↑", down: "↓", left: "←", right: "→", erase: "Backspace/Delete" };
// 按键怎么显示给用户看:空格键单独给个可读的名字,单个字符统一转
// 大写(键盘上敲的是哪个字母不重要,大小写视觉上更清楚是"一个按键"
// 而不是普通文字)。
function describeShortcutKey(key) {
  if (key === " ") return "Space";
  if (key.length === 1) return key.toUpperCase();
  return key;
}
// 尝试把按键key绑定给action(up/down/left/right/erase之一)。成功
// 返回{ok:true},失败返回{ok:false,reason}——冲突检查按位置固定
// 按键优先、其它自定义绑定其次的顺序查,不合规矩一律拒绝,不做
// "覆盖掉别的绑定"这种隐式行为,避免用户设置A的时候意外把B的绑定
// 悄悄清掉。
function tryAssignKeyBinding(action, key) {
  if (RESERVED_SHORTCUT_KEYS.has(key)) {
    return { ok: false, reason: `"${describeShortcutKey(key)}"已经是固定按键,不能重复绑定` };
  }
  const bindings = state.settings.keyBindings;
  for (const [otherAction, otherKey] of Object.entries(bindings)) {
    if (otherAction !== action && otherKey && otherKey.toLowerCase() === key.toLowerCase()) {
      return { ok: false, reason: `"${describeShortcutKey(key)}"已经绑定给了"${KEY_BINDING_LABELS[otherAction]}",请先清除那一项再绑定` };
    }
  }
  bindings[action] = key;
  return { ok: true };
}
// 只在用户勾选了"记住我的按键设置"时才真的写localStorage,跟主题
// 偏好那份opt-in逻辑同一个道理。存储不可用(隐私模式/受限WebView)
// 时静默忽略,不让这个次要功能的失败打断主线操作。
function persistKeyBindingsIfEnabled() {
  if (!state.settings.rememberKeyBindings) return;
  try {
    localStorage.setItem("sudoku-key-bindings", JSON.stringify(state.settings.keyBindings));
  } catch (e) {
    /* 同上,静默忽略 */
  }
}
// 运行时判断某个按下的键key是不是action这个动作绑定的自定义额外
// 按键——大小写不敏感(键盘上敲的是哪个大小写不重要)。
function matchesKeyBinding(action, key) {
  const bound = state.settings.keyBindings[action];
  return !!bound && bound.toLowerCase() === key.toLowerCase();
}

function renderSettingsPanel() {
  const el = document.getElementById("settings-panel");
  if (state.mode !== "settings") {
    el.innerHTML = "";
    return;
  }
  const on = state.settings.preferAdvancedHint;
  const listOn = state.settings.listTechniquesOnHint;
  const detailOn = state.settings.showChainDetail;
  const isDark = state.theme === "dark";
  const explainOpen = state.settingsUI.explainOpen;
  // 键盘快捷键这个区块只想给"看着有实体键盘/鼠标"的设备看——用
  // pointer:fine这个媒体查询(鼠标/触控板这类精确指针设备为真,纯
  // 触屏为假)判断,比瞎猜UA/屏幕宽度更贴近"这台设备到底有没有键盘"
  // 这个实际问题。触屏笔记本这类两者都有的设备会显示,这没问题,
  // 它们确实也有键盘。
  const isDesktopPointer = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(pointer: fine)").matches;
  el.innerHTML = `
    <div class="row-wrap" style="align-items:flex-start;gap:12px;">
      <button class="chip ${on ? "chip-active" : ""}" data-action="toggle-prefer-advanced-hint" style="flex-shrink:0;" ${!on && listOn ? "disabled" : ""}>
        提示/Auto模式优先用高级技巧${on ? "(已开启)" : "(已关闭,默认)"}
      </button>
    </div>
    <details class="settings-explain" data-explain-key="preferAdvancedHint" ${explainOpen.preferAdvancedHint ? "open" : ""}>
      <summary>说明</summary>
      <div class="mono-note" style="margin-top:8px; line-height:1.7;">
        「提示」按钮和Auto模式背后,是同一套技巧链——从最简单的唯一余数法
        一路试到最新加的MSLS,一共${TECHNIQUE_CHAIN.length}个技巧,按SE难度分值从低到高
        依次尝试,命中第一个就用它。默认关闭时用的就是这个顺序,好处是
        "能用简单技巧就不用复杂的",符合大多数人解题时的直觉;但代价是
        像Death Blossom、3D Medusa、Unary/Nishio/Multiple Chain这类排在
        很后面的高阶技巧,只要盘面里同时也存在AIC、ALS-链这些排在它们
        前面又足够强的技巧,几乎永远轮不到自己出场——不是它们不能用,
        是常年被"更能干的师兄"抢走工作,内部戏称"饿死"。<br/><br/>
        打开这个开关之后,「提示」和Auto模式会改成按SE难度分值从
        <b>高到低</b>依次尝试,同一批技巧,顺序反过来——你会更容易看到
        Multiple/Nishio/Unary Chain、3D Medusa、Death Blossom这类高阶
        技巧真正出现在提示里,代价是简单题目也可能被"杀鸡用牛刀",提示
        看起来比实际需要的更复杂。这个开关只影响「提示」和Auto模式怎么
        找下一步,不影响题目本身,也不会让原本无解的格子变得有解。<br/><br/>
        「做题」页面的「测难度」和「自建」页面的「校验」,衡量的是
        <b>这道题客观上有多难</b>(SudokuExplainer风格的评分,取用到过的
        最高难度那一步),不是"这次刚好用什么技巧解出来的"——所以这两个
        按钮背后永远用默认顺序(从低到高)计算,不受这个开关影响,不管
        你在设置里怎么切换,同一道题测出来的难度分值都是一样的。<br/><br/>
        随开随关,立刻生效:比如做题做到一半,跑来这里打开开关,再切回
        「做题」,下一次点「提示」就已经是新顺序了,不用重新开一局;
        关掉也一样立刻生效。这个设置只存在内存里,刷新页面会恢复成
        默认的关闭状态,不会跨会话记住。<br/><br/>
        跟下面「提示列出全部技巧」互斥,不能同时打开——两个开关管的都是
        「提示」按钮该表现成什么样,同时生效会让提示按钮的行为定义不清楚,
        所以做成二选一。
      </div>
    </details>

    <div class="row-wrap" style="align-items:flex-start;gap:12px;margin-top:16px;">
      <button class="chip ${listOn ? "chip-active" : ""}" data-action="toggle-list-techniques-on-hint" style="flex-shrink:0;" ${!listOn && on ? "disabled" : ""}>
        提示列出全部技巧${listOn ? "(已开启)" : "(已关闭,默认)"}
      </button>
    </div>
    <details class="settings-explain" data-explain-key="listTechniquesOnHint" ${explainOpen.listTechniquesOnHint ? "open" : ""}>
      <summary>说明</summary>
      <div class="mono-note" style="margin-top:8px; line-height:1.7;">
        只影响手动点「提示」这一个按钮,跟Auto模式、「测难度」、「校验」
        都没有关系。默认关闭时,点「提示」会直接给出/高亮下一步该做什么,
        这是目前唯一的行为。<br/><br/>
        打开之后,点「提示」不会直接给结论,而是先把当前盘面上能找到的
        <b>全部</b>技巧都扫一遍(不只是第一个命中的),列出所有技巧的名字
        供你挑——盘面本身不会高亮,也不会算做用了一次提示。点了列表里
        某个技巧名字,才会高亮对应的格子/候选数;这时候再点一次「揭晓
        数字」(原来的「提示」按钮),才会真正把这一步应用到盘面上。<br/><br/>
        跟上面「优先用高级技巧」互斥——原因不是两者同时生效有逻辑冲突
        (对Auto模式来说确实没有影响),而是两个开关都在决定「提示」

        所以做成二选一,而不是定义一套"两者都开"时的组合规则。<br/><br/>
        技巧列表算出来之后,如果你没有点选任何一项就改动了盘面(填数字、

      </div>
    </details>

    <div class="row-wrap" style="align-items:flex-start;gap:12px;margin-top:16px;">
      <button class="chip ${detailOn ? "chip-active" : ""}" data-action="toggle-chain-detail" style="flex-shrink:0;">
        强制链详细推导${detailOn ? "(已开启)" : "(已关闭,默认)"}
      </button>
    </div>
    <details class="settings-explain" data-explain-key="chainDetail" ${explainOpen.chainDetail ? "open" : ""}>
      <summary>说明</summary>
      <div class="mono-note" style="margin-top:8px; line-height:1.7;">
        Nishio/Unary/Multiple Chain、Tridagon Force Chain这几个技巧,和
        Nishio/Unary/Multiple对应的Dynamic版本,推导过程是"假设一个
        候选数(或几个候选数里必有一个)成立,一路传播到矛盾或者收敛
        到同一个结论",跟AIC那种一条链首尾相连不一样——这几个可能同时
        有好几条假设分支、Dynamic版本单条分支还可能长达几千步。默认
        关闭时,这几个技巧只告诉你"假设了什么、最后推出了什么",不逐步
        展开;盘面高亮哪些格子因技巧而异——Unary/Nishio/Cell版
        Multiple高亮的是假设起点那一个格子,Region版Multiple高亮那个
        数字在区域里的全部候选位置,Tridagon Force Chain高亮组成
        Tridagon结构的12个格子——但都只是普通高亮,不画连接线。<br/><br/>
        打开这个开关之后,会把每一条分支的逐步推导拆开显示(复用每一步
        自己技巧的说明文案编号列出来)。老实说这里名不副实:曾经想过
        分支数不多时(NishioChain 1条、UnaryChain 2条)在盘面上画出
        对应的曲线,但这部分实际上从来没写——多分支怎么在9x9盘面上画
        清楚(不叠成一团)是需要单独设计的事,不是这个开关顺手就能做的,
        所以现在不管分支多还是少(NishioChain到CellForcingChain/
        RegionForcingChain的最多9条、Tridagon Force Chain的最多8条),
        一律只给文字,没有例外。Dynamic版本如果单条分支长度超过一个
        阈值,同样会跳过逐步展开,回退到摘要文案,并且明确告诉你"这条
        链多长、为什么没有展开",不会假装什么都没发生。<br/><br/>
        跟「提示列出全部技巧」一起开的时候:扫描全部技巧、建列表那一步
        不会真的按这个开关的详细程度去算(那样等于每个命中的强制链技巧
        都白白多算一次没人看的详细推导)——只有你确实从列表里点中了一个
        强制链技巧,才会针对那一个单独重算一次详细推导,跟平时单命中
        流程的开销是一样的,不会因为开着列表模式而变贵。<br/><br/>
        同样随开随关,立刻生效,不做跨会话持久化。
      </div>
    </details>

        这里填的是<b>总</b>时长,不是单个阶段的时长——Auto模式每一步会
        自动均分成两个阶段:先展示"这一步用了什么技巧、推理过程是
        什么"(思考展示阶段),过了一半时间之后再展示"技巧生效之后的
        盘面"(结果展示阶段),两个阶段各占这里填的数字的一半。比如
        填3000(默认值),思考展示1500ms、结果展示1500ms;填10000
        (上限),两个阶段各5000ms。<br/><br/>
        下限${AUTO_STEP_INTERVAL_MIN_MS}ms是"两个阶段还能有效展示"的
        最低要求,低于这个数字推理文字基本来不及看清;上限
        ${AUTO_STEP_INTERVAL_MAX_MS}ms是经验判断——Auto模式终究是给
        人看推理过程用的,需要更长间隔慢慢看的场景,更适合用手动

        一样是纯内存偏好,不跨题重置(切换/开新题目不会清空这个数字),

        自建那边的画面,不是设置面板,结果理应出现在你正在看的地方,

        这个环境支持后台线程(Worker)的情况下,计算过程中会每隔至少

// 键盘快捷键自定义区块——只有renderSettingsPanel确认isDesktopPointer
// 为真才会被调用,手机端这段HTML连DOM里都不会出现,不是靠CSS藏起来。
function renderKeyBindingsSection() {
  const bindings = state.settings.keyBindings;
  const capturing = state.settingsUI.capturingKeyFor;
  const msg = state.settingsUI.keyBindingMessage;
  const rows = ["up", "down", "left", "right", "erase"]
    .map((action) => {
      const custom = bindings[action];
      const isCapturingThis = capturing === action;
      const valueText = isCapturingThis
        ? "请按下想要的按键…(Esc 取消)"
        : custom
          ? describeShortcutKey(custom)
          : "未设置";
      return `
        <div class="row-wrap" style="align-items:center;gap:10px;margin-top:6px;">
          <span class="mono-note" style="width:5em;">${KEY_BINDING_LABELS[action]}(${KEY_BINDING_DEFAULT_HINT[action]} 始终生效)</span>
          <button class="chip ${isCapturingThis ? "chip-active" : ""}" data-action="capture-key-binding" data-kb-action="${action}">${valueText}</button>
          ${custom && !isCapturingThis ? `<button class="chip" data-action="clear-key-binding" data-kb-action="${action}">清除</button>` : ""}
        </div>
      `;
    })
    .join("");
  return `
    <div class="settings-section-divider"></div>
    <div class="mono-note" style="font-weight:600;">键盘快捷键(桌面端)</div>
    <div class="mono-note" style="margin-top:4px;">
      方向键选格子、数字键 1-9 直接填入、Backspace/Delete 清除,这些
      始终生效,不受下面的设置影响。下面每一项可以再加一个你喜欢的
      额外按键(比如喜欢 WASD 的话,给"上"加个 W)——是补充,不会
      替换或取消上面那些固定按键。
    </div>
    ${rows}
    <div class="row-wrap" style="align-items:center;margin-top:10px;">
      <label class="mono-note" style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" data-action="toggle-remember-key-bindings" ${state.settings.rememberKeyBindings ? "checked" : ""} />
        记住我的按键设置(保存在本机)
      </label>
    </div>
    ${msg ? `<div class="mono-note" style="margin-top:6px;color:${COLORS.error};">${msg}</div>` : ""}
  `;
}

// 渲染盘面正确性检查的报错弹层。state.play.soundnessError为null时

// 有内容时占满全屏、盖在其余一切UI之上——这个报错的优先级理应高于

  const el = document.getElementById("soundness-error-modal");

    return;
  }
  el.innerHTML = `

      <div class="soundness-card">

          盘面和用到的技巧,<b>请点「复制报告」把内容复制下来并反馈给开发者</b>,
