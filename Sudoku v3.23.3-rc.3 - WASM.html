<script>

// 必须在脚本一开始就捕获,document.currentScript只在当前script标签
// 同步执行期间有效,晚一点(比如某个函数里再去读)就会拿到null——
// 这是后面Worker能"原封不动复用这份脚本、不用另外维护一份"的前提。
const MAIN_SCRIPT_SOURCE =
  typeof document !== "undefined" && document.currentScript ? document.currentScript.textContent : "";

/* ----------------------------------------------------------------
   设计基调:graph-paper / drafting-table 笔记本风格。
   ink = 深墨色线条与文字,accent = 铜棕色(用户落子与交互高亮),
   hint = 灰蓝色(提示揭晓的数字,与用户自填区分)。
   ---------------------------------------------------------------- */
const FONT_DISPLAY = "'Space Grotesk', system-ui, -apple-system, sans-serif";
const FONT_MONO = "'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace";

// COLORS.bg/panel/ink/inkSoft/accent/hint/error/success这8个是"活的"
// ——refreshColors()每次render()开头会从当前生效的CSS变量里现读一遍
// 覆盖掉,不是写死在这里就不变了。这里的字面量只是DOMContentLoaded
// 真正跑起来、第一次调用refreshColors()之前的安全默认值。
// chain/medusaA/medusaB(强制链连线、3D Medusa双阵营染色)这次保持
// 写死——链条箭头图层核实过暗色下依然清晰,不在这轮要修的范围内,
// 没有unverified的暗色数值,不贸然接进去。以后如果要让这两组也
// 跟主题走,需要先单独为它们计算、验证暗色数值,不能直接复用现在
//这套改法。
let COLORS = {
  bg: "#E7ECEA",
  panel: "#F7F9F7",
  ink: "#22313A",
  inkSoft: "#5C6F74",
  accent: "#C2703A",
  hint: "#3D7A8A",
  error: "#B23B3B",
  success: "#3F7D58",
  chain: "#E2521F", // 链式技巧(AIC/xyChain/W-Wing等)的连线+箭头专用色,
  // 饱和橙红,跟盘面本身的墨色网格线、accent的铜棕色、error的砖红都
  // 拉开明显差距,不会互相混淆语义、也不会被盘面底色吃掉对比度。
  medusaA: "#B8963E", // 3D Medusa染色阵营A(暖金),只在这一个技巧里用到
  medusaB: "#7A5C99", // 3D Medusa染色阵营B(浅紫),跟阵营A互为对抗色
};
// 每次render()开头调一次(不是81个格子各调一次)——getComputedStyle
// 本身不算贵,但没必要真的挂81次。CSS里已经有--ink/--ink-soft等
// 对应的暗色数值(上一轮暗色主题工作时算过、验证过的),这里只是把
// 已经在CSS里生效的值搬进JS这边在用的同一个对象,不引入新数值,
// 也不需要再单独维护一份"暗色版COLORS"手动保持同步。
function refreshColors() {
  const cs = getComputedStyle(document.documentElement);
  const read = (name) => cs.getPropertyValue(name).trim();
  COLORS.bg = read("--bg") || COLORS.bg;
  COLORS.panel = read("--panel") || COLORS.panel;
  COLORS.ink = read("--ink") || COLORS.ink;
  COLORS.inkSoft = read("--ink-soft") || COLORS.inkSoft;
  COLORS.accent = read("--accent") || COLORS.accent;
  COLORS.hint = read("--hint") || COLORS.hint;
  COLORS.error = read("--error") || COLORS.error;
  COLORS.success = read("--success") || COLORS.success;
}

const DIFFICULTY_CONFIG = {
  easy: { label: "简单", removeTarget: 40 },
  medium: { label: "中等", removeTarget: 51 },
  hard: { label: "困难", removeTarget: 57 },
};

/* ---------------------------- 基础工具 ---------------------------- */

function emptyGrid() {
  return Array.from({ length: 9 }, () => Array(9).fill(0));
}
function cloneGrid(g) {
  return g.map((row) => row.slice());
}
// 81位数独字符串编解码。空格统一识别"0"和"."(可以在同一个字符串里
// 混用,不强制二选一);编码永远统一输出"0"表示空格,不含糊。
function gridToPuzzleString(grid) {
  return grid.map((row) => row.map((v) => (v === 0 ? "0" : String(v))).join("")).join("");
}
function parsePuzzleString(raw) {
  const cleaned = raw.replace(/\s+/g, ""); // 去掉换行/空格,不管是用户粘贴的还是我们自己格式化过的
  if (cleaned.length !== 81) {
    return { ok: false, error: `长度不对——识别到 ${cleaned.length} 个字符,数独字符串需要正好 81 个(去掉空白后)。` };
  }
  const grid = [];
  for (let r = 0; r < 9; r++) {
    const row = [];
    for (let c = 0; c < 9; c++) {
      const ch = cleaned[r * 9 + c];
      if (ch === "0" || ch === ".") row.push(0);
      else if (/^[1-9]$/.test(ch)) row.push(Number(ch));
      else return { ok: false, error: `第 ${r * 9 + c + 1} 个字符"${ch}"不是合法数独字符(只认 1-9、以及代表空格的 0 或 .)。` };
    }
    grid.push(row);
  }
  return { ok: true, grid };
}
// 每9个字符换一行,对应盘面的每一行,让用户不用滚动就能看清整个
// 81位字符串长什么样,而不是全部挤在一行里。
function formatPuzzleStringForDisplay(str81) {
  const lines = [];
  for (let i = 0; i < 81; i += 9) lines.push(str81.slice(i, i + 9));
  return lines.join("\n");
}
function boxIndex(r, c) {
  return Math.floor(r / 3) * 3 + Math.floor(c / 3);
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function unitCells(unitType, idx) {
  if (unitType === "row") return Array.from({ length: 9 }, (_, c) => [idx, c]);
  if (unitType === "col") return Array.from({ length: 9 }, (_, r) => [r, idx]);
  const br = Math.floor(idx / 3) * 3,
    bc = (idx % 3) * 3;
  const cells = [];
  for (let i = br; i < br + 3; i++)
    for (let j = bc; j < bc + 3; j++) cells.push([i, j]);
  return cells;
}
// 候选数计算,全项目调用最密集的共享入口(53个技巧、出题、难度评估、
// DFC传播、正确性检查快照都要经过这里)。外部契约完全不变:给定
// grid+r+c,吐一个升序候选数字数组;内部扫描方式也没变,还是老老实实
// 现扫这一行/列/宫的27个peer格子(不能预建缓存,因为每次传进来的grid
// 可能是不同的假设分支克隆出来的,不保证跟上次调用是同一份)——唯一
// 变的是"记录已用数字"这一步,从Set.add/has换成了位运算:一个数字
// 对应一个二进制位,交集/去重全是O(1)的位操作,不用建Set对象、不用
// 哈希查找。用81个格子逐一对拍+200万次调用校验和比对过跟原Set版本
// 完全等价,实测这一步单独加速4.2-4.5倍(第一次报过一个24.7倍的
// 数字,那个测的是"掩码提前建好、循环里只查表"这种不符合candidatesAt
// 真实调用方式的场景,已经更正)。
function candidatesAt(grid, r, c) {
  if (grid[r][c] !== 0) return [];
  let used = 0;
  for (let i = 0; i < 9; i++) {
    if (grid[r][i]) used |= 1 << (grid[r][i] - 1);
    if (grid[i][c]) used |= 1 << (grid[i][c] - 1);
  }
  const br = Math.floor(r / 3) * 3,
    bc = Math.floor(c / 3) * 3;
  for (let i = br; i < br + 3; i++) for (let j = bc; j < bc + 3; j++) if (grid[i][j]) used |= 1 << (grid[i][j] - 1);
  const mask = ~used & 0x1ff; // 数字d(1-9)对应第(d-1)位,跟generateFullSolution/propagateAssumptionCore一致的约定
  const out = [];
  for (let d = 1; d <= 9; d++) if (mask & (1 << (d - 1))) out.push(d);
  // 位运算迁移:mask本来就是这个函数早就算出来的中间值(上面那行),
  // 白白扔掉太可惜——挂在返回数组上,不改变数组本身的任何行为(还是
  // 老老实实的Array,.length/.includes/for...of全都不受影响),只是
  // 顺手让已经迁移到位运算的技巧函数能免费拿到掩码,不用再从数组
  // 反推一遍(candMaskAt原来干的就是这个反推,现在优先读这个属性)。
  out.mask = mask;
  return out;
}
function findConflicts(grid) {
  const conflict = new Set();
  for (let r = 0; r < 9; r++) {
    const seen = {};
    for (let c = 0; c < 9; c++) {
      const v = grid[r][c];
      if (v === 0) continue;
      (seen[v] = seen[v] || []).push(`${r},${c}`);
    }
    Object.values(seen).forEach((cells) => {
      if (cells.length > 1) cells.forEach((k) => conflict.add(k));
    });
  }
  for (let c = 0; c < 9; c++) {
    const seen = {};
    for (let r = 0; r < 9; r++) {
      const v = grid[r][c];
      if (v === 0) continue;
      (seen[v] = seen[v] || []).push(`${r},${c}`);
    }
    Object.values(seen).forEach((cells) => {
      if (cells.length > 1) cells.forEach((k) => conflict.add(k));
    });
  }
  for (let b = 0; b < 9; b++) {
    const br = Math.floor(b / 3) * 3,
      bc = (b % 3) * 3;
    const seen = {};
    for (let i = br; i < br + 3; i++)
      for (let j = bc; j < bc + 3; j++) {
        const v = grid[i][j];
        if (v === 0) continue;
        (seen[v] = seen[v] || []).push(`${i},${j}`);
      }
    Object.values(seen).forEach((cells) => {
      if (cells.length > 1) cells.forEach((k) => conflict.add(k));
    });
  }
  return conflict;
}

/* -------------------- 候选数笔记系统 --------------------
   每个空格的笔记是 null(从未被碰过)或一个对象,对象的每个键是数字
   1-9,值是三种来源标记之一:
     'auto'   —— 懒加载现算填入(候选数显示开启时,渲染器发现某个
                  数字的键完全不存在,就会现算并以 auto 身份补上)
     'manual' —— 用户在笔记模式下主动标记的
     'erased' —— 用户在橡皮模式下主动擦除的"墓碑"标记(键仍然
                  存在,只是值变成 erased,渲染时不显示)

   区分"键完全不存在"和"键存在但值是 erased"是这套系统能同时满足
   两条不变量的关键:
   - 系统强制消除(某个数字在别处被真实填入)用的是彻底删除键,这样
     如果那次填入后来又被撤销/擦除,这个数字重新合法时,渲染器的
     逐位懒加载会自然把它加回来(键又是"不存在"了)。
   - 用户主动用橡皮擦掉的候选数,键还在、只是标成 erased,懒加载
     只会补全"键完全不存在"的数字,永远不会碰 erased 的键——这样
     候选数开关来回切换、甚至笔记模式来回切换,用户擦过的东西不会
     被悄悄找回来。

   笔记只用于"做题"模式,自建模式不需要。 -------------------- */

function makeEmptyNotes() {
  return Array.from({ length: 9 }, () => Array(9).fill(null));
}
function cloneNotes(notes) {
  return notes.map((row) => row.map((cell) => (cell ? { ...cell } : cell)));
}
// 确保(r,c)的笔记是一个对象而不是null,只做"从null变成{}"这一步,
// 不负责填充任何具体候选数(具体填充交给渲染时的逐位懒加载,或者
// 笔记/橡皮的显式操作各自负责自己那一个数字)。
function ensureNotesCell(notes, r, c) {
  if (notes[r][c] === null) notes[r][c] = {};
  return notes[r][c];
}
// 某个候选数标记当下是否真的显示在盘面上——manual永远可见;auto只有
// 候选数总开关开着才可见;erased或者压根没标记,永远不可见。铅笔/橡皮
// 模式该不该对某个数字生效、渲染时该不该画出来,都基于这同一个判断,
// 保证"看得见的才能被当成已经标记"这条直觉在写入和显示两端是一致的。
function isVisibleOrigin(origin, showCand) {
  return origin === "manual" || (origin === "auto" && showCand);
}
// 技巧引擎在"做题"模式下读取候选数用的桥接函数。基线永远是现算的
// candidatesAt(不会因为候选数显示开关之前开没开过而失真、过期),
// 只在基线之上过滤掉被显式标记erased的数字——这样不管候选数显示
// 开关此刻是开是关,技巧引擎都能正确感知到"用户/之前的提示已经
// 排除了这个候选数"这件事,不会重复提示已经排除过的内容,也不会
// 因为notes某处过期而给出错误判断(过期只可能发生在auto条目上,
// 而auto条目从不参与这里的过滤,只有erased墓碑参与)。
function liveCandidatesAt(grid, notes, r, c) {
  if (grid[r][c] !== 0) return [];
  const baseline = candidatesAt(grid, r, c);
  const cell = notes[r][c];
  if (!cell) return baseline;
  const out = baseline.filter((d) => cell[d] !== "erased");
  // 跟candidatesAt同样的道理:baseline.mask是免费的,只需要把被erased
  // 墓碑标记掉的那几位从掩码里抠掉,不用重新从out数组反推一遍。
  let erasedMask = 0;
  for (const d of baseline) if (cell[d] === "erased") erasedMask |= 1 << (d - 1);
  out.mask = baseline.mask & ~erasedMask;
  return out;
}
// 某个数字是否跟(r,c)所在行/列/宫里某个已经确定填入的格子冲突——
// 只看真实填的值,不看别的格子的候选数(候选数互相重叠是正常的,
// 不构成冲突)。
function digitConflictsWithPeers(grid, r, c, d) {
  for (let i = 0; i < 9; i++) {
    if (i !== c && grid[r][i] === d) return true;
    if (i !== r && grid[i][c] === d) return true;
  }
  const br = Math.floor(r / 3) * 3,
    bc = Math.floor(c / 3) * 3;
  for (let i = br; i < br + 3; i++)
    for (let j = bc; j < bc + 3; j++) if ((i !== r || j !== c) && grid[i][j] === d) return true;
  return false;
}
// 通用版:把数字 d 从一组指定格子(不限定"某格的peer",任意列表都行)
// 的笔记里强制抹掉——技巧引擎算出的eliminate类发现,消除范围往往不是
// 简单的"这一格的所有peer"(比如锁定候选消除的是"同一行但在另一个
// 宫"的格子),需要这个更通用的版本。
function eliminateNoteFromCells(notes, cells, d) {
  for (const [r, c] of cells) {
    const cell = notes[r][c];
    if (cell && Object.prototype.hasOwnProperty.call(cell, d)) delete cell[d];
  }
}
// 把数字 d 从一组指定格子的笔记里标记成 erased 墓碑(不是delete)——
// 这是"提示/Auto模式代替用户执行一次技巧消除"该用的语义:必须让键
// 继续存在但标成erased,否则下一次候选数懒加载会把它当成"这个数字
// 从没被考虑过",重新以auto身份加回来,消除等于白做。这跟填字触发的
// eliminateNoteFromPeers(用delete,因为那是"客观上不再合法"而不是
// "选择性地不再显示")是两种不同场景,不能混用。
// 参数eliminations是{r,c,digit}的扁平列表——不同格子可以是不同数字
// (数对/三数组一次消除往往涉及好几个不同数字,不能再假设"一批格子
// 共用同一个数字",这也是locked candidates迁移到这套结构的原因)。
function markCellsErased(notes, eliminations) {
  for (const { r, c, digit } of eliminations) {
    const cell = ensureNotesCell(notes, r, c);
    cell[digit] = "erased";
  }
}
// 某格被定性填入数字 d 后,把 d 从同行/列/宫所有格子的笔记里强制
// 抹掉——不管原来是系统标的还是用户手动标的,这里"没有商量余地"。
// 用的是彻底删除键(不是墓碑),因为这是"这个数字目前真的不合法了"
// 的客观描述,不是用户的主观选择;如果这次填入后来被撤销,这个数字
// 重新合法时,理应能被自然懒加载回来。
function eliminateNoteFromPeers(notes, r, c, d) {
  const peers = new Set();
  unitCells("row", r).forEach(([pr, pc]) => peers.add(`${pr},${pc}`));
  unitCells("col", c).forEach(([pr, pc]) => peers.add(`${pr},${pc}`));
  unitCells("box", boxIndex(r, c)).forEach(([pr, pc]) => peers.add(`${pr},${pc}`));
  peers.delete(`${r},${c}`);
  eliminateNoteFromCells(notes, [...peers].map((key) => key.split(",").map(Number)), d);
}
// 把一个"定性填入"动作真正落到(grid, notes)上——不管这个填入是用户
// 自己按数字键填的,还是提示/Auto模式帮忙揭晓的,都必须走这一个函数,
// 否则容易出现"手动填的会触发消除,系统填的却不会"这种不一致。
function commitFill(grid, notes, r, c, digit) {
  grid[r][c] = digit;
  notes[r][c] = null;
  eliminateNoteFromPeers(notes, r, c, digit);
}

/* -------------------- 求解 / 计数(Dancing Links 精确覆盖) --------------------
   把数独转成精确覆盖问题:729 行候选 = 每个"(格子,数字)"组合;
   324 列约束 = 81 格子占用 + 81 行内数字 + 81 列内数字 + 81 宫内数字。
   Algorithm X 每步选"剩余候选行最少"的列(Knuth 的 S 启发式,
   本质就是 MRV),配合 Dancing Links 链表 O(1) 的覆盖/恢复操作——
   不需要像朴素回溯那样每个节点都重新扫一遍候选数,已知数很少、
   空格很多时优势尤其明显。 -------------------- */

function buildCandidates(grid) {
  const cands = [];
  let id = 0;
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const fixed = grid[r][c];
      const digits = fixed !== 0 ? [fixed] : [1, 2, 3, 4, 5, 6, 7, 8, 9];
      const b = boxIndex(r, c);
      for (const d of digits) {
        cands.push({
          id: id++,
          r,
          c,
          d,
          cols: [r * 9 + c, 81 + r * 9 + (d - 1), 162 + c * 9 + (d - 1), 243 + b * 9 + (d - 1)],
        });
      }
    }
  }
  return cands;
}

function buildDLX(candidates, numCols) {
  const root = {};
  root.L = root;
  root.R = root;
  const headers = new Array(numCols);
  let prevHeader = root;
  for (let i = 0; i < numCols; i++) {
    const h = { L: prevHeader, R: root, size: 0 };
    h.U = h;
    h.D = h;
    prevHeader.R = h;
    root.L = h;
    headers[i] = h;
    prevHeader = h;
  }
  for (const cand of candidates) {
    const nodes = [];
    for (const colIdx of cand.cols) {
      const h = headers[colIdx];
      const node = { C: h, rowId: cand.id, D: h, U: h.U };
      h.U.D = node;
      h.U = node;
      h.size++;
      nodes.push(node);
    }
    const n = nodes.length;
    for (let i = 0; i < n; i++) {
      nodes[i].L = nodes[(i - 1 + n) % n];
      nodes[i].R = nodes[(i + 1) % n];
    }
  }
  return root;
}

function dlxCover(col) {
  col.R.L = col.L;
  col.L.R = col.R;
  for (let row = col.D; row !== col; row = row.D) {
    for (let node = row.R; node !== row; node = node.R) {
      node.D.U = node.U;
      node.U.D = node.D;
      node.C.size--;
    }
  }
}
function dlxUncover(col) {
  for (let row = col.U; row !== col; row = row.U) {
    for (let node = row.L; node !== row; node = node.L) {
      node.C.size++;
      node.D.U = node;
      node.U.D = node;
    }
  }
  col.R.L = col;
  col.L.R = col;
}
function dlxSearch(root, limit, solutions, chosen) {
  if (root.R === root) {
    solutions.push(chosen.slice());
    return solutions.length >= limit;
  }
  let col = root.R;
  for (let c = col.R; c !== root; c = c.R) if (c.size < col.size) col = c;
  if (col.size === 0) return false; // 这一列没有任何候选行能覆盖 —— 此路不通

  dlxCover(col);
  for (let row = col.D; row !== col; row = row.D) {
    chosen.push(row.rowId);
    for (let node = row.R; node !== row; node = node.R) dlxCover(node.C);

    if (dlxSearch(root, limit, solutions, chosen)) {
      dlxUncover(col);
      return true; // 已达到解数上限,逐层快速退出
    }
    for (let node = row.L; node !== row; node = node.L) dlxUncover(node.C);
    chosen.pop();
  }
  dlxUncover(col);
  return false;
}

function solveCount(startGrid, limit = 2) {
  const candidates = buildCandidates(startGrid);
  const root = buildDLX(candidates, 324);
  const solutions = [];
  dlxSearch(root, limit, solutions, []);
  return {
    count: solutions.length,
    solutions: solutions.map((rowIds) => {
      const g = emptyGrid();
      for (const id of rowIds) {
        const cand = candidates[id];
        g[cand.r][cand.c] = cand.d;
      }
      return g;
    }),
  };
}

// 生成完整盘面用的Backtracking+MRV(注意:不是数独求解用的DLX,那个在
// solveCount/buildDLX那边,这里是"从空盘面填出一个完整合法解"专用的
// 另一套逻辑,两者互不影响)。这一版换成了位掩码:rowUsed/colUsed/
// boxUsed各是长度9的数组,每个元素是个9位掩码(bit(d-1)置1表示数字d
// 已经被这一行/列/宫用掉)。原来这里每选一个格子都要对81个格子逐一
// 调用candidatesAt(内部建Set、扫27个peer格子),实测换成位运算之后
// 单次生成盘面平均耗时从1.87ms降到0.23ms,约8.13倍——填数字/回退
// 数字时同步维护这三个掩码,取某格候选数变成一次三路按位或再取反,
// 逻辑复杂度没变,只是把"逐格扫描+Set操作"换成了"查表+位运算"。
// 正确性用500个随机盘面(含不合法/冲突状态,不只测合法数独局面)对
// 81个格子逐一跟原Set版本对拍过,共40500次比较,完全一致,才替换的。
function generateFullSolution() {
  const g = emptyGrid();
  const rowUsed = new Array(9).fill(0);
  const colUsed = new Array(9).fill(0);
  const boxUsed = new Array(9).fill(0);
  function findEmptyMRV() {
    let bestR = -1,
      bestC = -1,
      bestMask = 0,
      bestLen = 10;
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++) {
        if (g[r][c] !== 0) continue;
        const mask = ~(rowUsed[r] | colUsed[c] | boxUsed[boxIndex(r, c)]) & 0x1ff;
        const len = countBits(mask);
        if (len === 0) return { r, c, mask: 0 };
        if (len < bestLen) {
          bestLen = len;
          bestR = r;
          bestC = c;
          bestMask = mask;
          if (bestLen === 1) return { r: bestR, c: bestC, mask: bestMask };
        }
      }
    return bestR === -1 ? null : { r: bestR, c: bestC, mask: bestMask };
  }
  function maskToDigits(mask) {
    const out = [];
    for (let d = 1; d <= 9; d++) if (mask & (1 << (d - 1))) out.push(d);
    return out;
  }
  function fill() {
    const cell = findEmptyMRV();
    if (cell === null) return true;
    if (cell.mask === 0) return false;
    const b = boxIndex(cell.r, cell.c);
    for (const d of shuffle(maskToDigits(cell.mask))) {
      const bit = 1 << (d - 1);
      g[cell.r][cell.c] = d;
      rowUsed[cell.r] |= bit;
      colUsed[cell.c] |= bit;
      boxUsed[b] |= bit;
      if (fill()) return true;
      g[cell.r][cell.c] = 0;
      rowUsed[cell.r] &= ~bit;
      colUsed[cell.c] &= ~bit;
      boxUsed[b] &= ~bit;
    }
    return false;
  }
  fill();
  return g;
}

function digHoles(solution, removeTarget) {
  const puzzle = cloneGrid(solution);
  const order = shuffle(
    Array.from({ length: 81 }, (_, i) => [Math.floor(i / 9), i % 9])
  );
  let removed = 0;
  for (const [r, c] of order) {
    if (removed >= removeTarget) break;
    if (puzzle[r][c] === 0) continue;
    const backup = puzzle[r][c];
    puzzle[r][c] = 0;
    const { count } = solveCount(puzzle, 2);
    if (count === 1) {
      removed++;
    } else {
      puzzle[r][c] = backup;
    }
  }
  return { puzzle, clueCount: 81 - removed };
}

// generatePuzzle只挖一次洞就返回,在已知数富余的档位(简单/中等)几乎
// 总能精确命中removeTarget,但"困难"这种目标已知数少、贪心挖洞容易
// "卡壳"(很多格子挖了又因为破坏唯一解被塞回去)的档位,单次结果不
// 可靠——实测困难档12次里有6次没达标,最多多出3个已知数,相当于用户
// 选困难有一半概率拿到明显偏简单的题。改成跟generateCustomPuzzle
// 同样的重试保底:最多试15次,保留挖到已知数最少(最难)的那次,
// 提前命中目标就直接停。
function generatePuzzle(difficultyKey) {
  const config = DIFFICULTY_CONFIG[difficultyKey];
  let best = null;
  for (let attempt = 0; attempt < 15; attempt++) {
    const solution = generateFullSolution();
    const { puzzle, clueCount } = digHoles(solution, config.removeTarget);
    if (!best || clueCount < best.clueCount) best = { puzzle, solution, clueCount };
    if (clueCount <= 81 - config.removeTarget) break;
  }
  return { puzzle: best.puzzle, solution: best.solution, clueCount: best.clueCount };
}

function parseSeedLine(line) {
  const grid = emptyGrid();
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      const ch = line[r * 9 + c];
      grid[r][c] = ch === "." ? 0 : Number(ch);
    }
  return grid;
}

// 行/列分组重排:保留"3个一组"的宫边界,组间顺序、组内顺序都随机打乱
function buildAxisMap() {
  const bandOrder = shuffle([0, 1, 2]);
  const map = [];
  for (const band of bandOrder) {
    const within = shuffle([0, 1, 2]);
    for (const w of within) map.push(band * 3 + w);
  }
  return map;
}

function transformGrid(grid) {
  const rowMap = buildAxisMap();
  const colMap = buildAxisMap();
  const digitMap = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
  const transpose = Math.random() < 0.5;

  let g = grid;
  if (transpose) {
    const t = emptyGrid();
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) t[c][r] = g[r][c];
    g = t;
  }
  const out = emptyGrid();
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const v = g[rowMap[r]][colMap[c]];
      out[r][c] = v === 0 ? 0 : digitMap[v - 1];
    }
  }
  return out;
}

function generateFromSeed(targetClueCount) {
  const line = SEED_17[Math.floor(Math.random() * SEED_17.length)];
  const transformed = transformGrid(parseSeedLine(line));
  const { solutions } = solveCount(transformed, 1);
  const solution = solutions[0];
  const emptyCells = [];
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) if (transformed[r][c] === 0) emptyCells.push([r, c]);
  const order = shuffle(emptyCells);
  const toAdd = Math.max(0, targetClueCount - 17);
  for (let i = 0; i < toAdd && i < order.length; i++) {
    const [r, c] = order[i];
    transformed[r][c] = solution[r][c];
  }
  return { puzzle: transformed, solution, clueCount: 17 + Math.min(toAdd, order.length) };
}

function generateCustomPuzzle(targetClueCount) {
  const safe = Number.isFinite(targetClueCount) ? Math.round(targetClueCount) : 30;
  const clamped = Math.max(17, Math.min(45, safe));

  if (clamped <= 21) {
    const { puzzle, solution, clueCount } = generateFromSeed(clamped);
    return { puzzle, solution, clueCount, requested: clamped, source: "seed" };
  }

  const removeTarget = 81 - clamped;
  let best = null;
  for (let attempt = 0; attempt < 15; attempt++) {
    const solution = generateFullSolution();
    const { puzzle, clueCount } = digHoles(solution, removeTarget);
    if (!best || clueCount < best.clueCount) best = { puzzle, solution, clueCount };
    if (clueCount <= clamped) break;
  }

  if (best.clueCount <= clamped) {
    return { puzzle: best.puzzle, solution: best.solution, clueCount: best.clueCount, requested: clamped, source: "dig" };
  }

  // 15 次贪心挖洞都没能正好挖到目标数量——不接受"差一点"的次优解,
  // 改用种子库 + 补格子精确兜底,保证最终拿到的就是用户要的那个数字。
  const fallback = generateFromSeed(clamped);
  return {
    puzzle: fallback.puzzle,
    solution: fallback.solution,
    clueCount: fallback.clueCount,
    requested: clamped,
    source: "seed-fallback",
  };
}

/* -------------------------- 提示引擎 -------------------------- */

/* -------------------- 技巧引擎 --------------------
   每个技巧函数签名统一:(grid, getCands) => finding | null。getCands
   是"读取(r,c)当前候选数"的函数,由调用方按场景提供——做题模式下
   读取的是liveCandidatesAt(能感知之前的提示消除/用户擦除),难度评估
   等一次性模拟场景下读取的是trackedCandidatesAt(一次性的、不依赖
   notes的内部候选状态)。技巧函数本身不关心这个区别,专心只管判断。

   发现(finding)分两种动作类型:
     actionType: 'fill'      —— 可以确定某格该填什么数字
     actionType: 'eliminate' —— 可以从一批格子里排除某个候选数字,
                                 不直接填任何格子

   技巧函数只返回结构化数据,不包含任何文字说明——文字是消费方
   (提示UI/Auto模式日志)按需要各自渲染的,同一份发现可以配出
   不同详略程度的说法。 -------------------- */

// 唯一余数法(naked single):某格候选数只剩一个。
// 位运算版:mask非0且是2的幂,就是"只剩一个候选数"(mask&(mask-1)===0
// 是经典的popcount===1判断),数字直接用Math.clz32从最高位反解出来,
// 不用真的建数组、不用看length。
function findNakedSingle(grid, getCands) {
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] === 0) {
        const mask = candMaskAt(getCands, r, c);
        if (mask !== 0 && (mask & (mask - 1)) === 0) {
          const digit = 32 - Math.clz32(mask); // mask是2^(d-1)这一个精确的位,反解出d
          return { actionType: "fill", technique: "nakedSingle", r, c, digit };
        }
      }
    }
  return null;
}

// 排除法(hidden single):某个数字在某个行/列/宫里只剩一个格子能填。
// 位运算版:每个候选格直接查掩码某一位有没有置1,不用.includes();
// 数到第二个命中格子就提前退出这个数字的扫描,不用凑齐整个unit。
function findHiddenSingle(grid, getCands) {
  const unitTypes = ["row", "col", "box"];
  for (const unitType of unitTypes) {
    for (let idx = 0; idx < 9; idx++) {
      const cells = unitCells(unitType, idx);
      const present = new Set(cells.map(([r, c]) => grid[r][c]).filter((v) => v !== 0));
      for (let d = 1; d <= 9; d++) {
        if (present.has(d)) continue;
        const bit = 1 << (d - 1);
        let spotR = -1,
          spotC = -1,
          count = 0;
        for (const [r, c] of cells) {
          if (grid[r][c] !== 0) continue;
          if (candMaskAt(getCands, r, c) & bit) {
            count++;
            if (count > 1) break; // 已经不止一个格子能填这个数字,不用再看剩下的格子
            spotR = r;
            spotC = c;
          }
        }
        if (count === 1) {
          return {
            actionType: "fill",
            technique: "hiddenSingle",
            r: spotR,
            c: spotC,
            digit: d,
            unitType,
            idx,
          };
        }
      }
    }
  }
  return null;
}

// 锁定候选(locked candidates),两个方向:
// pointing(宫→行/列):宫内某数字候选全挤在一行/列上,该行/列宫外
//   部分能排除这个候选。
// claiming(行/列→宫):行/列内某数字候选全挤在一个宫里,该宫内
//   行/列外部分能排除这个候选。
// 位运算版:四处.includes(d)全部换成掩码位检查,candMaskAt对已经带
// .mask的getCands是O(1)读取,不用每次都重新扫一遍候选数组。
function findLockedCandidates(grid, getCands) {
  for (let box = 0; box < 9; box++) {
    const cells = unitCells("box", box);
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << (d - 1);
      const spots = cells.filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit);
      if (spots.length < 2) continue;
      const rows = new Set(spots.map(([r]) => r));
      const cols = new Set(spots.map(([, c]) => c));
      if (rows.size === 1) {
        const r0 = [...rows][0];
        const elimCells = unitCells("row", r0).filter(
          ([er, ec]) => boxIndex(er, ec) !== box && grid[er][ec] === 0 && candMaskAt(getCands, er, ec) & bit
        );
        if (elimCells.length > 0) {
          return {
            actionType: "eliminate", technique: "lockedCandidate", subtype: "pointingRow",
            patternCells: spots, eliminations: elimCells.map(([er, ec]) => ({ r: er, c: ec, digit: d })),
            context: { box, line: r0, lineType: "row", digit: d },
          };
        }
      }
      if (cols.size === 1) {
        const c0 = [...cols][0];
        const elimCells = unitCells("col", c0).filter(
          ([er, ec]) => boxIndex(er, ec) !== box && grid[er][ec] === 0 && candMaskAt(getCands, er, ec) & bit
        );
        if (elimCells.length > 0) {
          return {
            actionType: "eliminate", technique: "lockedCandidate", subtype: "pointingCol",
            patternCells: spots, eliminations: elimCells.map(([er, ec]) => ({ r: er, c: ec, digit: d })),
            context: { box, line: c0, lineType: "col", digit: d },
          };
        }
      }
    }
  }
  for (const lineType of ["row", "col"]) {
    for (let idx = 0; idx < 9; idx++) {
      const cells = unitCells(lineType, idx);
      for (let d = 1; d <= 9; d++) {
        const bit = 1 << (d - 1);
        const spots = cells.filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit);
        if (spots.length < 2) continue;
        const boxes = new Set(spots.map(([r, c]) => boxIndex(r, c)));
        if (boxes.size === 1) {
          const box = [...boxes][0];
          const elimCells = unitCells("box", box).filter(([er, ec]) => {
            const inLine = lineType === "row" ? er === idx : ec === idx;
            return !inLine && grid[er][ec] === 0 && candMaskAt(getCands, er, ec) & bit;
          });
          if (elimCells.length > 0) {
            return {
              actionType: "eliminate", technique: "lockedCandidate",
              subtype: lineType === "row" ? "claimingRow" : "claimingCol",
              patternCells: spots, eliminations: elimCells.map(([er, ec]) => ({ r: er, c: ec, digit: d })),
              context: { line: idx, lineType, box, digit: d },
            };
          }
        }
      }
    }
  }
  return null;
}

// 组合数生成器:从数组里选k个的所有组合,子集类/鱼形技巧的核心遍历
// 工具——数独棋盘每个单元最多9个格子/数字,组合数天花板很低
// (C(9,3)=84),不会有性能问题。
function combinations(arr, k) {
  const results = [];
  function backtrack(start, chosen) {
    if (chosen.length === k) {
      results.push(chosen.slice());
      return;
    }
    for (let i = start; i < arr.length; i++) {
      chosen.push(arr[i]);
      backtrack(i + 1, chosen);
      chosen.pop();
    }
  }
  backtrack(0, []);
  return results;
}

// 显式子集(naked subset),参数化k:k=2是显式数对,k=3是显式三数组。
// 某个单元里有k个格子,候选数合起来(并集)恰好是k个数字——不管
// 具体怎么分配,这k个数字必然被这k格瓜分掉,单元里其它格子都不能
// 再是这几个数字。
// 位运算版:候选数并集从Set换成按位OR,size检查从.size换成countBits,
// 消除检查从"逐个数字查Set.has"换成"跟union做AND、结果里剩下的位就是
// 要消的数字"。
const NAKED_SUBSET_TECHNIQUE_BY_SIZE = { 2: "nakedPair", 3: "nakedTriple", 4: "nakedQuad" };
function findNakedSubset(grid, getCands, k) {
  const unitTypes = ["row", "col", "box"];
  for (const unitType of unitTypes) {
    for (let idx = 0; idx < 9; idx++) {
      const cells = unitCells(unitType, idx);
      const candidateCells = cells
        .filter(([r, c]) => grid[r][c] === 0)
        .map(([r, c]) => ({ r, c, mask: candMaskAt(getCands, r, c) }))
        .filter((cell) => {
          const n = countBits(cell.mask);
          return n >= 2 && n <= k;
        });
      if (candidateCells.length < k) continue;
      for (const combo of combinations(candidateCells, k)) {
        let unionMask = 0;
        for (const cell of combo) unionMask |= cell.mask;
        if (countBits(unionMask) !== k) continue;
        const comboKeys = new Set(combo.map((cell) => `${cell.r},${cell.c}`));
        const eliminations = [];
        for (const [r, c] of cells) {
          if (comboKeys.has(`${r},${c}`) || grid[r][c] !== 0) continue;
          for (const d of maskToDigits(candMaskAt(getCands, r, c) & unionMask)) eliminations.push({ r, c, digit: d });
        }
        if (eliminations.length > 0) {
          return {
            actionType: "eliminate",
            technique: NAKED_SUBSET_TECHNIQUE_BY_SIZE[k],
            subtype: unitType,
            patternCells: combo.map((cell) => [cell.r, cell.c]),
            eliminations,
            context: { unitType, idx, digits: maskToDigits(unionMask) },
          };
        }
      }
    }
  }
  return null;
}

// 隐式子集(hidden subset),参数化k:k=2是隐式数对,k=3是隐式三数组。
// 某个单元里有k个数字,能填的位置合起来(并集)恰好是同样k个格子——
// 这k个数字被锁定在这几格里了,这几格除了这k个数字之外的其它候选数
// 都可以划掉(相当于把这几格从"看不出规律"还原成一个显式子集)。
// 位运算版:每个数字的候选位置改用掩码位检查;拿掉的候选(digitCombo
// 之外的部分)通过跟digitMask取反再AND一次性拿到,不用逐个数字查Set。
const HIDDEN_SUBSET_TECHNIQUE_BY_SIZE = { 2: "hiddenPair", 3: "hiddenTriple", 4: "hiddenQuad" };
function findHiddenSubset(grid, getCands, k) {
  const unitTypes = ["row", "col", "box"];
  for (const unitType of unitTypes) {
    for (let idx = 0; idx < 9; idx++) {
      const cells = unitCells(unitType, idx);
      const present = new Set(cells.map(([r, c]) => grid[r][c]).filter((v) => v !== 0));
      const unplacedDigits = [];
      for (let d = 1; d <= 9; d++) if (!present.has(d)) unplacedDigits.push(d);
      const positionsOf = {};
      for (const d of unplacedDigits) {
        const bit = 1 << (d - 1);
        positionsOf[d] = cells.filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit);
      }
      const eligibleDigits = unplacedDigits.filter((d) => positionsOf[d].length >= 2 && positionsOf[d].length <= k);
      if (eligibleDigits.length < k) continue;
      for (const digitCombo of combinations(eligibleDigits, k)) {
        const cellKeySet = new Set();
        digitCombo.forEach((d) => positionsOf[d].forEach(([r, c]) => cellKeySet.add(`${r},${c}`)));
        if (cellKeySet.size !== k) continue;
        let digitMask = 0;
        for (const d of digitCombo) digitMask |= 1 << (d - 1);
        const eliminations = [];
        for (const key of cellKeySet) {
          const [r, c] = key.split(",").map(Number);
          for (const d of maskToDigits(candMaskAt(getCands, r, c) & ~digitMask)) eliminations.push({ r, c, digit: d });
        }
        if (eliminations.length > 0) {
          return {
            actionType: "eliminate",
            technique: HIDDEN_SUBSET_TECHNIQUE_BY_SIZE[k],
            subtype: unitType,
            patternCells: [...cellKeySet].map((key) => key.split(",").map(Number)),
            eliminations,
            context: { unitType, idx, digits: digitCombo.slice().sort((a, b) => a - b) },
          };
        }
      }
    }
  }
  return null;
}

// 鱼形(fish),参数化k:k=2是X翼,k=3是剑鱼。某个数字在k条"底线"
// (行或列)上的候选位置,合起来只落在同样k条"覆盖线"(列或行)上——
// 围成一个k×k的矩形网格,这个数字必然占据网格上的k个位置,所以
// 覆盖线上、底线之外的格子都不能再是这个数字。
const FISH_TECHNIQUE_BY_SIZE = { 2: "xWing", 3: "swordfish", 4: "jellyfish", 5: "squirmbagFish" };
const FINNED_FISH_TECHNIQUE_BY_SIZE = { 2: "finnedXWing", 3: "finnedSwordfish", 4: "finnedJellyfish" };

// 位运算版:数字d在这个函数里从外层循环就定死了,提前算好bit,
// 两处.includes(d)都换成掩码位检查。
function findFish(grid, getCands, k) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << (d - 1);
    for (const [baseType, coverType] of [
      ["row", "col"],
      ["col", "row"],
    ]) {
      const baseUnits = [];
      for (let idx = 0; idx < 9; idx++) {
        const positions = unitCells(baseType, idx).filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit);
        if (positions.length >= 2 && positions.length <= k) baseUnits.push({ idx, positions });
      }
      if (baseUnits.length < k) continue;
      for (const combo of combinations(baseUnits, k)) {
        const coverIdxSet = new Set();
        combo.forEach((u) => u.positions.forEach((pos) => coverIdxSet.add(baseType === "row" ? pos[1] : pos[0])));
        if (coverIdxSet.size !== k) continue;
        const baseIdxSet = new Set(combo.map((u) => u.idx));
        const eliminations = [];
        for (const coverIdx of coverIdxSet) {
          for (const [r, c] of unitCells(coverType, coverIdx)) {
            const baseIdxOfCell = baseType === "row" ? r : c;
            if (baseIdxSet.has(baseIdxOfCell)) continue;
            if (grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit) eliminations.push({ r, c, digit: d });
          }
        }
        if (eliminations.length > 0) {
          const patternCells = [];
          combo.forEach((u) => u.positions.forEach((pos) => patternCells.push(pos)));
          return {
            actionType: "eliminate",
            technique: FISH_TECHNIQUE_BY_SIZE[k],
            subtype: baseType,
            patternCells,
            eliminations,
            context: {
              digit: d, baseType, coverType,
              baseIdxs: [...baseIdxSet].sort((a, b) => a - b),
              coverIdxs: [...coverIdxSet].sort((a, b) => a - b),
            },
          };
        }
      }
    }
  }
  return null;
}

// 两个格子是否互相"看得见"(同行、同列或同宫)——链式/wing类技巧
// 判断"强链接"的基础工具,子集/鱼形技巧不需要它(它们按单元遍历,
// 不需要单独判断任意两格的关系)。
function cellsSeeEachOther(a, b) {
  return a.r === b.r || a.c === b.c || boxIndex(a.r, a.c) === boxIndex(b.r, b.c);
}

// 带鳍鱼形(finned fish),参数化k:k=2是带鳍二阶鱼,k=3是带鳍剑鱼。跟
// 普通鱼形(findFish)共享同一个思路,区别只在于:选定的k条底线上,
// 候选位置允许多出几个不在k条覆盖线上的"鳍"——但这些鳍必须全部
// 挤在同一个宫里,消除范围也从"整条覆盖线"收窄到"覆盖线上、同时
// 能被所有鳍格看见的格子"(不带鳍的普通情况已经被findFish处理过了,
// 走到这里的都是真的需要鳍才能解释的局面)。
// 位运算版:跟findFish同样的思路,d提前算好bit,两处.includes(d)
// 换成掩码位检查。
function findFinnedFish(grid, getCands, k) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << (d - 1);
    for (const [baseType, coverType] of [
      ["row", "col"],
      ["col", "row"],
    ]) {
      const baseUnits = [];
      for (let idx = 0; idx < 9; idx++) {
        const positions = unitCells(baseType, idx).filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit);
        if (positions.length >= 1) baseUnits.push({ idx, positions });
      }
      if (baseUnits.length < k) continue;
      for (const combo of combinations(baseUnits, k)) {
        const allPositions = [];
        combo.forEach((u) => u.positions.forEach((pos) => allPositions.push(pos)));
        const coverIdxSetFull = new Set(allPositions.map((pos) => (baseType === "row" ? pos[1] : pos[0])));
        if (coverIdxSetFull.size <= k) continue; // 不需要鳍就能凑成鱼形,交给findFish处理
        const baseIdxSet = new Set(combo.map((u) => u.idx));
        for (const coverIdxCombo of combinations([...coverIdxSetFull], k)) {
          const coverSet = new Set(coverIdxCombo);
          const finCells = allPositions.filter((pos) => !coverSet.has(baseType === "row" ? pos[1] : pos[0]));
          if (finCells.length === 0) continue;
          const finBoxes = new Set(finCells.map(([r, c]) => boxIndex(r, c)));
          if (finBoxes.size !== 1) continue; // 鳍必须全部挤在同一个宫里,消除逻辑才立得住
          const finCellObjs = finCells.map(([r, c]) => ({ r, c }));
          const eliminations = [];
          for (const coverIdx of coverIdxCombo) {
            for (const [r, c] of unitCells(coverType, coverIdx)) {
              const baseIdxOfCell = baseType === "row" ? r : c;
              if (baseIdxSet.has(baseIdxOfCell)) continue;
              if (finCells.some(([fr, fc]) => fr === r && fc === c)) continue;
              if (grid[r][c] !== 0 || !(candMaskAt(getCands, r, c) & bit)) continue;
              if (finCellObjs.every((f) => cellsSeeEachOther({ r, c }, f))) eliminations.push({ r, c, digit: d });
            }
          }
          if (eliminations.length > 0) {
            return {
              actionType: "eliminate",
              technique: FINNED_FISH_TECHNIQUE_BY_SIZE[k],
              subtype: baseType,
              patternCells: allPositions,
              finCells,
              eliminations,
              context: {
                digit: d, baseType, coverType,
                baseIdxs: [...baseIdxSet].sort((a, b) => a - b),
                coverIdxs: coverIdxCombo.slice().sort((a, b) => a - b),
              },
            };
          }
        }
      }
    }
  }
  return null;
}

// Skyscraper(摩天楼):专注一个数字,找两条同类型的线(两行或两列),
// 各自对这个数字只剩两个候选位置。如果每条线各出一个候选位置,
// 恰好落在同一条交叉线上(两行版本时是同一列,两列版本时是同一
// 行)——这条共享线当"地基",两条线剩下没对齐的那两个位置就是
// "楼顶"。地基上两个位置里必有一个是真的(各自所在的线只剩它俩
// 候选),不管究竟是哪个,楼顶那两个位置里也必有一个是真的(跟地基
// 反着来)——所以同时看得见两个楼顶的格子,这个数字都不可能成立。
// 官方Sudoku Explainer现行版本把这个技巧定为4.0分(分组版4.3),
// 查过资料,不是项目自己估的。HoDoKu的说法是:它是Turbot Fish的
// 特例,也可以看成两个Sashimi X-Wing叠在一起。
function findSkyscraper(grid, getCands) {
  for (const baseType of ["row", "col"]) {
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << (d - 1);
      const lines = [];
      for (let i = 0; i < 9; i++) {
        const cells =
          baseType === "row" ? Array.from({ length: 9 }, (_, c) => [i, c]) : Array.from({ length: 9 }, (_, r) => [r, i]);
        const positions = cells.filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit);
        if (positions.length === 2) lines.push(positions);
      }
      const crossOf = (cell) => (baseType === "row" ? cell[1] : cell[0]);
      for (let i = 0; i < lines.length; i++)
        for (let j = i + 1; j < lines.length; j++) {
          const [a1, a2] = lines[i];
          const [b1, b2] = lines[j];
          for (const [x, y] of [
            [a1, b1],
            [a1, b2],
            [a2, b1],
            [a2, b2],
          ]) {
            if (crossOf(x) !== crossOf(y)) continue;
            const roof1 = x === a1 ? a2 : a1;
            const roof2 = y === b1 ? b2 : b1;
            if (roof1[0] === roof2[0] && roof1[1] === roof2[1]) continue; // 两个楼顶撞在一起,不构成真正的摩天楼,防御性跳过
            const eliminations = [];
            for (let r = 0; r < 9; r++)
              for (let c = 0; c < 9; c++) {
                if (grid[r][c] !== 0 || !(candMaskAt(getCands, r, c) & bit)) continue;
                if ((r === roof1[0] && c === roof1[1]) || (r === roof2[0] && c === roof2[1])) continue;
                if (
                  cellsSeeEachOther({ r, c }, { r: roof1[0], c: roof1[1] }) &&
                  cellsSeeEachOther({ r, c }, { r: roof2[0], c: roof2[1] })
                ) {
                  eliminations.push({ r, c, digit: d });
                }
              }
            if (eliminations.length > 0) {
              return {
                actionType: "eliminate",
                technique: "skyscraper",
                patternCells: [x, y, roof1, roof2],
                eliminations,
                context: { digit: d, baseType, base: [x, y], roof: [roof1, roof2] },
              };
            }
          }
        }
    }
  }
  return null;
}

// 双线风筝(Two-String Kite):跟Skyscraper是同一个GNPX命题("两条强链,
// 四个端点里恰好一对同House")的另一种落地——Skyscraper两条强链都在
// "行"或都在"列",风筝则是一条强链在行、一条在列,共享的那对端点同宫
// (不是同行/同列)。证明完全一致:共享宫的那一对端点不能同时是数字X
// (宫内唯一性),所以至少有一条强链的"远端"是X——能同时看到两个远端
// 的格子都能划掉X。findSkyscraper只搜了"两条链同轴"的情形,这里补
// 上"一行一列"的情形,两个函数不重叠,双线风筝之前是真的没实现。
function findTwoStringKite(grid, getCands) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << (d - 1);
    const rowLinks = [];
    const colLinks = [];
    for (let i = 0; i < 9; i++) {
      const rowCells = [];
      for (let c = 0; c < 9; c++) if (grid[i][c] === 0 && candMaskAt(getCands, i, c) & bit) rowCells.push([i, c]);
      if (rowCells.length === 2) rowLinks.push(rowCells);
      const colCells = [];
      for (let r = 0; r < 9; r++) if (grid[r][i] === 0 && candMaskAt(getCands, r, i) & bit) colCells.push([r, i]);
      if (colCells.length === 2) colLinks.push(colCells);
    }
    for (const [r1, r2] of rowLinks) {
      for (const [c1, c2] of colLinks) {
        for (const [near1, far1, near2, far2] of [
          [r1, r2, c1, c2],
          [r1, r2, c2, c1],
          [r2, r1, c1, c2],
          [r2, r1, c2, c1],
        ]) {
          if (boxIndex(near1[0], near1[1]) !== boxIndex(near2[0], near2[1])) continue;
          if (near1[0] === near2[0] && near1[1] === near2[1]) continue; // 防御:两条链共用同一格,不是真正独立的两条强链
          if (far1[0] === far2[0] && far1[1] === far2[1]) continue;
          const eliminations = [];
          for (let r = 0; r < 9; r++)
            for (let c = 0; c < 9; c++) {
              if (grid[r][c] !== 0 || !(candMaskAt(getCands, r, c) & bit)) continue;
              if ((r === far1[0] && c === far1[1]) || (r === far2[0] && c === far2[1])) continue;
              if ((r === near1[0] && c === near1[1]) || (r === near2[0] && c === near2[1])) continue;
              if (
                cellsSeeEachOther({ r, c }, { r: far1[0], c: far1[1] }) &&
                cellsSeeEachOther({ r, c }, { r: far2[0], c: far2[1] })
              ) {
                eliminations.push({ r, c, digit: d });
              }
            }
          if (eliminations.length > 0) {
            return {
              actionType: "eliminate",
              technique: "twoStringKite",
              patternCells: [near1, near2, far1, far2],
              eliminations,
              context: { digit: d, near: [near1, near2], far: [far1, far2] },
            };
          }
        }
      }
    }
  }
  return null;
}

// 空矩形(Empty Rectangle):在某个宫里,数字X的候选格恰好全部落在
// "一行R∪一列C"这个十字形上(宫里另外4格——不在R也不在C的那2×2
// 区域——一个候选都没有,故名"空矩形")。这时如果宫外能在R所在行或
// C所在列上找到一条强链,链的另一端就能给出消除:强链一端跟C同列
// (在宫外),假设这一端不是X,强链另一端(远端)必须是X;这一端如果
// 是X,C在宫内的部分就不能再有X,结合"宫内候选只在R∪C上"这个前提,
// 宫内的X就只能落在R这一行上——R这一整行(含宫外)已经有一个X的
// 候选来源,若同一行的target格也是X就矛盾(重复)。所以target(R,
// 强链远端所在列)不可能是X。反方向(强链在R所在行、消除格用C)同理。
function findEmptyRectangle(grid, getCands) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << (d - 1);
    for (let box = 0; box < 9; box++) {
      const boxRowStart = Math.floor(box / 3) * 3;
      const boxColStart = (box % 3) * 3;
      const boxDCells = [];
      for (let r = boxRowStart; r < boxRowStart + 3; r++)
        for (let c = boxColStart; c < boxColStart + 3; c++)
          if (grid[r][c] === 0 && candMaskAt(getCands, r, c) & bit) boxDCells.push([r, c]);
      if (boxDCells.length < 2) continue;
      for (let R = boxRowStart; R < boxRowStart + 3; R++) {
        for (let C = boxColStart; C < boxColStart + 3; C++) {
          if (!boxDCells.every(([r, c]) => r === R || c === C)) continue;
          if (!boxDCells.some(([r, c]) => r === R) || !boxDCells.some(([r, c]) => c === C)) continue;
          // 方向1:强链落在C所在列的宫外部分
          {
            const colCellsOutside = [];
            for (let r = 0; r < 9; r++) {
              if (r >= boxRowStart && r < boxRowStart + 3) continue;
              if (grid[r][C] === 0 && candMaskAt(getCands, r, C) & bit) colCellsOutside.push([r, C]);
            }
            if (colCellsOutside.length === 1) {
              const near = colCellsOutside[0];
              const rowOfNear = near[0];
              const rowCells = [];
              for (let c = 0; c < 9; c++) if (grid[rowOfNear][c] === 0 && candMaskAt(getCands, rowOfNear, c) & bit) rowCells.push([rowOfNear, c]);
              if (rowCells.length === 2) {
                const far = rowCells[0][1] === C ? rowCells[1] : rowCells[0];
                if (far[1] < boxColStart || far[1] >= boxColStart + 3) {
                  const target = [R, far[1]];
                  const inBox = target[0] >= boxRowStart && target[0] < boxRowStart + 3 && target[1] >= boxColStart && target[1] < boxColStart + 3;
                  if (grid[target[0]][target[1]] === 0 && candMaskAt(getCands, target[0], target[1]) & bit && !inBox) {
                    return {
                      actionType: "eliminate",
                      technique: "emptyRectangle",
                      patternCells: [...boxDCells, near, far],
                      eliminations: [{ r: target[0], c: target[1], digit: d }],
                      context: { digit: d, box, axis: [R, C], near, far, target },
                    };
                  }
                }
              }
            }
          }
          // 方向2:强链落在R所在行的宫外部分(跟方向1对称)
          {
            const rowCellsOutside = [];
            for (let c = 0; c < 9; c++) {
              if (c >= boxColStart && c < boxColStart + 3) continue;
              if (grid[R][c] === 0 && candMaskAt(getCands, R, c) & bit) rowCellsOutside.push([R, c]);
            }
            if (rowCellsOutside.length === 1) {
              const near = rowCellsOutside[0];
              const colOfNear = near[1];
              const colCells = [];
              for (let r = 0; r < 9; r++) if (grid[r][colOfNear] === 0 && candMaskAt(getCands, r, colOfNear) & bit) colCells.push([r, colOfNear]);
              if (colCells.length === 2) {
                const far = colCells[0][0] === R ? colCells[1] : colCells[0];
                if (far[0] < boxRowStart || far[0] >= boxRowStart + 3) {
                  const target = [far[0], C];
                  const inBox = target[0] >= boxRowStart && target[0] < boxRowStart + 3 && target[1] >= boxColStart && target[1] < boxColStart + 3;
                  if (grid[target[0]][target[1]] === 0 && candMaskAt(getCands, target[0], target[1]) & bit && !inBox) {
                    return {
                      actionType: "eliminate",
                      technique: "emptyRectangle",
                      patternCells: [...boxDCells, near, far],
                      eliminations: [{ r: target[0], c: target[1], digit: d }],
                      context: { digit: d, box, axis: [R, C], near, far, target },
                    };
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  return null;
}

// 恰好落在两个宫里,本该都只剩{X,Y}两个候选数——真那样的话,交换
// X/Y在这四格里也是合法解,题目就不是唯一解了,矛盾。如果其中三格
// 已经真的只剩{X,Y}("纯净"),第四格却还带着别的候选数,那第四格
// 就不可能是X或Y(不然就凑出了这个"致命矩形"),把X,Y从第四格划掉。
// 位运算版:candsOf从数组换成掩码;pureFlags的length===2换成
// countBits===2;eliminations从"逐个数字查includes"换成跟xyMask做AND
// 之后maskToDigits一次拿完(x<y已经由combinations保证,结果顺序不变)。
function findUniqueRectangleType1(grid, getCands) {
  const idxs = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  for (const [r1, r2] of combinations(idxs, 2)) {
    for (const [c1, c2] of combinations(idxs, 2)) {
      const boxes = new Set([boxIndex(r1, c1), boxIndex(r1, c2), boxIndex(r2, c1), boxIndex(r2, c2)]);
      if (boxes.size !== 2) continue; // 必须恰好横跨两宫,一宫/四宫都不构成唯一矩形
      const corners = [
        { r: r1, c: c1 }, { r: r1, c: c2 },
        { r: r2, c: c1 }, { r: r2, c: c2 },
      ];
      if (corners.some((p) => grid[p.r][p.c] !== 0)) continue;
      const maskOf = corners.map((p) => candMaskAt(getCands, p.r, p.c));
      for (const [x, y] of combinations([1, 2, 3, 4, 5, 6, 7, 8, 9], 2)) {
        const xyMask = (1 << (x - 1)) | (1 << (y - 1));
        if (!maskOf.every((mask) => (mask & xyMask) === xyMask)) continue;
        const pureFlags = maskOf.map((mask) => countBits(mask) === 2);
        if (pureFlags.filter(Boolean).length !== 3) continue;
        const extraIdx = pureFlags.indexOf(false);
        const extraCell = corners[extraIdx];
        const eliminations = maskToDigits(maskOf[extraIdx] & xyMask).map((d) => ({ r: extraCell.r, c: extraCell.c, digit: d }));
        if (eliminations.length > 0) {
          return {
            actionType: "eliminate",
            technique: "uniqueRectangleType1",
            patternCells: corners.map((p) => [p.r, p.c]),
            eliminations,
            context: { digits: [x, y], extraCell: [extraCell.r, extraCell.c] },
          };
        }
      }
    }
  }
  return null;
}

// 唯一矩形 Type 2:四格里恰好两格是纯净的双值格{X,Y},且这两格彼此
// 同行或同列("楼板",相邻,不能是对角);另外两格("楼顶")各自恰好是
// {X,Y,Z}(多出同一个额外候选Z)。楼顶两格如果都退化成{X,Y},就会跟
// 楼板凑出致命矩形(X/Y互换仍是合法解,题目就不唯一解了),矛盾——
// 所以Z在两个楼顶格里至少真一个,同时看到两个楼顶格的格子,Z都能划掉
// (楼顶两格本身彼此已经同行或同列,共同视野可能横跨行/列/宫)。
function findUniqueRectangleType2(grid, getCands) {
  const idxs = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  for (const [r1, r2] of combinations(idxs, 2)) {
    for (const [c1, c2] of combinations(idxs, 2)) {
      const boxes = new Set([boxIndex(r1, c1), boxIndex(r1, c2), boxIndex(r2, c1), boxIndex(r2, c2)]);
      if (boxes.size !== 2) continue;
      const corners = [
        { r: r1, c: c1 }, { r: r1, c: c2 },
        { r: r2, c: c1 }, { r: r2, c: c2 },
      ];
      if (corners.some((p) => grid[p.r][p.c] !== 0)) continue;
      const maskOf = corners.map((p) => candMaskAt(getCands, p.r, p.c));
      for (const [x, y] of combinations([1, 2, 3, 4, 5, 6, 7, 8, 9], 2)) {
        const xyMask = (1 << (x - 1)) | (1 << (y - 1));
        if (!maskOf.every((mask) => (mask & xyMask) === xyMask)) continue;
        const pureIdxs = [];
        for (let i = 0; i < 4; i++) if (countBits(maskOf[i]) === 2) pureIdxs.push(i);
        if (pureIdxs.length !== 2) continue;
        const [p1, p2] = pureIdxs;
        if (corners[p1].r !== corners[p2].r && corners[p1].c !== corners[p2].c) continue; // 两个纯净格必须相邻(同行/同列),对角线不算
        const [q1, q2] = [0, 1, 2, 3].filter((i) => !pureIdxs.includes(i));
        if (countBits(maskOf[q1]) !== 3 || countBits(maskOf[q2]) !== 3) continue;
        const extraQ1 = maskOf[q1] & ~xyMask;
        const extraQ2 = maskOf[q2] & ~xyMask;
        if (extraQ1 !== extraQ2 || countBits(extraQ1) !== 1) continue; // 两个楼顶格必须是同一个额外候选Z
        const z = maskToDigits(extraQ1)[0];
        const roof1 = corners[q1], roof2 = corners[q2];
        const eliminations = [];
        for (let r = 0; r < 9; r++)
          for (let c = 0; c < 9; c++) {
            if (grid[r][c] !== 0 || !(candMaskAt(getCands, r, c) & (1 << (z - 1)))) continue;
            if ((r === roof1.r && c === roof1.c) || (r === roof2.r && c === roof2.c)) continue;
            if (cellsSeeEachOther({ r, c }, roof1) && cellsSeeEachOther({ r, c }, roof2)) eliminations.push({ r, c, digit: z });
          }
        if (eliminations.length > 0) {
          return {
            actionType: "eliminate",
            technique: "uniqueRectangleType2",
            patternCells: corners.map((p) => [p.r, p.c]),
            eliminations,
            context: { digits: [x, y], extraDigit: z, roofCells: [[roof1.r, roof1.c], [roof2.r, roof2.c]] },
          };
        }
      }
    }
  }
  return null;
}
// 隐式矩形 Type 1(对应清单里的"隐式矩形"):四格里只有一格是纯净的
// 双值格{X,Y}("floor"),矩形另外三格都带着别的候选数,没法直接用
// 唯一矩形删数。盯着floor对角线正对面的那一格("target"):如果数字
// X在target所在的那一行、那一列里,都恰好只剩target和矩形上的另一
// 格能填(两条独立的强链接),反推下去——一旦target是另一个数字Y,
// 就会被逼出跟三个纯双值格一样的致命矩形,矛盾。所以target不可能
// 是Y,把Y从target划掉。(只做这一个最基础的子类型;Type 2/2b那套
// 推广规则连SudokuWiki自己的论坛都没有完全统一的说法,暂不实现,
// 避免凭不确定的资料拼出错误的消除逻辑。)
function findHiddenUniqueRectangleType1(grid, getCands) {
  const idxs = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  const diag = { 0: 3, 1: 2, 2: 1, 3: 0 };
  const rowPartnerIdx = { 0: 1, 1: 0, 2: 3, 3: 2 };
  const colPartnerIdx = { 0: 2, 1: 3, 2: 0, 3: 1 };
  for (const [r1, r2] of combinations(idxs, 2)) {
    for (const [c1, c2] of combinations(idxs, 2)) {
      const boxes = new Set([boxIndex(r1, c1), boxIndex(r1, c2), boxIndex(r2, c1), boxIndex(r2, c2)]);
      if (boxes.size !== 2) continue;
      const corners = [
        { r: r1, c: c1 }, { r: r1, c: c2 },
        { r: r2, c: c1 }, { r: r2, c: c2 },
      ];
      if (corners.some((p) => grid[p.r][p.c] !== 0)) continue;
      const maskOf = corners.map((p) => candMaskAt(getCands, p.r, p.c));

      for (let floorIdx = 0; floorIdx < 4; floorIdx++) {
        if (countBits(maskOf[floorIdx]) !== 2) continue;
        const [x, y] = maskToDigits(maskOf[floorIdx]);
        const xyMask = (1 << (x - 1)) | (1 << (y - 1));
        if (!maskOf.every((mask) => (mask & xyMask) === xyMask)) continue;

        const targetIdx = diag[floorIdx];
        const target = corners[targetIdx];
        const rowPartner = corners[rowPartnerIdx[targetIdx]];
        const colPartner = corners[colPartnerIdx[targetIdx]];

        for (const testDigit of [x, y]) {
          const otherDigit = testDigit === x ? y : x;
          if (!(maskOf[targetIdx] & (1 << (otherDigit - 1)))) continue;
          const testBit = 1 << (testDigit - 1);

          const rowUnit = unitCells("row", target.r).filter(([rr, cc]) => grid[rr][cc] === 0 && candMaskAt(getCands, rr, cc) & testBit);
          if (rowUnit.length !== 2 || !rowUnit.some(([rr, cc]) => rr === rowPartner.r && cc === rowPartner.c)) continue;

          const colUnit = unitCells("col", target.c).filter(([rr, cc]) => grid[rr][cc] === 0 && candMaskAt(getCands, rr, cc) & testBit);
          if (colUnit.length !== 2 || !colUnit.some(([rr, cc]) => rr === colPartner.r && cc === colPartner.c)) continue;

          return {
            actionType: "eliminate",
            technique: "hiddenUniqueRectangle",
            patternCells: corners.map((p) => [p.r, p.c]),
            eliminations: [{ r: target.r, c: target.c, digit: otherDigit }],
            context: {
              digits: [x, y],
              floorCell: [corners[floorIdx].r, corners[floorIdx].c],
              targetCell: [target.r, target.c],
              strongDigit: testDigit,
            },
          };
        }
      }
    }
  }
  return null;
}

// W-Wing:两个候选数完全相同的双值格(不互相看见),配合其中一个
// 数字在别处的强链接(共轭对)——强链接两端分别看见这两个双值格中
// 的一个。不管强链接哪端为真,总有一个双值格必须是另一个数字,所以
// 那个数字可以从"同时看见两个双值格"的其它格子里排除。
// 位运算版:双值格判定从length===2换成countBits===2,两个双值格
// "候选数完全相同"从逐位比较[0]/[1]简化成直接比较mask是否相等,
// 强链接/消除的.includes()都换成位检查。
function findWWing(grid, getCands) {
  const bivalueCells = [];
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] === 0) {
        const mask = candMaskAt(getCands, r, c);
        if (countBits(mask) === 2) bivalueCells.push({ r, c, mask });
      }
    }
  for (let i = 0; i < bivalueCells.length; i++) {
    for (let j = i + 1; j < bivalueCells.length; j++) {
      const A = bivalueCells[i],
        B = bivalueCells[j];
      if (A.mask !== B.mask) continue;
      if (cellsSeeEachOther(A, B)) continue;
      const [x, y] = maskToDigits(A.mask);
      for (const [strongDigit, elimDigit] of [
        [x, y],
        [y, x],
      ]) {
        const strongBit = 1 << (strongDigit - 1);
        const elimBit = 1 << (elimDigit - 1);
        for (const unitType of ["row", "col", "box"]) {
          for (let idx = 0; idx < 9; idx++) {
            const cells = unitCells(unitType, idx).filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & strongBit);
            if (cells.length !== 2) continue;
            const [p, q] = cells.map(([r, c]) => ({ r, c }));
            const isAorB = (cell) => (cell.r === A.r && cell.c === A.c) || (cell.r === B.r && cell.c === B.c);
            if (isAorB(p) || isAorB(q)) continue;
            const config1 = cellsSeeEachOther(p, A) && cellsSeeEachOther(q, B);
            const config2 = cellsSeeEachOther(p, B) && cellsSeeEachOther(q, A);
            if (!config1 && !config2) continue;
            const eliminations = [];
            for (let er = 0; er < 9; er++)
              for (let ec = 0; ec < 9; ec++) {
                if (grid[er][ec] !== 0) continue;
                if ((er === A.r && ec === A.c) || (er === B.r && ec === B.c)) continue;
                if (!(candMaskAt(getCands, er, ec) & elimBit)) continue;
                if (cellsSeeEachOther({ r: er, c: ec }, A) && cellsSeeEachOther({ r: er, c: ec }, B)) {
                  eliminations.push({ r: er, c: ec, digit: elimDigit });
                }
              }
            if (eliminations.length > 0) {
              return {
                actionType: "eliminate",
                technique: "wWing",
                patternCells: [
                  [A.r, A.c],
                  [B.r, B.c],
                  [p.r, p.c],
                  [q.r, q.c],
                ],
                eliminations,
                context: {
                  biValueCells: [
                    [A.r, A.c],
                    [B.r, B.c],
                  ],
                  strongLinkCells: [
                    [p.r, p.c],
                    [q.r, q.c],
                  ],
                  strongDigit,
                  elimDigit,
                  unitType,
                  idx,
                },
              };
            }
          }
        }
      }
    }
  }
  return null;
}

// WXYZ-Wing(标准/窄定义):一个恰好4候选数的"枢纽"格,配合3个双值
// "外围"格——每个外围格都看得见枢纽,candidates是{枢纽的某一个候选,
// 公共数字z},三个外围格各自贡献一个不同的"另一候选"(合起来正好
// 覆盖枢纽除z外的另外3个数字)。z可以从"同时看见枢纽和三个外围格"
// 的其它格子里排除。这是XYZ-Wing(3候选枢纽+2外围格)往上再加一格
// 的推广,不覆盖3候选枢纽的情形(那是另一个更简单的技巧,这批没做)。
// XYZ-Wing:枢纽格有3个候选{X,Y,Z},能看见两个双值翼格{X,Z}和{Y,Z}
// (Z是三格共有的那个数字)。不管枢纽最终填X还是Y,总有一个翼格必须
// 是Z——所以Z可以从"同时看得见枢纽+两个翼格这三格"的其它格子里
// 排除。跟XY-Wing的关键区别就是这里:XY-Wing消除只需要看得见两个
// 翼格,XYZ-Wing因为枢纽自己也可能就是Z,必须连枢纽也一起看得见。
// 结构上是WXYZ-Wing往下减一格减一个数字的版本,两个技巧共用同一套
// 逻辑,这里单独实现是因为WXYZ-Wing的搜索硬编码死了"枢纽恰好4个
// 候选",不会退化覆盖到3候选的情形。
// 参考:SudokuWiki "XYZ-Wing"词条。
// 位运算版:枢纽/外围格的候选数判定、z的成员测试都换成掩码;
// "外围格另一个候选数"直接用位运算从(mask & ~zBit)反解,不用
// Array.find。
function findXYZWing(grid, getCands) {
  for (let hr = 0; hr < 9; hr++)
    for (let hc = 0; hc < 9; hc++) {
      if (grid[hr][hc] !== 0) continue;
      const hingeMask = candMaskAt(getCands, hr, hc);
      if (countBits(hingeMask) !== 3) continue;
      const hingeDigits = maskToDigits(hingeMask);
      for (const z of hingeDigits) {
        const zBit = 1 << (z - 1);
        const othersMask = hingeMask & ~zBit;
        const candidateOutliers = [];
        for (let r = 0; r < 9; r++)
          for (let c = 0; c < 9; c++) {
            if (r === hr && c === hc) continue;
            if (grid[r][c] !== 0) continue;
            if (!(r === hr || c === hc || boxIndex(r, c) === boxIndex(hr, hc))) continue;
            const mask = candMaskAt(getCands, r, c);
            if (countBits(mask) !== 2 || !(mask & zBit)) continue;
            const otherBit = mask & ~zBit;
            if (!(othersMask & otherBit)) continue;
            const other = 32 - Math.clz32(otherBit); // 恰好2候选去掉z剩的那一个,直接反解位置
            candidateOutliers.push({ r, c, other });
          }
        if (candidateOutliers.length < 2) continue;
        for (const combo of combinations(candidateOutliers, 2)) {
          const covered = new Set(combo.map((o) => o.other));
          if (covered.size !== 2) continue;
          const patternCells = [[hr, hc], ...combo.map((o) => [o.r, o.c])];
          const eliminations = [];
          for (let er = 0; er < 9; er++)
            for (let ec = 0; ec < 9; ec++) {
              if (grid[er][ec] !== 0) continue;
              if (patternCells.some(([pr, pc]) => pr === er && pc === ec)) continue;
              if (!(candMaskAt(getCands, er, ec) & zBit)) continue;
              const seesAll = patternCells.every(([pr, pc]) => er === pr || ec === pc || boxIndex(er, ec) === boxIndex(pr, pc));
              if (seesAll) eliminations.push({ r: er, c: ec, digit: z });
            }
          if (eliminations.length > 0) {
            return {
              actionType: "eliminate",
              technique: "xyzWing",
              patternCells,
              eliminations,
              context: { hinge: [hr, hc], outliers: combo.map((o) => [o.r, o.c]), digit: z, hingeDigits },
            };
          }
        }
      }
    }
  return null;
}
// 位运算版:跟findXYZWing同样的思路(枢纽从3候选换成4候选,外围格
// 组合数从2换成3,其余判定逻辑完全一致)。
function findWxyzWing(grid, getCands) {
  for (let hr = 0; hr < 9; hr++)
    for (let hc = 0; hc < 9; hc++) {
      if (grid[hr][hc] !== 0) continue;
      const hingeMask = candMaskAt(getCands, hr, hc);
      if (countBits(hingeMask) !== 4) continue;
      const hingeDigits = maskToDigits(hingeMask);
      for (const z of hingeDigits) {
        const zBit = 1 << (z - 1);
        const othersMask = hingeMask & ~zBit;
        const candidateOutliers = [];
        for (let r = 0; r < 9; r++)
          for (let c = 0; c < 9; c++) {
            if (r === hr && c === hc) continue;
            if (grid[r][c] !== 0) continue;
            if (!(r === hr || c === hc || boxIndex(r, c) === boxIndex(hr, hc))) continue;
            const mask = candMaskAt(getCands, r, c);
            if (countBits(mask) !== 2 || !(mask & zBit)) continue;
            const otherBit = mask & ~zBit;
            if (!(othersMask & otherBit)) continue;
            const other = 32 - Math.clz32(otherBit);
            candidateOutliers.push({ r, c, other });
          }
        if (candidateOutliers.length < 3) continue;
        for (const combo of combinations(candidateOutliers, 3)) {
          const covered = new Set(combo.map((o) => o.other));
          if (covered.size !== 3) continue;
          const patternCells = [[hr, hc], ...combo.map((o) => [o.r, o.c])];
          const eliminations = [];
          for (let er = 0; er < 9; er++)
            for (let ec = 0; ec < 9; ec++) {
              if (grid[er][ec] !== 0) continue;
              if (patternCells.some(([pr, pc]) => pr === er && pc === ec)) continue;
              if (!(candMaskAt(getCands, er, ec) & zBit)) continue;
              const seesAll = patternCells.every(([pr, pc]) => er === pr || ec === pc || boxIndex(er, ec) === boxIndex(pr, pc));
              if (seesAll) eliminations.push({ r: er, c: ec, digit: z });
            }
          if (eliminations.length > 0) {
            return {
              actionType: "eliminate",
              technique: "wxyzWing",
              patternCells,
              eliminations,
              context: { hinge: [hr, hc], outliers: combo.map((o) => [o.r, o.c]), digit: z, hingeDigits },
            };
          }
        }
      }
    }
  return null;
}

// XY-链:任意长度的双值格交替链(长度3就等价于经典XY-Wing,SudokuWiki
// 上明确说过"最短的XY-链就是只有3格的XY-Wing")。链上每格都是双值格,
// 相邻格子互相看得见且共享一个数字作为"传递"用的候选,链的首尾格都
// 含有同一个数字z——不管从哪一端开始推,z总会在链的某一端成立,所以
// z可以从"同时看见链首尾"的其它格子里排除。用有限深度的DFS搜索,已经
// 用大量真实题目验证过耗时可以接受(最慢的完全卡住场景也就几十毫秒)。
// 位运算版:双值格判定、"链上另一个数字"提取、消除检查,都用跟
// findXYZWing同样的位运算套路。
function findXYChain(grid, getCands) {
  const bivalueCells = [];
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] === 0) {
        const mask = candMaskAt(getCands, r, c);
        if (countBits(mask) === 2) bivalueCells.push({ r, c, mask });
      }
    }
  if (bivalueCells.length < 3) return null;
  const MAX_CHAIN_LEN = 10;

  for (const start of bivalueCells) {
    for (const z of maskToDigits(start.mask)) {
      const zBit = 1 << (z - 1);
      const otherDigit = 32 - Math.clz32(start.mask & ~zBit);
      const visited = new Set([`${start.r},${start.c}`]);
      const path = [{ r: start.r, c: start.c }];
      const linkDigits = []; // 每一段链接实际用的数字,比path少一个元素

      function dfs(currentCell, neededDigit, depth) {
        if (depth > MAX_CHAIN_LEN) return null;
        const neededBit = 1 << (neededDigit - 1);
        for (const next of bivalueCells) {
          const key = `${next.r},${next.c}`;
          if (visited.has(key)) continue;
          if (!(next.mask & neededBit)) continue;
          if (!cellsSeeEachOther(currentCell, next)) continue;
          const nextOther = 32 - Math.clz32(next.mask & ~neededBit);

          if (nextOther === z) {
            const chainCells = [...path, { r: next.r, c: next.c }];
            const chainLinkDigits = [...linkDigits, neededDigit];
            const chainKeys = new Set(chainCells.map((cell) => `${cell.r},${cell.c}`));
            const eliminations = [];
            for (let er = 0; er < 9; er++)
              for (let ec = 0; ec < 9; ec++) {
                if (grid[er][ec] !== 0) continue;
                if (chainKeys.has(`${er},${ec}`)) continue;
                if (!(candMaskAt(getCands, er, ec) & zBit)) continue;
                if (cellsSeeEachOther({ r: er, c: ec }, start) && cellsSeeEachOther({ r: er, c: ec }, next)) {
                  eliminations.push({ r: er, c: ec, digit: z });
                }
              }
            if (eliminations.length > 0) return { chainCells, chainLinkDigits, eliminations };
          }

          visited.add(key);
          path.push({ r: next.r, c: next.c });
          linkDigits.push(neededDigit);
          const result = dfs(next, nextOther, depth + 1);
          if (result) return result;
          path.pop();
          linkDigits.pop();
          visited.delete(key);
        }
        return null;
      }

      const result = dfs(start, otherDigit, 1);
      if (result) {
        return {
          actionType: "eliminate",
          technique: "xyChain",
          patternCells: result.chainCells.map((cell) => [cell.r, cell.c]),
          eliminations: result.eliminations,
          chainCells: result.chainCells,
          chainLinkDigits: result.chainLinkDigits,
          context: { digit: z, chainLength: result.chainCells.length },
        };
      }
    }
  }
  return null;
}

// 节点的规范化key,供visited集合去重用——不管节点是单格还是分组,
// 格子按坐标排序后拼起来,保证同一个节点不管从哪条路径走到,key都
// 一样。
function nodeKey(node) {
  return (
    node.cells
      .map(([r, c]) => `${r},${c}`)
      .sort()
      .join("|") +
    "#" +
    node.d
  );
}
function groupSeesGroup(cellsA, cellsB) {
  return cellsA.every(([r1, c1]) => cellsB.every(([r2, c2]) => cellsSeeEachOther({ r: r1, c: c1 }, { r: r2, c: c2 })));
}
// 按宫分组:同一行/列里,挤在同一个宫里的候选格子捆成一"组"。这是
// Grouped AIC的核心——"数字d在这个行/列里只剩2个位置"这条强链接
// 规则,现在认的"位置"可以是单个格子,也可以是好几个挤在同一个宫
// 里的格子捆成的一组,不再只认单格。
function groupCellsByBox(cells) {
  const byBox = {};
  for (const [r, c] of cells) {
    const b = boxIndex(r, c);
    (byBox[b] = byBox[b] || []).push([r, c]);
  }
  return Object.values(byBox);
}
// AIC(交替推理链)的强链接:格内双值(只对单格节点有意义,分组节点
// 跨了好几个格子,没有"格内候选"这个概念);或者同一个数字在某个
// 行/列/宫里恰好只剩2个"位置"——位置可以是单格,行/列方向上还可以
// 是挤在同一个宫里的一组格子(Grouped)。
// 位运算版:d是这个函数里从一开始就定死的(node.d),提前算好dBit;
// "格内双值的另一个数字"用位运算直接反解,不用Array.find。
function aicStrongPartners(grid, getCands, node) {
  const partners = [];
  const d = node.d;
  const dBit = 1 << (d - 1);
  if (node.cells.length === 1) {
    const [r, c] = node.cells[0];
    const mask = candMaskAt(getCands, r, c);
    if (countBits(mask) === 2) {
      const otherBit = mask & ~dBit;
      if (otherBit) partners.push({ cells: [[r, c]], d: 32 - Math.clz32(otherBit) });
    }
  }
  const [nr0, nc0] = node.cells[0];
  for (const unitType of ["row", "col", "box"]) {
    const idx = unitType === "row" ? nr0 : unitType === "col" ? nc0 : boxIndex(nr0, nc0);
    const nodeInUnit = node.cells.every(([r, c]) => {
      const i = unitType === "row" ? r : unitType === "col" ? c : boxIndex(r, c);
      return i === idx;
    });
    if (!nodeInUnit) continue; // 分组节点必须整体属于这个单元,分组的判断才有意义
    const remaining = unitCells(unitType, idx).filter(
      ([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & dBit && !node.cells.some(([nr, nc]) => nr === r && nc === c)
    );
    if (remaining.length === 0) continue;
    if (unitType === "box") {
      // 宫内部不再往下分组(分组是给行/列方向服务的,宫这一维只认单格)
      if (remaining.length === 1) partners.push({ cells: [remaining[0]], d });
      continue;
    }
    const groups = groupCellsByBox(remaining);
    if (groups.length === 1) partners.push({ cells: groups[0], d });
  }
  const seen = new Set();
  return partners.filter((p) => {
    const k = nodeKey(p);
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
// 弱链接:节点自己格子里的其它候选数字(只对单格节点有意义);或者
// 同一个数字、能被节点里所有格子共同看见的其它格子(同一单元同一
// 数字最多一个)——分组节点"是真的"具体是组里哪个格子不知道,所以
// 候选伙伴必须跟组里每一个格子都构成"不能同时为真"的关系,只有
// 组里某一个格子能看见是不够的(这是导致过一次错误消除的地方,
// 修过了)。弱链接的另一端一律按单格返回,不再往下分组——弱链接
// 只是"排除",不需要强链接那种"恰好2个位置"的精确匹配。
// 位运算版:同上,d提前算好dBit;"格内其它候选数字"从for...of数组
// 换成maskToDigits(mask & ~dBit)直接枚举。
function aicWeakPartners(grid, getCands, node) {
  const partners = [];
  const d = node.d;
  const dBit = 1 << (d - 1);
  if (node.cells.length === 1) {
    const [r, c] = node.cells[0];
    const mask = candMaskAt(getCands, r, c);
    for (const d2 of maskToDigits(mask & ~dBit)) {
      partners.push({ cells: [[r, c]], d: d2 });
    }
  }
  const nodeCellSet = new Set(node.cells.map(([r, c]) => `${r},${c}`));
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (nodeCellSet.has(`${r},${c}`)) continue;
      if (grid[r][c] !== 0 || !(candMaskAt(getCands, r, c) & dBit)) continue;
      if (groupSeesGroup([[r, c]], node.cells)) partners.push({ cells: [[r, c]], d });
    }
  const seen = new Set();
  return partners.filter((p) => {
    const k = nodeKey(p);
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
// 链条首尾都是强链接时,检查能不能收尾出结论。同数字(Type 1)——
// 消除范围是能同时看见首尾两组全部格子的其它格子;不同数字但首尾
// 互相看得见(Type 2)——直接消掉"起点里的终点数字"和"终点里的起点
// 数字",这个只在首尾都是单格节点时才有意义(分组节点没有"这一格
// 填了另一个数字"这种单一格子的候选可消)。同类相食链(消除目标
// 恰好碰到链条中间节点的格子)只在"消掉的是那个格子上跟链条节点
// 无关的别的数字"时才合法——如果消掉的正是某个节点自己代表的那个
// 数字,那就是在拆链条自己的地基,必须排除,这条路径接收完整链条

// 深度上限参照SudokuWiki作者Andrew Stuart自己说的"12层是个合理折中"

// ALS(近似锁定集):同一个单元(行/列/宫)里的N个格子,候选数并集正好

// 同一组格子从"行"和"宫"两个方向各数一遍。封顶3个格子——实测过
// 封到4个格子时,链搜索偶尔会飙到4-5秒(困难题、ALS数量上到170+
// 时),封到3个格子之后最慢稳定在几百毫秒以内,找到的实例数量
// 几乎没受影响,这个上限是测出来的,不是随手定的。

      for (let size = 1; size <= Math.min(ALS_MAX_SIZE, emptyCells.length); size++) {

          // 这一段是ALS家族好几个技巧(alsXZ/alsChain/deathBlossom)共用
          // 的入口,调用密度高,收益能传导到下游全部技巧。mask字段留给
          // 下游做快速交集/子集判断;candidates数组字段照常保留,不动
          // 现有依赖它的渲染函数/其它调用方。
          let mask = 0;

          if (countBits(mask) !== size + 1) continue;

            .map(([r, c]) => `${r},${c}`)
            .sort()

// 在两个ALS中的一个里成立(简化起见,不处理两个ALS有重叠格子的情况,

// 数字Z(不要求是RCC,双重连接时Z也可以是另一个RCC),Z就必然被锁死

          if (grid[r][c] !== 0 || !(candMaskAt(getCands, r, c) & zBit)) continue;

// 那么Z能从"同时看得见所有花瓣里Z"的外部格子划掉。花瓣之间不能
// 互相重叠、也不能包含茎格子自己(跟HoDoKu默认的标准实现一致,不
// 处理允许重叠的更复杂情况,原因跟当初ALS-XZ不处理重叠一样:那种
// 情况要多一层限制判断,容易出错,暂不实现)。贪心地给每个茎候选数
// 找第一个可用的花瓣,不做回溯——有可能因此漏掉一些需要换一种花瓣
// 搭配才能凑齐的情况,但换取的是搜索简单、速度快。
// 位运算版:茎格子候选数、"每个花瓣ALS共有的Z"的交集、消除检查,
// 都换成位运算——底层enumerateALS/alsCandidatePositions本来就是位

function findDeathBlossom(grid, getCands) {
  const alsList = enumerateALS(grid, getCands);
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      const stemMask = candMaskAt(getCands, r, c);
      if (countBits(stemMask) < 2) continue;
      const petals = [];
      const usedAls = [];
      let allFound = true;
      for (const d of maskToDigits(stemMask)) {

        for (const als of alsList) {
          if (als.cells.some(([ar, ac]) => ar === r && ac === c)) continue;
          if (!(als.mask & dBit)) continue;
          if (usedAls.some((u) => alsOverlap(u, als))) continue;
          const petalPos = alsCandidatePositions(als, d, getCands);
          if (petalPos.every(([ar, ac]) => cellsSeeEachOther({ r: ar, c: ac }, { r, c }))) {

      if (commonZMask === 0) continue;
      const allPetalCells = petals.flatMap((p) => p.als.cells);
      for (const z of maskToDigits(commonZMask)) {
        const zBit = 1 << (z - 1);
        const zPositions = petals.flatMap((p) => alsCandidatePositions(p.als, z, getCands));
        const eliminations = [];
        for (let er = 0; er < 9; er++)
          for (let ec = 0; ec < 9; ec++) {
            if (er === r && ec === c) continue;
            if (allPetalCells.some(([ar, ac]) => ar === er && ac === ec)) continue;
            if (grid[er][ec] !== 0 || !(candMaskAt(getCands, er, ec) & zBit)) continue;
            if (zPositions.every(([ar, ac]) => cellsSeeEachOther({ r: er, c: ec }, { r: ar, c: ac }))) {
              eliminations.push({ r: er, c: ec, digit: z });
            }
          }
        if (eliminations.length > 0) {
          return {
            actionType: "eliminate",
            technique: "deathBlossom",
            patternCells: [[r, c], ...allPetalCells],
            eliminations,
            context: {
              stemCell: [r, c],
              stemDigits: maskToDigits(stemMask),
              petals: petals.map((p) => ({ digit: p.digit, cells: p.als.cells })),
              elimDigit: z,
            },
          };
        }
      }
    }

}

function findMedusa3D(grid, getCands) {
  const nodeKey = (r, c, d) => `${r},${c},${d}`;
  const parseKey = (k) => k.split(",").map(Number);
  const strongLinks = new Map();
  const addLink = (k1, k2) => {
    if (!strongLinks.has(k1)) strongLinks.set(k1, new Set());
    if (!strongLinks.has(k2)) strongLinks.set(k2, new Set());
    strongLinks.get(k1).add(k2);
    strongLinks.get(k2).add(k1);
  };

  // 强链接①:格内双值——一个格子只剩两个候选数,这两个候选数互为强链接
  const allNodes = [];
  for (let r = 0; r < 9; r++)
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] !== 0) continue;
      const digits = maskToDigits(candMaskAt(getCands, r, c));
      for (const d of digits) allNodes.push([r, c, d]);
      if (digits.length === 2) addLink(nodeKey(r, c, digits[0]), nodeKey(r, c, digits[1]));
    }

  // 强链接②:同一数字在同一行/列/宫里只剩两个位置,这两个位置互为共轭对强链接
  for (let d = 1; d <= 9; d++) {
    const dBit = 1 << (d - 1);
    const collect = (cellsOfUnit) => cellsOfUnit.filter(([r, c]) => grid[r][c] === 0 && candMaskAt(getCands, r, c) & dBit);
    for (let r = 0; r < 9; r++) {
      const cells = collect(Array.from({ length: 9 }, (_, c) => [r, c]));
      if (cells.length === 2) addLink(nodeKey(cells[0][0], cells[0][1], d), nodeKey(cells[1][0], cells[1][1], d));
    }
    for (let c = 0; c < 9; c++) {
      const cells = collect(Array.from({ length: 9 }, (_, r) => [r, c]));
      if (cells.length === 2) addLink(nodeKey(cells[0][0], cells[0][1], d), nodeKey(cells[1][0], cells[1][1], d));
    }
    for (let br = 0; br < 9; br += 3)
      for (let bc = 0; bc < 9; bc += 3) {
        const boxCells = [];
        for (let r = br; r < br + 3; r++) for (let c = bc; c < bc + 3; c++) boxCells.push([r, c]);
        const cells = collect(boxCells);
        if (cells.length === 2) addLink(nodeKey(cells[0][0], cells[0][1], d), nodeKey(cells[1][0], cells[1][1], d));
      }
  }

  const visited = new Set();
  for (const [r0, c0, d0] of allNodes) {
    const startKey = nodeKey(r0, c0, d0);
    if (visited.has(startKey)) continue;
    if (!strongLinks.has(startKey)) {
      visited.add(startKey);
      continue; // 孤立候选数,没有任何强链接,不可能参与染色
    }

    // BFS建这个连通分量的双色染色(强链接两端必须异色,这是染色本身
    // 的定义,不是"选择"——所以BFS/DFS对结果没有区别,只是遍历顺序
    // 不同,这一点之前跟你讨论过)
    const color = new Map([[startKey, 0]]);
    const queue = [startKey];
    const componentKeys = [startKey];
    while (queue.length > 0) {
      const cur = queue.shift();
      const curColor = color.get(cur);
      for (const nb of strongLinks.get(cur)) {
        if (!color.has(nb)) {
          color.set(nb, 1 - curColor);
          queue.push(nb);
          componentKeys.push(nb);
        }
      }
    }
    for (const k of componentKeys) visited.add(k);

    // 规则A:同一个格子里,同一种颜色出现了两次——矛盾,这个颜色不可能是解
    let badColor = null;
    let reasonKeys = null;
    let reasonType = null;
    const byCell = new Map();
    for (const k of componentKeys) {
      const [r, c] = parseKey(k);
      const ck = `${r},${c},${color.get(k)}`;
      if (!byCell.has(ck)) byCell.set(ck, []);
      byCell.get(ck).push(k);
    }
    for (const [ck, keys] of byCell) {
      if (keys.length >= 2) {
        badColor = Number(ck.split(",")[2]);
        reasonKeys = keys.slice(0, 2);
        reasonType = "cell";
        break;
      }
    }

    // 规则B:同一个数字,在同一个行/列/宫里,同一种颜色出现了两次——
    // 矛盾(同一个数字不能在同一个区域里出现两次)
    if (badColor === null) {
      const byUnit = new Map();
      for (const k of componentKeys) {
        const [r, c, d] = parseKey(k);
        const col = color.get(k);
        const boxIdx = Math.floor(r / 3) * 3 + Math.floor(c / 3);
        for (const uk of [`row${r}-d${d}-c${col}`, `col${c}-d${d}-c${col}`, `box${boxIdx}-d${d}-c${col}`]) {
          if (!byUnit.has(uk)) byUnit.set(uk, []);
          byUnit.get(uk).push(k);
        }
      }
      for (const [uk, keys] of byUnit) {
        if (keys.length >= 2) {
          badColor = Number(uk.split("-c")[1]);
          reasonKeys = keys.slice(0, 2);
          reasonType = "unit";
          break;
        }
      }
    }

    // coloring/patternCells对下面四条规则都通用,先算出来
    const coloring = componentKeys.map((k) => {
      const [r, c, d] = parseKey(k);
      return { r, c, d, color: color.get(k) };
    });
    const patternCells = [...new Set(componentKeys.map((k) => k.split(",").slice(0, 2).join(",")))].map((s) =>
      s.split(",").map(Number)
    );

    if (badColor !== null) {
      // 规则A/B命中:整个颜色都不可能是解,直接把这个颜色的全部候选数划掉
      const eliminationsAB = componentKeys
        .filter((k) => color.get(k) === badColor)
        .map((k) => {
          const [r, c, d] = parseKey(k);
          return { r, c, digit: d };
        });
      if (eliminationsAB.length > 0) {
        return {
          actionType: "eliminate",
          technique: "medusa3D",
          patternCells,
          eliminations: eliminationsAB,
          context: {
            coloring,
            ruleType: reasonType, // "cell" | "unit"
            badColor,
            reasonCells: reasonKeys.map((k) => {
              const [r, c, d] = parseKey(k);
              return { r, c, d };
            }),
          },
        };
      }
    }

    // 规则C:同一个格子里出现了两种不同颜色的候选数——不管最终哪个
    // 颜色是真的,这个格子的答案已经被这两个候选数其中之一锁定了,
    // 格子里其余没参与染色的候选数都可以划掉。跟A/B不一样,这条不是
    // "矛盾",不消除整个颜色,只消除这一个格子里的"其余"候选。
    {
      const byCellAllColors = new Map(); // "r,c" -> [{d,color}]
      for (const k of componentKeys) {
        const [r, c, d] = parseKey(k);
        const ck = `${r},${c}`;
        if (!byCellAllColors.has(ck)) byCellAllColors.set(ck, []);
        byCellAllColors.get(ck).push({ d, color: color.get(k) });
      }
      for (const [ck, entries] of byCellAllColors) {
        const colorsHere = new Set(entries.map((e) => e.color));
        if (colorsHere.size < 2) continue; // 这个格子里染色只出现了一种颜色,这条规则用不上
        const [r, c] = ck.split(",").map(Number);
        let coloredMask = 0;
        for (const e of entries) coloredMask |= 1 << (e.d - 1);
        const eliminationsC = maskToDigits(candMaskAt(getCands, r, c) & ~coloredMask).map((d) => ({ r, c, digit: d }));
        if (eliminationsC.length === 0) continue; // 这个格子刚好只有这两个候选,没有"其余"可划
        const twoColored = [0, 1]
          .map((col) => entries.find((en) => en.color === col))
          .filter(Boolean)
          .map((e) => ({ r, c, d: e.d, color: e.color }));
        return {
          actionType: "eliminate",
          technique: "medusa3D",
          patternCells,
          eliminations: eliminationsC,
          context: { coloring, ruleType: "twoColorsInCell", reasonCells: twoColored },
        };
      }
    }

    // 规则D:一个没有参与这次染色的候选数,同时看得到这个分量里同一
    // 个数字的两种颜色——不管最终哪个颜色是真的,这个候选数自己都
    // 活不下来。这是四条规则里计算量最大的一条,放最后做。
    {
      const byDigit = new Map(); // d -> {0:[[r,c]], 1:[[r,c]]}
      for (const k of componentKeys) {
        const [r, c, d] = parseKey(k);
        if (!byDigit.has(d)) byDigit.set(d, { 0: [], 1: [] });
        byDigit.get(d)[color.get(k)].push([r, c]);
      }
      for (let r = 0; r < 9; r++)
        for (let c = 0; c < 9; c++) {
          if (grid[r][c] !== 0) continue;
          for (const d of maskToDigits(candMaskAt(getCands, r, c))) {
            if (color.has(nodeKey(r, c, d))) continue; // 本身就在这个分量里染过色了,不是"未染色候选"
            const positions = byDigit.get(d);
            if (!positions) continue;
            const seen0 = positions[0].find(([pr, pc]) => cellsSeeEachOther({ r, c }, { r: pr, c: pc }));
            const seen1 = positions[1].find(([pr, pc]) => cellsSeeEachOther({ r, c }, { r: pr, c: pc }));
            if (seen0 && seen1) {
              return {
                actionType: "eliminate",
                technique: "medusa3D",
                patternCells,
                eliminations: [{ r, c, digit: d }],
                context: {
                  coloring,
                  ruleType: "seesTwoColors",
                  reasonCells: [
                    { r, c, d },
                    { r: seen0[0], c: seen0[1], d, color: 0 },
                    { r: seen1[0], c: seen1[1], d, color: 1 },
                  ],
                },
              };
            }
          }
        }
    }
    // 这个分量四条规则都没找到矛盾/消除,试下一个还没访问过的候选数
  }
  return null;
}

// 传播引擎的核心实现。techniques是这一轮传播允许使用的技巧清单

// 传入的数组里加一项,不用改这个函数本身一个字符,这是开闭原则的
// 具体落地。budget是可选的共享调用预算(引用同一个对象,允许跨多次
// 调用累加计数),只有动态版(允许嵌套)才需要,静态版传null直接跳过
// 这层检查。recordTrace是可选的第9个参数,默认false——这是"强制链
// 详细推导"这个设置项背后的开关,默认关闭时这个函数的行为、性能
// 跟这个参数加入之前完全一样(steps全程是null,不分配数组、不push);

//
